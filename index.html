ectionObserver' in window && divisions.length) {\n    var spy = new IntersectionObserver(function (entries) {\n      entries.forEach(function (entry) {\n        if (entry.isIntersecting) {\n          subnavLinks.forEach(function (a) {\n            a.classList.toggle('is-active', a.getAttribute('data-subnav') === entry.target.id);\n          });\n        }\n      });\n    }, { rootMargin: '-140px 0px -60% 0px', threshold: 0 });\n    divisions.forEach(function (d) { spy.observe(d); });\n  }\n})();\n<\/script>\n\n<script>(function(){\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a[href]');\n    if(!a) return;\n    var href = a.getAttribute('href') || '';\n    if(/^(https?:|mailto:|tel:)/i.test(href)) { a.target = '_blank'; return; }\n    var m = href.match(/^(?:\\.\\.\\/)?(?:([0-9]{2}-[a-z]+)\\/)?([a-z]+\\.html)?(#.*)?$/i);\n    if(!m) return;\n    if(href.charAt(0) === '#') return;          /* Anker in der Seite: normal lassen */\n    e.preventDefault();\n    parent.postMessage({bzNav: {concept: m[1] || null, page: m[2] || 'index.html', hash: m[3] || ''}}, '*');\n  }, true);\n  window.addEventListener('message', function(e){\n    if(e.data && e.data.bzHash){ location.hash = e.data.bzHash; }\n  });\n})();<\/script>\n\n</body>\n</html>\n", "03-platinum/network.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<script>(function(){try{if(localStorage.getItem('bz-theme-03')==='light'){document.documentElement.setAttribute('data-theme','light');}}catch(e){}})();<\/script>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>BYZARO GROUP \u2014 The Network</title>\n<meta name=\"description\" content=\"One international network across Serbia, Switzerland, UAE, Montenegro, Croatia, Germany and Italy. Discuss an opportunity with Byzaro Group.\">\n<meta name=\"robots\" content=\"noindex\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,600;0,700;1,600;1,700&amp;family=Jost:wght@300;400;500&amp;display=swap\" rel=\"stylesheet\">\n<style>\n/* ==========================================================================\n   BYZARO GROUP \u2014 Concept 03: PLATINUM\n   Swiss precision instrument. Machined steel, guilloch\u00e9, engraved indices.\n   Shared stylesheet for index.html, capabilities.html, network.html\n   ========================================================================== */\n\n:root {\n  --bg: #0E1116;\n  --bg-2: #161B22;\n  --bg-3: #1E242D;\n  --steel: #B9C4D0;\n  --steel-dim: #8C97A5;\n  --text: #E9EDF2;\n  --text-dim: #A3AEBC;\n\n  /* small-text accent \u2014 must be \u22654.5:1 on --bg/--bg-2/--bg-3 */\n  --steel-text: var(--steel);\n  /* rule/hairline colour \u2014 decorative, no contrast requirement */\n  --steel-rule: var(--steel-dim);\n  /* fill colour for filled steel states (button hover, selected chip) \u2014\n     paired with --bg-coloured text on top, needs \u22654.5:1 against --bg */\n  --steel-fill: var(--steel);\n\n  --border: rgba(185, 196, 208, .16);\n  --border-strong: rgba(185, 196, 208, .32);\n  --header-bg: rgba(14, 17, 22, .82);\n  --subnav-bg: rgba(14, 17, 22, .92);\n  --input-bg: var(--bg-2);\n  --input-border: rgba(185, 196, 208, .28);\n  --frame-border: rgba(233, 237, 242, .14);\n\n  --font-display: \"Bodoni Moda\", \"Times New Roman\", serif;\n  --font-ui: \"Jost\", system-ui, sans-serif;\n\n  --container: 1320px;\n  --section-pad: clamp(96px, 12vh, 180px);\n\n  --metal-gradient: linear-gradient(100deg, #8C97A5, #E9EDF2 42%, #7E8A98 58%, #C3CDD9);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Light theme \u2014 cool paper, darker steel for small text                    */\n/* Default (no attribute, or data-theme=\"dark\") stays PLATINUM dark.        */\n/* ---------------------------------------------------------------------- */\n\n[data-theme=\"light\"] {\n  --bg: #F1F4F8;\n  --bg-2: #E4E9F0;\n  --bg-3: #D8DFE8;\n  --steel: #9FACBB;       /* lighter steel kept for rules/lines */\n  --steel-dim: #B7C2CE;\n  --text: #0E1116;\n  --text-dim: #4E5867;\n\n  --steel-text: #5A6675;  /* darkened steel \u2014 measured \u22654.5:1 on bg/bg-2/bg-3 */\n  --steel-rule: #8A97A6;\n  --steel-fill: #5A6675;  /* darkened fill so --bg-coloured text on top stays \u22654.5:1 */\n\n  --border: rgba(14, 17, 22, .14);\n  --border-strong: rgba(14, 17, 22, .24);\n  --header-bg: rgba(241, 244, 248, .82);\n  --subnav-bg: rgba(241, 244, 248, .92);\n  --input-bg: #E9EEF3;\n  --input-border: rgba(14, 17, 22, .2);\n  --frame-border: rgba(14, 17, 22, .12);\n\n  /* Auf hellem Papier muss der Metallverlauf DUNKEL sein \u2014 helles Metall auf\n     hellem Grund war praktisch unlesbar. Dunkler Stahl mit hellerem Streiflicht\n     h\u00e4lt den polierten Charakter und bleibt kr\u00e4ftig. */\n  --metal-gradient: linear-gradient(100deg, #2B3542, #6B7A8C 42%, #1B222C 58%, #4A5766);\n}\n\n[data-theme=\"light\"] .hero-mark-bg { color: var(--text); opacity: .028; }\n\n@media (prefers-reduced-motion: no-preference) {\n  html.theme-transition,\n  html.theme-transition *,\n  html.theme-transition *::before,\n  html.theme-transition *::after {\n    transition: background-color 300ms ease, color 300ms ease, border-color 300ms ease, fill 300ms ease, stroke 300ms ease !important;\n  }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Reset                                                                    */\n/* ---------------------------------------------------------------------- */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--text);\n  font-family: var(--font-ui);\n  font-weight: 400;\n  font-size: 1rem;\n  line-height: 1.7;\n  overflow-x: hidden;\n  min-width: 320px;\n}\n\nhtml, body { max-width: 100%; overflow-x: hidden; }\n\nimg, svg { display: block; max-width: 100%; }\n\na { color: inherit; }\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: 600;\n  letter-spacing: .01em;\n  margin: 0;\n}\n\np { margin: 0; }\n\nul, ol { list-style: none; margin: 0; padding: 0; }\n\nbutton { font-family: inherit; cursor: pointer; }\n\n/* ---------------------------------------------------------------------- */\n/* Focus visibility                                                         */\n/* ---------------------------------------------------------------------- */\n\na:focus-visible,\nbutton:focus-visible,\ninput:focus-visible,\nselect:focus-visible,\ntextarea:focus-visible,\n[tabindex]:focus-visible {\n  outline: 2px solid var(--steel);\n  outline-offset: 3px;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Layout helpers                                                           */\n/* ---------------------------------------------------------------------- */\n\n.container {\n  width: 100%;\n  max-width: var(--container);\n  margin: 0 auto;\n  padding-left: clamp(20px, 5vw, 56px);\n  padding-right: clamp(20px, 5vw, 56px);\n}\n\n.chapter {\n  position: relative;\n  padding: var(--section-pad) 0;\n}\n\n.chapter--panel { background: var(--bg-2); }\n\n.chapter-head {\n  display: flex;\n  align-items: baseline;\n  justify-content: center;\n  gap: clamp(12px, 3vw, 28px);\n  margin-bottom: clamp(40px, 6vw, 72px);\n  text-align: center;\n}\n\n.chapter-numeral {\n  font-family: var(--font-ui);\n  color: var(--steel-text);\n  font-size: clamp(1rem, 2vw, 1.3rem);\n  letter-spacing: .3em;\n}\n\n.chapter-title {\n  font-size: clamp(1.8rem, 4vw, 3.4rem);\n  line-height: 1.15;\n}\n\n.hairline {\n  border: none;\n  border-top: 1px solid var(--steel-rule);\n  opacity: .5;\n  width: 100%;\n  margin: 0;\n}\n\n.label {\n  display: inline-block;\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .25em;\n  text-transform: uppercase;\n  color: var(--steel-text);\n}\n\n.label--dim { color: var(--text-dim); }\n\n.lede {\n  color: var(--text-dim);\n  max-width: 62ch;\n}\n\n.center { text-align: center; margin-left: auto; margin-right: auto; }\n\n/* ---------------------------------------------------------------------- */\n/* Polished metal \u2014 the jewel, used sparingly                               */\n/* ---------------------------------------------------------------------- */\n\n.metal-text {\n  background: var(--metal-gradient);\n  -webkit-background-clip: text;\n  background-clip: text;\n  color: transparent;\n  -webkit-text-fill-color: transparent;\n}\n\n.metal-rule {\n  border: none;\n  height: 2px;\n  width: 100%;\n  background: var(--metal-gradient);\n  margin: 0;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Index scale \u2014 the signature precision-instrument motif                  */\n/* 60 short ticks; every 5th reinforced into a long tick.                  */\n/* ---------------------------------------------------------------------- */\n\n.index-scale {\n  position: relative;\n  width: 100%;\n  height: 18px;\n  pointer-events: none;\n}\n\n.index-scale::before {\n  content: \"\";\n  position: absolute;\n  left: 0; right: 0; top: 50%;\n  height: 7px;\n  transform: translateY(-50%);\n  background-image: repeating-linear-gradient(to right, var(--steel-dim) 0 1px, transparent 1px calc(100% / 60));\n  opacity: .6;\n}\n\n.index-scale::after {\n  content: \"\";\n  position: absolute;\n  left: 0; right: 0; top: 0; bottom: 0;\n  background-image: repeating-linear-gradient(to right, var(--steel) 0 1.4px, transparent 1.4px calc(100% / 12));\n}\n\n.index-scale--v {\n  width: 18px;\n  height: 100%;\n}\n\n.index-scale--v::before {\n  left: 50%; right: auto; top: 0; bottom: 0;\n  width: 7px; height: auto;\n  transform: translateX(-50%);\n  background-image: repeating-linear-gradient(to bottom, var(--steel-dim) 0 1px, transparent 1px calc(100% / 60));\n}\n\n.index-scale--v::after {\n  background-image: repeating-linear-gradient(to bottom, var(--steel) 0 1.4px, transparent 1.4px calc(100% / 12));\n}\n\n/* ---------------------------------------------------------------------- */\n/* Jewel bearings \u2014 tiny precision markers                                  */\n/* ---------------------------------------------------------------------- */\n\n.jewel {\n  display: inline-block;\n  width: 6px;\n  height: 6px;\n  flex-shrink: 0;\n  border-radius: 50%;\n  background: radial-gradient(circle at 35% 30%, var(--text) 0%, var(--steel) 45%, var(--steel-dim) 100%);\n  box-shadow: 0 0 0 1px var(--border);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Buttons                                                                   */\n/* ---------------------------------------------------------------------- */\n\n.btn {\n  display: inline-block;\n  border-radius: 0;\n  padding: 16px 34px;\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  text-decoration: none;\n  text-align: center;\n  transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease;\n  white-space: nowrap;\n}\n\n.btn-primary {\n  border: 1px solid var(--steel);\n  color: var(--text);\n  background: transparent;\n}\n\n.btn-primary:hover,\n.btn-primary:focus-visible {\n  background: var(--steel-fill);\n  border-color: var(--steel-fill);\n  color: var(--bg);\n}\n\n.text-link {\n  color: var(--steel-text);\n  text-decoration: none;\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  border-bottom: 1px solid var(--steel-rule);\n  padding-bottom: 2px;\n}\n\n.text-link:hover, .text-link:focus-visible { border-color: var(--steel); color: var(--text); }\n\n/* ---------------------------------------------------------------------- */\n/* Intro assembly animation                                                 */\n/* ---------------------------------------------------------------------- */\n\n.intro-overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 9000;\n  background: var(--bg);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  transition: opacity 500ms ease;\n}\n\n.intro-overlay[data-hidden=\"true\"] {\n  opacity: 0;\n  pointer-events: none;\n}\n\n.intro-mark {\n  width: clamp(72px, 14vw, 140px);\n  color: var(--steel);\n}\n\n.intro-mark .bz-b {\n  opacity: 0;\n  transition: transform 1200ms cubic-bezier(0,.68,.24,1), opacity 1200ms ease;\n}\n\n.intro-mark.bz-run .bz-b { opacity: 1; transform: translate(0, 0); }\n\n.intro-mark .bz-b1 { transform: translate(6%, -6%); }\n.intro-mark .bz-b2 { transform: translate(-6%, -6%); }\n.intro-mark .bz-b3 { transform: translate(6%, 6%); }\n.intro-mark .bz-b4 { transform: translate(-6%, 6%); }\n\n.intro-mark.bz-run .bz-b2 { transition-delay: 35ms; }\n.intro-mark.bz-run .bz-b3 { transition-delay: 65ms; }\n.intro-mark.bz-run .bz-b4 { transition-delay: 100ms; }\n\n/* ---------------------------------------------------------------------- */\n/* Top navigation                                                           */\n/* ---------------------------------------------------------------------- */\n\n.site-header {\n  position: fixed;\n  top: 0; left: 0; right: 0;\n  z-index: 500;\n  background: var(--header-bg);\n  backdrop-filter: blur(10px);\n  border-bottom: 1px solid var(--border);\n}\n\n.nav {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 16px;\n  padding-top: 16px;\n  padding-bottom: 16px;\n}\n\n.brand { display: inline-flex; align-items: center; gap: .7em; text-decoration: none; color: var(--text); flex-shrink: 0; }\n.byzaro-mark { width: auto; height: 32px; flex-shrink: 0; }\n.brand-text { display: flex; flex-direction: column; gap: .28em; min-width: 0; }\n\n.brand-word {\n  font-family: var(--font-ui);\n  font-weight: 500;\n  font-size: 16px;\n  line-height: .72;\n  letter-spacing: .445em;\n  text-indent: .445em;\n  margin-right: -.445em;\n  display: flex;\n  align-items: flex-start;\n  white-space: nowrap;\n}\n\n.brand-lam { width: .745em; height: .72em; margin-right: .036em; flex-shrink: 0; }\n\n.brand-sub {\n  font-family: var(--font-ui);\n  font-weight: 300;\n  font-size: 8.5px;\n  line-height: .72;\n  letter-spacing: 1.02em;\n  text-indent: 1.02em;\n  margin-right: -1.02em;\n  white-space: nowrap;\n}\n\n.nav-links {\n  display: flex;\n  align-items: center;\n  gap: clamp(16px, 2.4vw, 34px);\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n}\n\n.nav-links a:not(.btn) {\n  text-decoration: none;\n  color: var(--text-dim);\n  padding: 4px 0;\n  border-bottom: 1px solid transparent;\n  transition: color 200ms ease, border-color 200ms ease;\n}\n\n.nav-links a:not(.btn):hover,\n.nav-links a:not(.btn):focus-visible,\n.nav-links a.is-active {\n  color: var(--text);\n  border-bottom-color: var(--steel);\n}\n\n.nav-cta { padding: 11px 20px; font-size: 11px; }\n\n.lang-switch { display: flex; align-items: center; gap: 6px; font-family: var(--font-ui); font-size: 11px; letter-spacing: .12em; }\n.lang-switch a, .lang-switch .lang-current { color: var(--steel-text); text-decoration: none; }\n.lang-switch span[aria-disabled=\"true\"] { color: var(--text-dim); opacity: .85; cursor: default; }\n.lang-sep { color: var(--text-dim); opacity: .5; }\n\n/* ---------------------------------------------------------------------- */\n/* Theme toggle                                                             */\n/* ---------------------------------------------------------------------- */\n\n.theme-toggle {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  background: transparent;\n  border: none;\n  padding: 4px 0;\n  color: var(--steel-text);\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  transition: color 200ms ease;\n}\n\n.theme-toggle-glyph { font-size: 13px; line-height: 1; }\n\n.theme-toggle:hover, .theme-toggle:focus-visible { color: var(--text); }\n\n.mobile-menu .theme-toggle { margin-top: 12px; font-size: 13px; justify-content: center; }\n\n.nav-toggle {\n  display: none;\n  background: transparent;\n  border: 1px solid var(--border);\n  width: 42px;\n  height: 42px;\n  align-items: center;\n  justify-content: center;\n  flex-shrink: 0;\n}\n\n.nav-toggle-bars { position: relative; width: 18px; height: 12px; }\n.nav-toggle-bars span {\n  position: absolute; left: 0; right: 0; height: 1px;\n  background: var(--text);\n  transition: transform 200ms ease, opacity 200ms ease, top 200ms ease;\n}\n.nav-toggle-bars span:nth-child(1) { top: 0; }\n.nav-toggle-bars span:nth-child(2) { top: 5px; }\n.nav-toggle-bars span:nth-child(3) { top: 11px; }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(1) { top: 5px; transform: rotate(45deg); }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(2) { opacity: 0; }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(3) { top: 5px; transform: rotate(-45deg); }\n\n.mobile-menu {\n  position: fixed;\n  inset: 0;\n  z-index: 600;\n  background: var(--bg);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: clamp(20px, 5vh, 40px);\n  transform: translateY(-100%);\n  opacity: 0;\n  transition: transform 320ms ease, opacity 320ms ease;\n  visibility: hidden;\n}\n\n.mobile-menu.is-open { transform: translateY(0); opacity: 1; visibility: visible; }\n\n.mobile-menu a {\n  font-family: var(--font-display);\n  font-size: clamp(1.6rem, 8vw, 2.6rem);\n  text-decoration: none;\n  color: var(--text);\n  letter-spacing: .01em;\n}\n\n.mobile-menu a.is-active { color: var(--steel-text); }\n.mobile-menu .lang-switch { margin-top: 12px; font-size: 13px; }\n\n.mobile-menu-close {\n  position: absolute;\n  top: 16px;\n  right: clamp(20px, 5vw, 56px);\n  background: transparent;\n  border: 1px solid var(--border);\n  width: 42px;\n  height: 42px;\n  color: var(--text);\n  font-size: 18px;\n  line-height: 1;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Hero                                                                      */\n/* ---------------------------------------------------------------------- */\n\n.hero {\n  position: relative;\n  min-height: 100svh;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  overflow: hidden;\n  padding: 140px 0 80px;\n}\n\n.hero-guilloche {\n  position: absolute;\n  inset: 0;\n  pointer-events: none;\n  opacity: .035;\n  background-repeat: repeat;\n  background-size: 64px 64px;\n  background-image: url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><g fill='none' stroke='%238C97A5' stroke-width='0.6'><circle cx='0' cy='0' r='34'/><circle cx='64' cy='0' r='34'/><circle cx='0' cy='64' r='34'/><circle cx='64' cy='64' r='34'/><circle cx='32' cy='32' r='34'/></g></svg>\");\n}\n\n.hero-mark-bg {\n  position: absolute;\n  top: 50%;\n  left: 50%;\n  width: 140vh;\n  max-width: none;\n  height: 140vh;\n  transform: translate(-50%, -50%);\n  color: var(--steel);\n  opacity: .045;\n  pointer-events: none;\n}\n\n.hero-frame { position: absolute; inset: 22px; border: 1px solid var(--frame-border); pointer-events: none; z-index: 1; }\n\n@media (max-width: 640px) { .hero-frame { display: none; } }\n\n.hero-index-scale {\n  position: absolute;\n  left: clamp(20px, 4vw, 48px);\n  top: 140px;\n  bottom: 80px;\n  z-index: 1;\n  display: none;\n}\n\n@media (min-width: 1000px) { .hero-index-scale { display: block; } }\n\n.hero .hero-index-scale.index-scale--v { height: auto; }\n\n.hero-inner {\n  position: relative;\n  z-index: 2;\n  max-width: 900px;\n  margin: 0 auto;\n  padding: 0 clamp(20px, 5vw, 56px);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: clamp(20px, 3vw, 30px);\n}\n\n.hero-label { font-family: var(--font-ui); font-size: 11px; letter-spacing: .25em; text-transform: uppercase; color: var(--steel-text); max-width: 44ch; }\n\n.hero-headline {\n  font-size: clamp(2.6rem, 7vw, 6.4rem);\n  line-height: 1.03;\n  text-transform: uppercase;\n}\n\n.hero-headline span { display: block; }\n\n.hero-support { color: var(--text-dim); max-width: 56ch; font-size: clamp(.95rem, 1.4vw, 1.1rem); }\n\n.hero-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: clamp(16px, 3vw, 28px); margin-top: 8px; }\n\n/* ---------------------------------------------------------------------- */\n/* The Group \u2014 triad                                                        */\n/* ---------------------------------------------------------------------- */\n\n.triad {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n}\n\n.triad-tick { width: 18px; }\n\n.triad-word {\n  text-align: center;\n  padding: clamp(20px, 4vw, 36px) 0;\n  font-size: clamp(1.6rem, 5vw, 3.2rem);\n}\n\n.triad-tick { height: 16px; }\n\n@media (min-width: 780px) {\n  .triad { flex-direction: row; align-items: stretch; }\n  .triad-word { flex: 1; }\n  .triad-tick { width: 16px; height: auto; flex-shrink: 0; }\n}\n\n.group-copy { margin-top: clamp(40px, 6vw, 64px); text-align: center; display: flex; flex-direction: column; gap: 20px; align-items: center; }\n.group-copy .lede { font-size: clamp(1rem, 1.6vw, 1.2rem); color: var(--text); }\n.group-copy .audience { color: var(--text-dim); max-width: 52ch; font-size: .95rem; }\n\n/* ---------------------------------------------------------------------- */\n/* Capabilities rows (home page) \u2014 \"Five Movements, One Mechanism\"          */\n/* ---------------------------------------------------------------------- */\n\n.cap-rows { border-top: 1px solid var(--border); }\n\n.cap-row {\n  display: flex;\n  align-items: center;\n  gap: clamp(14px, 3vw, 28px);\n  text-decoration: none;\n  color: var(--text);\n  padding: clamp(20px, 3.4vw, 34px) clamp(8px, 2vw, 20px);\n  border-bottom: 1px solid var(--border);\n  transition: background-color 200ms ease;\n}\n\n.cap-row:hover, .cap-row:focus-visible { background: var(--bg-2); }\n\n.cap-row .jewel { margin-right: 4px; }\n\n.cap-num {\n  font-family: var(--font-ui);\n  color: var(--text-dim);\n  font-size: clamp(1rem, 1.6vw, 1.3rem);\n  width: 2.2em;\n  flex-shrink: 0;\n  transition: color 200ms ease;\n}\n\n.cap-row:hover .cap-num, .cap-row:focus-visible .cap-num { color: var(--text); }\n\n.cap-name {\n  font-family: var(--font-display);\n  font-size: clamp(1.2rem, 2.6vw, 1.9rem);\n  letter-spacing: .01em;\n  flex-shrink: 0;\n  width: 9em;\n  max-width: 40vw;\n}\n\n.cap-descriptor { margin-left: auto; color: var(--text-dim); font-size: .9rem; text-align: right; display: none; }\n\n@media (min-width: 720px) { .cap-descriptor { display: block; } }\n\n.cap-arrow {\n  flex-shrink: 0;\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--steel-text);\n  white-space: nowrap;\n}\n\n/* ---------------------------------------------------------------------- */\n/* One Network \u2014 the Movement diagram                                       */\n/* ---------------------------------------------------------------------- */\n\n.movement-wrap { margin-top: clamp(48px, 7vw, 88px); display: flex; justify-content: center; }\n\n.movement-diagram { width: min(100%, 720px); height: auto; }\n\n.movement-diagram .mv-scale { stroke: var(--steel-dim); stroke-width: .6; opacity: .7; }\n.movement-diagram .mv-scale-long { stroke: var(--steel); stroke-width: 1; }\n.movement-diagram .mv-ring { fill: none; stroke: var(--border-strong); stroke-width: 1; }\n.movement-diagram .mv-ring--outer { stroke-dasharray: 3 5; stroke: var(--steel-dim); }\n.movement-diagram .mv-line { stroke: var(--steel-dim); stroke-width: 1; }\n.movement-diagram .mv-center { color: var(--text); }\n.movement-diagram .mv-jewel { fill: var(--steel); }\n.movement-diagram .mv-jewel-core { fill: var(--text); }\n.movement-diagram .mv-label {\n  font-family: var(--font-ui);\n  font-size: 9px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  fill: var(--text-dim);\n}\n.movement-diagram .mv-label--division { fill: var(--steel-text); font-weight: 500; }\n.movement-diagram .mv-label--ring { fill: var(--steel-text); font-size: 8.5px; letter-spacing: .18em; }\n\n.network-statement {\n  max-width: 60ch;\n  margin: 0 auto;\n  text-align: center;\n  font-size: clamp(1.1rem, 2vw, 1.5rem);\n  font-family: var(--font-display);\n  letter-spacing: .01em;\n  line-height: 1.4;\n}\n\n.movement-list-fallback-wrap { display: none; text-align: center; margin-top: 24px; width: 100%; }\n\n.movement-list-fallback {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 8px 16px;\n  font-family: var(--font-ui);\n  font-size: .88rem;\n  letter-spacing: .08em;\n  text-transform: uppercase;\n  color: var(--text-dim);\n  margin-top: 10px;\n}\n\n@media (max-width: 640px) {\n  .movement-diagram { display: none; }\n  .movement-list-fallback-wrap { display: block; }\n}\n\n/* ---------------------------------------------------------------------- */\n/* International reach \u2014 precision table                                    */\n/* ---------------------------------------------------------------------- */\n\n.reach-table { border-top: 1px solid var(--border); max-width: 720px; margin: 0 auto; }\n\n.reach-row {\n  display: flex;\n  align-items: center;\n  gap: 16px;\n  padding: clamp(14px, 2.4vw, 20px) 4px;\n  border-bottom: 1px solid var(--border);\n}\n\n.reach-name { font-family: var(--font-display); font-size: clamp(1.05rem, 1.8vw, 1.3rem); }\n\n.reach-tick { flex: 1; height: 14px; }\n\n.reach-label {\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  color: var(--steel-text);\n  flex-shrink: 0;\n}\n\n.reach-cities {\n  margin-top: clamp(28px, 4vw, 44px);\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  color: var(--text-dim);\n  text-align: center;\n}\n\n.reach-ambition { margin-top: 14px; color: var(--text-dim); text-align: center; }\n\n/* ---------------------------------------------------------------------- */\n/* Special situations                                                       */\n/* ---------------------------------------------------------------------- */\n\n.special-headline {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-weight: 700;\n  font-size: clamp(1.9rem, 4.6vw, 3.4rem);\n  max-width: 20ch;\n  line-height: 1.2;\n}\n\n.special-body { color: var(--text-dim); max-width: 56ch; margin-top: 20px; }\n\n.special-list {\n  margin-top: clamp(40px, 6vw, 64px);\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 4px 0;\n  font-family: var(--font-ui);\n  font-size: clamp(.85rem, 1.6vw, 1rem);\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  color: var(--text);\n}\n\n.special-list li { display: flex; align-items: center; }\n.special-list li .index-scale { width: 30px; margin: 0 14px; }\n.special-list li:last-child .index-scale { display: none; }\n\n.special-cta { margin-top: clamp(40px, 6vw, 64px); text-align: center; }\n\n/* ---------------------------------------------------------------------- */\n/* Opportunities rows                                                       */\n/* ---------------------------------------------------------------------- */\n\n.opp-rows { border-top: 1px solid var(--border); }\n\n.opp-row {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 8px 24px;\n  padding: clamp(20px, 3vw, 30px) 4px;\n  border-bottom: 1px solid var(--border);\n}\n\n.opp-name { font-family: var(--font-display); font-size: clamp(1.1rem, 2vw, 1.5rem); letter-spacing: .01em; }\n\n.opp-tag {\n  color: var(--text-dim);\n  font-family: var(--font-ui);\n  font-size: .78rem;\n  letter-spacing: .08em;\n  text-transform: uppercase;\n  flex-shrink: 0;\n}\n\n.opp-qualification { margin-top: clamp(24px, 4vw, 36px); color: var(--text-dim); text-align: center; }\n\n/* ---------------------------------------------------------------------- */\n/* Closing CTA                                                              */\n/* ---------------------------------------------------------------------- */\n\n.closing {\n  text-align: center;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: clamp(28px, 4vw, 44px);\n}\n\n.closing .index-scale { max-width: 480px; margin-bottom: 12px; }\n\n.closing-headline { font-size: clamp(2.2rem, 7vw, 5.4rem); line-height: 1.05; max-width: 16ch; }\n\n/* ---------------------------------------------------------------------- */\n/* Footer                                                                    */\n/* ---------------------------------------------------------------------- */\n\n.site-footer { border-top: 1px solid var(--border); padding: clamp(56px, 8vw, 96px) 0 clamp(28px, 4vw, 40px); }\n\n.footer-top { display: flex; flex-wrap: wrap; gap: clamp(28px, 5vw, 60px); justify-content: space-between; padding-bottom: clamp(32px, 5vw, 56px); }\n\n.footer-brand { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }\n.footer-brand .byzaro-mark { height: 26px; }\n.footer-brand .brand-word { font-size: 14px; }\n.footer-brand .brand-sub { font-size: 7.5px; }\n\n.footer-brand-tagline { font-family: var(--font-ui); font-size: 10px; letter-spacing: .18em; color: var(--text-dim); }\n\n.footer-nav { display: flex; flex-wrap: wrap; gap: 10px 28px; font-family: var(--font-ui); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }\n.footer-nav a { text-decoration: none; color: var(--text-dim); }\n.footer-nav a:hover, .footer-nav a:focus-visible { color: var(--steel-text); }\n\n.footer-bottom { border-top: 1px solid var(--border); padding-top: clamp(24px, 4vw, 36px); display: flex; flex-direction: column; gap: 14px; }\n\n.footer-legal-row { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; font-family: var(--font-ui); font-size: 12px; color: var(--text-dim); }\n\n.footer-compliance { font-family: var(--font-ui); font-size: 11.5px; color: var(--text-dim); max-width: 90ch; line-height: 1.6; }\n\n/* ---------------------------------------------------------------------- */\n/* Reveal on scroll                                                         */\n/* ---------------------------------------------------------------------- */\n\n.reveal { opacity: 0; transform: translateY(24px); transition: opacity 700ms ease, transform 700ms ease; }\n.reveal.is-visible { opacity: 1; transform: translateY(0); }\n\n/* ---------------------------------------------------------------------- */\n/* Sticky sub-nav (capabilities.html)                                       */\n/* ---------------------------------------------------------------------- */\n\n.subnav { position: sticky; top: 66px; z-index: 100; background: var(--subnav-bg); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }\n\n.subnav-inner { display: flex; gap: clamp(16px, 3vw, 36px); overflow-x: auto; padding: 14px clamp(20px, 5vw, 56px); scrollbar-width: thin; max-width: 100%; }\n.subnav-inner::-webkit-scrollbar { height: 4px; }\n.subnav-inner::-webkit-scrollbar-thumb { background: var(--border-strong); }\n\n.subnav a {\n  flex-shrink: 0;\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  text-decoration: none;\n  color: var(--text-dim);\n  padding-bottom: 4px;\n  border-bottom: 1px solid transparent;\n  white-space: nowrap;\n}\n\n.subnav a:hover, .subnav a:focus-visible, .subnav a.is-active { color: var(--steel-text); border-bottom-color: var(--steel); }\n\n/* ---------------------------------------------------------------------- */\n/* Division chapters (capabilities.html)                                    */\n/* ---------------------------------------------------------------------- */\n\n.division { scroll-margin-top: 130px; }\n\n.division-head { text-align: center; max-width: 720px; margin: 0 auto clamp(40px, 6vw, 72px); }\n\n.division-eyebrow { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 20px; }\n\n.division-name { font-size: clamp(2.2rem, 6vw, 4.2rem); line-height: 1.05; }\n\n.division-line { margin-top: 18px; color: var(--text-dim); font-size: clamp(1rem, 1.6vw, 1.2rem); }\n\n.division-body { display: grid; grid-template-columns: 1fr; gap: clamp(32px, 5vw, 64px); max-width: 1100px; margin: 0 auto; }\n\n@media (min-width: 860px) { .division-body { grid-template-columns: 1.1fr .9fr; align-items: start; } }\n\n.service-list { display: grid; grid-template-columns: 1fr; border-top: 1px solid var(--border); }\n\n@media (min-width: 560px) { .service-list { grid-template-columns: 1fr 1fr; } }\n\n.service-list li {\n  display: flex;\n  align-items: baseline;\n  gap: 10px;\n  padding: 16px 12px;\n  border-bottom: 1px solid var(--border);\n  font-size: .96rem;\n}\n\n.service-list li .jewel { flex-shrink: 0; margin-top: .35em; }\n\n@media (min-width: 560px) { .service-list li:nth-child(odd) { border-right: 1px solid var(--border); padding-left: 0; } }\n\n.division-aside { border-left: 1px solid var(--border-strong); padding: 4px 0 4px 22px; display: flex; flex-direction: column; gap: 18px; }\n\n.use-case-panel { position: relative; padding-top: 22px; }\n.use-case-panel .index-scale { position: absolute; top: 0; left: 0; right: 0; height: 12px; }\n.use-case-panel .use-case { font-style: italic; font-family: var(--font-display); color: var(--text); font-size: 1.05rem; line-height: 1.6; padding-top: 8px; }\n\n.division-aside .relation-line { font-size: .88rem; color: var(--text-dim); }\n\n.division-compliance-panel {\n  margin-top: 28px;\n  background: var(--bg-3);\n  padding: 20px 22px;\n  border: 1px solid var(--border);\n}\n\n.division-compliance {\n  font-size: .82rem;\n  color: var(--text-dim);\n  line-height: 1.6;\n}\n\n.division-sep { margin: 0; }\n\n/* ---------------------------------------------------------------------- */\n/* Network page \u2014 the Movement, mandate flow how-it-works                   */\n/* ---------------------------------------------------------------------- */\n\n.mandate-steps {\n  display: flex;\n  max-width: 780px;\n  margin: clamp(40px, 6vw, 64px) auto 0;\n  gap: clamp(20px, 4vw, 40px);\n}\n\n.mandate-steps-spine { flex-shrink: 0; width: 18px; }\n\n.mandate-steps-list { display: flex; flex-direction: column; gap: clamp(28px, 4vw, 44px); flex: 1; }\n\n.mandate-step { display: flex; align-items: flex-start; gap: 14px; }\n\n.mandate-step .jewel { margin-top: .5em; flex-shrink: 0; }\n\n.mandate-step-num { font-family: var(--font-ui); color: var(--steel-text); font-size: .85rem; letter-spacing: .1em; margin-right: 14px; }\n\n.mandate-step-name { font-family: var(--font-display); font-size: clamp(1.05rem, 1.8vw, 1.3rem); }\n\n.mandate-step-body { color: var(--text-dim); font-size: .92rem; margin-top: 4px; }\n\n.mandate-worked-lede { max-width: 62ch; margin: 0 auto; text-align: center; color: var(--text-dim); }\n\n/* ---------------------------------------------------------------------- */\n/* Mandate form                                                             */\n/* ---------------------------------------------------------------------- */\n\n.mandate { max-width: 820px; margin: 0 auto; }\n\n.mandate-headline { text-align: center; font-size: clamp(2rem, 5.5vw, 4rem); margin-bottom: clamp(20px, 3vw, 28px); }\n\n.mandate-confidential-top { text-align: center; color: var(--text-dim); font-size: .9rem; max-width: 60ch; margin: 0 auto clamp(36px, 5vw, 56px); }\n\n.category-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: clamp(36px, 5vw, 56px); }\n\n.category-grid input[type=\"radio\"] { position: absolute; opacity: 0; width: 1px; height: 1px; }\n\n.category-grid label {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  padding: 18px 14px;\n  border: 1px solid var(--border);\n  background: var(--bg-2);\n  font-family: var(--font-ui);\n  font-size: .84rem;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: var(--text-dim);\n  transition: border-color 200ms ease, color 200ms ease, background-color 200ms ease;\n  min-height: 64px;\n}\n\n.category-grid input[type=\"radio\"]:checked + label { background: var(--steel-fill); border-color: var(--steel-fill); color: var(--bg); }\n\n.category-grid input[type=\"radio\"]:focus-visible + label { outline: 2px solid var(--steel); outline-offset: 2px; }\n\n.mandate-form { display: grid; grid-template-columns: 1fr; gap: 22px; }\n\n@media (min-width: 680px) {\n  .mandate-form { grid-template-columns: 1fr 1fr; }\n  .field--full { grid-column: 1 / -1; }\n}\n\n.field { display: flex; flex-direction: column; gap: 8px; }\n\n.field label { font-family: var(--font-ui); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--text-dim); }\n\n.field input, .field select, .field textarea {\n  background: var(--input-bg);\n  border: 1px solid var(--input-border);\n  color: var(--text);\n  padding: 13px 14px;\n  font-family: var(--font-ui);\n  font-size: .95rem;\n  border-radius: 0;\n}\n\n.field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible { outline: none; border-color: var(--steel); box-shadow: 0 0 0 2px var(--border-strong); }\n\n.field textarea { resize: vertical; min-height: 120px; }\n\n.mandate-submit-row { margin-top: 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }\n\n.mandate-confidential { font-size: .82rem; color: var(--text-dim); max-width: 60ch; }\n\n.mandate-confirmation { display: none; border: 1px solid var(--steel); padding: 16px 20px; color: var(--text); font-size: .92rem; }\n.mandate-confirmation.is-visible { display: block; }\n\n/* ---------------------------------------------------------------------- */\n/* Reduced motion                                                           */\n/* ---------------------------------------------------------------------- */\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: .001ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: .001ms !important;\n    scroll-behavior: auto !important;\n  }\n  .reveal { opacity: 1; transform: none; }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Responsive: nav collapse                                                 */\n/* ---------------------------------------------------------------------- */\n\n@media (max-width: 820px) {\n  .nav-links { display: none; }\n  .nav-toggle { display: flex; }\n}\n\n@media (min-width: 821px) {\n  .mobile-menu, .mobile-menu-close { display: none; }\n}\n\n</style>\n</head>\n<body data-concept=\"03\">\n\n<header class=\"site-header\">\n  <div class=\"container nav\">\n    <a class=\"brand\" href=\"index.html\" aria-label=\"Byzaro Group\">\n      <svg class=\"byzaro-mark\" viewBox=\"0 0 367 390\" fill=\"currentColor\" aria-hidden=\"true\">\n        <defs><path id=\"bzb-nav\" fill-rule=\"evenodd\" d=\"M0,0 H164 V56 C161,68 145,70 145,90 C145,110 161,112 164,124 V181 H0 Z M33,32 H131 V54 A20,20 0 0 1 111,74 H76 V107 H110 A21,21 0 0 1 131,128 V149 H33 Z\"/></defs>\n        <use href=\"#bzb-nav\" transform=\"translate(203,0)\"/>\n        <use href=\"#bzb-nav\" transform=\"translate(164,0) scale(-1,1)\"/>\n        <use href=\"#bzb-nav\" transform=\"translate(203,209)\"/>\n        <use href=\ veal\">\n        <span class=\"chapter-numeral\">III</span>\n        <h2 class=\"chapter-title\">How a Mandate Runs</h2>\n      </div>\n      <p class=\"mandate-worked-lede reveal\">A Swiss entrepreneur expands into the UAE. A single mandate, assembled across the group.</p>\n\n      <div class=\"mandate-steps reveal\">\n        <div class=\"mandate-steps-spine index-scale index-scale--v\" aria-hidden=\"true\"></div>\n        <ol class=\"mandate-steps-list\">\n          <li class=\"mandate-step\"><span class=\"jewel\" aria-hidden=\"true\"></span><div><span class=\"mandate-step-num\">01</span><span class=\"mandate-step-name\">Strategy</span><p class=\"mandate-step-body\">Defining the approach to the UAE market.</p></div></li>\n          <li class=\"mandate-step\"><span class=\"jewel\" aria-hidden=\"true\"></span><div><span class=\"mandate-step-num\">02</span><span class=\"mandate-step-name\">Company Establishment</span><p class=\"mandate-step-body\">Structuring and incorporating in the UAE.</p></div></li>\n          <li class=\"mandate-step\"><span class=\"jewel\" aria-hidden=\"true\"></span><div><span class=\"mandate-step-num\">03</span><span class=\"mandate-step-name\">Structuring</span><p class=\"mandate-step-body\">Aligning entities across jurisdictions.</p></div></li>\n          <li class=\"mandate-step\"><span class=\"jewel\" aria-hidden=\"true\"></span><div><span class=\"mandate-step-num\">04</span><span class=\"mandate-step-name\">Legal &amp; Tax Coordination</span><p class=\"mandate-step-body\">Coordinated with qualified partners.</p></div></li>\n          <li class=\"mandate-step\"><span class=\"jewel\" aria-hidden=\"true\"></span><div><span class=\"mandate-step-num\">05</span><span class=\"mandate-step-name\">Premises</span><p class=\"mandate-step-body\">Securing operating premises.</p></div></li>\n          <li class=\"mandate-step\"><span class=\"jewel\" aria-hidden=\"true\"></span><div><span class=\"mandate-step-num\">06</span><span class=\"mandate-step-name\">Recruitment</span><p class=\"mandate-step-body\">Building the local team.</p></div></li>\n          <li class=\"mandate-step\"><span class=\"jewel\" aria-hidden=\"true\"></span><div><span class=\"mandate-step-num\">07</span><span class=\"mandate-step-name\">Software</span><p class=\"mandate-step-body\">Deploying the operating systems and tools.</p></div></li>\n          <li class=\"mandate-step\"><span class=\"jewel\" aria-hidden=\"true\"></span><div><span class=\"mandate-step-num\">08</span><span class=\"mandate-step-name\">Market Presence</span><p class=\"mandate-step-body\">Establishing visibility and go-to-market.</p></div></li>\n        </ol>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"chapter chapter--panel\" id=\"opportunities\">\n    <div class=\"container\">\n      <div class=\"chapter-head reveal\">\n        <span class=\"chapter-numeral\">IV</span>\n        <h2 class=\"chapter-title\">Opportunities</h2>\n      </div>\n      <p class=\"lede center reveal\" style=\"margin-bottom:clamp(32px,5vw,56px);\">Selected opportunities are shared directly and may require qualification.</p>\n      <div class=\"opp-rows reveal\">\n        <div class=\"opp-row\"><span class=\"opp-name\">Private Markets</span><span class=\"opp-tag\">Qualification required</span></div>\n        <div class=\"opp-row\"><span class=\"opp-name\">Real Estate</span><span class=\"opp-tag\">Qualification required</span></div>\n        <div class=\"opp-row\"><span class=\"opp-name\">Strategic Partnerships</span><span class=\"opp-tag\">Qualification required</span></div>\n        <div class=\"opp-row\"><span class=\"opp-name\">Business Acquisitions</span><span class=\"opp-tag\">Qualification required</span></div>\n      </div>\n      <div class=\"special-cta reveal\">\n        <a class=\"btn btn-primary\" href=\"#mandate\">Request Access</a>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"chapter\" id=\"mandate\">\n    <div class=\"container\">\n      <div clas k); }\n\n/* ---------------------------------------------------------------------- */\n/* Mobile menu                                                             */\n/* ---------------------------------------------------------------------- */\n\n.nav-toggle {\n  display: none;\n  background: transparent;\n  border: 1px solid var(--concrete);\n  width: 42px;\n  height: 42px;\n  align-items: center;\n  justify-content: center;\n  flex-shrink: 0;\n}\n\n.nav-toggle-bars { position: relative; width: 18px; height: 12px; }\n\n.nav-toggle-bars span {\n  position: absolute;\n  left: 0; right: 0;\n  height: 1px;\n  background: var(--ink);\n  transition: transform 200ms ease, opacity 200ms ease, top 200ms ease;\n}\n\n.nav-toggle-bars span:nth-child(1) { top: 0; }\n.nav-toggle-bars span:nth-child(2) { top: 5px; }\n.nav-toggle-bars span:nth-child(3) { top: 11px; }\n\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(1) { top: 5px; transform: rotate(45deg); }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(2) { opacity: 0; }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(3) { top: 5px; transform: rotate(-45deg); }\n\n.mobile-menu {\n  position: fixed;\n  inset: 0;\n  z-index: 600;\n  background: var(--bg);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: clamp(20px, 5vh, 36px);\n  transform: translateY(-100%);\n  opacity: 0;\n  transition: transform 320ms ease, opacity 320ms ease;\n  visibility: hidden;\n  font-family: var(--font-ui);\n  text-transform: uppercase;\n  letter-spacing: .1em;\n  font-size: 18px;\n}\n\n.mobile-menu.is-open { transform: translateY(0); opacity: 1; visibility: visible; }\n\n.mobile-menu a { text-decoration: none; color: var(--ink); }\n.mobile-menu a.is-active { color: var(--muted); }\n\n.mobile-menu-close {\n  position: absolute;\n  top: 16px;\n  right: clamp(20px, 5vw, 56px);\n  background: transparent;\n  border: 1px solid var(--concrete);\n  width: 42px;\n  height: 42px;\n  color: var(--ink);\n  font-size: 18px;\n  line-height: 1;\n}\n\n@media (max-width: 820px) {\n  .nav-links { display: none; }\n  .nav-toggle { display: flex; }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Hero (index)                                                            */\n/* ---------------------------------------------------------------------- */\n\n.hero {\n  position: relative;\n  min-height: 100svh;\n  display: flex;\n  align-items: center;\n  justify-content: flex-start;\n  overflow: hidden;\n  padding: calc(var(--header-h) + 40px) 0 80px;\n  background-color: var(--bg);\n}\n\n.hero-mark-bg {\n  position: absolute;\n  top: 50%;\n  right: -10vw;\n  width: 130vh;\n  max-width: none;\n  height: 130vh;\n  transform: translateY(-50%);\n  color: var(--ink);\n  opacity: .045;\n  pointer-events: none;\n  z-index: 0;\n}\n\n.hero-mark-bg.hero-mark-bg--2 {\n  opacity: .02;\n  transform: translateY(-50%) translate(6px, 8px);\n}\n\n.hero-inner {\n  position: relative;\n  z-index: 2;\n  max-width: 920px;\n  width: 100%;\n  margin: 0 auto;\n  padding: 0 clamp(20px, 5vw, 56px);\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  gap: clamp(22px, 3vw, 34px);\n}\n\n.hero-label {\n  max-width: 46ch;\n}\n\n.hero-headline {\n  font-family: var(--font-display);\n  font-weight: 700;\n  text-transform: uppercase;\n  font-size: clamp(3rem, 9vw, 8rem);\n  line-height: .94;\n}\n\n.hero-headline span { display: block; }\n\n.hero-support {\n  color: var(--muted);\n  font-size: clamp(1rem, 1.6vw, 1.2rem);\n  max-width: 56ch;\n}\n\n.hero-cta-row { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; }\n\n.scroll-cue {\n  position: absolute;\n  left: clamp(20px, 5vw, 56px);\n  bottom: 28px;\n  width: 1px;\n  height: 46px;\n  background: var(--concrete);\n  z-index: 2;\n}\n\n@media (max-width: 640px) {\n  .scroll-cue { display: none; }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Chapters / generic section rhythm                                       */\n/* ---------------------------------------------------------------------- */\n\n.chapter {\n  position: relative;\n  padding: var(--section-pad) 0;\n  background: var(--bg);\n}\n\n.chapter--alt { background: var(--bg-2); }\n\n.chapter-head {\n  display: flex;\n  align-items: baseline;\n  gap: 18px;\n  margin-bottom: clamp(40px, 6vw, 72px);\n  border-bottom: 1px solid rgba(var(--ink-rgb), .14);\n  padding-bottom: 20px;\n}\n\n.chapter-numeral {\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .16em;\n  color: var(--muted);\n}\n\n.band .chapter-numeral { color: var(--muted-on-ink); }\n\n.chapter-title {\n  font-family: var(--font-display);\n  text-transform: uppercase;\n  font-size: clamp(1.5rem, 3vw, 2.1rem);\n}\n\n.band {\n  background: var(--ink);\n  color: var(--bg);\n}\n\n.band .muted-line { color: var(--muted-on-ink); }\n\n/* ---------------------------------------------------------------------- */\n/* Triad \u2014 ACCESS. EXPERTISE. EXECUTION.                                   */\n/* ---------------------------------------------------------------------- */\n\n.triad {\n  display: flex;\n  flex-direction: column;\n  margin-bottom: clamp(48px, 7vw, 80px);\n}\n\n.triad-word {\n  font-family: var(--font-display);\n  font-weight: 700;\n  text-transform: uppercase;\n  font-size: clamp(2.4rem, 8vw, 6.4rem);\n  line-height: 1.02;\n  padding: clamp(10px, 1.6vw, 18px) 0;\n}\n\n.triad-rule { border: none; border-top: 1px solid rgba(var(--bg-rgb), .22); margin: 0; }\n\n.group-copy { max-width: 780px; display: flex; flex-direction: column; gap: 20px; }\n\n.lede { font-size: clamp(1.05rem, 1.8vw, 1.3rem); }\n\n.audience { color: var(--muted-on-ink); font-size: .95rem; }\n\n/* ---------------------------------------------------------------------- */\n/* Capabilities \u2014 gallery-wall rows (index teaser)                         */\n/* ---------------------------------------------------------------------- */\n\n.cap-rows { border-top: 1px solid rgba(var(--ink-rgb), .14); }\n\n.cap-row {\n  display: grid;\n  grid-template-columns: 160px 1fr;\n  gap: 16px 40px;\n  align-items: center;\n  padding: clamp(22px, 3.4vw, 40px) clamp(12px, 2vw, 24px);\n  border-bottom: 1px solid rgba(var(--ink-rgb), .14);\n  text-decoration: none;\n  color: inherit;\n  transition: background-color 220ms ease;\n}\n\n.cap-row:hover, .cap-row:focus-visible { background: var(--bg-2); }\n\n.cap-row-label { display: flex; align-items: baseline; gap: 12px; }\n\n.cap-row-index { font-family: var(--font-ui); font-size: 12px; letter-spacing: .1em; color: var(--muted); }\n\n.cap-row-cat { font-family: var(--font-ui); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }\n\n.cap-row-main {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 8px 24px;\n}\n\n.cap-row-name {\n  font-family: var(--font-display);\n  font-weight: 700;\n  text-transform: uppercase;\n  font-size: clamp(1.6rem, 3.6vw, 2.8rem);\n  transition: transform 220ms ease;\n}\n\n.cap-row:hover .cap-row-name, .cap-row:focus-visible .cap-row-name { transform: translateX(2px); }\n\n.cap-row-descriptor { color: var(--muted); font-size: .95rem; max-width: 52ch; }\n\n.cap-row-explore {\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  color: var(--ink);\n  border-bottom: 1px solid var(--concrete);\n  padding-bottom: 2px;\n  white-space: nowrap;\n}\n\n@media (max-width: 820px) {\n  .cap-row { grid-template-columns: 1fr; gap: 10px; }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Site plan diagram                                                       */\n/* ---------------------------------------------------------------------- */\n\n.plan-wrap { display: flex; justify-content: center; margin: clamp(24px, 4vw, 48px) 0; }\n\n.plan-svg { width: min(100%, 620px); height: auto; overflow: visible; color: var(--ink); }\n\n.plan-lines line { stroke: var(--concrete); stroke-width: 1; }\n.plan-node { fill: var(--concrete); }\n.plan-center-frame { fill: none; stroke: var(--concrete); stroke-width: 1; }\n.plan-label {\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  fill: var(--ink);\n}\n.plan-label--market { fill: var(--muted); font-size: 10px; }\n.plan-dim line { stroke: var(--concrete); stroke-width: 1; }\n.plan-boundary { fill: none; stroke: var(--concrete); stroke-width: 1; stroke-dasharray: 5 6; }\n.plan-boundary-label {\n  font-family: var(--font-ui);\n  font-size: 10.5px;\n  letter-spacing: .2em;\n  text-transform: uppercase;\n  fill: var(--muted);\n}\n\n.plan-caption {\n  max-width: 640px;\n  margin: 0 auto;\n  text-align: center;\n  color: var(--muted);\n  font-size: clamp(1rem, 1.5vw, 1.15rem);\n}\n\n/* ---------------------------------------------------------------------- */\n/* International reach \u2014 table                                             */\n/* ---------------------------------------------------------------------- */\n\n.reach-table { width: 100%; border-collapse: collapse; margin-bottom: clamp(28px, 4vw, 44px); }\n\n.reach-table tr { border-bottom: 1px solid rgba(var(--ink-rgb), .14); }\n.reach-table tr:first-child { border-top: 1px solid rgba(var(--ink-rgb), .14); }\n\n.reach-table td { padding: clamp(16px, 2.4vw, 26px) clamp(8px, 1.4vw, 16px); }\n\n.reach-name {\n  font-family: var(--font-display);\n  font-weight: 700;\n  text-transform: uppercase;\n  font-size: clamp(1.2rem, 2.6vw, 1.8rem);\n}\n\n.reach-tag {\n  text-align: right;\n  font-family: var(--font-ui);\n  font-size: 10.5px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.reach-foot { display: flex; flex-direction: column; gap: 10px; max-width: 640px; }\n.reach-cities { color: var(--muted); font-size: .95rem; }\n.reach-ambition { font-size: clamp(1.05rem, 1.8vw, 1.25rem); }\n\n/* ---------------------------------------------------------------------- */\n/* Special Situations \u2014 light-shaft section                                */\n/* ---------------------------------------------------------------------- */\n\n.special-headline {\n  font-family: var(--font-display);\n  text-transform: uppercase;\n  font-size: clamp(2rem, 5.4vw, 4rem);\n  max-width: 18ch;\n  margin-bottom: 24px;\n}\n\n.special-body { color: var(--muted); max-width: 60ch; margin-bottom: clamp(32px, 5vw, 56px); font-size: clamp(1rem, 1.6vw, 1.15rem); }\n\n.special-list {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 12px 28px;\n  margin-bottom: clamp(36px, 5vw, 56px);\n  padding-top: 22px;\n  border-top: 1px solid rgba(var(--ink-rgb), .14);\n}\n\n.special-list li {\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Opportunities teaser                                                    */\n/* ---------------------------------------------------------------------- */\n\n.opp-rows { border-top: 1px solid rgba(var(--ink-rgb), .14); margin-bottom: clamp(24px, 3vw, 36px); }\n\n.opp-row {\n  display: flex;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 16px;\n  padding: clamp(18px, 2.6vw, 28px) 0;\n  border-bottom: 1px solid rgba(var(--ink-rgb), .14);\n}\n\n.opp-name {\n  font-family: var(--font-display);\n  font-weight: 700;\n  text-transform: uppercase;\n  font-size: clamp(1.15rem, 2.4vw, 1.6rem);\n}\n\n.opp-tag {\n  font-family: var(--font-ui);\n  font-size: 10.5px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  color: var(--muted);\n  white-space: nowrap;\n}\n\n.opp-note { color: var(--muted); max-width: 60ch; margin-bottom: 28px; }\n.opp-cta-row { display: flex; }\n\n/* ---------------------------------------------------------------------- */\n/* Closing band                                                            */\n/* ---------------------------------------------------------------------- */\n\n.closing { text-align: left; }\n\n.closing .container {\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  gap: clamp(28px, 4vw, 44px);\n}\n\n.closing-headline {\n  font-family: var(--font-display);\n  text-transform: uppercase;\n  font-size: clamp(2.2rem, 7vw, 5.4rem);\n  max-width: 16ch;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Reveal-on-scroll                                                        */\n/* ---------------------------------------------------------------------- */\n\n.reveal {\n  opacity: 0;\n  transform: translateY(22px);\n  transition: opacity 700ms ease, transform 700ms ease;\n}\n\n.reveal.is-visible { opacity: 1; transform: translateY(0); }\n\n@media (prefers-reduced-motion: reduce) {\n  .reveal { opacity: 1; transform: none; transition: none; }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Footer                                                                   */\n/* ---------------------------------------------------------------------- */\n\n.site-footer {\n  background: var(--bg-2);\n  border-top: 1px solid rgba(var(--ink-rgb), .14);\n  padding: clamp(56px, 7vw, 88px) 0 clamp(28px, 4vw, 40px);\n}\n\n.footer-top {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: space-between;\n  gap: 32px;\n  padding-bottom: clamp(32px, 4vw, 48px);\n  border-bottom: 1px solid rgba(var(--ink-rgb), .14);\n}\n\n.footer-brand { display: flex; align-items: center; gap: .7em; color: var(--ink); }\n.footer-brand-text { font-family: var(--font-ui); font-size: 12px; color: var(--muted); line-height: 1.6; }\n.footer-brand-text .g1 { color: var(--ink); font-weight: 500; letter-spacing: .04em; }\n\n.footer-nav {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 14px 28px;\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n}\n\n.footer-nav a { text-decoration: none; color: var(--muted); }\n.footer-nav a:hover, .footer-nav a:focus-visible { color: var(--ink); }\n\n.footer-bottom { padding-top: clamp(24px, 3vw, 32px); display: flex; flex-direction: column; gap: 16px; }\n\n.footer-legal-row {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: space-between;\n  gap: 12px;\n  font-family: var(--font-ui);\n  font-size: 12px;\n  color: var(--muted);\n}\n\n.footer-compliance { color: var(--muted); font-size: 11.5px; max-width: 80ch; line-height: 1.6; }\n\n/* ---------------------------------------------------------------------- */\n/* Sticky sub-nav (capabilities.html)                                       */\n/* ---------------------------------------------------------------------- */\n\n.subnav {\n  position: sticky;\n  top: var(--header-h);\n  z-index: 100;\n  background: rgba(var(--bg-rgb), .94);\n  backdrop-filter: blur(8px);\n  border-bottom: 1px solid rgba(var(--ink-rgb), .14);\n}\n\n.subnav-inner {\n  display: flex;\n  gap: clamp(16px, 3vw, 32px);\n  overflow-x: auto;\n  padding: 14px clamp(20px, 5vw, 56px);\n  scrollbar-width: thin;\n}\n\n.subnav-inner::-webkit-scrollbar { height: 4px; }\n.subnav-inner::-webkit-scrollbar-thumb { background: var(--limestone); }\n\n.subnav a {\n  flex-shrink: 0;\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  text-decoration: none;\n  color: var(--muted);\n  padding-bottom: 4px;\n  border-bottom: 1px solid transparent;\n  white-space: nowrap;\n}\n\n.subnav a:hover, .subnav a:focus-visible, .subnav a.is-active {\n  color: var(--ink);\n  border-bottom-color: var(--ink);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Capabilities page \u2014 gallery bays                                        */\n/* ---------------------------------------------------------------------- */\n\n.page-head { padding: calc(var(--header-h) + 56px) 0 clamp(48px, 7vw, 80px); background: var(--bg); }\n.page-head-eyebrow { margin-bottom: 18px; }\n.page-head-title { font-family: var(--font-display); text-transform: uppercase; font-size: clamp(2.4rem, 7vw, 5rem); margin-bottom: 20px; }\n.page-head-intro { color: var(--muted); max-width: 64ch; font-size: clamp(1rem, 1.6vw, 1.2rem); }\n\n.bay { padding: var(--section-pad) 0; scroll-margin-top: calc(var(--header-h) + 56px); }\n.bay--alt { background: var(--bg-2); }\n.bay--ink { background: var(--ink); color: var(--bg); }\n.bay--ink .division-line,\n.bay--ink .service-list li,\n.bay--ink .relation-line { color: var(--muted-on-ink); }\n.bay--ink .service-list li::before { background: var(--muted-on-ink); }\n\n.division-label { display: flex; flex-direction: column; gap: 6px; }\n.division-index { font-family: var(--font-ui); font-size: 12px; letter-spacing: .1em; color: var(--muted); }\n.bay--ink .division-index { color: var(--muted-on-ink); }\n.division-cat { font-family: var(--font-ui); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }\n.bay--ink .division-cat { color: var(--muted-on-ink); }\n.bay--ink .ml { color: var(--muted-on-ink); }\n\n.division-name {\n  font-family: var(--font-display);\n  font-weight: 700;\n  text-transform: uppercase;\n  font-size: clamp(2.2rem, 6vw, 4.2rem);\n  margin-bottom: 16px;\n}\n\n.division-line { color: var(--muted); font-size: clamp(1.02rem, 1.7vw, 1.25rem); max-width: 56ch; margin-bottom: clamp(32px, 4.5vw, 52px); }\n\n.division-content { display: grid; grid-template-columns: 1fr; gap: clamp(28px, 4vw, 48px); }\n\n@media (min-width: 900px) {\n  .division-content { grid-template-columns: 1.05fr .95fr; align-items: start; }\n}\n\n.service-list { columns: 2; column-gap: 28px; }\n\n@media (max-width: 480px) { .service-list { columns: 1; } }\n\n.service-list li {\n  position: relative;\n  padding-left: 20px;\n  margin-bottom: 12px;\n  break-inside: avoid;\n  font-size: .95rem;\n}\n\n.service-list li::before {\n  content: \"\";\n  position: absolute;\n  left: 0;\n  top: .5em;\n  width: 6px;\n  height: 6px;\n  background: var(--concrete);\n}\n\n.division-aside { display: flex; flex-direction: column; gap: 20px; }\n\n.scenario {\n  border: 1px solid var(--concrete);\n  padding: clamp(18px, 2.4vw, 26px);\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n}\n\n.scenario p { font-style: italic; font-size: .98rem; }\n.bay--ink .scenario { border-color: var(--muted-on-ink); }\n\n.relation { display: flex; flex-direction: column; gap: 8px; }\n.relation-line { color: var(--muted); font-size: .92rem; }\n\n.division-compliance {\n  margin-top: 4px;\n  font-size: 11.5px;\n  color: var(--muted-on-ink);\n  max-width: 60ch;\n  line-height: 1.6;\n}\n\n.bay:not(.bay--ink) .division-compliance { color: var(--muted); }\n\n/* ---------------------------------------------------------------------- */\n/* Network page \u2014 mandate table + category cells + form                   */\n/* ---------------------------------------------------------------------- */\n\n.mandate-table { width: 100%; border-collapse: collapse; margin: clamp(24px, 4vw, 40px) 0; }\n\n.mandate-table tr { border-bottom: 1px solid rgba(var(--ink-rgb), .14); }\n.mandate-table tr:first-child { border-top: 1px solid rgba(var(--ink-rgb), .14); }\n\n.mandate-table td { padding: clamp(14px, 2vw, 20px) clamp(8px, 1.4vw, 16px); vertical-align: top; }\n\n.mandate-step-num {\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .1em;\n  color: var(--muted);\n  width: 64px;\n  white-space: nowrap;\n}\n\n.mandate-step-text { font-size: .98rem; }\n\n.mandate {\n  max-width: 820px;\n  margin: 0 auto;\n}\n\n.mandate-headline {\n  text-align: center;\n  font-family: var(--font-display);\n  text-transform: uppercase;\n  font-size: clamp(2rem, 5.5vw, 4rem);\n  margin-bottom: clamp(20px, 3vw, 30px);\n}\n\n.mandate-intro { text-align: center; color: var(--muted); max-width: 60ch; margin: 0 auto clamp(36px, 5vw, 56px); }\n\n.band .mandate-intro { color: var(--muted-on-ink); }\n\n.cat-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));\n  gap: 10px;\n  margin-bottom: clamp(36px, 5vw, 56px);\n}\n\n.cat-input {\n  position: absolute;\n  opacity: 0;\n  width: 1px;\n  height: 1px;\n}\n\n.cat-cell {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  padding: 18px 14px;\n  min-height: 64px;\n  border: 1px solid var(--concrete);\n  background: var(--bg-2);\n  font-family: var(--font-ui);\n  font-size: .84rem;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: var(--ink);\n  transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease;\n}\n\n.cat-input:checked + .cat-cell { background: var(--ink); color: var(--bg); border-color: var(--ink); }\n.cat-input:focus-visible + .cat-cell { outline: 2px solid var(--ink); outline-offset: 2px; }\n\n.mandate-form { display: grid; grid-template-columns: 1fr; gap: 22px; }\n\n@media (min-width: 680px) {\n  .mandate-form { grid-template-columns: 1fr 1fr; }\n  .field--full { grid-column: 1 / -1; }\n}\n\n.field { display: flex; flex-direction: column; gap: 8px; }\n\n.field > label {\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.band .field > label { color: var(--muted-on-ink); }\n\n.field input, .field select, .field textarea {\n  background: var(--bg-2);\n  border: 1px solid var(--concrete);\n  color: var(--ink);\n  padding: 13px 14px;\n  font-family: var(--font-ui);\n  font-size: .95rem;\n  border-radius: 0;\n}\n\n.field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible {\n  outline: none;\n  border-color: var(--ink);\n}\n\n.field textarea { resize: vertical; m    <p class=\"lede\">Byzaro is an international business network bringing together specialized teams and trusted partners across markets and disciplines. One group, five capabilities, one network \u2014 assembled around each mandate.</p>\n        <p class=\"audience muted-line\">Built for businesses, entrepreneurs, investors and private clients with ambitions beyond borders.</p>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"chapter\" id=\"capabilities\">\n    <div class=\"container\">\n      <div class=\"chapter-head reveal\">\n        <span class=\"chapter-numeral\">II</span>\n        <h2 class=\"chapter-title\">Capabilities</h2>\n      </div>\n\n      <div class=\"cap-rows reveal\">\n        <a class=\"cap-row\" href=\"capabilities.html#talent\">\n          <span class=\"cap-row-label\"><span class=\"cap-row-index\">01</span><span class=\"cap-row-cat\">Talent</span></span>\n          <span class=\"cap-row-main\">\n            <span class=\"cap-row-name\">Talent</span>\n            <span class=\"cap-row-descriptor\">Connecting companies with the people they need \u2014 across borders.</span>\n            <span class=\"cap-row-explore\">Explore \u2192</span>\n          </span>\n        </a>\n        <a class=\"cap-row\" href=\"capabilities.html#digital\">\n          <span class=\"cap-row-label\"><span class=\"cap-row-index\">02</span><span class=\"cap-row-cat\">Digital</span></span>\n          <span class=\"cap-row-main\">\n            <span class=\"cap-row-name\">Digital</span>\n            <span class=\"cap-row-descriptor\">Building the technology and digital systems behind modern businesses.</span>\n            <span class=\"cap-row-explore\">Explore \u2192</span>\n          </span>\n        </a>\n        <a class=\"cap-row\" href=\"capabilities.html#realestate\">\n          <span class=\"cap-row-label\"><span class=\"cap-row-index\">03</span><span class=\"cap-row-cat\">Real Estate</span></span>\n          <span class=\"cap-row-main\">\n
