= toggle.getAttribute('aria-expanded') === 'true';\n      if (expanded) { closeMenu(); } else { openMenu(); }\n    });\n  }\n  if (closeBtn) { closeBtn.addEventListener('click', closeMenu); }\n  if (menu) {\n    menu.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', closeMenu); });\n  }\n\n  var themeToggles = document.querySelectorAll('.theme-toggle');\n  var themeLabels = { light: 'DARK', dark: 'LIGHT' };\n  function currentTheme() {\n    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';\n  }\n  function updateThemeToggles() {\n    var theme = currentTheme();\n    themeToggles.forEach(function (btn) {\n      btn.setAttribute('aria-pressed', String(theme === 'dark'));\n      var label = btn.querySelector('.theme-toggle-label');\n      if (label) { label.textContent = themeLabels[theme]; }\n    });\n  }\n  function setTheme(theme) {\n    document.documentElement.classList.add('theme-transition');\n    window.setTimeout(function () {\n      document.documentElement.classList.remove('theme-transition');\n    }, 320);\n    if (theme === 'light') {\n      document.documentElement.setAttribute('data-theme', 'light');\n    } else {\n      document.documentElement.removeAttribute('data-theme');\n    }\n    try { localStorage.setItem('bz-theme-01', theme); } catch (e) {}\n    updateThemeToggles();\n  }\n  updateThemeToggles();\n  themeToggles.forEach(function (btn) {\n    btn.addEventListener('click', function () {\n      setTheme(currentTheme() === 'light' ? 'dark' : 'light');\n    });\n  });\n\n  var reveals = document.querySelectorAll('.reveal');\n  if ('IntersectionObserver' in window) {\n    var io = new IntersectionObserver(function (entries) {\n      entries.forEach(function (entry) {\n        if (entry.isIntersecting) {\n          entry.target.classList.add('is-visible');\n          io.unobserve(entry.target);\n        }\n      });\n    }, { threshold: .15 });\n    reveals.forEach(function (el) { io.observe(el); });\n  } else {\n    reveals.forEach(function (el) { el.classList.add('is-visible'); });\n  }\n\n  var form = document.querySelector('.mandate-form');\n  var confirmation = document.querySelector('.mandate-confirmation');\n  if (form) {\n    form.addEventListener('submit', function (e) {\n      e.preventDefault();\n      confirmation.classList.add('is-visible');\n      confirmation.setAttribute('tabindex', '-1');\n      confirmation.focus();\n      form.reset();\n    });\n  }\n})();\n<\/script>\n\n<script>(function(){\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a[href]');\n    if(!a) return;\n    var href = a.getAttribute('href') || '';\n    if(/^(https?:|mailto:|tel:)/i.test(href)) { a.target = '_blank'; return; }\n    var m = href.match(/^(?:\\.\\.\\/)?(?:([0-9]{2}-[a-z]+)\\/)?([a-z]+\\.html)?(#.*)?$/i);\n    if(!m) return;\n    if(href.charAt(0) === '#') return;          /* Anker in der Seite: normal lassen */\n    e.preventDefault();\n    parent.postMessage({bzNav: {concept: m[1] || null, page: m[2] || 'index.html', hash: m[3] || ''}}, '*');\n  }, true);\n  window.addEventListener('message', function(e){\n    if(e.data && e.data.bzHash){ location.hash = e.data.bzHash; }\n  });\n})();<\/script>\n\n</body>\n</html>\n", "02-riviera/index.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<script>\n(function () {\n  try {\n    var t = localStorage.getItem('bz-theme-02');\n    if (t === 'dark' || t === 'light') {\n      document.documentElement.setAttribute('data-theme', t);\n    }\n  } catch (e) {}\n})();\n<\/script>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>BYZARO GROUP \u2014 Business Without Borders</title>\n<meta name=\"description\" content=\"Byzaro Group is an international business &amp; opportunity group \u2014 five capabilities, one network, across Serbia, Switzerland, the UAE and beyond.\">\n<meta name=\"robots\" content=\"noindex\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&amp;family=Albert+Sans:wght@400;500;600&amp;family=Jost:wght@300;400;500&amp;display=swap\" rel=\"stylesheet\">\n<style>\n/* ==========================================================================\n   BYZARO GROUP \u2014 Concept 02: RIVIERA\n   Shared stylesheet for index.html, capabilities.html, network.html\n   Mediterranean luxury in daylight. Light theme is default; dark is a fully\n   designed variant toggled via [data-theme] on <html>.\n   ========================================================================== */\n\n:root {\n  --bg: #F6F3EC;\n  --bg-2: #EEE9DD;\n  --sea: #0E3A5C;\n  --sea-deep: #092841;\n  --ink: #10131A;\n  --brass: #A8875A;\n  --brass-text: #796141;\n  --text: #232A33;\n  --muted: #5C6672;\n  --porcelain: #F2EEE3;\n\n  --headline: var(--sea);\n  --btn-border: var(--sea);\n  --btn-hover-text: var(--bg);\n  --border: rgba(16, 19, 26, .14);\n  --border-strong: var(--sea);\n  --nav-bg: rgba(246, 243, 236, .86);\n  --deep-band-bg: var(--sea-deep);\n  --deep-band-text: var(--porcelain);\n  --deep-band-muted: rgba(242, 238, 227, .68);\n  --deep-band-border: rgba(242, 238, 227, .22);\n\n  --font-display: \"Newsreader\", Georgia, \"Times New Roman\", serif;\n  --font-body: \"Albert Sans\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-ui: \"Jost\", system-ui, sans-serif;\n\n  --container: 1360px;\n  --section-pad: clamp(88px, 11vh, 160px);\n}\n\n[data-theme=\"dark\"] {\n  --bg: #092841;\n  --bg-2: #0E3A5C;\n  --sea: #0E3A5C;\n  --sea-deep: #071E33;\n  --ink: #F2EEE3;\n  --text: #F2EEE3;\n  --muted: #9FB0C0;\n  --brass-text: #C69F6A;\n\n  --headline: var(--porcelain);\n  --btn-border: var(--porcelain);\n  --border: rgba(242, 238, 227, .18);\n  --border-strong: var(--porcelain);\n  --nav-bg: rgba(9, 40, 65, .86);\n  --deep-band-bg: #061B2C;\n  --deep-band-text: var(--porcelain);\n  --deep-band-muted: rgba(242, 238, 227, .68);\n  --deep-band-border: rgba(242, 238, 227, .22);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Reset                                                                    */\n/* ---------------------------------------------------------------------- */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nhtml, body { max-width: 100%; overflow-x: hidden; }\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--text);\n  font-family: var(--font-body);\n  font-weight: 400;\n  font-size: 1rem;\n  line-height: 1.7;\n  overflow-x: hidden;\n  min-width: 320px;\n  transition: background-color 300ms ease, color 300ms ease;\n}\n\nimg, svg { display: block; max-width: 100%; }\n\na { color: inherit; text-decoration: none; }\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: 500;\n  margin: 0;\n  color: var(--headline);\n}\n\np { margin: 0; }\n\nul { list-style: none; margin: 0; padding: 0; }\n\nbutton { font-family: inherit; cursor: pointer; background: none; border: none; color: inherit; }\n\ninput, textarea { font-family: inherit; font-size: inherit; color: inherit; }\n\n* { min-width: 0; }\n\n/* ---------------------------------------------------------------------- */\n/* Focus visibility                                                         */\n/* ---------------------------------------------------------------------- */\n\na:focus-visible,\nbutton:focus-visible,\ninput:focus-visible,\nselect:focus-visible,\ntextarea:focus-visible,\n[tabindex]:focus-visible {\n  outline: 2px solid var(--brass);\n  outline-offset: 3px;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Layout helpers                                                           */\n/* ---------------------------------------------------------------------- */\n\n.container {\n  width: 100%;\n  max-width: var(--container);\n  margin: 0 auto;\n  padding-left: clamp(20px, 5vw, 64px);\n  padding-right: clamp(20px, 5vw, 64px);\n}\n\n.section {\n  position: relative;\n  padding: var(--section-pad) 0;\n  background: var(--bg);\n}\n\n.section--panel { background: var(--bg-2); }\n\n.section--deep {\n  background: var(--deep-band-bg);\n  color: var(--deep-band-text);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Inverted-surface scoping \u2014 any section rendered on a dark band must     */\n/* re-declare the semantic tokens so buttons, links, headings, labels and  */\n/* body copy inside it stay legible, in BOTH themes (dark bands stay dark  */\n/* in both light and dark theme; only the exact shade changes). Brass text */\n/* also needs the brighter \"on-dark\" variant here regardless of the active */\n/* root theme, since a sea-deep band is always dark.                       */\n/* ---------------------------------------------------------------------- */\n\n.band--invert {\n  --headline: var(--deep-band-text);\n  --text: var(--deep-band-text);\n  --muted: var(--deep-band-muted);\n  --btn-border: var(--deep-band-text);\n  --btn-hover-text: var(--deep-band-bg);\n  --border-strong: var(--deep-band-text);\n  --brass-text: #C69F6A;\n}\n\n.section-head {\n  margin-bottom: clamp(40px, 6vw, 80px);\n  text-align: center;\n}\n\n.section-title {\n  font-size: clamp(1.8rem, 4vw, 3.2rem);\n  line-height: 1.15;\n  margin-top: 10px;\n}\n\n.label {\n  display: inline-block;\n  font-family: var(--font-ui);\n  font-size: 11px;\n  font-weight: 500;\n  letter-spacing: .25em;\n  text-transform: uppercase;\n  color: var(--brass-text);\n}\n\n.lede {\n  color: var(--muted);\n  max-width: 62ch;\n  font-size: clamp(1rem, 1.4vw, 1.15rem);\n}\n\n.center { text-align: center; margin-left: auto; margin-right: auto; }\n\n.italic { font-style: italic; }\n\n/* ---------------------------------------------------------------------- */\n/* Horizon line motif                                                       */\n/* ---------------------------------------------------------------------- */\n\n.horizon-line {\n  position: relative;\n  width: 100%;\n  height: 1px;\n  background: var(--brass);\n  opacity: .55;\n}\n\n.horizon-line .horizon-node {\n  position: absolute;\n  top: 50%;\n  left: 50%;\n  width: 6px;\n  height: 6px;\n  border-radius: 50%;\n  background: var(--brass);\n  transform: translate(-50%, -50%);\n}\n\n.horizon-divider {\n  padding: 0 0;\n}\n\n.section-divider {\n  margin-top: clamp(56px, 8vw, 96px);\n}\n\n.horizon-divider .container {\n  display: flex;\n  align-items: center;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Buttons & links                                                          */\n/* ---------------------------------------------------------------------- */\n\n.btn {\n  display: inline-block;\n  border-radius: 0;\n  padding: 16px 34px;\n  font-family: var(--font-ui);\n  font-size: 12px;\n  font-weight: 500;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  text-decoration: none;\n  text-align: center;\n  transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease;\n  white-space: nowrap;\n  cursor: pointer;\n}\n\n.btn-primary {\n  border: 1px solid var(--btn-border);\n  color: var(--btn-border);\n  background: transparent;\n}\n\n.btn-primary:hover,\n.btn-primary:focus-visible {\n  background: var(--btn-border);\n  color: var(--btn-hover-text);\n}\n\n.text-link {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  font-family: var(--font-ui);\n  font-size: 13px;\n  font-weight: 500;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: var(--headline);\n  border-bottom: 1px solid var(--border-strong);\n  padding-bottom: 2px;\n  transition: opacity 200ms ease;\n}\n\n.text-link:hover, .text-link:focus-visible { opacity: .65; }\n\n/* ---------------------------------------------------------------------- */\n/* Intro assembly animation (ported pattern from concept 01)                */\n/* ---------------------------------------------------------------------- */\n\n.intro-overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 9000;\n  background: var(--bg);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  transition: opacity 500ms ease, background-color 300ms ease;\n}\n\n.intro-overlay[data-hidden=\"true\"] {\n  opacity: 0;\n  pointer-events: none;\n}\n\n.intro-mark {\n  width: clamp(72px, 14vw, 140px);\n  color: var(--headline);\n}\n\n.intro-mark .bz-b {\n  opacity: 0;\n  transition: transform 1200ms cubic-bezier(0,.68,.24,1), opacity 1200ms ease;\n}\n\n.intro-mark.bz-run .bz-b { opacity: 1; transform: translate(0, 0); }\n\n.intro-mark .bz-b1 { transform: translate(6%, -6%); }\n.intro-mark .bz-b2 { transform: translate(-6%, -6%); }\n.intro-mark .bz-b3 { transform: translate(6%, 6%); }\n.intro-mark .bz-b4 { transform: translate(-6%, 6%); }\n\n.intro-mark.bz-run .bz-b2 { transition-delay: 35ms; }\n.intro-mark.bz-run .bz-b3 { transition-delay: 65ms; }\n.intro-mark.bz-run .bz-b4 { transition-delay: 100ms; }\n\n/* ---------------------------------------------------------------------- */\n/* Top navigation                                                           */\n/* ---------------------------------------------------------------------- */\n\n.site-header {\n  position: fixed;\n  top: 0;\n  left: 0;\n  right: 0;\n  z-index: 500;\n  background: var(--nav-bg);\n  backdrop-filter: blur(10px);\n  border-bottom: 1px solid var(--border);\n  transition: background-color 300ms ease, border-color 300ms ease;\n}\n\n.nav {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 24px;\n  height: 84px;\n}\n\n.brand {\n  display: inline-flex;\n  align-items: center;\n  gap: .7em;\n  text-decoration: none;\n  color: var(--headline);\n  flex-shrink: 0;\n}\n\n.byzaro-mark {\n  width: auto;\n  height: 32px;\n  flex-shrink: 0;\n}\n\n.brand-text {\n  display: flex;\n  flex-direction: column;\n  gap: .28em;\n  min-width: 0;\n}\n\n.brand-word {\n  font-family: var(--font-ui);\n  font-weight: 500;\n  font-size: 16px;\n  line-height: .72;\n  letter-spacing: .445em;\n  text-indent: .445em;\n  margin-right: -.445em;\n  display: flex;\n  align-items: flex-start;\n  white-space: nowrap;\n}\n\n.brand-lam {\n  width: .745em;\n  height: .72em;\n  margin-right: .036em;\n  flex-shrink: 0;\n}\n\n.brand-sub {\n  font-family: var(--font-ui);\n  font-weight: 300;\n  font-size: 8.5px;\n  line-height: .72;\n  letter-spacing: 1.02em;\n  text-indent: 1.02em;\n  margin-right: -1.02em;\n  white-space: nowrap;\n}\n\n.nav-links {\n  display: flex;\n  align-items: center;\n  gap: clamp(18px, 2.4vw, 34px);\n}\n\n.nav-links a:not(.btn) {\n  font-family: var(--font-ui);\n  font-size: 13px;\n  font-weight: 500;\n  letter-spacing: .04em;\n  color: var(--text);\n  position: relative;\n  padding-bottom: 4px;\n  transition: color 200ms ease;\n}\n\n.nav-links a:not(.btn):hover,\n.nav-links a:not(.btn).is-active {\n  color: var(--headline);\n}\n\n.nav-links a:not(.btn).is-active {\n  border-bottom: 1px solid var(--brass);\n}\n\n.lang-switch {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  font-family: var(--font-ui);\n  font-size: 11px;\n  font-weight: 500;\n  letter-spacing: .1em;\n}\n\n.lang-switch .lang-current { color: var(--headline); }\n.lang-switch [aria-disabled=\"true\"] { color: var(--muted); opacity: .5; cursor: default; }\n.lang-switch .lang-sep { color: var(--muted); opacity: .4; }\n\n.theme-toggle {\n  display: flex;\n  align-items: center;\n  gap: 7px;\n  border: 1px solid var(--border);\n  border-radius: 999px;\n  padding: 6px 12px;\n  font-family: var(--font-ui);\n  font-size: 10px;\n  font-weight: 500;\n  letter-spacing: .14em;\n  color: var(--text);\n  transition: border-color 200ms ease, color 200ms ea e);\n  border-bottom-color: var(--brass);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Capability chapters                                                      */\n/* ---------------------------------------------------------------------- */\n\n.chapter { padding: clamp(80px, 10vh, 140px) 0; scroll-margin-top: 150px; }\n\n.chapter-num {\n  display: block;\n  margin-bottom: 14px;\n}\n\n.chapter-name {\n  font-size: clamp(2rem, 5vw, 3.6rem);\n}\n\n.chapter-standfirst {\n  margin-top: 18px;\n  max-width: 58ch;\n  font-size: clamp(1.05rem, 1.6vw, 1.3rem);\n  color: var(--muted);\n}\n\n.section--deep .chapter-standfirst { color: var(--deep-band-muted); }\n\n.chapter-body {\n  margin-top: clamp(40px, 5vw, 64px);\n  display: grid;\n  grid-template-columns: 1.1fr .9fr;\n  gap: clamp(32px, 5vw, 72px);\n  align-items: start;\n}\n\n.services-list {\n  columns: 2;\n  column-gap: 32px;\n}\n\n.services-list li {\n  break-inside: avoid;\n  display: flex;\n  align-items: baseline;\n  gap: 10px;\n  padding: 10px 0;\n  font-size: .98rem;\n}\n\n.services-list li::before {\n  content: \"\";\n  width: 10px;\n  height: 1px;\n  background: var(--brass);\n  flex-shrink: 0;\n  transform: translateY(-4px);\n}\n\n.usecase-aside {\n  border-left: 2px solid var(--brass);\n  padding-left: 22px;\n}\n\n.usecase-aside p {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: clamp(1.05rem, 1.6vw, 1.2rem);\n  color: var(--headline);\n}\n\n.section--deep .usecase-aside p { color: var(--deep-band-text); }\n\n.network-relationship {\n  margin-top: 18px;\n  font-size: .92rem;\n  color: var(--muted);\n}\n\n.section--deep .network-relationship { color: var(--deep-band-muted); }\n\n.compliance-note {\n  margin-top: 28px;\n  padding-top: 18px;\n  border-top: 1px solid var(--border);\n  font-size: 11.5px;\n  line-height: 1.6;\n  color: var(--muted);\n  max-width: 70ch;\n}\n\n.section--deep .compliance-note {\n  border-top-color: var(--deep-band-border);\n  color: var(--deep-band-muted);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Network page \u2014 mandate flow                                              */\n/* ---------------------------------------------------------------------- */\n\n.opportunities-intro { margin-bottom: 30px; }\n\n.qualification-line {\n  margin-top: 26px;\n  color: var(--muted);\n  max-width: 62ch;\n}\n\n.mandate { padding: var(--section-pad) 0; background: var(--bg-2); scroll-margin-top: 100px; }\n\n.mandate-head { text-align: center; margin-bottom: clamp(40px, 6vw, 64px); }\n\n.mandate-title {\n  font-size: clamp(1.9rem, 5vw, 3.4rem);\n  margin-top: 12px;\n}\n\n.mandate-form {\n  max-width: 860px;\n  margin: 0 auto;\n}\n\n.chip-group {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px;\n  margin-bottom: 40px;\n}\n\n.chip { position: relative; }\n\n.chip input {\n  position: absolute;\n  opacity: 0;\n  width: 1px;\n  height: 1px;\n  pointer-events: none;\n}\n\n.chip label {\n  display: inline-block;\n  padding: 11px 20px;\n  border: 1px solid var(--border-strong);\n  font-family: var(--font-ui);\n  font-size: 12px;\n  font-weight: 500;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: var(--text);\n  cursor: pointer;\n  transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease;\n}\n\n.chip input:checked + label {\n  background: var(--sea);\n  border-color: var(--sea);\n  color: var(--porcelain);\n}\n\n[data-theme=\"dark\"] .chip input:checked + label {\n  background: var(--porcelain);\n  border-color: var(--porcelain);\n  color: var(--sea-deep);\n}\n\n.chip input:focus-visible + label {\n  outline: 2px solid var(--brass);\n  outline-offset: 3px;\n}\n\n.form-grid {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 28px 32px;\n}\n\n.field { display: flex; flex-direction: column; gap: 8px; }\n\n.field--full { grid-column: 1 / -1; }\n\n.field-label {\n  font-family: var(--font-ui);\n  font-size: 11px;\n  font-weight: 500;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.field input[type=\"text\"],\n.field input[type=\"email\"],\n.field input[type=\"tel\"],\n.field select {\n  border: none;\n  border-bottom: 1px solid var(--border-strong);\n  background: transparent;\n  padding: 10px 2px;\n  font-family: var(--font-ui);\n  font-size: 1rem;\n  color: var(--text);\n  transition: border-color 200ms ease;\n  border-radius: 0;\n  width: 100%;\n}\n\n.field input:focus-visible,\n.field select:focus-visible {\n  outline: none;\n  border-bottom-color: var(--brass);\n}\n\n.field textarea {\n  border: 1px solid var(--border-strong);\n  background: transparent;\n  padding: 14px;\n  font-family: var(--font-ui);\n  font-size: 1rem;\n  color: var(--text);\n  resize: vertical;\n  min-height: 120px;\n  width: 100%;\n  transition: border-color 200ms ease;\n}\n\n.field textarea:focus-visible {\n  outline: none;\n  border-color: var(--brass);\n}\n\n.form-actions {\n  margin-top: 36px;\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  gap: 24px;\n}\n\n.confidentiality-note {\n  margin-top: 20px;\n  font-size: 12px;\n  color: var(--muted);\n}\n\n.form-success {\n  display: none;\n  margin-top: 22px;\n  padding: 16px 18px;\n  border: 1px solid var(--brass);\n  font-size: .95rem;\n  color: var(--headline);\n}\n\n.form-success.is-visible { display: block; }\n\n/* ---------------------------------------------------------------------- */\n/* Reveal-on-scroll                                                         */\n/* ---------------------------------------------------------------------- */\n\n.reveal {\n  opacity: 0;\n  transform: translateY(18px);\n  transition: opacity 700ms ease, transform 700ms ease;\n}\n\n.reveal.is-visible { opacity: 1; transform: translateY(0); }\n\n@media (prefers-reduced-motion: reduce) {\n  .reveal { opacity: 1; transform: none; transition: none; }\n  .intro-mark .bz-b { transition: none; opacity: 1; n      <p class=\"footer-compliance\">Byzaro coordinates specialized legal, tax and regulatory work with qualified local partners. Nothing on this site constitutes investment, legal or tax advice.</p>\n    </div>\n  </div>\n</footer>\n\n<script>\n(function () {\n  var overlay = document.getElementById('intro-overlay');\n  if (overlay) {\n    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (reduce || sessionStorage.getItem('bz02-intro')) {\n      overlay.setAttribute('data-hidden', 'true');\n      overlay.style.display = 'none';\n    } else {\n      var mark = document.getElementById('intro-mark');\n      requestAnimationFrame(function () {\n        requestAnimationFrame(function () {\n          mark.classList.add('bz-run');\n        });\n      });\n      setTimeout(function () {\n        overlay.setAttribute('data-hidden', 'true');\n        sessionStorage.setItem('bz02-intro', '1');\n        setTimeout(function () { overlay.style.display = 'none'; }, 500);\n      }, 1300);\n    }\n  }\n\n  var toggle = document.querySelector('.nav-toggle');\n  var menu = document.querySelector('.mobile-menu');\n  var closeBtn = document.querySelector('.mobile-menu-close');\n  function openMenu() {\n    menu.classList.add('is-open');\n    toggle.setAttribute('aria-expanded', 'true');\n    document.body.style.overflow = 'hidden';\n  }\n  function closeMenu() {\n    menu.classList.remove('is-open');\n    toggle.setAttribute('aria-expanded', 'false');\n    document.body.style.overflow = '';\n  }\n  if (toggle) {\n    toggle.addEventListener('click', function () {\n      var expanded = toggle.getAttribute('aria-expanded') === 'true';\n      if (expanded) { closeMenu(); } else { openMenu(); }\n    });\n  }\n  if (closeBtn) { closeBtn.addEventListener('click', closeMenu); }\n  if (menu) {\n    menu.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', closeMenu); });\n  }\n\n  function updateToggles() {\n    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';\n    document.querySelectorAll('.theme-toggle').forEach(function (btn) {\n      btn.setAttribute('aria-pressed', String(isDark));\n      var label = btn.querySelector('.theme-toggle-label');\n      if (label) { label.textContent = isDark ? 'LIGHT' : 'DARK'; }\n    });\n  }\n  updateToggles();\n  document.querySelectorAll('.theme-toggle').forEach(function (btn) {\n    btn.addEventListener('click', function () {\n      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';\n      var next = isDark ? 'light' : 'dark';\n      document.documentElement.setAttribute('data-theme', next);\n      try { localStorage.setItem('bz-theme-02', next); } catch (e) {}\n      updateToggles();\n    });\n  });\n\n  var reveals = document.querySelectorAll('.reveal');\n  if ('IntersectionObserver' in window) {\n    var io = new IntersectionObserver(function (entries) {\n      entries.forEach(function (entry) {\n        if (entry.isIntersecting) {\n          entry.target.classList.add('is-visible');\n          io.unobserve(entry.target);\n        }\n      });\n    }, { threshold: .15 });\n    reveals.forEach(function (el) { io.observe(el); });\n  } else {\n    reveals.forEach(function (el) { el.classList.add('is-visible'); });\n  }\n})();\n<\/script>\n\n<script>(function(){\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a[href]');\n    if(!a) return;\n    var href = a.getAttribute('href') || '';\n    if(/^(https?:|mailto:|tel:)/i.test(href)) { a.target = '_blank'; return; }\n    var m = href.match(/^(?:\\.\\.\\/)?(?:([0-9]{2}-[a-z]+)\\/)?([a-z]+\\.html)?(#.*)?$/i);\n    if(!m) return;\n    if(href.charAt(0) === '#') return;          /* Anker in der Seite: normal lassen */\n    e.preventDefault();\n    parent.postMessage({bzNav: {concept: m[1] || null, page: m[2] || 'index.html', hash: m[3] || ''}}, '*');\n  }, true);\n  window.addEventListener('message', function(e){\n    if(e.data && e.data.bzHash){ location.hash = e.data.bzHash; }\n  });\n})();<\/script>\n\n</body>\n</html>\n", "02-riviera/capabilities.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<script>\n(function () {\n  try {\n    var t = localStorage.getItem('bz-theme-02');\n    if (t === 'dark' || t === 'light') {\n      document.documentElement.setAttribute('data-theme', t);\n    }\n  } catch (e) {}\n})();\n<\/script>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>BYZARO GROUP \u2014 Capabilities</title>\n<meta name=\"description\" content=\"Five capabilities \u2014 Talent, Digital, Real Estate, Capital and Advisory \u2014 assembled around each mandate by Byzaro Group.\">\n<meta name=\"robots\" content=\"noindex\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&amp;family=Albert+Sans:wght@400;500;600&amp;family=Jost:wght@300;400;500&amp;display=swap\" rel=\"stylesheet\">\n<style>\n/* ==========================================================================\n   BYZARO GROUP \u2014 Concept 02: RIVIERA\n   Shared stylesheet for index.html, capabilities.html, network.html\n   Mediterranean luxury in daylight. Light theme is default; dark is a fully\n   designed variant toggled via [data-theme] on <html>.\n   ========================================================================== */\n\n:root {\n  --bg: #F6F3EC;\n  --bg-2: #EEE9DD;\n  --sea: #0E3A5C;\n  --sea-deep: #092841;\n  --ink: #10131A;\n  --brass: #A8875A;\n  --brass-text: #796141;\n  --text: #232A33;\n  --muted: #5C6672;\n  --porcelain: #F2EEE3;\n\n  --headline: var(--sea);\n  --btn-border: var(--sea);\n  --btn-hover-text: var(--bg);\n  --border: rgba(16, 19, 26, .14);\n  --border-strong: var(--sea);\n  --nav-bg: rgba(246, 243, 236, .86);\n  --deep-band-bg: var(--sea-deep);\n  --deep-band-text: var(--porcelain);\n  --deep-band-muted: rgba(242, 238, 227, .68);\n  --deep-band-border: rgba(242, 238, 227, .22);\n\n  --font-display: \"Newsreader\", Georgia, \"Times New Roman\", serif;\n  --font-body: \"Albert Sans\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-ui: \"Jost\", system-ui, sans-serif;\n\n  --container: 1360px;\n  --section-pad: clamp(88px, 11vh, 160px);\n}\n\n[data-theme=\"dark\"] {\n  --bg: #092841;\n  --bg-2: #0E3A5C;\n  --sea: #0E3A5C;\n  --sea-deep: #071E33;\n  --ink: #F2EEE3;\n  --text: #F2EEE3;\n  --muted: #9FB0C0;\n  --brass-text: #C69F6A;\n\n  --headline: var(--porcelain);\n  --btn-border: var(--porcelain);\n  --border: rgba(242, 238, 227, .18);\n  --border-strong: var(--porcelain);\n  --nav-bg: rgba(9, 40, 65, .86);\n  --deep-band-bg: #061B2C;\n  --deep-band-text: var(--porcelain);\n  --deep-band-muted: rgba(242, 238, 227, .68);\n  --deep-band-border: rgba(242, 238, 227, .22);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Reset                                                                    */\n/* ---------------------------------------------------------------------- */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nhtml, body { max-width: 100%; overflow-x: hidden; }\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--text);\n  font-family: var(--font-body);\n  font-weight: 400;\n  font-size: 1rem;\n  line-height: 1.7;\n  overflow-x: hidden;\n  min-width: 320px;\n  transition: background-color 300ms ease, color 300ms ease;\n}\n\nimg, svg { display: block; max-width: 100%; }\n\na { color: inherit; text-decoration: none; }\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: 500;\n  margin: 0;\n  color: var(--headline);\n}\n\np { margin: 0; }\n\nul { list-style: none; margin: 0; padding: 0; }\n\nbutton { font-family: inherit; cursor: pointer; background: none; border: none; color: inherit; }\n\ninput, textarea { font-family: inherit; font-size: inherit; color: inherit; }\n\n* { min-width: 0; }\n\n/* ---------------------------------------------------------------------- */\n/* Focus visibility                                                         */\n/* ---------------------------------------------------------------------- */\n\na:focus-visible,\nbutton:focus-visible,\ninput:focus-visible,\nselect:focus-visible,\ntextarea:focus-visible,\n[tabindex]:focus-visible {\n  outline: 2px solid var(--brass);\n  outline-offset: 3px;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Layout helpers                                                           */\n/* ---------------------------------------------------------------------- */\n\n.container {\n  width: 100%;\n  max-width: var(--container);\n  margin: 0 auto;\n  padding-left: clamp(20px, 5vw, 64px);\n  padding-right: clamp(20px, 5vw, 64px);\n}\n\n.section {\n  position: relative;\n  padding: var(--section-pad) 0;\n  background: var(--bg);\n}\n\n.section--panel { background: var(--bg-2); }\n\n.section--deep {\n  background: var(--deep-band-bg);\n  color: var(--deep-band-text);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Inverted-surface scoping \u2014 any section rendered on a dark band must     */\n/* re-declare the semantic tokens so buttons, links, headings, labels and  */\n/* body copy inside it stay legible, in BOTH themes (dark bands stay dark  */\n/* in both light and dark theme; only the exact shade changes). Brass text */\n/* also needs the brighter \"on-dark\" variant here regardless of the active */\n/* root theme, since a sea-deep band is always dark.                       */\n/* ---------------------------------------------------------------------- */\n\n.band--invert {\n  --headline: var(--deep-band-text);\n  --text: var(--deep-band-text);\n  --muted: var(--deep-band-muted);\n  --btn-border: var(--deep-band-text);\n  --btn-hover-text: var(--deep-band-bg);\n  --border-strong: var(--deep-band-text);\n  --brass-text: #C69F6A;\n}\n\n.section-head {\n  margin-bottom: clamp(40px, 6vw, 80px);\n  text-align: center;\n}\n\n.section-title {\n  font-size: clamp(1.8rem, 4vw, 3.2rem);\n  line-height: 1.15;\n  margin-top: 10px;\n}\n\n.label {\n  display: inline-block;\n  font-family: var(--font-ui);\n  font-size: 11px;\n  font-weight: 500;\n  letter-spacing: .25em;\n  text-transform: uppercase;\n  color: var(--brass-text);\n}\n\n.lede {\n  color: var(--muted);\n  max-width: 62ch;\n  font-size: clamp(1rem, 1.4vw, 1.15rem);\n}\n\n.center { text-align: center; margin-left: auto; margin-right: auto; }\n\n.italic { font-style: italic; }\n\n/* ---------------------------------------------------------------------- */\n/* Horizon line motif                                                       */\n/* ---------------------------------------------------------------------- */\n\n.horizon-line {\n  position: relative;\n  width: 100%;\n  height: 1px;\n  background: var(--brass);\n  opacity: .55;\n}\n\n.horizon-line .horizon-node {\n  position: absolute;\n  top: 50%;\n  left: 50%;\n  width: 6px;\n  height: 6px;\n  border-radius: 50%;\n  background: var(--brass);\n  transform: translate(-50%, -50%);\n}\n\n.horizon-divider {\n  padding: 0 0;\n}\n\n.section-divider {\n  margin-top: clamp(56px, 8vw, 96px);\n}\n\n.horizon-divider .container {\n  display: flex;\n  align-items: center;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Buttons & links                                                          */\n/* ---------------------------------------------------------------------- */\n\n.btn {\n  display: inline-block;\n  border-radius: 0;\n  padding: 16px 34px;\n  font-family: var(--font-ui);\n  font-size: 12px;\n  font-weight: 500;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  text-decoration: none;\n  text-align: center;\n  transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease;\n  white-space: nowrap;\n  cursor: pointer;\n}\n\n.btn-primary {\n  border: 1px solid var(--btn-border);\n  color: var(--btn-border);\n  background: transparent;\n}\n\n.btn-primary:hover,\n.btn-primary:focus-visible {\n  background: var(--btn-border);\n  color: var(--btn-hover-text);\n}\n\n.text-link {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  font-family: var(--font-ui);\n  font-size: 13px;\n  font-weight: 500;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: var(--headline);\n  border-bottom: 1px solid var(--border-strong);\n  padding-bottom: 2px;\n  transition: opacity 200ms ease;\n}\n\n.text-link:hover, .text-link:focus-visible { opacity: .65; }\n\n/* ---------------------------------------------------------------------- */\n/* Intro assembly animation (ported pattern from concept 01)                */\n/* ---------------------------------------------------------------------- */\n\n.intro-overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 9000;\n  background: var(--bg);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  transition: opacity 500ms ease, background-color 300ms ease;\n}\n\n.intro-overlay[data-hidden=\"true\"] {\n  opacity: 0;\n  pointer-events: none;\n}\n\n.intro-mark {\n  width: clamp(72px, 14vw, 140px);\n  color: var(--headline);\n}\n\n.intro-mark .bz-b {\n  opacity: 0;\n  transition: transform 1200ms cubic-bezier(0,.68,.24,1), opacity 1200ms ease;\n}\n\n.intro-mark.bz-run .bz-b { opacity: 1; transform: translate(0, 0); }\n\n.intro-mark .bz-b1 { transform: translate(6%, -6%); }\n.intro-mark .bz-b2 { transform: translate(-6%, -6%); }\n.intro-mark .bz-b3 { transform: translate(6%, 6%); }\n.intro-mark .bz-b4 { transform: translate(-6%, 6%); }\n\n.intro-mark.bz-run .bz-b2 { transition-delay: 35ms; }\n.intro-mark.bz-run .bz-b3 { transition-delay: 65ms; }\n.intro-mark.bz-run .bz-b4 { transition-delay: 100ms; }\n\n/* ---------------------------------------------------------------------- */\n/* Top navigation                                                           */\n/* ---------------------------------------------------------------------- */\n\n.site-header {\n  position: fixed;\n  top: 0;\n  left: 0;\n  right: 0;\n  z-index: 500;\n  background: var(--nav-bg);\n  backdrop-filter: blur(10px);\n  border-bottom: 1px solid var(--border);\n  transition: background-color 300ms ease, border-color 300ms ease;\n}\n\n.nav {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 24px;\n  height: 84px;\n}\n\n.brand {\n  display: inline-flex;\n  align-items: center;\n  gap: .7em;\n  text-decoration: none;\n  color: var(--headline);\n  flex-shrink: 0;\n}\n\n.byzaro-mark {\n  width: auto;\n  height: 32px;\n  flex-shrink: 0;\n}\n\n.brand-text {\n  display: flex;\n  flex-direction: column;\n  gap: .28em;\n  min-width: 0;\n}\n\n.brand-word {\n  font-family: var(--font-ui);\n  font-weight: 500;\n  font-size: 16px;\n  line-height: .72;\n  letter-spacing: .445em;\n  text-indent: .445em;\n  margin-right: -.445em;\n  display: flex;\n  align-items: flex-start;\n  white-space: nowrap;\n}\n\n.brand-lam {\n  width: .745em;\n  height: .72em;\n  margin-right: .036em;\n  flex-shrink: 0;\n}\n\n.brand-sub {\n  font-family: var(--font-ui);\n  font-weight: 300;\n  font-size: 8.5px;\n  line-height: .72;\n  letter-spacing: 1.02em;\n  text-indent: 1.02em;\n  margin-right: -1.02em;\n  white-space: nowrap;\n}\n\n.nav-links {\n  display: flex;\n  align-items: center;\n  gap: clamp(18px, 2.4vw, 34px);\n}\n\n.nav-links a:not(.btn) {\n  font-family: var(--font-ui);\n  font-size: 13px;\n  font-weight: 500;\n  letter-spacing: .04em;\n  color: var(--text);\n  position: relative;\n  padding-bottom: 4px;\n  transition: color 200ms ease;\n}\n\n.nav-links a:not(.btn):hover,\n.nav-links a:not(.btn).is-active {\n  color: var(--headline);\n}\n\n.nav-links a:not(.btn tive\" aria-current=\"page\">Capabilities</a>\n      <a href=\"network.html\">Network</a>\n      <a class=\"btn btn-primary nav-cta\" href=\"network.html#mandate\">Discuss an Opportunity</a>\n      <div class=\"lang-switch\" aria-label=\"Language\">\n        <span class=\"lang-current\" aria-current=\"true\">EN</span><span class=\"lang-sep\">|</span>\n        <span aria-disabled=\"true\">DE</span><span class=\"lang-sep\">|</span>\n        <span aria-disabled=\"true\">SR</span>\n      </div>\n      <button class=\"theme-toggle\" type=\"button\" aria-pressed=\"false\" aria-label=\"Toggle color scheme\">\n        <span class=\"theme-toggle-dot\" aria-hidden=\"true\">\u25d0</span><span class=\"theme-toggle-label\">DARK</span>\n      </button>\n    </nav>\n    <button class=\"nav-toggle\" type=\"button\" aria-label=\"Open menu\" aria-expanded=\"false\" aria-controls=\"mobile-menu\">\n      <span class=\"nav-toggle-bars\"><span></span><span></span><span></span></span>\n    </button>\n  </div>\n</header>\n\n<div class=\"mobile-menu\" id=\"mobile-menu\">\n  <button class=\"mobile-menu-close\" type=\"button\" aria-label=\"Close menu\">&times;</button>\n  <a href=\"index.html\">Home</a>\n  <a href=\"capabilities.html\" class=\"is-active\">Capabilities</a>\n  <a href=\"network.html\">Network</a>\n  <a href=\"network.html#mandate\">Discuss an Opportunity</a>\n  <div class=\"lang-switch\" aria-label=\"Language\">\n    <span class=\"lang-current\" aria-current=\"true\">EN</span><span class=\"lang-sep\">|</span>\n    <span aria-disabled=\"true\">DE</span><span class=\"lang-sep\">|</span>\n    <span aria-disabled=\"true\">SR</span>\n  </div>\n  <button class=\"theme-toggle\" type=\"button\" aria-pressed=\"false\" aria-label=\"Toggle color scheme\">\n    <span class=\"theme-toggle-dot\" aria-hidden=\"true\">\u25d0</span><span class=\"theme-toggle-label\">DARK</span>\n  </button>\n</div>\n\n<main>\n\n  <section class=\"page-head\">\n    <div class=\"container\">\n      <p class=\"label reveal\">Byzaro Group</p>\n      <h1 class=\"page-head-title reveal\">Capabilities</h1>\n      <p class=\"page-head-intro reveal\">One group, five capabilities, one network \u2014 assembled around each mandate. Specialized internal teams and trusted international partners, coordinated behind a single point of access.</p>\n    </div>\n  </section>\n\n  <nav class=\"subnav\" aria-label=\"Capabilities sections\">\n    <div class=\"container subnav-inner\">\n      <a href=\"#talent\">Talent</a>\n      <a href=\"#digital\">Digital</a>\n      <a href=\"#realestate\">Real Estate</a>\n      <a href=\"#capital\">Capital</a>\n      <a href=\"#advisory\">Advisory</a>\n    </div>\n  </nav>\n\n  <section class=\"section chapter\" id=\"talent\">\n    <div class=\"container\">\n      <p class=\"label chapter-num reveal\">No. 01</p>\n      <h2 class=\"chapter-name reveal\">Talent</h2>\n      <p class=\"chapter-standfirst reveal\">Connecting companies with the people they need \u2014 across borders.</p>\n      <div class=\"chapter-body reveal\">\n        <ul class=\"services-list\">\n          <li>International Recruitment</li>\n          <li>Executive Search</li>\n          <li>Temporary Staffing</li>\n          <li>Recruitment Outsourcing</li>\n          <li>Agency-to-Agency Recruiting</li>\n          <li>Cross-Border Workforce Projects</li>\n        </ul>\n        <aside class=\"usecase-aside\">\n          <p>A growing company needs specialized people in a new market \u2014 sourced, vetted and placed across borders.</p>\n        </aside>\n      </div>\n      <p class=\"network-relationship reveal\">Works alongside Advisory and Digital when a mandate calls for structure, systems or market entry alongside people.</p>\n    </div>\n  </section>\n\n  <section class=\"section section--panel chapter\" id=\"digital\">\n    <div class=\"container\">\n      <p class=\"label chapter-num reveal\">No. 02</p>\n      <h2 class=\"chapter-name reveal\">Digital</h2>\n      <p class=\"chapter-standfirst reveal\">Building the technology and digital systems behind modern businesses.</p>\n      <div class=\"chapter-body reveal\">\n        <ul class=\"services-list\">\n          <li>Corporate Websites &amp; Applications</li>\n          <li>Custom Software</li>\n          <li>AI Agents &amp; Automation</li>\n          <li>CRM &amp; ERP Systems</li>\n          <li>Digital Strategy</li>\n          <li>Performance Marketing</li>\n        </ul>\n        <aside class=\"usecase-aside\">\n          <p>An established business needs its digital infrastructure \u2014 software, automation and visibility \u2014 built to an international standard.</p>\n        </aside>\n      </div>\n      <p class=\"network-relationship reveal\">One capability within Byzaro Group \u2014 coordinated with Advisory, Talent and Real Estate as mandates require.</p>\n    </div>\n  </section>\n\n  <section class=\"section chapter\" id=\"realestate\">\n    <div class=\"container\">\n      <p class=\"label chapter-num reveal\">No. 03</p>\n      <h2 class=\"chapter-name reveal\">Real Estate</h2>\n      <p class=\"chapter-standfirst reveal\">Connecting property, people and opportunity across markets.</p>\n      <div class=\"chapter-body reveal\">\n        <ul class=\"services-list\">\n          <li>International Brokerage</li>\n          <li>Buyer &amp; Seller Representation</li>\n          <li>Off-Market Opportunities</li>\n          <li>Investment Properties</li>\n          <li>Property Search &amp; Relocation</li>\n          <li>Real Estate Investment Advisory</li>\n        </ul>\n        <aside class=\"usecase-aside\">\n          <p>Active across the UAE, Switzerland, Serbia, Montenegro, Croatia, Germany and Italy \u2014 and internationally through trusted partners.</p>\n        </aside>\n      </div>\n      <p class=\"network-relationship reveal\">Coordinated with Advisory and Capital wherever a transaction involves structuring, financing or cross-border relocation.</p>\n    </div>\n  </section>\n\n  <section class=\"section section--deep band--invert chapter\" id=\"capital\">\n    <div class=\"container\">\n      <p class=\"label chapter-num reveal\">No. 04</p>\n      <h2 class=\"chapter-name reveal\">Capital</h2>\n      <p class=\"chapter-standfirst reveal\">Connecting qualified clients with selected private-market opportunities.</p>\n      <div class=\"chapter-body reveal\">\n        <ul class=\"services-list\">\n          <li>Selected Investment Opportunities</li>\n          <li>Investor Introductions</li>\n          <li>Capital Advisory</li>\n          <li>Project Introductions</li>\n          <li>Strategic Capital Connections</li>\n        </ul>\n        <aside class=\"usecase-aside\">\n          <p>A qualified investor is introduced to a selected opportunity that fits their mandate \u2014 coordinated with the relevant specialists inside the group.</p>\n        </aside>\n      </div>\n      <p class=\"network-relationship reveal\">Introductions are coordinated within the group and through trusted partners.</p>\n      <p class=\"compliance-note reveal\">Selected opportunities may only be available to eligible or qualified investors and are subject to jurisdiction, due diligence and applicable regulation. Byzaro is not a bank, investment fund or regulated financial institution.</p>\n    </div>\n  </section>\n\n  <section class=\"section section--panel chapter\" id=\"advisory\">\n    <div class=\"container\">\n      <p class=\"label chapter-num reveal\">No. 05</p>\n      <h2 class=\"chapter-name reveal\">Advisory</h2>\n      <p class=\"chapter-standfirst reveal\">Structure, expansion and execution across jurisdictions.</p>\n      <div class=\"chapter-body reveal\">\n        <ul class=\"services-list\">\n          <li>International Company Formation</li>\n          <li>Market Entry &amp; Expansion</li>\n          <li>Corporate &amp; Holding Structures</li>\n          <li>M&amp;A Coordination</li>\n          <li>Business Succession</li>\n          <li>Corporate Relocation</li>\n        </ul>\n        <aside class=\"usecase-aside\">\n          <p>An entrepreneur expanding into a new jurisdiction receives coordinated legal, tax and structural guidance through Byzaro's trusted partners.</p>\n        </aside>\n      </div>\n      <p class=\"network-relationship reveal\">Structured alongside Talent, Real Estate and Capital wherever expansion requires people, property or capital as well as legal structure.</p>\n      <p class=\"compliance-note reveal\">International structures developed in coordination with specialized legal, tax and regulatory partners.</p>\n    </div>\n  </section>\n\n  <section class=\"section\" id=\"special-situations\">\n    <div class=\"container\">\n      <h2 class=\"special-headline reveal\">Some opportunities don't fit into conventional categories.</h2>\n      <p class=\"special-body reveal\">For mandates that cross capabilities \u2014 or fall outside them entirely \u2014 Byzaro works as one coordinated group.</p>\n      <ul class=\"special-list reveal\">\n        <li>Business Succession</li>\n        <li>Strategic Partnerships</li>\n        <li>International Expansion</li>\n        <li>Business Acquisitions &amp; Sales</li>\n        <li>Joint Ventures</li>\n      </ul>\n      <div class=\"special-cta reveal\">\n        <a class=\"btn btn-primary\" href=\"network.html#mandate\">Present an Opportunity</a>\n      </div>\n    </div>\n  </section>\n\n</main>\n\n<footer class=\"site-footer\">\n  <div class=\"horizon-line\" aria-hidden=\"true\"><span class=\"horizon-node\"></span></div>\n  <div class=\"container\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <a class=\"brand\" href=\"index.html\" aria-label=\"Byzaro Group\">\n          <svg class=\"byzaro-mark\" viewBox=\"0 0 367 390\" fill=\"currentColor\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\">\n            <defs><path id=\"bzb-foot\" fill-rule=\"evenodd\" d=\"M0,0 H164 V56 C161,68 145,70 145,90 C14 ;\n  document.querySelectorAll('.theme-toggle').forEach(function (btn) {\n    btn.addEventListener('click', function () {\n      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';\n      var next = isDark ? 'light' : 'dark';\n      document.documentElement.setAttribute('data-theme', next);\n      try { localStorage.setItem('bz-theme-02', next); } catch (e) {}\n      updateToggles();\n    });\n  });\n\n  var sections = document.querySelectorAll('.chapter[id]');\n  var subnavLinks = document.querySelectorAll('.subnav-inner a');\n  if ('IntersectionObserver' in window && sections.length) {\n    var navIo = new IntersectionObserver(function (entries) {\n      entries.forEach(function (entry) {\n        if (entry.isIntersecting) {\n          subnavLinks.forEach(function (a) {\n            a.classList.toggle('is-active', a.getAttribute('href') === '#' + entry.target.id);\n          });\n        }\n      });\n    }, { rootMargin: '-160px 0px -70% 0px' });\n    sections.forEach(function (s) { navIo.observe(s); });\n  }\n\n  var reveals = document.querySelectorAll('.reveal');\n  if ('IntersectionObserver' in window) {\n    var io = new IntersectionObserver(function (entries) {\n      entries.forEach(function (entry) {\n        if (entry.isIntersecting) {\n          entry.target.classList.add('is-visible');\n          io.unobserve(entry.target);\n        }\n      });\n    }, { threshold: .15 });\n    reveals.forEach(function (el) { io.observe(el); });\n  } else {\n    reveals.forEach(function (el) { el.classList.add('is-visible'); });\n  }\n})();\n<\/script>\n\n<script>(function(){\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a[href]');\n    if(!a) return;\n    var href = a.getAttribute('href') || '';\n    if(/^(https?:|mailto:|tel:)/i.test(href)) { a.target = '_blank'; return; }\n    var m = href.match(/^(?:\\.\\.\\/)?(?:([0-9]{2}-[a-z]+)\\/)?([a-z]+\\.html)?(#.*)?$/i);\n    if(!m) return;\n    if(href.charAt(0) === '#') return;          /* Anker in der Seite: normal lassen */\n    e.preventDefault();\n    parent.postMessage({bzNav: {concept: m[1] || null, page: m[2] || 'index.html', hash: m[3] || ''}}, '*');\n  }, true);\n  window.addEventListener('message', function(e){\n    if(e.data && e.data.bzHash){ location.hash = e.data.bzHash; }\n  });\n})();<\/script>\n\n</body>\n</html>\n", "02-riviera/network.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<script>\n(function () {\n  try {\n    var t = localStorage.getItem('bz-theme-02');\n    if (t === 'dark' || t === 'light') {\n      document.documentElement.setAttribute('data-theme', t);\n    }\n  } catch (e) {}\n})();\n<\/script>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>BYZARO GROUP \u2014 The Network</title>\n<meta name=\"description\" content=\"Byzaro's international network and mandate flow \u2014 tell us what you are trying to achieve.\">\n<meta name=\"robots\" content=\"noindex\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&amp;family=Albert+Sans:wght@400;500;600&amp;family=Jost:wght@300;400;500&amp;display=swap\" rel=\"stylesheet\">\n<style>\n/* ==========================================================================\n   BYZARO GROUP \u2014 Concept 02: RIVIERA\n   Shared stylesheet for index.html, capabilities.html, network.html\n   Mediterranean luxury in daylight. Light theme is default; dark is a fully\n   designed variant toggled via [data-theme] on <html>.\n   ========================================================================== */\n\n:root {\n  --bg: #F6F3EC;\n  --bg-2: #EEE9DD;\n  --sea: #0E3A5C;\n  --sea-deep: #092841;\n  --ink: #10131A;\n  --brass: #A8875A;\n  --brass-text: #796141;\n  --text: #232A33;\n  --muted: #5C6672;\n  --porcelain: #F2EEE3;\n\n  --headline: var(--sea);\n  --btn-border: var(--sea);\n  --btn-hover-text: var(--bg);\n  --border: rgba(16, 19, 26, .14);\n  --border-strong: var(--sea);\n  --nav-bg: rgba(246, 243, 236, .86);\n  --deep-band-bg: var(--sea-deep);\n  --deep-band-text: var(--porcelain);\n  --deep-band-muted: rgba(242, 238, 227, .68);\n  --deep-band-border: rgba(242, 238, 227, .22);\n\n  --font-display: \"Newsreader\", Georgia, \"Times New Roman\", serif;\n  --font-body: \"Albert Sans\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-ui: \"Jost\", system-ui, sans-serif;\n\n  --container: 1360px;\n  --section-pad: clamp(88px, 11vh, 160px);\n}\n\n[data-theme=\"dark\"] {\n  --bg: #092841;\n  --bg-2: #0E3A5C;\n  --sea: #0E3A5C;\n  --sea-deep: #071E33;\n  --ink: #F2EEE3;\n  --text: #F2EEE3;\n  --muted: #9FB0C0;\n  --brass-text: #C69F6A;\n\n  --headline: var(--porcelain);\n  --btn-border: var(--porcelain);\n  --border: rgba(242, 238, 227, .18);\n  --border-strong: var(--porcelain);\n  --nav-bg: rgba(9, 40, 65, .86);\n  --deep-band-bg: #061B2C;\n  --deep-band-text: var(--porcelain);\n  --deep-band-muted: rgba(242, 238, 227, .68);\n  --deep-band-border: rgba(242, 238, 227, .22);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Reset                                                                    */\n/* ---------------------------------------------------------------------- */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nhtml, body { max-width: 100%; overflow-x: hidden; }\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--text);\n  font-family: var(--font-body);\n  font-weight: 400;\n  font-size: 1rem;\n  line-height: 1.7;\n  overflow-x: hidden;\n  min-width: 320px;\n  transition: background-color 300ms ease, color 300ms ease;\n}\n\nimg, svg { display: block; max-width: 100%; }\n\na { color: inherit; text-decoration: none; }\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: 500;\n  margin: 0;\n  color: var(--headline);\n}\n\np { margin: 0; }\n\nul { list-style: none; margin: 0; padding: 0; }\n\nbutton { font-family: inherit; cursor: pointer; background: none; border: none; color: inherit; }\n\ninput, textarea { font-family: inherit; font-size: inherit; color: inherit; }\n\n* { min-width: 0; }\n\n/* ---------------------------------------------------------------------- */\n/* Focus visibility                                                         */\n/* ---------------------------------------------------------------------- */\n\na:focus-visible,\nbutton:focus-visible,\ninput:focus-visible,\nselect:focus-visible,\ntextarea:focus-visible,\n[tabindex]:focus-visible {\n  outline: 2px solid var(--brass);\n  outline-offset: 3px;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Layout helpers                                                           */\n/* ---------------------------------------------------------------------- */\n\n.container {\n  width: 100%;\n  max-width: var(--container);\n  margin: 0 auto;\n  padding-left: clamp(20px, 5vw, 64px);\n  padding-right: clamp(20px, 5vw, 64px);\n}\n\n.section {\n  position: relative;\n  padding: var(--section-pad) 0;\n  background: var(--bg);\n}\n\n.section--panel { background: var(--bg-2); }\n\n.section--deep {\n  background: var(--deep-band-bg);\n  color: var(--deep-band-text);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Inverted-surface scoping \u2014 any section rendered on a dark band must     */\n/* re-declare the semantic tokens so buttons, links, headings, labels and  */\n/* body copy inside it stay legible, in BOTH themes (dark bands stay dark  */\n/* in both light and dark theme; only the exact shade changes). Brass text */\n/* also needs the brighter \"on-dark\" variant here regardless of the active */\n/* root theme, since a sea-deep band is always dark.                       */\n/* ---------------------------------------------------------------------- */\n\n.band--invert {\n  --headline: var(--deep-band-text);\n  --text: var(--deep-band-text);\n  --muted: var(--deep-band-muted);\n  --btn-border: var(--deep-band-text);\n  --btn-hover-text: var(--deep-band-bg);\n  --border-strong: var(--deep-band-text);\n  --brass-text: #C69F6A;\n}\n\n.section-head {\n  margin-bottom: clamp(40px, 6vw, 80px);\n  text-align: center;\n}\n\n.section-title {\n  font-size: clamp(1.8rem, 4vw, 3.2rem);\n  line-height: 1.15;\n  margin-top: 10px;\n}\n\n.label {\n  display: inline-block;\n  font-family: var(--font-ui);\n  font-size: 11px;\n  font-weight: 500;\n  letter-spacing: .25em;\n  text-transform: uppercase;\n  color: var(--brass-text);\n}\n\n.lede {\n  color: var(--muted);\n  max-width: 62ch;\n  font-size: clamp(1rem, 1.4vw, 1.15rem);\n}\n\n.center { text-align: center; margin-left: auto; margin-right: auto; }\n\n.italic { font-style: italic; }\n\n/* ---------------------------------------------------------------------- */\n/* Horizon line motif                                                       */\n/* ---------------------------------------------------------------------- */\n\n.horizon-line {\n  position: relative;\n  width: 100%;\n  height: 1px;\n  background: var(--brass);\n  opacity: .55;\n}\n\n.horizon-line .horizon-node {\n  position: absolute;\n  top: 50%;\n  left: 50%;\n  width: 6px;\n  height: 6px;\n  border-radius: 50%;\n  background: var(--brass);\n  transform: translate(-50%, -50%);\n}\n\n.horizon-divider {\n  padding: 0 0;\n}\n\n.section-divider {\n  margin-top: clamp(56px, 8vw, 96px);\n}\n\n.horizon-divider .container {\n  display: flex;\n  align-items: center;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Buttons & links                                                          */\n/* ---------------------------------------------------------------------- */\n\n.btn {\n  display: inline-block;\n  border-radius: 0;\n  padding: 16px 34px;\n  font-family: var(--font-ui);\n  font-size: 12px;\n  font-weight: 500;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  text-decoration: none;\n  text-align: center;\n  transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease;\n  white-space: nowrap;\n  cursor: pointer;\n}\n\n.btn-primary {\n  border: 1px solid var(--btn-border);\n  color: var(--btn-border);\n  background: transparent;\n}\n\n.btn-primary:hover,\n.btn-primary:focus-visible {\n  background: var(--btn-border);\n  color: var(--btn-hover-text);\n}\n\n.text-link {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  font-family: var(--font-ui);\n  font-size: 13px;\n  font-weight: 500;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: var(--headline);\n  border-bottom: 1px solid var(--border-strong);\n  padding-bottom: 2px;\n  transition: opacity 200ms ease;\n}\n\n.text-link:hover, .text-link:focus-visible { opacity: .65; }\n\n/* ---------------------------------------------------------------------- */\n/* Intro assembly animation (ported pattern from concept 01)                */\n/* ---------------------------------------------------------------------- */\n\n.intro-overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 9000;\n  background: var(--bg);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  transition: opacity 500ms ease, background-color 300ms ease;\n}\n\n.intro-overlay[data-hidden=\"true\"] {\n  opacity: 0;\n  pointer-events: none;\n}\n\n.intro-mark {\n  width: clamp(72px, 14vw, 140px);\n  color: var(--headline);\n}\n\n.intro-mark .bz-b {\n  opacity: 0;\n  transition: transform 1200ms cubic-bezier(0,.68,.24,1), opacity 1200ms ease;\n}\n\n.intro-mark.bz-run .bz-b { opacity: 1; transform: translate(0, 0); }\n\n.intro-mark .bz-b1 { transform: translate(6%, -6%); }\n.intro-mark .bz-b2 { transform: translate(-6%, -6%); }\n.intro-mark .bz-b3 { transform: translate(6%, 6%); }\n.intro-mark .bz-b4 { transform: translate(-6%, 6%); }\n\n.intro-mark.bz-run .bz-b2 { transition-delay: 35ms; }\n.intro-mark.bz-run .bz-b3 { transition-delay: 65ms; }\n.intro-mark.bz-run .bz-b4 { transition-delay: 100ms; }\n\n/* ---------------------------------------------------------------------- */\n/* Top navigation                                                           */\n/* ---------------------------------------------------------------------- */\n\n.site-header {\n  position: fixed;\n  top: 0;\n  left: 0;\n  right: 0;\n  z-index: 500;\n  background: var(--nav-bg);\n  backdrop-filter: blur(10px);\n  border-bottom: 1px solid var(--border);\n  transition: background-color 300ms ease, border-color 300ms ease;\n}\n\n.nav {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 24px;\n  height: 84px;\n}\n\n.brand {\n  display: inline-flex;\n  align-items: center;\n  gap: .7em;\n  text-decoration: none;\n  color: var(--headline);\n  flex-shrink: 0;\n}\n\n.byzaro-mark {\n  width: auto;\n  height: 32px;\n  flex-shrink: 0;\n}\n\n.brand-text {\n  display: flex;\n  flex-direction: column;\n  gap: .28em;\n  min-width: 0;\n}\n\n.brand-word {\n  font-family: var(--font-ui);\n  font-weight: 500;\n  font-size: 16px;\n  line-height: .72;\n  letter-spacing: .445em;\n  text-indent: .445em;\n  margin-right: -.445em;\n  display: flex;\n  align-items: flex-start;\n  white-space: nowrap;\n}\n\n.brand-lam {\n  width: .745em;\n  height: .72em;\n  margin-right: .036em;\n  flex-shrink: 0;\n}\n\n.brand-sub {\n  font-family: var(--font-ui);\n  font-weight: 300;\n  font-size: 8.5px;\n  line-height: .72;\n  letter-spacing: 1.02em;\n  text-indent: 1.02em;\n  margin-right: -1.02em;\n  white-space: nowrap;\n}\n\n.nav-links {\n  display: flex;\n  align-items: center;\n  gap: clamp(18px, 2.4vw, 34px);\n}\n\n.nav-links a:not(.btn) {\n  font-family: var(--font-ui);\n  font-size: 13px;\n  font-weight: 500;\n  letter-spacing: .04em;\n  color: var(--text);\n  position: relative;\n  padding-bottom: 4px;\n  transition: color 200ms ease;\n}\n\n.nav-links a:not(.btn):hover,\n.nav-links a:not(.btn).is-active {\n  color: var(--headline);\n}\n\n.nav-links a:not(.btn).is-active {\n  border-bottom: 1px solid var(--brass);\n}\n\n.lang-switch {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  font-family: var(--font-ui);\n  font-size: 11px;\n  font-weight: 500;\n  letter-spacing: .1em;\n}\n\n.lang-switch .lang-current { color: var(--headline); }\n.lang-switch [aria-disabled=\"true\"] { color: var(--muted); opacity: .5; cursor: default; }\n.lang-switch .lang-sep { color: var(--muted); opacity: .4; }\n\n.theme-toggle {\n  display: flex;\n  align-items: center;\n  gap: 7px;\n  border: 1px solid var(--border);\n  border-radius: 999px;\n  padding: 6px 12px;\n  font-family: var(--font-ui);\n  font-size: 10px;\n  font-weight: 500;\n  letter-spacing: .14em;\n  color: var(--text);\n  transition: border-color 200ms ease, color 200ms ease;\n}\n\n.theme-toggle:hover, .theme-toggle:focus-visible { border-color: var(--brass); color: var(--headline); }\n\n.theme-toggle-dot { font-size: 13px; line-height: 1; color: var(--brass-text); }\n\n.nav-toggle {\n  display: none;\n  width: 40px;\n  height: 40px;\n  align-items: center;\n  justify-content: center;\n  flex-shrink: 0;\n}\n\n.nav-toggle-bars {\n  display: flex;\n  flex-direction: column;\n  gap: 5px;\n  width: 22px;\n}\n\n.nav-toggle-bars span {\n  display: block;\n  height: 1px;\n  background: var(--headline);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Mobile menu                                                              */\n/* ---------------------------------------------------------------------- */\n\n.mobile-menu {\n  position: fixed;\n  inset: 0;\n  z-index: 800;\n  background: var(--bg);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: 26px;\n  transform: translateY(-100%);\n  transition: transform 350ms ease;\n  padding: 32px;\n}\n\n.mobile-menu.is-open { transform: translateY(0); }\n\n.mobile-menu a {\n  font-family: var(--font-display);\n  font-size: clamp(1.6rem, 6vw, 2.2rem);\n  color: var(--headline);\n}\n\n.mobile-menu a.is-active { color: var(--brass); }\n\n.mobile-menu-close {\n  position: absolute;\n  top: 22px;\n  right: clamp(20px, 5vw, 64px);\n  font-size: 32px;\n  line-height: 1;\n  color: var(--headline);\n}\n\n.mobile-menu .lang-switch { margin-top: 12px; font-size: 13px; }\n\n.mobile-menu .theme-toggle { margin-top: 8px; }\n\n/* ---------------------------------------------------------------------- */\n/* Hero                                                                      */\n/* ---------------------------------------------------------------------- */\n\n.hero {\n  position: relative;\n  min-height: 92svh;\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n  padding-top: 140px;\n  padding-bottom: 48px;\n  background: var(--bg);\n  overflow: hidden;\n}\n\n.hero-mark-bg {\n  position: absolute;\n  top: 50%;\n  right: -18%;\n  width: 120vh;\n  max-width: none;\n  height: 120vh;\n  transform: translateY(-50%);\n  color: var(--headline);\n  opacity: .03;\n  pointer-events: none;\n  z-index: 0;\n}\n\n[data-theme=\"dark\"] .hero-mark-bg {\n  opacity: .045;\n}\n\n@media (max-width: 560px) {\n  .hero-mark-bg { display: none; }\n}\n\n.hero-inner { position: relative; z-index: 1; padding-top: 24px; padding-bottom: clamp(48px, 8vh, 96px); }\n\n.hero > .container { position: relative; z-index: 1; }\n\n.hero-label { margin-bottom: 22px; }\n\n.hero-headline {\n  font-size: clamp(2.6rem, 9vw, 6.6rem);\n  line-height: .98;\n  letter-spacing: -.01em;\n}\n\n.hero-headline .line { display: block; }\n\n.hero-headline .hero-italic { font-style: italic; font-weight: 400; }\n\n.hero-support {\n  margin-top: 26px;\n  max-width: 46ch;\n  font-size: clamp(1rem, 1.5vw, 1.2rem);\n  color: var(--muted);\n}\n\n.hero-actions {\n  margin-top: 40px;\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  gap: 28px;\n}\n\n.horizon-line--hero { margin: 0; }\n\n.market-row {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 0;\n  padding-top: 22px;\n  padding-bottom: 4px;\n}\n\n.market-row li {\n  font-family: var(--font-ui);\n  font-size: 11px;\n  font-weight: 500;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  color: var(--muted);\n  display: flex;\n  align-items: center;\n}\n\n.market-row li::before {\n  content: \"\";\n  display: inline-block;\n  width: 1px;\n  height: 10px;\n  background: var(--brass);\n  margin: 0 14px;\n}\n\n.market-row li:first-child::before { display: none; }\n\n/* ---------------------------------------------------------------------- */\n/* Triad / The Group                                                        */\n/* ---------------------------------------------------------------------- */\n\n.triad {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: baseline;\n  justify-content: center;\n  gap: clamp(14px, 3vw, 34px);\n  text-align: center;\n}\n\n.triad-word {\n  font-family: var(--font-display);\n  font-size: clamp(1.9rem, 6vw, 4rem);\n  font-weight: 500;\n  color: var(--deep-band-text);\n}\n\n.triad-rule {\n  width: 44px;\n  height: 1px;\n  background: var(--brass);\n  align-self: center;\n}\n\n.deep-lede {\n  margin: clamp(36px, 5vw, 56px) auto 0;\n  max-width: 62ch;\n  text-align: center;\n  font-size: clamp(1rem, 1.4vw, 1.15rem);\n  color: var(--deep-band-text);\n}\n\n.deep-muted {\n  margin: 16px auto 0;\n  max-width: 56ch;\n  text-align: center;\n  color: var(--deep-band-muted);\n  font-size: .95rem;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Ledger rows (capabilities, opportunities)                                */\n/* ---------------------------------------------------------------------- */\n\n.ledger { border-top: 1px dotted var(--border-strong); }\n\n.ledger-row {\n  display: grid;\n  grid-template-columns: 90px 1fr 2fr auto;\n  align-items: center;\n  gap: 20px;\n  padding: 26px 18px;\n  border-bottom: 1px dotted var(--border-strong);\n  transition: background-color 200ms ease;\n}\n\na.ledger-row { display: grid; }\n\n.ledger-row:hover, .ledger-row:focus-visible { background: var(--bg-2); }\n\n.ledger-num {\n  font-family: var(--font-ui);\n  font-weight: 500;\n  font-size: .95rem;\n  letter-spacing: .05em;\n  color: var(--brass-text);\n  transition: color 200ms ease;\n}\n\n.ledger-row:hover .ledger-num { color: var(--sea); }\n\n[data-theme=\"dark\"] .ledger-row:hover .ledger-num { color: var(--porcelain); }\n\n.ledger-name {\n  font-family: var(--font-display);\n  font-size: clamp(1.3rem, 2.6vw, 2rem);\n  color: var(--headline);\n}\n\n.ledger-desc {\n  color: var(--muted);\n  font-size: .95rem;\n}\n\n.ledger-link {\n  font-family: var(--font-ui);\n  font-size: 12px;\n  font-weight: 500;\n  letter-spacing: .08em;\n  text-transform: uppercase;\n  color: var(--headline);\n  white-space: nowrap;\n  justify-self: end;\n}\n\n/* ---------------------------------------------------------------------- */\n/* The Crossing \u2014 network plate                                             */\n/* ---------------------------------------------------------------------- */\n\n.crossing { margin-top: 20px; }\n\n.crossing-plate { width: 100%; height: auto; color: var(--text); }\n\n.crossing-baseline { stroke: var(--brass); stroke-width: 1; opacity: .6; }\n\n.crossing-arc { fill: none; stroke: var(--sea); stroke-width: 1.4; }\n\n[data-theme=\"dark\"] .crossing-arc { stroke: var(--porcelain); }\n\n.crossing-arc--outer {\n  fill: none;\n  stroke: var(--brass);\n  stroke-width: 1;\n  stroke-dasharray: 4 6;\n  opacity: .7;\n}\n\n.crossing-node { fill: var(--brass); }\n\n.crossing-point { fill: var(--bg); stroke: var(--sea); stroke-width: 1.6; }\n\n[data-theme=\"dark\"] .crossing-point { stroke: var(--porcelain); }\n\n.crossing-leader work across talent, digital, real estate, capital and advisory.\">\n<meta name=\"robots\" content=\"noindex\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,600;0,700;1,600;1,700&amp;family=Jost:wght@300;400;500&amp;display=swap\" rel=\"stylesheet\">\n<style>\n/* ==========================================================================\n   BYZARO GROUP \u2014 Concept 03: PLATINUM\n   Swiss precision instrument. Machined steel, guilloch\u00e9, engraved indices.\n   Shared stylesheet for index.html, capabilities.html, network.html\n   ========================================================================== */\n\n:root {\n  --bg: #0E1116;\n  --bg-2: #161B22;\n  --bg-3: #1E242D;\n  --steel: #B9C4D0;\n  --steel-dim: #8C97A5;\n  --text: #E9EDF2;\n  --text-dim: #A3AEBC;\n\n  /* small-text accent \u2014 must be \u22654.5:1 on --bg/--bg-2/--bg-3 */\n  --steel-text: var(--steel);\n  /* rule/hairline colour \u2014 decorative, no contrast requirement */\n  --steel-rule: var(--steel-dim);\n  /* fill colour for filled steel states (button hover, selected chip) \u2014\n     paired with --bg-coloured text on top, needs \u22654.5:1 against --bg */\n  --steel-fill: var(--steel);\n\n  --border: rgba(185, 196, 208, .16);\n  --border-strong: rgba(185, 196, 208, .32);\n  --header-bg: rgba(14, 17, 22, .82);\n  --subnav-bg: rgba(14, 17, 22, .92);\n  --input-bg: var(--bg-2);\n  --input-border: rgba(185, 196, 208, .28);\n  --frame-border: rgba(233, 237, 242, .14);\n\n  --font-display: \"Bodoni Moda\", \"Times New Roman\", serif;\n  --font-ui: \"Jost\", system-ui, sans-serif;\n\n  --container: 1320px;\n  --section-pad: clamp(96px, 12vh, 180px);\n\n  --metal-gradient: linear-gradient(100deg, #8C97A5, #E9EDF2 42%, #7E8A98 58%, #C3CDD9);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Light theme \u2014 cool paper, darker steel for small text                    */\n/* Default (no attribute, or data-theme=\"dark\") stays PLATINUM dark.        */\n/* ---------------------------------------------------------------------- */\n\n[data-theme=\"light\"] {\n  --bg: #F1F4F8;\n  --bg-2: #E4E9F0;\n  --bg-3: #D8DFE8;\n  --steel: #9FACBB;       /* lighter steel kept for rules/lines */\n  --steel-dim: #B7C2CE;\n  --text: #0E1116;\n  --text-dim: #4E5867;\n\n  --steel-text: #5A6675;  /* darkened steel \u2014 measured \u22654.5:1 on bg/bg-2/bg-3 */\n  --steel-rule: #8A97A6;\n  --steel-fill: #5A6675;  /* darkened fill so --bg-coloured text on top stays \u22654.5:1 */\n\n  --border: rgba(14, 17, 22, .14);\n  --border-strong: rgba(14, 17, 22, .24);\n  --header-bg: rgba(241, 244, 248, .82);\n  --subnav-bg: rgba(241, 244, 248, .92);\n  --input-bg: #E9EEF3;\n  --input-border: rgba(14, 17, 22, .2);\n  --frame-border: rgba(14, 17, 22, .12);\n\n  /* Auf hellem Papier muss der Metallverlauf DUNKEL sein \u2014 helles Metall auf\n     hellem Grund war praktisch unlesbar. Dunkler Stahl mit hellerem Streiflicht\n     h\u00e4lt den polierten Charakter und bleibt kr\u00e4ftig. */\n  --metal-gradient: linear-gradient(100deg, #2B3542, #6B7A8C 42%, #1B222C 58%, #4A5766);\n}\n\n[data-theme=\"light\"] .hero-mark-bg { color: var(--text); opacity: .028; }\n\n@media (prefers-reduced-motion: no-preference) {\n  html.theme-transition,\n  html.theme-transition *,\n  html.theme-transition *::before,\n  html.theme-transition *::after {\n    transition: background-color 300ms ease, color 300ms ease, border-color 300ms ease, fill 300ms ease, stroke 300ms ease !important;\n  }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Reset                                                                    */\n/* ---------------------------------------------------------------------- */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--text);\n  font-family: var(--font-ui);\n  font-weight: 400;\n  font-size: 1rem;\n  line-height: 1.7;\n  overflow-x: hidden;\n  min-width: 320px;\n}\n\nhtml, body { max-width: 100%; overflow-x: hidden; }\n\nimg, svg { display: block; max-width: 100%; }\n\na { color: inherit; }\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: 600;\n  letter-spacing: .01em;\n  margin: 0;\n}\n\np { margin: 0; }\n\nul, ol { list-style: none; margin: 0; padding: 0; }\n\nbutton { font-family: inherit; cursor: pointer; }\n\n/* ---------------------------------------------------------------------- */\n/* Focus visibility                                                         */\n/* ---------------------------------------------------------------------- */\n\na:focus-visible,\nbutton:focus-visible,\ninput:focus-visible,\nselect:focus-visible,\ntextarea:focus-visible,\n[tabindex]:focus-visible {\n  outline: 2px solid var(--steel);\n  outline-offset: 3px;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Layout helpers                                                           */\n/* ---------------------------------------------------------------------- */\n\n.container {\n  width: 100%;\n  max-width: var(--container);\n  margin: 0 auto;\n  padding-left: clamp(20px, 5vw, 56px);\n  padding-right: clamp(20px, 5vw, 56px);\n}\n\n.chapter {\n  position: relative;\n  padding: var(--section-pad) 0;\n}\n\n.chapter--panel { background: var(--bg-2); }\n\n.chapter-head {\n  display: flex;\n  align-items: baseline;\n  justify-content: center;\n  gap: clamp(12px, 3vw, 28px);\n  margin-bottom: clamp(40px, 6vw, 72px);\n  text-align: center;\n}\n\n.chapter-numeral {\n  font-family: var(--font-ui);\n  color: var(--steel-text);\n  font-size: clamp(1rem, 2vw, 1.3rem);\n  letter-spacing: .3em;\n}\n\n.chapter-title {\n  font-size: clamp(1.8rem, 4vw, 3.4rem);\n  line-height: 1 \n  height: 100%;\n}\n\n.index-scale--v::before {\n  left: 50%; right: auto; top: 0; bottom: 0;\n  width: 7px; height: auto;\n  transform: translateX(-50%);\n  background-image: repeating-linear-gradient(to bottom, var(--steel-dim) 0 1px, transparent 1px calc(100% / 60));\n}\n\n.index-scale--v::after {\n  background-image: repeating-linear-gradient(to bottom, var(--steel) 0 1.4px, transparent 1.4px calc(100% / 12));\n}\n\n/* ---------------------------------------------------------------------- */\n/* Jewel bearings \u2014 tiny precision markers                                  */\n/* ---------------------------------------------------------------------- */\n\n.jewel {\n  display: inline-block;\n  width: 6px;\n  height: 6px;\n  flex-shrink: 0;\n  border-radius: 50%;\n  background: radial-gradient(circle at 35% 30%, var(--text) 0%, var(--steel) 45%, var(--steel-dim) 100%);\n  box-shadow: 0 0 0 1px var(--border);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Buttons                                                                   */\n/* ---------------------------------------------------------------------- */\n\n.btn {\n  display: inline-block;\n  border-radius: 0;\n  padding: 16px 34px;\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  text-decoration: none;\n  text-align: center;\n  transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease;\n  white-space: nowrap;\n}\n\n.btn-primary {\n  border: 1px solid var(--steel);\n  color: var(--text);\n  background: transparent;\n}\n\n.btn-primary:hover,\n.btn-primary:focus-visible {\n  background: var(--steel-fill);\n  border-color: var(--steel-fill);\n  color: var(--bg);\n}\n\n.text-link {\n  color: var(--steel-text);\n  text-decoration: none;\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  border-bottom: 1px solid var(--steel-rule);\n  padding-bottom: 2px;\n}\n\n.text-link:hover, .text-link:focus-visible { border-color: var(--steel); color: var(--text); }\n\n/* ---------------------------------------------------------------------- */\n/* Intro assembly animation                                                 */\n/* ---------------------------------------------------------------------- */\n\n.intro-overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 9000;\n  background: var(--bg);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  transition: opacity 500ms ease;\n}\n\n.intro-overlay[data-hidden=\"true\"] {\n  opacity: 0;\n  pointer-events: none;\n}\n\n.intro-mark {\n  width: clamp(72px, 14vw, 140px);\n  color: var(--steel);\n}\n\n.intro-mark .bz-b {\n  opacity: 0;\n  transition: transform 1200ms cubic-bezier(0,.68,.24,1), opacity 1200ms ease;\n}\n\n.intro-mark.bz-run .bz-b { opacity: 1; transform: translate(0, 0); }\n\n.intro-mark .bz-b1 { transform: translate(6%, -6%); }\n.intro-mark .bz-b2 { transform: translate(-6%, -6%); }\n.intro-mark .bz-b3 { transform: translate(6%, 6%); }\n.intro-mark .bz-b4 { transform: translate(-6%, 6%); }\n\n.intro-mark.bz-run .bz-b2 { transition-delay: 35ms; }\n.intro-mark.bz-run .bz-b3 { transition-delay: 65ms; }\n.intro-mark.bz-run .bz-b4 { transition-delay: 100ms; }\n\n/* ---------------------------------------------------------------------- */\n/* Top navigation                                                           */\n/* ---------------------------------------------------------------------- */\n\n.site-header {\n  position: fixed;\n  top: 0; left: 0; right: 0;\n  z-index: 500;\n  background: var(--header-bg);\n  backdrop-filter: blur(10px);\n  border-bottom: 1px solid var(--border);\n}\n\n.nav {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 16px;\n  padding-top: 16px;\n  padding-bottom: 16px;\n}\n\n.brand { display: inline-flex; align-items: center; gap: .7em; text-decoration: none; color: var(--
