        <span aria-disabled=\"true\">SR</span>\n        </div>\n      </div>\n      <p class=\"footer-compliance\">Byzaro coordinates specialized legal, tax and regulatory work with qualified local partners. Nothing on this site constitutes investment, legal or tax advice.</p>\n    </div>\n  </div>\n</footer>\n\n<script>\n(function () {\n  var overlay = document.getElementById('intro-overlay');\n  if (overlay) {\n    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (reduce || sessionStorage.getItem('bz04-intro')) {\n      overlay.setAttribute('data-hidden', 'true');\n      overlay.style.display = 'none';\n    } else {\n      var mark = document.getElementById('intro-mark');\n      requestAnimationFrame(function () {\n        requestAnimationFrame(function () {\n          mark.classList.add('bz-run');\n        });\n      });\n      setTimeout(function () {\n        overlay.setAttribute('data-hidden', 'true');\n        sessionStorage.setItem('bz04-intro', '1');\n        setTimeout(function () { overlay.style.display = 'none'; }, 500);\n      }, 1300);\n    }\n  }\n\n  var toggle = document.querySelector('.nav-toggle');\n  var menu = document.querySelector('.mobile-menu');\n  var closeBtn = document.querySelector('.mobile-menu-close');\n  function openMenu() {\n    menu.classList.add('is-open');\n    toggle.setAttribute('aria-expanded', 'true');\n    document.body.style.overflow = 'hidden';\n  }\n  function closeMenu() {\n    menu.classList.remove('is-open');\n    toggle.setAttribute('aria-expanded', 'false');\n    document.body.style.overflow = '';\n  }\n  if (toggle) {\n    toggle.addEventListener('click', function () {\n      var expanded = toggle.getAttribute('aria-expanded') === 'true';\n      if (expanded) { closeMenu(); } else { openMenu(); }\n    });\n  }\n  if (closeBtn) { closeBtn.addEventListener('click', closeMenu); }\n  if (menu) {\n    menu.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', closeMenu); });\n  }\n\n  var themeToggles = document.querySelectorAll('.theme-toggle');\n  var themeLabels = { light: 'DARK', dark: 'LIGHT' };\n  function currentTheme() {\n    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';\n  }\n  function updateThemeToggles() {\n    var theme = currentTheme();\n    themeToggles.forEach(function (btn) {\n      btn.setAttribute('aria-pressed', String(theme === 'dark'));\n      var label = btn.querySelector('.theme-toggle-label');\n      if (label) { label.textContent = themeLabels[theme]; }\n    });\n  }\n  function setTheme(theme) {\n    document.documentElement.classList.add('theme-transition');\n    window.setTimeout(function () {\n      document.documentElement.classList.remove('theme-transition');\n    }, 320);\n    if (theme === 'dark') {\n      document.documentElement.setAttribute('data-theme', 'dark');\n    } else {\n      document.documentElement.removeAttribute('data-theme');\n    }\n    try { localStorage.setItem('bz-theme-04', theme); } catch (e) {}\n    updateThemeToggles();\n  }\n  updateThemeToggles();\n  themeToggles.forEach(function (btn) {\n    btn.addEventListener('click', function () {\n      setTheme(currentTheme() === 'dark' ? 'light' : 'dark');\n    });\n  });\n\n  var reveals = document.querySelectorAll('.reveal');\n  if ('IntersectionObserver' in window) {\n    var io = new IntersectionObserver(function (entries) {\n      entries.forEach(function (entry) {\n        if (entry.isIntersecting) {\n          entry.target.classList.add('is-visible');\n          io.unobserve(entry.target);\n        }\n      });\n    }, { threshold: .15 });\n    reveals.forEach(function (el) { io.observe(el); });\n  } else {\n    reveals.forEach(function (el) { el.classList.add('is-visible'); });\n  }\n\n  var form = document.querySelector('.mandate-form');\n  var confirmation = document.querySelector('.mandate-confirmation');\n  if (form) {\n    form.addEventListener('submit', function (e) {\n ===========================================\n   BYZARO GROUP \u2014 Concept 05: BORDEAUX\n   Shared stylesheet for index.html, capabilities.html, network.html\n   ========================================================================== */\n\n:root {\n  --bg: #2B1218;\n  --bg-2: #3A181F;\n  --wine: #5C1A28;\n  --wine-dim: rgba(92, 26, 40, .55);\n  --sand: #D9CBB4;\n  --sand-dim: rgba(217, 203, 180, .35);\n  --sand-faint: rgba(217, 203, 180, .12);\n  --cream: #F0EBE1;\n  --muted: #B9A894;\n  /* accent-text: the accent colour for SMALL text (labels, numerals, rules,\n     active states) \u2014 must read \u22654.5:1 on its backdrop. */\n  --accent-text: var(--sand);\n  /* text placed directly on a sand surface (the inverted \"Group\"/\"Closing\"\n     band) cannot use --muted (fails contrast on sand) \u2014 use wine instead. */\n  --on-sand-strong: var(--wine);\n  --on-sand-dim: #7A3040;\n\n  --header-bg: rgba(43, 18, 24, .86);\n  --subnav-bg: rgba(43, 18, 24, .94);\n  --frame-border: var(--sand-dim);\n  --input-bg: var(--bg-2);\n  --input-border: rgba(217, 203, 180, .3);\n\n  --font-display: \"Playfair Display\", \"Times New Roman\", serif;\n  --font-ui: \"Jost\", system-ui, sans-serif;\n  --font-body: \"Jost\", system-ui, sans-serif;\n\n  --container: 1320px;\n  --section-pad: clamp(96px, 12vh, 180px);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Light theme \u2014 opt-in via [data-theme=\"light\"] on <html>.\n   Default (no attribute) stays the dark Bordeaux design.                  */\n/* ---------------------------------------------------------------------- */\n\n[data-theme=\"light\"] {\n  --bg: #F0EBE1;\n  --bg-2: #E4DBCA;\n  --wine: #5C1A28;\n  --wine-dim: rgba(92, 26, 40, .18);\n  --sand: #D9CBB4;\n  --sand-dim: rgba(43, 37, 34, .22);\n  --sand-faint: rgba(43, 37, 34, .08);\n  --cream: #F0EBE1;\n  --muted: #5E5248;\n  /* darkened wine reads \u22654.5:1 on both cream surfaces \u2014 measured */\n  --accent-text: var(--wine);\n  --on-sand-strong: var(--cream);\n  --on-sand-dim: rgba(240, 235, 225, .72);\n\n  --header-bg: rgba(240, 235, 225, .86);\n  --subnav-bg: rgba(240, 235, 225, .94);\n  --frame-border: rgba(43, 37, 34, .22);\n  --input-bg: #EAE2D0;\n  --input-border: rgba(43, 37, 34, .22);\n\n  /* text colour that used to be \"cream on dark\" is now ink on cream */\n  color-scheme: light;\n}\n\nhtml[data-theme=\"light\"] body { color: #2B2522; }\nhtml:not([data-theme=\"light\"]) body { color: var(--cream); }\n\n[data-theme=\"light\"] .hero-mark-bg { opacity: .03; color: var(--wine); }\nhtml:not([data-theme=\"light\"]) .hero-mark-bg { opacity: .045; color: var(--sand); }\n\n@media (prefers-reduced-motion: no-preference) {\n  html.theme-transition,\n  html.theme-transition *,\n  html.theme-transition *::before,\n  html.theme-transition *::after {\n    transition: background-color 300ms ease, color 300ms ease, border-color 300ms ease, fill 300ms ease, stroke 300ms ease !important;\n  }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Reset                                                                    */\n/* ---------------------------------------------------------------------- */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  font-family: var(--font-body);\n  font-weight: 400;\n  font-size: 1rem;\n  line-height: 1.7;\n  overflow-x: hidden;\n  min-width: 320px;\n}\n\nhtml, body { max-width: 100%; overflow-x: hidden; }\n\nimg, svg { display: block; max-width: 100%; }\n\na { color: inherit; }\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: 600;\n  letter-spacing: .01em;\n  margin: 0;\n}\n\np { margin: 0; }\n\nul { list-style: none; margin: 0; padding: 0; }\n\nbutton { font-family: inherit; cursor: pointer; }\n\n/* ---------------------------------------------------------------------- */\n/* Focus visibility                                                         */\n/* ---------------------------------------------------------------------- */\n\na:focus-visible,\nbutton:focus-visible,\ninput:focus-visible,\nselect:focus-visible,\ntextarea:focus-visible,\n[tabindex]:focus-visible {\n  outline: 2px solid var(--sand);\n  outline-offset: 3px;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Layout helpers                                                           */\n/* ---------------------------------------------------------------------- */\n\n.container {\n  width: 100%;\n  max-width: var(--container);\n  margin: 0 auto;\n  padding-left: clamp(20px, 5vw, 56px);\n  padding-right: clamp(20px, 5vw, 56px);\n}\n\n.section {\n  position: relative;\n  padding: var(--section-pad) 0;\n}\n\n.section--panel { background: var(--bg-2); }\n\n.lacquer {\n  background-image: linear-gradient(180deg, rgba(255,255,255,.05) 0%, rgba(0,0,0,.05) 100%);\n}\n\n.section-head {\n  display: flex;\n  align-items: baseline;\n  justify-content: center;\n  gap: clamp(12px, 3vw, 26px);\n  margin-bottom: clamp(40px, 6vw, 72px);\n  text-align: center;\n}\n\n.section-numeral {\n  font-family: var(--font-ui);\n  color: var(--accent-text);\n  font-size: clamp(1rem, 2vw, 1.3rem);\n  letter-spacing: .3em;\n}\n\n.section-title {\n  font-size: clamp(1.8rem, 4vw, 3.2rem);\n  line-height: 1.15;\n}\n\n.label {\n  display: inline-block;\n  font-size: 11px;\n  letter-spacing: .25em;\n  text-transform: uppercase;\n  color: var(--accent-text);\n  font-family: var(--font-ui);\n}\n\n.label--dim { color: var(--muted); }\n\n.lede {\n  color: var(--muted);\n  max-width: 62ch;\n}\n\n.center { text-align: center; margin-left: auto; margin-right: auto; }\n\n/* ---------------------------------------------------------------------- */\n/* The Ledger Rule \u2014 signature motif                                        */\n/* ---------------------------------------------------------------------- */\n\n.ledger-rule {\n  position: relative;\n  height: 8px;\n  width: 100%;\n}\n\n.ledger-rule::before {\n  content: \"\";\n  position: absolute;\n  top: 0; left: 0; right: 0;\n  height: 2px;\n  background: var(--accent-text);\n}\n\n.ledger-rule::after {\n  content: \"\";\n  position: absolute;\n  top: 7px; left: 0; right: 0;\n  height: 1px;\n  background: var(--sand-dim);\n}\n\n.ledger-rule--tight { height: 7px; margin-bottom: clamp(36px, 5vw, 56px); }\n\n/* ---------------------------------------------------------------------- */\n/* The Panel \u2014 framed inset motif                                          */\n/* ---------------------------------------------------------------------- */\n\n.panel {\n  border: 1px solid var(--frame-border);\n  padding: 6px;\n}\n\n.panel-inner {\n  border: 1px solid var(--frame-border);\n  padding: clamp(28px, 5vw, 56px);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Buttons                                                                   */\n/* ---------------------------------------------------------------------- */\n\n.btn {\n  display: inline-block;\n  border-radius: 0;\n  padding: 16px 34px;\n  font-size: 12px;\n  font-family: var(--font-ui);\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  text-decoration: none;\n  text-align: center;\n  transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease;\n  white-space: nowrap;\n}\n\n.btn-primary {\n  border: 1px solid var(--sand);\n  color: var(--cream);\n  background: transparent;\n}\n\nhtml:not([data-theme=\"light\"]) .btn-primary:hover,\nhtml:not([data-theme=\"light\"]) .btn-primary:focus-visible {\n  background: var(--sand);\n  color: var(--bg);\n}\n\n[data-theme=\"light\"] .btn-primary { color: var(--wine); border-color: var(--wine); }\n[data-theme=\"light\"] .btn-primary:hover,\n[data-theme=\"light\"] .btn-primary:focus-visible {\n  background: var(--wine);\n  color: var(--cream);\n}\n\n/* Buttons inside the inverted sand/wine band must contrast with THAT band,\n   not the page default \u2014 --on-sand-strong already flips correctly per theme. */\n.band-invert .btn-primary { color: var(--on-sand-strong); border-color: var(--on-sand-strong); }\n.band-invert .btn-primary:hover,\n.band-invert .btn-primary:focus-visible {\n  background: var(--on-sand-strong);\n  color: var(--sand);\n}\n[data-theme=\"light\"] .band-invert .btn-primary:hover,\n[data-theme=\"light\"] .band-invert .btn-primary:focus-visible {\n  color: var(--wine);\n}\n\n.band-invert .section-numeral,\n.band-invert .label { color: var(--on-sand-strong); }\n\n.text-link {\n  color: var(--accent-text);\n  text-decoration: none;\n  font-size: .9rem;\n  letter-spacing: .08em;\n  text-transform: uppercase;\n  font-family: var(--font-ui);\n  border-bottom: 1px solid var(--sand-dim);\n  width: fit-content;\n  padding-bottom: 2px;\n}\n\n.text-link:hover, .text-link:focus-visible { border-color: var(--accent-text); }\n\n/* ---------------------------------------------------------------------- */\n/* Intro assembly animation                                                 */\n/* ---------------------------------------------------------------------- */\n\n.intro-overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 9000;\n  background: var(--bg);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  transition: opacity 500ms ease;\n}\n\n.intro-overlay[data-hidden=\"true\"] {\n  opacity: 0;\n  pointer-events: none;\n}\n\n.intro-mark {\n  width: clamp(72px, 14vw, 140px);\n  color: var(--sand);\n}\n\n.intro-mark .bz-b {\n  opacity: 0;\n  transition: transform 1200ms cubic-bezier(0,.68,.24,1), opacity 1200ms ease;\n}\n\n.intro-mark.bz-run .bz-b { opacity: 1; transform: translate(0, 0); }\n\n.intro-mark .bz-b1 { transform: translate(6%, -6%); }\n.intro-mark .bz-b2 { transform: translate(-6%, -6%); }\n.intro-mark .bz-b3 { transform: translate(6%, 6%); }\n.intro-mark .bz-b4 { transform: translate(-6%, 6%); }\n\n.intro-mark.bz-run .bz-b2 { transition-delay: 35ms; }\n.intro-mark.bz-run .bz-b3 { transition-delay: 65ms; }\n.intro-mark.bz-run .bz-b4 { transition-delay: 100ms; }\n\n/* ---------------------------------------------------------------------- */\n/* Wordmark (per assets/WORDMARK.md)                                        */\n/* ---------------------------------------------------------------------- */\n\n.brand { display: inline-flex; align-items: center; gap: .7em; text-decoration: none; color: inherit; flex-shrink: 0; }\n\n.byzaro-mark { width: auto; height: 32px; flex-shrink: 0; }\n\n.brand-text { display: flex; flex-direction: column; gap: .28em; min-width: 0; }\n\n.brand-word {\n  font-family: var(--font-ui);\n  font-weight: 500;\n  font-size: 16px;\n  line-height: .72;\n  letter-spacing: .445em;\n  text-indent: .445em;\n  margin-right: -.445em;\n  display: flex;\n  align-items: flex-start;\n  white-space: nowrap;\n}\n\n.brand-lam { width: .745em; height: .72em; margin-right: .036em; flex-shrink: 0; }\n\n.brand-sub {\n  font-family: var(--font-ui);\n  font-weight: 300;\n  font-size: 8.5px;\n  line-height: .72;\n  letter-spacing: 1.02em;\n  text-indent: 1.02em;\n  margin-right: -1.02em;\n  white-space: nowrap;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Top navigation                                                           */\n/* ---------------------------------------------------------------------- */\n\n.site-header {\n  position: fixed;\n  top: 0; left: 0; right: 0;\n  z-index: 500;\n  background: var(--header-bg);\n  backdrop-filter: blur(10px);\n  border-bottom: 1px solid var(--sand-faint);\n}\n\n.nav {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 16px;\n  padding-top: 16px;\n  padding-bottom: 16px;\n}\n\n.nav-links {\n  display: flex;\n  align-items: center;\n  gap: clamp(16px, 2.4vw, 30px);\n  font-size: 12px;\n  font-family: var(--font-ui);\n  letter-spacing: .14em;\n  text-transform: uppercase;\n}\n\n.nav-links a:not(.btn) {\n  text-decoration: none;\n  color: var(--muted);\n  padding: 4px 0;\n  border-bottom: 1px solid transparent;\n  transition: color 200ms ease, border-color 200ms ease;\n}\n\n.nav-links a:not(.btn):hover,\n.nav-links a:not(.btn):focus-visible,\n.nav-links a.is-active {\n  color: inherit;\n  border-bottom-color: var(--accent-text);\n}\n\n.nav-cta { padding: 11px 20px; font-size: 11px; }\n\n.lang-switch {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  font-size: 11px;\n  font-family: var(--font-ui);\n  letter-spacing: .12em;\n}\n\n.lang-switch .lang-current { color: var(--accent-text); }\n\n.lang-switch span[aria-disabled=\"true\"] { color: var(--muted); opacity: .62; cursor: default; }\n\n.lang-sep { color: var(--muted); opacity: .5; }\n\n/* ---------------------------------------------------------------------- */\n/* Theme toggle                                                             */\n/* ---------------------------------------------------------------------- */\n\n.theme-toggle {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  background: transparent;\n  border: none;\n  padding: 4px 0;\n  color: var(--accent-text);\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  transition: color 200ms ease;\n}\n\n.theme-toggle-glyph { font-size: 13px; line-height: 1; }\n\n.theme-toggle:hover, .theme-toggle:focus-visible { color: var(--sand); }\n[data-theme=\"light\"] .theme-toggle:hover,\n[data-theme=\"light\"] .theme-toggle:focus-visible { color: var(--wine); opacity: .75; }\n\n.mobile-menu .theme-toggle { margin-top: 4px; font-size: 13px; justify-content: center; }\n\n.nav-toggle {\n  display: none;\n  background: transparent;\n  border: 1px solid var(--sand-faint);\n  width: 42px;\n  height: 42px;\n  align-items: center;\n  justify-content: center;\n  flex-shrink: 0;\n}\n\n.nav-toggle-bars { position: relative; width: 18px; height: 12px; }\n\n.nav-toggle-bars span {\n  position: absolute; left: 0; right: 0; height: 1px;\n  background: currentColor;\n  transition: transform 200ms ease, opacity 200ms ease, top 200ms ease;\n}\n\n.nav-toggle-bars span:nth-child(1) { top: 0; }\n.nav-toggle-bars span:nth-child(2) { top: 5px; }\n.nav-toggle-bars span:nth-child(3) { top: 11px; }\n\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(1) { top: 5px; transform: rotate(45deg); }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(2) { opacity: 0; }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(3) { top: 5px; transform: rotate(-45deg); }\n\n.mobile-menu {\n  position: fixed;\n  inset: 0;\n  z-index: 600;\n  background: var(--bg);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: clamp(18px, 4vh, 32px);\n  transform: translateY(-100%);\n  opacity: 0;\n  transition: transform 320ms ease, opacity 320ms ease;\n  visibility: hidden;\n  overflow-y: auto;\n  padding: 90px 20px 40px;\n}\n\n.mobile-menu.is-open { transform: translateY(0); opacity: 1; visibility: visible; }\n\n.mobile-menu .brand { margin-bottom: clamp(8px, 3vh, 20px); }\n.mobile-menu .byzaro-mark { height: 40px; }\n.mobile-menu .brand-word { font-size: 20px; }\n.mobile-menu .brand-sub { font-size: 10.5px; }\n\n.mobile-menu a:not(.brand) {\n  font-family: var(--font-display);\n  font-size: clamp(1.5rem, 7vw, 2.3rem);\n  text-decoration: none;\n  color: inherit;\n  letter-spacing: .01em;\n}\n\n.mobile-menu a.is-active { color: var(--accent-text); }\n\n.mobile-menu .lang-switch { margin-top: 8px; font-size: 13px; }\n\n.mobile-menu-close {\n  position: absolute;\n  top: 16px;\n  right: clamp(20px, 5vw, 56px);\n  background: transparent;\n  border: 1px solid var(--sand-faint);\n  width: 42px;\n  height: 42px;\n  color: inherit;\n  font-size: 18px;\n  line-height: 1;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Hero                                                                      */\n/* ---------------------------------------------------------------------- */\n\n.hero {\n  position: relative;\n  min-height: 100svh;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  overflow: hidden;\n  padding: 140px 0 0;\n  background-color: var(--bg);\n}\n\n.hero-mark-bg {\n  position: absolute;\n  top: 50%; left: 50%;\n  width: 140vh;\n  max-width: none;\n  height: 140vh;\n  transform: translate(-50%, -50%);\n  pointer-events: none;\n}\n\n.hero-inner {\n  position: relative;\n  z-index: 2;\n  max-width: 900px;\n  margin: 0 auto;\n  padding: 0 clamp(20px, 5vw, 56px) 64px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: clamp(20px, 3vw, 28px);\n}\n\n.hero-label {\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .25em;\n  text-transform: uppercase;\n  color: var(--accent-text);\n  max-width: 46ch;\n}\n\n.hero-headline {\n  font-size: clamp(2.6rem, 7vw, 6.4rem);\n  line-height: 1.06;\n}\n\n.hero-headline span { display: block; }\n.hero-headline em { font-style: italic; font-weight: 500; }\n\n.hero-support {\n  color: var(--muted);\n  max-width: 56ch;\n  font-size: clamp(.95rem, 1.4vw, 1.1rem);\n}\n\n.hero-actions {\n  margin-top: 8px;\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  justify-content: center;\n  gap: clamp(18px, 3vw, 30px);\n}\n\n.hero-close-rule { position: relative; z-index: 2; width: 100%; max-width: 640px; margin: 0 auto; }\n\n/* ---------------------------------------------------------------------- */\n/* The Group / Closing \u2014 inverted band (sand in dark, wine in light)        */\n/* ---------------------------------------------------------------------- */\n\n.band-invert {\n  background: var(--sand);\n  color: var(--on-sand-strong);\n}\n\n[data-theme=\"light\"] .band-invert { background: var(--wine); }\n\n.triad {\n  display: flex;\n  flex-direction: column;\n  border-top: 1px solid var(--wine-dim);\n  border-bottom: 1px solid var(--wine-dim);\n}\n\n[data-theme=\"light\"] .triad { border-color: rgba(240,235,225,.35); }\n\n.triad-word {\n  font-family: var(--font-display);\n  text-align: center;\n  padding: clamp(20px, 4vw, 36px) 0;\n  font-size: clamp(1.6rem, 5vw, 3.2rem);\n  border-top: 1px solid var(--wine-dim);\n}\n\n[data-theme=\"light\"] .triad-word { border-color: rgba(240,235,225,.35); }\n\n.triad-word:first-child { border-top: none; }\n\n@media (min-width: 780px) {\n  .triad { flex-direction: row; border-top: none; border-bottom: none; }\n  .triad-word { flex: 1; border-top: none; border-left: 1px solid var(--wine-dim); }\n  [data-theme=\"light\"] .triad-word { border-color: rgba(240,235,225,.35); }\n  .triad-word:first-child { border-left: none; }\n}\n\n.group-copy {\n  margin-top: clamp(40px, 6vw, 64px);\n  text-align: center;\n  display: flex;\n  flex-direction: column;\n  gap: 20px;\n  align-items: center;\n}\n\n.group-copy .lede { font-size: clamp(1rem, 1.6vw, 1.2rem); color: var(--on-sand-strong); }\n.group-copy .audience { color: var(--on-sand-dim); max-width: 52ch; font-size: .95rem; }\n\n/* ---------------------------------------------------------------------- */\n/* The House Ledger \u2014 capability rows (home page)                           */\n/* ---------------------------------------------------------------------- */\n\n.ledger-rows { }\n\n.ledger-row-wrap { border-bottom: 1px solid var(--sand-faint); }\n\n.ledger-row {\n  width: 100%;\n  display: flex;\n  align-items: center;\n  gap: clamp(14px, 3vw, 32px);\n  background: transparent;\n  border: none;\n  text-decoration: none;\n  color: inherit;\n  text-align: left;\n  padding: clamp(20px, 3.4vw, 34px) clamp(8px, 2vw, 20px);\n  transition: background-color 200ms ease;\n}\n\n.ledger-row:hover, .ledger-row:focus-visible { background: var(--bg-2); }\n\n.ledger-num {\n  font-family: var(--font-ui);\n  color: var(--muted);\n  font-size: clamp(.95rem, 1.4vw, 1.15rem);\n  letter-spacing: .1em;\n  width: 2.6em;\n  flex-shrink: 0;\n  transition: color 200ms ease;\n}\n\n.ledger-row:hover .ledger-num, .ledger-row:focus-visible .ledger-num { color: var(--cream); }\n[data-theme=\"light\"] .ledger-row:hover .ledger-num,\n[data-theme=\"light\"] .ledger-row:focus-visible .ledger-num { color: #2B2522; }\n\n.ledger-name {\n  font-family: var(--font-display);\n  font-size: clamp(1.2rem, 2.6vw, 1.9rem);\n  letter-spacing: .01em;\n  flex-shrink: 0;\n}\n\n.ledger-descriptor {\n  margin-left: 16px;\n  color: var(--muted);\n  font-size: .9rem;\n  display: none;\n}\n\n@media (min-width: 720px) { .ledger-descriptor { display: block; } }\n\n.ledger-explore {\n  margin-left: auto;\n  flex-shrink: 0;\n  color: var(--accent-text);\n  font-family: var(--font-ui);\n  font-size: .82rem;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n}\n\n/* ---------------------------------------------------------------------- */\n/* The Roll \u2014 SVG membership plate                                          */\n/* ---------------------------------------------------------------------- */\n\n.roll-wrap {\n  margin-top: clamp(48px, 7vw, 88px);\n  display: flex;\n  justify-content: center;\n}\n\n.roll-diagram { width: min(100%, 720px); height: auto; }\n\n.roll-diagram .rl-outer-dashed { fill: none; stroke: var(--sand-dim); stroke-width: 1; stroke-dasharray: 3 5; }\n.roll-diagram .rl-line { stroke: var(--sand-dim); stroke-width: 1; }\n.roll-diagram .rl-node { fill: var(--sand); }\n.roll-diagram .rl-node-partner { fill: none; stroke: var(--sand-dim); stroke-width: 1; }\n.roll-diagram .rl-center-ring { fill: none; stroke: var(--sand-dim); stroke-width: 1; }\n.roll-diagram .rl-center-mark { color: var(--cream); }\n.roll-diagram .rl-label {\n  font-family: var(--font-ui);\n  font-size: 9px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  fill: var(--muted);\n}\n.roll-diagram .rl-label--strong { fill: var(--cream); font-weight: 500; }\n.roll-diagram .rl-frame { fill: none; stroke: var(--frame-border); stroke-width: 1; }\n\n.roll-caption {\n  margin-top: clamp(28px, 4vw, 44px);\n  max-width: 60ch;\n  text-align: center;\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: clamp(1.05rem, 1.8vw, 1.35rem);\n  color: var(--accent-text);\n}\n\n.roll-list-fallback {\n  display: none;\n  flex-direction: column;\n  gap: 20px;\n  align-items: center;\n  text-align: center;\n}\n\n.roll-list-fallback ul {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 8px 16px;\n  font-size: .88rem;\n  letter-spacing: .08em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.roll-list-fallback li::after { content: \"\u00b7\"; margin-left: 14px; color: var(--sand); }\n.roll-list-fallback li:last-child::after { content: \"\"; }\n\n@media (max-width: 640px) {\n  .roll-diagram { display: none; }\n  .roll-list-fallback { display: flex; }\n}\n\n/* ---------------------------------------------------------------------- */\n/* International reach \u2014 ledger rows                                        */\n/* ---------------------------------------------------------------------- */\n\n.reach-rows { border-top: 1px solid var(--sand-faint); max-width: 640px; margin: 0 auto; }\n\n.reach-row {\n  display: flex;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 20px;\n  padding: 16px 4px;\n  border-bottom: 1px solid var(--sand-faint);\n  font-size: clamp(.95rem, 1.6vw, 1.1rem);\n  letter-spacing: .04em;\n}\n\n.reach-row .reach-name { font-family: var(--font-ui); }\n.reach-row .reach-tag { font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-text); flex-shrink: 0; }\n\n.reach-cities {\n  margin-top: clamp(28px, 4vw, 44px);\n  text-align: center;\n  font-size: 12px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.reach-ambition { margin-top: 16px; color: var(--muted); text-align: center; }\n\n/* ---------------------------------------------------------------------- */\n/* Special situations                                                       */\n/* ---------------------------------------------------------------------- */\n\n.special-panel { max-width: 900px; margin: 0 auto; text-align: center; }\n\n.special-headline {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-weight: 500;\n  font-size: clamp(1.7rem, 4.4vw, 3rem);\n  line-height: 1.25;\n}\n\n.special-body { color: var(--muted); max-width: 56ch; margin: 20px auto 0; }\n\n.special-list {\n  margin-top: clamp(32px, 5vw, 48px);\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 10px 26px;\n  font-family: var(--font-ui);\n  font-size: .82rem;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  color: var(--accent-text);\n}\n\n.special-list li { display: flex; align-items: center; gap: 26px; }\n.special-list li::after { content: \"\u00b7\"; color: var(--sand-dim); }\n.special-list li:last-child::after { content: \"\"; }\n\n.special-cta { margin-top: clamp(36px, 5vw, 52px); }\n\n/* ---------------------------------------------------------------------- */\n/* Closing CTA                                                              */\n/* ---------------------------------------------------------------------- */\n\n.closing {\n  text-align: center;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: clamp(28px, 4vw, 44px);\n}\n\n.closing-headline {\n  font-size: clamp(2.2rem, 7vw, 5.2rem);\n  line-height: 1.1;\n  max-width: 15ch;\n}\n\n\n/* ---------------------------------------------------------------------- */\n/* Footer                                                                    */\n/* ---------------------------------------------------------------------- */\n\n.site-footer { padding: clamp(56px, 8vw, 96px) 0 clamp(28px, 4vw, 40px); }\n\n.footer-ledger { margin-bottom: clamp(40px, 6vw, 64px); }\n\n.footer-top {\n  display: flex;\n  flex-wrap: wrap;\n  gap: clamp(28px, 5vw, 60px);\n  justify-content: space-between;\n  padding-bottom: clamp(32px, 5vw, 56px);\n}\n\n.footer-brand { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }\n\n.footer-brand .byzaro-mark { height: 26px; }\n.footer-brand .brand-word { font-size: 14px; }\n.footer-brand .brand-sub { font-size: 7.5px; }\n\n.footer-brand-tagline { font-family: var(--font-ui); font-size: 10px; letter-spacing: .1em; color: var(--muted); }\n\n.footer-nav {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 10px 28px;\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n}\n\n.footer-nav a { text-decoration: none; color: var(--muted); }\n.footer-nav a:hover, .footer-nav a:focus-visible { color: var(--accent-text); }\n\n.footer-bottom {\n  border-top: 1px solid var(--sand-faint);\n  padding-top: clamp(24px, 4vw, 36px);\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n\n.footer-legal-row {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 16px;\n  justify-content: space-between;\n  align-items: center;\n  font-family: var(--font-ui);\n  font-size: 12px;\n  color: var(--muted);\n}\n\n.footer-compliance {\n  font-family: var(--font-ui);\n  font-size: 11.5px;\n  color: var(--muted);\n  max-width: 90ch;\n  line-height: 1.6;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Reveal on scroll                                                         */\n/* ---------------------------------------------------------------------- */\n\n.reveal { opacity: 0; transform: translateY(24px); transition: opacity 700ms ease, transform 700ms ease; }\n.reveal.is-visible { opacity: 1; transform: translateY(0); }\n\n/* ---------------------------------------------------------------------- */\n/* Sticky sub-nav (capabilities.html)                                       */\n/* ---------------------------------------------------------------------- */\n\n.subnav {\n  position: sticky;\n  top: 66px;\n  z-index: 100;\n  background: var(--subnav-bg);\n  backdrop-filter: blur(8px);\n  border-bottom: 1px solid var(--sand-faint);\n}\n\n.subnav-inner {\n  display: flex;\n  gap: clamp(16px, 3vw, 36px);\n  overflow-x: auto;\n  max-width: 100%;\n  padding: 14px clamp(20px, 5vw, 56px);\n  scrollbar-width: thin;\n}\n\n.subnav-inner::-webkit-scrollbar { height: 4px; }\n.subnav-inner::-webkit-scrollbar-thumb { background: var(--sand-dim); }\n\n.subnav a {\n  flex-shrink: 0;\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  text-decoration: none;\n  color: var(--muted);\n  padding-bottom: 4px;\n  border-bottom: 1px solid transparent;\n  white-space: nowrap;\n}\n\n.subnav a:hover, .subnav a:focus-visible, .subnav a.is-active { color: var(--accent-text); border-bottom-color: var(--accent-text); }\n\n/* ---------------------------------------------------------------------- */\n/* Division chapters (capabilities.html)                                    */\n/* ---------------------------------------------------------------------- */\n\n.division { scroll-margin-top: 130px; }\n\n.division-head { text-align: center; max-width: 720px; margin: 0 auto clamp(40px, 6vw, 72px); }\n\n.division-eyebrow { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 20px; }\n\n.division-name { font-size: clamp(2.2rem, 6vw, 4.2rem); line-height: 1.05; }\n\n.division-line { margin-top: 18px; color: var(--muted); font-size: clamp(1rem, 1.6vw, 1.2rem); font-family: var(--font-ui); font-weight: 300; }\n\n[data-theme=\"light\"] .division.band-invert .division-line,\n.division.band-invert .division-line { color: var(--on-sand-dim); }\n\n.division-body {\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: clamp(32px, 5vw, 64px);\n  max-width: 1100px;\n  margin: 0 auto;\n}\n\n@media (min-width: 860px) { .division-body { gr ;\n}\n\n.category-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));\n  gap: 10px;\n  margin-bottom: clamp(36px, 5vw, 56px);\n}\n\n.category-grid input[type=\"radio\"] { position: absolute; opacity: 0; width: 1px; height: 1px; }\n\n.category-grid label {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  padding: 18px 14px;\n  border: 1px solid var(--sand-faint);\n  background: var(--bg-2);\n  font-family: var(--font-ui);\n  font-size: .82rem;\n  letter-spacing: .05em;\n  text-transform: uppercase;\n  color: var(--muted);\n  transition: border-color 200ms ease, color 200ms ease, background-color 200ms ease;\n  min-height: 64px;\n}\n\n.category-grid input[type=\"radio\"]:checked + label {\n  border-color: var(--sand);\n  background: var(--sand);\n  color: var(--bg);\n}\n\n[data-theme=\"light\"] .category-grid input[type=\"radio\"]:checked + label {\n  background: var(--wine);\n  border-color: var(--wine);\n  color: var(--cream);\n}\n\n.category-grid input[type=\"radio\"]:focus-visible + label { outline: 2px solid var(--sand); outline-offset: 2px; }\n\n.mandate-form { display: grid; grid-template-columns: 1fr; gap: 22px; }\n\n@media (min-width: 680px) {\n  .mandate-form { grid-template-columns: 1fr 1fr; }\n  .field--full { grid-column: 1 / -1; }\n}\n\n.field { display: flex; flex-direction: column; gap: 8px; }\n\n.field label {\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.field input, .field select, .field textarea {\n  background: var(--input-bg);\n  border: 1px solid var(--input-border);\n  color: inherit;\n  padding: 13px 14px;\n  font-family: var(--font-ui);\n  font-size: .95rem;\n  border-radius: 0;\n}\n\n.field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible {\n  outline: none;\n  border-color: var(--sand);\n}\n[data-theme=\"light\"] .field input:focus-visi EventListener('click', closeMenu); }\n  if (menu) {\n    menu.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', closeMenu); });\n  }\n\n  var themeToggles = document.querySelectorAll('.theme-toggle');\n  var themeLabels = { light: 'DARK', dark: 'LIGHT' };\n  function currentTheme() {\n    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';\n  }\n  function updateThemeToggles() {\n    var theme = currentTheme();\n    themeToggles.forEach(function (btn) {\n      btn.setAttribute('aria-pressed', String(theme === 'dark'));\n      var label = btn.querySelector('.theme-toggle-label');\n      if (label) { label.textContent = themeLabels[theme]; }\n    });\n  }\n  function setTheme(theme) {\n    document.documentElement.classList.add('theme-transition');\n    window.setTimeout(function () {\n      document.documentElement.classList.remove('theme-transition');\n    }, 320);\n    if (theme === 'light') {\n      document.documentElement.setAttribute('data-theme', 'light');\n    } else {\n      document.documentElement.removeAttribute('data-theme');\n    }\n    try { localStorage.setItem('bz-theme-05', theme); } catch (e) {}\n    updateThemeToggles();\n  }\n  updateThemeToggles();\n  themeToggles.forEach(function (btn) {\n    btn.addEventListener('click', function () {\n      setTheme(currentTheme() === 'light' ? 'dark' : 'light');\n    });\n  });\n\n  var reveals = document.querySelectorAll('.reveal');\n  if ('IntersectionObserver' in window) {\n    var io = new IntersectionObserver(function (entries) {\n      entries.forEach(function (entry) {\n        if (entry.isIntersecting) {\n          entry.target.classList.add('is-visible');\n          io.unobserve(entry.target);\n        }\n      });\n    }, { threshold: .15 });\n    reveals.forEach(function (el) { io.observe(el); });\n  } else {\n    reveals.forEach(function (el) { el.classList.add('is-visible'); });\n  }\n})();\n<\/script>\n\n<script>(function(){\n  docum  --bg-2: #3A181F;\n  --wine: #5C1A28;\n  --wine-dim: rgba(92, 26, 40, .55);\n  --sand: #D9CBB4;\n  --sand-dim: rgba(217, 203, 180, .35);\n  --sand-faint: rgba(217, 203, 180, .12);\n  --cream: #F0EBE1;\n  --muted: #B9A894;\n  /* accent-text: the accent colour for SMALL text (labels, numerals, rules,\n     active states) \u2014 must read \u22654.5:1 on its backdrop. */\n  --accent-text: var(--sand);\n  /* text placed directly on a sand surface (the inverted \"Group\"/\"Closing\"\n     band) cannot use --muted (fails contrast on sand) \u2014 use wine instead. */\n  --on-sand-strong: var(--wine);\n  --on-sand-dim: #7A3040;\n\n  --header-bg: rgba(43, 18, 24, .86);\n  --subnav-bg: rgba(43, 18, 24, .94);\n  --frame-border: var(--sand-dim);\n  --input-bg: var(--bg-2);\n  --input-border: rgba(217, 203, 180, .3);\n\n  --font-display: \"Playfair Display\", \"Times New Roman\", serif;\n  --font-ui: \"Jost\", system-ui, sans-serif;\n  --font-body: \"Jost\", system-ui, sans-serif;\n\n  --container: 1320px;\n  --section-pad: clamp(96px, 12vh, 180px);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Light theme \u2014 opt-in via [data-theme=\"light\"] on <html>.\n   Default (no attribute) stays the dark Bordeaux design.                  */\n/* ---------------------------------------------------------------------- */\n\n[data-theme=\"light\"] {\n  --bg: #F0EBE1;\n  --bg-2: #E4DBCA;\n  --wine: #5C1A28;\n  --wine-dim: rgba(92, 26, 40, .18);\n  --sand: #D9CBB4;\n  --sand-dim: rgba(43, 37, 34, .22);\n  --sand-faint: rgba(43, 37, 34, .08);\n  --cream: #F0EBE1;\n  --muted: #5E5248;\n  /* darkened wine reads \u22654.5:1 on both cream surfaces \u2014 measured */\n  --accent-text: var(--wine);\n  --on-sand-strong: var(--cream);\n  --on-sand-dim: rgba(240, 235, 225, .72);\n\n  --header-bg: rgba(240, 235, 225, .86);\n  --subnav-bg: rgba(240, 235, 225, .94);\n  --frame-border: rgba(43, 37, 34, .22);\n  --input-bg: #EAE2D0;\n  --input-border: rgba(43, 37, 34, .22);\n\n  /* text colour that used to be \"cream on dark\" is now ink on cream */\n  color-scheme: light;\n}\n\nhtml[data-theme=\"light\"] body { color: #2B2522; }\nhtml:not([data-theme=\"light\"]) body { color: var(--cream); }\n\n[data-theme=\"light\"] .hero-mark-bg { opacity: .03; color: var(--wine); }\nhtml:not([data-theme=\"light\"]) .hero-mark-bg { opacity: .045; color: var(--sand); }\n\n@media (prefers-reduced-motion: no-preference) {\n  html.theme-transition,\n  html.theme-transition *,\n  html.theme-transition *::before,\n  html.theme-transition *::after {\n    transition: background-color 300ms ease, color 300ms ease, border-color 300ms ease, fill 300ms ease, stroke 300ms ease !important;\n  }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Reset                                                                    */\n/* ---------------------------------------------------------------------- */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  font-family: var(--font-body);\n  font-weight: 400;\n  font-size: 1rem;\n  line-height: 1.7;\n  overflow-x: hidden;\n  min-width: 320px;\n}\n\nhtml, body { max-width: 100%; overflow-x: hidden; }\n\nimg, svg { display: block; max-width: 100%; }\n\na { color: inherit; }\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: 600;\n  letter-spacing: .01em;\n  margin: 0;\n}\n\np { margin: 0; }\n\nul { list-style: none; margin: 0; padding: 0; }\n\nbutton { font-family: inherit; cursor: pointer; }\n\n/* ---------------------------------------------------------------------- */\n/* Focus visibility                                                         */\n/* ---------------------------------------------------------------------- */\n\na:focus-visible,\nbutton:focus-visible,\ninput:focus-visible,\nselect:focus-visible,\ntextarea:focus-visible,\n[tabindex]:focus-visible {\n  outline: 2px solid var(--sand);\n  outline-offset: 3px;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Layout helpers                                                           */\n/* ---------------------------------------------------------------------- */\n\n.container {\n  width: 100%;\n  max-width: var(--container);\n  margin: 0 auto;\n  padding-left: clamp(20px, 5vw, 56px);\n  padding-right: clamp(20px, 5vw, 56px);\n}\n\n.section {\n  position: relative;\n  padding: var(--section-pad) 0;\n}\n\n.section--panel { background: var(--bg-2); }\n\n.lacquer {\n  background-image: linear-gradient(180deg, rgba(255,255,255,.05) 0%, rgba(0,0,0,.05) 100%);\n}\n\n.section-head {\n  display: flex;\n  align-items: baseline;\n  justify-content: center;\n  gap: clamp(12px, 3vw, 26px);\n  margin-bottom: clamp(40px, 6vw, 72px);\n  text-align: center;\n}\n\n.section-numeral {\n  font-family: var(--font-ui);\n  color: var(--accent-text);\n  font-size: clamp(1rem, 2vw, 1.3rem);\n  letter-spacing: .3em;\n}\n\n.section-title {\n  font-size: clamp(1.8rem, 4vw, 3.2rem);\n  line-height: 1.15;\n}\n\n.label {\n  display: inline-block;\n  font-size: 11px;\n  letter-spacing: .25em;\n  text-transform: uppercase;\n  color: var(--accent-text);\n  font-family: var(--font-ui);\n}\n\n.label--dim { color: var(--muted); }\n\n.lede {\n  color: var(--muted);\n  max-width: 62ch;\n}\n\n.center { text-align: center; margin-left: auto; margin-right: auto; }\n\n/* ---------------------------------------------------------------------- */\n/* The Ledger Rule \u2014 signature motif                                        */\n/* ---------------------------------------------------------------------- */\n\n.ledger-rule {\n  position: relative;\n  height: 8px;\n  width: 100%;\n}\n\n.ledger-rule::before {\n  content: \"\";\n  position: absolute;\n  top: 0; left: 0; right: 0;\n  height: 2px;\n  background: var(--accent-text);\n}\n\n.ledger-rule::after {\n  content: \"\";\n  position: absolute;\n  top: 7px; left: 0; right: 0;\n  height: 1px;\n  background: var(--sand-dim);\n}\n\n.ledger-rule--tight { height: 7px; margin-bottom: clamp(36px, 5vw, 56px); }\n\n/* ---------------------------------------------------------------------- */\n/* The Panel \u2014 framed inset motif                                          */\n/* ---------------------------------------------------------------------- */\n\n.panel {\n  border: 1px solid var(--frame-border);\n  padding: 6px;\n}\n\n.panel-inner {\n  border: 1px solid var(--frame-border);\n  padding: clamp(28px, 5vw, 56px);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Buttons                                                                   */\n/* ---------------------------------------------------------------------- */\n\n.btn {\n  display: inline-block;\n  border-radius: 0;\n  padding: 16px 34px;\n  font-size: 12px;\n  font-family: var(--font-ui);\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  text-decoration: none;\n  text-align: center;\n  transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease;\n  white-space: nowrap;\n}\n\n.btn-primary {\n  border: 1px solid var(--sand);\n  color: var(--cream);\n  background: transparent;\n}\n\nhtml:not([data-theme=\"light\"]) .btn-primary:hover,\nhtml:not([data-theme=\"light\"]) .btn-primary:focus-visible {\n  background: var(--sand);\n  color: var(--bg);\n}\n\n[data-theme=\"light\"] .btn-primary { color: var(--wine); border-color: var(--wine); }\n[data-theme=\"light\"] .btn-primary:hover,\n[data-theme=\"light\"] .btn-primary:focus-visible {\n  background: var(--wine);\n  color: var(--cream);\n}\n\n/* Buttons inside the inverted sand/wine band must contrast with THAT band,\n   not the page default \u2014 --on-sand-strong already flips correctly per theme. */\n.band-invert .btn-primary { color: var(--on-sand-strong); border-color: var(--on-sand-strong); }\n.band-invert .btn-primary:hover,\n.band-invert .btn-primary:focus-visible {\n  background: var(--on-sand-strong);\n  color: var(--sand);\n}\n[data-theme=\"light\"] .band-invert .btn-primary:hover,\n[data-theme=\"light\"] .band-invert .btn-primary:focus-visible {\n  color: var(--wine);\n}\n\n.band-invert .section-numeral,\n.band-invert .label { color: var(--on-sand-strong); }\n\n.text-link {\n  color: var(--accent-text);\n  text-decoration: none;\n  font-size: .9rem;\n  letter-spacing: .08em;\n  text-transform: uppercase;\n  font-family: var(--font-ui);\n  border-bottom: 1px solid var(--sand-dim);\n  width: fit-content;\n  padding-bottom: 2px;\n}\n\n.text-link:hover, .text-link:focus-visible { border-color: var(--accent-text); }\n\n/* ---------------------------------------------------------------------- */\n/* Intro assembly animation                                                 */\n/* ---------------------------------------------------------------------- */\n\n.intro-overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 9000;\n  background: var(--bg);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  transition: opacity 500ms ease;\n}\n\n.intro-overlay[data-hidden=\"true\"] {\n  opacity: 0;\n  pointer-events: none;\n}\n\n.intro-mark {\n  width: clamp(72px, 14vw, 140px);\n  color: var(--sand);\n}\n\n.intro-mark .bz-b {\n  opacity: 0;\n  transition: transform 1200ms cubic-bezier(0,.68,.24,1), opacity 1200ms ease;\n}\n\n.intro-mark.bz-run .bz-b { opacity: 1; transform: translate(0, 0); }\n\n.intro-mark .bz-b1 { transform: translate(6%, -6%); }\n.intro-mark .bz-b2 { transform: translate(-6%, -6%); }\n.intro-mark .bz-b3 { transform: translate(6%, 6%); }\n.intro-mark .bz-b4 { transform: translate(-6%, 6%); }\n\n.intro-mark.bz-run .bz-b2 { transition-delay: 35ms; }\n.intro-mark.bz-run .bz-b3 { transition-delay: 65ms; }\n.intro-mark.bz-run .bz-b4 { transition-delay: 100ms; }\n\n/* ---------------------------------------------------------------------- */\n/* Wordmark (per assets/WORDMARK.md)                                        */\n/* ---------------------------------------------------------------------- */\n\n.brand { display: inline-flex; align-items: center; gap: .7em; text-decoration: none; color: inherit; flex-shrink: 0; }\n\n.byzaro-mark { width: auto; height: 32px; flex-shrink: 0; }\n\n.brand-text { display: flex; flex-direction: column; gap: .28em; min-width: 0; }\n\n.brand-word {\n  font-family: var(--font-ui);\n  font-weight: 500;\n  font-size: 16px;\n  line-height: .72;\n  letter-spacing: .445em;\n  text-indent: .445em;\n  margin-right: -.445em;\n  display: flex;\n  align-items: flex-start;\n  white-space: nowrap;\n}\n\n.brand-lam { width: .745em; height: .72em; margin-right: .036em; flex-shrink: 0; }\n\n.brand-sub {\n  font-family: var(--font-ui);\n  font-weight: 300;\n  font-size: 8.5px;\n  line-height: .72;\n  letter-spacing: 1.02em;\n  text-indent: 1.02em;\n  margin-right: -1.02em;\n  white-space: nowrap;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Top navigation                                                           */\n/* ---------------------------------------------------------------------- */\n\n.site-header {\n  position: fixed;\n  top: 0; left: 0; right: 0;\n  z-index: 500;\n  background: var(--header-bg);\n  backdrop-filter: blur(10px);\n  border-bottom: 1px solid var(--sand-faint);\n}\n\n.nav {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 16px;\n  padding-top: 16px;\n  padding-bottom: 16px;\n}\n\n.nav-links {\n  display: flex;\n  align-items: center;\n  gap: clamp(16px, 2.4vw, 30px);\n  font-size: 12px;\n  font-family: var(--font-ui);\n  letter-spacing: .14em;\n  text-transform: uppercase;\n}\n\n.nav-links a:not(.btn) {\n  text-decoration: none;\n  color: var(--muted);\n  padding: 4px 0;\n  border-bottom: 1px solid transparent;\n  transition: color 200ms ease, border-color 200ms ease;\n}\n\n.nav-links a:not(.btn):hover,\n.nav-links a:not(.btn):focus-visible,\n.nav-links a.is-active {\n  color: inherit;\n  border-bottom-color: var(--accent-text);\n}\n\n.nav-cta { padding: 11px 20px; font-size: 11px; }\n\n.lang-switch {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  font-size: 11px;\n  font-family: var(--font-ui);\n  letter-spacing: .12em;\n}\n\n.lang-switch .lang-current { color: var(--accent-text); }\n\n.lang-switch span[aria-disabled=\"true\"] { color: var(--muted); opacity: .62; cursor: default; }\n\n.lang-sep { color: var(--muted); opacity: .5; }\n\n/* ---------------------------------------------------------------------- */\n/* Theme toggle                                                             */\n/* ---------------------------------------------------------------------- */\n\n.theme-toggle {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  background: transparent;\n  border: none;\n  padding: 4px 0;\n  color: var(--accent-text);\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  transition: color 200ms ease;\n}\n\n.theme-toggle-glyph { font-size: 13px; line-height: 1; }\n\n.theme-toggle:hover, .theme-toggle:focus-visible { color: var(--sand); }\n[data-theme=\"light\"] .theme-toggle:hover,\n[data-theme=\"light\"] .theme-toggle:focus-visible { color: var(--wine); opacity: .75; }\n\n.mobile-menu .theme-toggle { margin-top: 4px; font-size: 13px; justify-content: center; }\n\n.nav-toggle {\n  display: none;\n  background: transparent;\n  border: 1px solid var(--sand-faint);\n  width: 42px;\n  height: 42px;\n  align-items: center;\n  justify-content: center;\n  flex-shrink: 0;\n}\n\n.nav-toggle-bars { position: relative; width: 18px; height: 12px; }\n\n.nav-toggle-bars span {\n  position: absolute; left: 0; right: 0; height: 1px;\n  background: currentColor;\n  transition: transform 200ms ease, opacity 200ms ease, top 200ms ease;\n}\n\n.nav-toggle-bars span:nth-child(1) { top: 0; }\n.nav-toggle-bars span:nth-child(2) { top: 5px; }\n.nav-toggle-bars span:nth-child(3) { top: 11px; }\n\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(1) { top: 5px; transform: rotate(45deg); }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(2) { opacity: 0; }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(3) { top: 5px; transform: rotate(-45deg); }\n\n.mobile-menu {\n  position: fixed;\n  inset: 0;\n  z-index: 600;\n  background: var(--bg);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: clamp(18px, 4vh, 32px);\n  transform: translateY(-100%);\n  opacity: 0;\n  transition: transform 320ms ease, opacity 320ms ease;\n  visibility: hidden;\n  overflow-y: auto;\n  padding: 90px 20px 40px;\n}\n\n.mobile-menu.is-open { transform: translateY(0); opacity: 1; visibility: visible; }\n\n.mobile-menu .brand { margin-bottom: clamp(8px, 3vh, 20px); }\n.mobile-menu .byzaro-mark { height: 40px; }\n.mobile-menu .brand-word { font-size: 20px; }\n.mobile-menu .brand-sub { font-size: 10.5px; }\n\n.mobile-menu a:not(.brand) {\n  font-family: var(--font-display);\n  font-size: clamp(1.5rem, 7vw, 2.3rem);\n  text-decoration: none;\n  color: inherit;\n  letter-spacing: .01em;\n}\n\n.mobile-menu a.is-active { color: var(--accent-text); }\n\n.mobile-menu .lang-switch { margin-top: 8px; font-size: 13px; }\n\n.mobile-menu-close {\n  position: absolute;\n  top: 16px;\n  right: clamp(20px, 5vw, 56px);\n  background: transparent;\n  border: 1px solid var(--sand-faint);\n  width: 42px;\n  height: 42px;\n  color: inherit;\n  font-size: 18px;\n  line-height: 1;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Hero                                                                      */\n/* ---------------------------------------------------------------------- */\n\n.hero {\n  position: relative;\n  min-height: 100svh;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  overflow: hidden;\n  padding: 140px 0 0;\n  background-color: var(--bg);\n}\n\n.hero-mark-bg {\n  position: absolute;\n  top: 50%; left: 50%;\n  width: 140vh;\n  max-width: none;\n  height: 140vh;\n  transform: translate(-50%, -50%);\n  pointer-events: none;\n}\n\n.hero-inner {\n  position: relative;\n  z-index: 2;\n  max-width: 900px;\n  margin: 0 auto;\n  padding: 0 clamp(20px, 5vw, 56px) 64px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: clamp(20px, 3vw, 28px);\n}\n\n.hero-label {\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .25em;\n  text-transform: uppercase;\n  color: var(--accent-text);\n  max-width: 46ch;\n}\n\n.hero-headline {\n  font-size: clamp(2.6rem, 7vw, 6.4rem);\n  line-height: 1.06;\n}\n\n.hero-headline span { display: block; }\n.hero-headline em { font-style: italic; font-weight: 500; }\n\n.hero-support {\n  color: var(--muted);\n  max-width: 56ch;\n  font-size: clamp(.95rem, 1.4vw, 1.1rem);\n}\n\n.hero-actions {\n  margin-top: 8px;\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  justify-content: center;\n  gap: clamp(18px, 3vw, 30px);\n}\n\n.hero-close-rule { position: relative; z-index: 2; width: 100%; max-width: 640px; margin: 0 auto; }\n\n/* ---------------------------------------------------------------------- */\n/* The Group / Closing \u2014 inverted band (sand in dark, wine in light)        */\n/* ---------------------------------------------------------------------- */\n\n.band-invert {\n  background: var(--sand);\n  color: var(--on-sand-strong);\n}\n\n[data-theme=\"light\"] .band-invert { background: var(--wine); }\n\n.triad {\n  display: flex;\n  flex-direction: column;\n  border-top: 1px solid var(--wine-dim);\n  border-bottom: 1px solid var(--wine-dim);\n}\n\n[data-theme=\"light\"] .triad { border-color: rgba(240,235,225,.35); }\n\n.triad-word {\n  font-family: var(--font-display);\n  text-align: center;\n  padding: clamp(20px, 4vw, 36px) 0;\n  font-size: clamp(1.6rem, 5vw, 3.2rem);\n  border-top: 1px solid var(--wine-dim);\n}\n\n[data-theme=\"light\"] .triad-word { border-color: rgba(240,235,225,.35); }\n\n.triad-word:first-child { border-top: none; }\n\n@media (min-width: 780px) {\n  .triad { flex-direction: row; border-top: none; border-bottom: none; }\n  .triad-word { flex: 1; border-top: none; border-left: 1px solid var(--wine-dim); }\n  [data-theme=\"light\"] .triad-word { border-color: rgba(240,235,225,.35); }\n  .triad-word:first-child { border-left: none; }\n}\n\n.group-copy {\n  margin-top: clamp(40px, 6vw, 64px);\n  text-align: center;\n  display: flex;\n  flex-direction: column;\n  gap: 20px;\n  align-items: center;\n}\n\n.group-copy .lede { font-size: clamp(1rem, 1.6vw, 1.2rem); color: var(--on-sand-strong); }\n.group-copy .audience { color: var(--on-sand-dim); max-width: 52ch; font-size: .95rem; }\n\n/* ---------------------------------------------------------------------- */\n/* The House Ledger \u2014 capability rows (home page)                           */\n/* ---------------------------------------------------------------------- */\n\n.ledger-rows { }\n\n.ledger-row-wrap { border-bottom: 1px solid var(--sand-faint); }\n\n.ledger-row {\n  width: 100%;\n  display: flex;\n  align-items: center;\n  gap: clamp(14px, 3vw, 32px);\n  background: transparent;\n  border: none;\n  text-decoration: none;\n  color: inherit;\n  text-align: left;\n  padding: clamp(20px, 3.4vw, 34px) clamp(8px, 2vw, 20px);\n  transition: background-color 200ms ease;\n}\n\n.ledger-row:hover, .ledger-row:focus-visible { background: var(--bg-2); }\n\n.ledger-num {\n  font-family: var(--font-ui);\n  color: var(--muted);\n  font-size: clamp(.95rem, 1.4vw, 1.15rem);\n  letter-spacing: .1em;\n  width: 2.6em;\n  flex-shrink: 0;\n  transition: color 200ms ease;\n}\n\n.ledger-row:hover .ledger-num, .ledger-row:focus-visible .ledger-num { color: var(--cream); }\n[data-theme=\"light\"] .ledger-row:hover .ledger-num,\n[data-theme=\"light\"] .ledger-row:focus-visible .ledger-num { color: #2B2522; }\n\n.ledger-name {\n  font-family: var(--font-display);\n  font-size: clamp(1.2rem, 2.6vw, 1.9rem);\n  letter-spacing: .01em;\n  flex-shrink: 0;\n}\n\n.ledger-descriptor {\n  margin-left: 16px;\n  color: var(--muted);\n  font-size: .9rem;\n  display: none;\n}\n\n@media (min-width: 720px) { .ledger-descriptor { display: block; } }\n\n.ledger-explore {\n  margin-left: auto;\n  flex-shrink: 0;\n  color: var(--accent-text);\n  font-family: var(--font-ui);\n  font-size: .82rem;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n}\n\n/* ---------------------------------------------------------------------- */\n/* The Roll \u2014 SVG membership plate                                          */\n/* ---------------------------------------------------------------------- */\n\n.roll-wrap {\n  margin-top: clamp(48px, 7vw, 88px);\n  display: flex;\n  justify-content: center;\n}\n\n.roll-diagram { width: min(100%, 720px); height: auto; }\n\n.roll-diagram .rl-outer-dashed { fill: none; stroke: var(--sand-dim); stroke-width: 1; stroke-dasharray: 3 5; }\n.roll-diagram .rl-line { stroke: var(--sand-dim); stroke-width: 1; }\n.roll-diagram .rl-node { fill: var(--sand); }\n.roll-diagram .rl-node-partner { fill: none; stroke: var(--sand-dim); stroke-width: 1; }\n.roll-diagram .rl-center-ring { fill: none; stroke: var(--sand-dim); stroke-width: 1; }\n.roll-diagram .rl-center-mark { color: var(--cream); }\n.roll-diagram .rl-label {\n  font-family: var(--font-ui);\n  font-size: 9px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  fill: var(--muted);\n}\n.roll-diagram .rl-label--strong { fill: var(--cream); font-weight: 500; }\n.roll-diagram .rl-frame { fill: none; stroke: var(--frame-border); stroke-width: 1; }\n\n.roll-caption {\n  margin-top: clamp(28px, 4vw, 44px);\n  max-width: 60ch;\n  text-align: center;\n  font-family: var(--font-display);\n  font-st -sep\">|</span>\n    <span aria-disabled=\"true\">SR</span>\n  </div>\n  <button class=\"theme-toggle\" type=\"button\" aria-pressed=\"false\" aria-label=\"Toggle color scheme\">\n    <span class=\"theme-toggle-glyph\" aria-hidden=\"true\">&#9680;</span>\n    <span class=\"theme-toggle-label\">LIGHT</span>\n  </button>\n</div>\n\n<nav class=\"subnav\" aria-label=\"Divisions\">\n  <div class=\"subnav-inner\">\n    <a href=\"#talent\" data-subnav=\"talent\">01 \u2014 Talent</a>\n    <a href=\"#digital\" data-subnav=\"digital\">02 \u2014 Digital</a>\n    <a href=\"#realestate\" data-subnav=\"realestate\">03 \u2014 Real Estate</a>\n    <a href=\"#capital\" data-subnav=\"capital\">04 \u2014 Capital</a>\n    <a href=\"#advisory\" data-subnav=\"advisory\">05 \u2014 Advisory</a>\n  </div>\n</nav>\n\n<main>\n\n  <section class=\"section lacquer\" style=\"padding-bottom: clamp(56px,7vh,100px); padding-top:clamp(150px,18vh,220px);\">\n    <div class=\"container\">\n      <div class=\"section-head reveal\" style=\"margin-bottom:0;\">\n        <span class=\"section-numeral\">\u2014</span>\n        <h1 class=\"section-title\" style=\"font-size:clamp(1.6rem,3.4vw,2.4rem);\">Five Capabilities. One Network.</h1>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"section division\" id=\"talent\">\n    <div class=\"container\">\n      <div class=\"division-head reveal\">\n        <div class=\"division-eyebrow\">\n          <span class=\"section-numeral\">01</span>\n          <span class=\"label\">I \u2014 Talent &amp; Workforce Solutions</span>\n        </div>\n        <h2 class=\"division-name\">Talent</h2>\n        <p class=\"division-line\">Connecting companies with the people they need \u2014 across borders.</p>\n      </div>\n      <div class=\"division-body reveal\">\n        <ul class=\"service-list\">\n          <li>International Recruitment</li>\n          <li>Executive Search</li>\n          <li>Temporary Staffing</li>\n          <li>Recruitment Outsourcing</li>\n          <li>Agency-to-Agency Recruiting</li>\n          <li>Cross-Border Workforce Projects</li>\n        </ul>\n        <aside class=\"division-aside\">\n          <div class=\"division-aside-inner\">\n            <p class=\"use-case\">\"A growing company needs specialized people in a new market \u2014 sourced, vetted and placed across borders.\"</p>\n            <p class=\"relation-line\">Talent solutions rarely stand alone \u2014 placements often connect to Advisory structuring or Digital systems as a company scales across borders.</p>\n          </div>\n        </aside>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"section section--panel division\" id=\"digital\">\n    <div class=\"container\">\n      <div class=\"division-head reveal\">\n        <div class=\"division-eyebrow\">\n          <span class=\"section-numeral\">02</span>\n          <span class=\"label\">II \u2014 Technology, AI &amp; Digital Growth</span>\n        </div>\n        <h2 class=\"division-name\">Digital</h2>\n        <p class=\"division-line\">Building the technology and digital systems behind modern businesses.</p>\n      </div>\n      <div class=\"division-body reveal\">\n        <ul class=\"service-list\">\n          <li>Corporate Websites &amp; Applications</li>\n          <li>Custom Software</li>\n          <li>AI Agents &amp; Automation</li>\n          <li>CRM &amp; ERP Systems</li>\n          <li>Digital Strategy</li>\n          <li>Performance Marketing</li>\n        </ul>\n        <aside class=\"division-aside\">\n          <div class=\"division-aside-inner\">\n            <p class=\"use-case\">\"An established business needs its digital infrastructure \u2014 software, automation and visibility \u2014 built to an international standard.\"</p>\n            <p class=\"relation-line\">Digital capability is built to work alongside the group's other disciplines \u2014 from Advisory structuring to Real Estate premises \u2014 as part of a single mandate.</p>\n          </div>\n        </aside>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"section division\" id=\"realestate\">\n    <div class=\"container\">\n      <div class=\"division-head reveal\">\n        <div class=\"division-eyebrow\">\n          <span class=\"section-numeral\">03</span>\n          <span class=\"label\">III \u2014 International Real Estate</span>\n        </div>\n        <h2 class=\"division-name\">Real Estate</h2>\n        <p class=\"division-line\">Connecting property, people and opportunity across markets.</p>\n      </div>\n      <div class=\"division-body reveal\">\n        <ul class=\"service-list\">\n          <li>International Brokerage</li>\n          <li>Buyer &amp; Seller Representation</li>\n          <li>Off-Market Opportunities</li>\n          <li>Investment Properties</li>\n          <li>Property Search &amp; Relocation</li>\n          <li>Real Estate Investment Advisory</li>\n        </ul>\n        <aside class=\"division-aside\">\n          <div class=\"division-aside-inner\">\n            <p class=\"use-case\">Active across the UAE, Switzerland, Serbia, Montenegro, Croatia, Germany and Italy \u2014 and internationally through trusted partners.</p>\n            <p class=\"relation-line\">Real estate mandates often connect to Advisory structuring, Capital introductions and Talent placements as part of a single cross-border move.</p>\n          </div>\n        </aside>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"section band-invert lacquer division\" id=\"capital\">\n    <div class=\"container\">\n      <div class=\"division-head reveal\">\n        <div class=\"division-eyebrow\">\n          <span class=\"section-numeral\">04</span>\n          <span class=\"label\" style=\"color:var(--on-sand-strong);\">IV \u2014 Private Markets &amp; Selected Opportunities</span>\n        </div>\n        <h2 class=\"division-name\">Capital</h2>\n        <p class=\"division-line\">Connecting qualified clients with selected private-market opportunities.</p>\n      </div>\n      <div class=\"division-body reveal\">\n        <ul class=\"service-list\" style=\"color:var(--on-sand-strong);\">\n          <li>Selected Investment Opportunities</li>\n          <li>Investor Introductions</li>\n          <li>Capital Advisory</li>\n          <li>Project Introductions</li>\n          <li>Strategic Capital Connections</li>\n        </ul>\n        <aside class=\"division-aside\" style=\"border-color: var(--on-sand-strong);\">\n          <div class=\"division-aside-inner\" style=\"border-color: var(--on-sand-strong); color:var(--on-sand-strong);\">\n            <p class=\"relation-line\">Capital introductions are coordinated alongside Advisory structuring and Real Estate opportunities, assembled around each mandate.</p>\n            <p class=\"division-compliance\">Selected opportunities may only be available to eligible or qualified investors and are subject to jurisdiction, due diligence and applicable regulation. Byzaro is not a bank, investment fund or regulated financial institution.</p>\n          </div>\n        </aside>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"section section--panel division\" id=\"advisory\">\n    <div class=\"container\">\n      <div class=\"division-head reveal\">\n        <div class=\"division-eyebrow\">\n          <span class=\"section-numeral\">05</span>\n          <span class=\"label\">V \u2014 Corporate &amp; Strategic Advisory</span>\n        </div>\n        <h2 class=\"division-name\">Advisory</h2>\n        <p class=\"division-line\">Structure, expansion and execution across jurisdictions.</p>\n      </div>\n      <div class=\"division-body reveal\">\n        <ul class=\"service-list\">\n          <li>International Company Formation</li>\n          <li>Market Entry &amp; Expansion</li>\n          <li>Corporate &amp; Holding Structures</li>\n          <li>M&amp;A Coordination</li>\n          <li>Business Succession</li>\n          <li>Corporate Relocation</li>\n        </ul>\n        <aside class=\"division-aside\">\n          <div class=\"division-aside-inner\">\n            <p class=\"relation-line\">Advisory sits at the center of most cross-border mandates \u2014 coordinating Talent, Digital, Real Estate and Capital as the mandate requires.</p>\n            <p class=\"division-compliance\">International structures developed in coordination with specialized legal, tax and regulatory partners.</p>\n          </div>\n        </aside>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"section lacquer\" id=\"special-situations-teaser\">\n    <div class=\"container closing\">\n      <p class=\"label center reveal\" style=\"display:block; margin-bottom:20px;\">Beyond the five capabilities</p>\n      <h2 class=\"closing-headline reveal\" style=\"font-size:clamp(1.8rem,4.4vw,3.2rem); max-width:20ch; font-style:italic; font-weight:500;\">Some opportunities don't fit into conventional categories.</h2>\n      <p class=\"lede center reveal\">For mandates that cross capabilities \u2014 or fall outside them entirely \u2014 Byzaro works as one coordinated group.</p>\n      <a class=\"btn btn-primary reveal\" href=\"network.html#mandate\">Present an Opportunity</a>\n    </div>\n  </section>\n\n</main>\n\n<footer class=\"site-footer\">\n  <div class=\"container\">\n    <div class=\"ledger-rule footer-ledger\" aria-hidden=\"true\"></div>\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <a class=\"brand\" href=\"index.html\" aria-label=\"Byzaro Group\">\n          <svg class=\"byzaro-mark\" viewBox=\"0 0 367 390\" fill=\"currentColor\" aria-hidden=\"true\">\n            <defs><path id=\"bzb-foot\" fill-rule=\"evenodd\" d=\"M0,0 H164 V56 C161,68 145,70 145,90 C145,110 161,112 164,124 V181 H0 Z M33,32 H131 V54 A20,20 0 0 1 111,74 H76 V107 H110 A21,21 0 0 1 131,128 V149 H33 Z\"/></defs>\n            <use href=\"#bzb-foot\" transform=\"translate(203,0)\"/>\n            <use href=\"#bzb-foot\" t
