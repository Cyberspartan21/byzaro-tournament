rflow = 'hidden';\n  }\n  function closeMenu() {\n    menu.classList.remove('is-open');\n    toggle.setAttribute('aria-expanded', 'false');\n    document.body.style.overflow = '';\n  }\n  if (toggle) {\n    toggle.addEventListener('click', function () {\n      var expanded = toggle.getAttribute('aria-expanded') === 'true';\n      if (expanded) { closeMenu(); } else { openMenu(); }\n    });\n  }\n  if (closeBtn) { closeBtn.addEventListener('click', closeMenu); }\n  if (menu) {\n    menu.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', closeMenu); });\n  }\n\n  var themeToggles = document.querySelectorAll('.theme-toggle');\n  var themeLabels = { light: 'DARK', dark: 'LIGHT' };\n  function currentTheme() {\n    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';\n  }\n  function updateThemeToggles() {\n    var theme = currentTheme();\n    themeToggles.forEach(function (btn) {\n      btn.setAttribute('aria-pressed', String(theme === 'dark'));\n      var label = btn.querySelector('.theme-toggle-label');\n      if (label) { label.textContent = themeLabels[theme]; }\n    });\n  }\n  function setTheme(theme) {\n    document.documentElement.classList.add('theme-transition');\n    window.setTimeout(function () {\n      document.documentElement.classList.remove('theme-transition');\n    }, 320);\n    if (theme === 'light') {\n      document.documentElement.setAttribute('data-theme', 'light');\n    } else {\n      document.documentElement.removeAttribute('data-theme');\n    }\n    try { localStorage.setItem('bz-theme-05', theme); } catch (e) {}\n    updateThemeToggles();\n  }\n  updateThemeToggles();\n  themeToggles.forEach(function (btn) {\n    btn.addEventListener('click', function () {\n      setTheme(currentTheme() === 'light' ? 'dark' : 'light');\n    });\n  });\n\n  var reveals = document.querySelectorAll('.reveal');\n  if ('IntersectionObserver' in window) {\n    var io = new IntersectionObserver(function (entries) {\n      entries.forEach(function (entry) {\n        if (entry.isIntersecting) {\n          entry.target.classList.add('is-visible');\n          io.unobserve(entry.target);\n        }\n      });\n    }, { threshold: .15 });\n    reveals.forEach(function (el) { io.observe(el); });\n  } else {\n    reveals.forEach(function (el) { el.classList.add('is-visible'); });\n  }\n\n  var divisions = document.querySelectorAll('.division');\n  var subnavLinks = document.querySelectorAll('.subnav a');\n  if ('IntersectionObserver' in window && divisions.length) {\n    var spy = new IntersectionObserver(function (entries) {\n      entries.forEach(function (entry) {\n        if (entry.isIntersecting) {\n          subnavLinks.forEach(function (a) {\n            a.classList.toggle('is-active', a.getAttribute('data-subnav') === entry.target.id);\n          });\n        }\n      });\n    }, { rootMargin: '-140px 0px -60% 0px', threshold: 0 });\n    divisions.forEach(function (d) { spy.observe(d); });\n  }\n})();\n<\/script>\n\n<script>(function(){\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a[href]');\n    if(!a) return;\n    var href = a.getAttribute('href') || '';\n    if(/^(https?:|mailto:|tel:)/i.test(href)) { a.target = '_blank'; return; }\n    var m = href.match(/^(?:\\.\\.\\/)?(?:([0-9]{2}-[a-z]+)\\/)?([a-z]+\\.html)?(#.*)?$/i);\n    if(!m) return;\n    if(href.charAt(0) === '#') return;          /* Anker in der Seite: normal lassen */\n    e.preventDefault();\n    parent.postMessage({bzNav: {concept: m[1] || null, page: m[2] || 'index.html', hash: m[3] || ''}}, '*');\n  }, true);\n  window.addEventListener('message', function(e){\n    if(e.data && e.data.bzHash){ location.hash = e.data.bzHash; }\n  });\n})();<\/script>\n\n</body>\n</html>\n", "05-bordeaux/network.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<script>(function(){try{if(localStorage.getItem('bz-theme-05')==='light'){document.documentElement.setAttribute('data-theme','light');}}catch(e){}})();<\/script>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>BYZARO GROUP \u2014 Network &amp; Opportunities</title>\n<meta name=\"description\" content=\"One international network across Serbia, Switzerland, UAE, Montenegro, Croatia, Germany and Italy. Discuss an opportunity with Byzaro Group.\">\n<meta name=\"robots\" content=\"noindex\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&amp;family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&amp;display=swap\" rel=\"stylesheet\">\n<style>\n/* ==========================================================================\n   BYZARO GROUP \u2014 Concept 05: BORDEAUX\n   Shared stylesheet for index.html, capabilities.html, network.html\n   ========================================================================== */\n\n:root {\n  --bg: #2B1218;\n  --bg-2: #3A181F;\n  --wine: #5C1A28;\n  --wine-dim: rgba(92, 26, 40, .55);\n  --sand: #D9CBB4;\n  --sand-dim: rgba(217, 203, 180, .35);\n  --sand-faint: rgba(217, 203, 180, .12);\n  --cream: #F0EBE1;\n  --muted: #B9A894;\n  /* accent-text: the accent colour for SMALL text (labels, numerals, rules,\n     active states) \u2014 must read \u22654.5:1 on its backdrop. */\n  --accent-text: var(--sand);\n  /* text placed directly on a sand surface (the inverted \"Group\"/\"Closing\"\n     band) cannot use --muted (fails contrast on sand) \u2014 use wine instead. */\n  --on-sand-strong: var(--wine);\n  --on-sand-dim: #7A3040;\n\n  --header-bg: rgba(43, 18, 24, .86);\n  --subnav-bg: rgba(43, 18, 24, .94);\n  --frame-border: var(--sand-dim);\n  --input-bg: var(--bg-2);\n  --input-border: rgba(217, 203, 180, .3);\n\n  --font-display: \"Playfair Display\", \"Times New Roman\", serif;\n  --font-ui: \"Jost\", system-ui, sans-serif;\n  --font-body: \"Jost\", system-ui, sans-serif;\n\n  --container: 1320px;\n  --section-pad: clamp(96px, 12vh, 180px);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Light theme \u2014 opt-in via [data-theme=\"light\"] on <html>.\n   Default (no attribute) stays the dark Bordeaux design.                  */\n/* ---------------------------------------------------------------------- */\n\n[data-theme=\"light\"] {\n  --bg: #F0EBE1;\n  --bg-2: #E4DBCA;\n  --wine: #5C1A28;\n  --wine-dim: rgba(92, 26, 40, .18);\n  --sand: #D9CBB4;\n  --sand-dim: rgba(43, 37, 34, .22);\n  --sand-faint: rgba(43, 37, 34, .08);\n  --cream: #F0EBE1;\n  --muted: #5E5248;\n  /* darkened wine reads \u22654.5:1 on both cream surfaces \u2014 measured */\n  --accent-text: var(--wine);\n  --on-sand-strong: var(--cream);\n  --on-sand-dim: rgba(240, 235, 225, .72);\n\n  --header-bg: rgba(240, 235, 225, .86);\n  --subnav-bg: rgba(240, 235, 225, .94);\n  --frame-border: rgba(43, 37, 34, .22);\n  --input-bg: #EAE2D0;\n  --input-border: rgba(43, 37, 34, .22);\n\n  /* text colour that used to be \"cream on dark\" is now ink on cream */\n  color-scheme: light;\n}\n\nhtml[data-theme=\"light\"] body { color: #2B2522; }\nhtml:not([data-theme=\"light\"]) body { color: var(--cream); }\n\n[data-theme=\"light\"] .hero-mark-bg { opacity: .03; color: var(--wine); }\nhtml:not([data-theme=\"light\"]) .hero-mark-bg { opacity: .045; color: var(--sand); }\n\n@media (prefers-reduced-motion: no-preference) {\n  html.theme-transition,\n  html.theme-transition *,\n  html.theme-transition *::before,\n  html.theme-transition *::after {\n    transition: background-color 300ms ease, color 300ms ease, border-color 300ms ease, fill 300ms ease, stroke 300ms ease !important;\n  }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Reset                                                                    */\n/* ---------------------------------------------------------------------- */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  font-family: var(--font-body);\n  font-weight: 400;\n  font-size: 1rem;\n  line-height: 1.7;\n  overflow-x: hidden;\n  min-width: 320px;\n}\n\nhtml, body { max-width: 100%; overflow-x: hidden; }\n\nimg, svg { display: block; max-width: 100%; }\n\na { color: inherit; }\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: 600;\n  letter-spacing: .01em;\n  margin: 0;\n}\n\np { margin: 0; }\n\nul { list-style: none; margin: 0; padding: 0; }\n\nbutton { font-family: inherit; cursor: pointer; }\n\n/* ---------------------------------------------------------------------- */\n/* Focus visibility                                                         */\n/* ---------------------------------------------------------------------- */\n\na:focus-visible,\nbutton:focus-visible,\ninput:focus-visible,\nselect:focus-visible,\ntextarea:focus-visible,\n[tabindex]:focus-visible {\n  outline: 2px solid var(--sand);\n  outline-offset: 3px;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Layout helpers                                                           */\n/* ---------------------------------------------------------------------- */\n\n.container {\n  width: 100%;\n  max-width: var(--container);\n  margin: 0 auto;\n  padding-left: clamp(20px, 5vw, 56px);\n  padding-right: clamp(20px, 5vw, 56px);\n}\n\n.section {\n  position: relative;\n  padding: var(--section-pad) 0;\n}\n\n.section--panel { background: var(--bg-2); }\n\n.lacquer {\n  background-image: linear-gradient(180deg, rgba(255,255,255,.05) 0%, rgba(0,0,0,.05) 100%);\n}\n\n.section-head {\n  display: flex;\n  align-items: baseline;\n  justify-content: center;\n  gap: clamp(12px, 3vw, 26px);\n  margin-bottom: clamp(40px, 6vw, 72px);\n  text-align: center;\n}\n\n.section-numeral {\n  font-family: var(--font-ui);\n  color: var(--accent-text);\n  font-size: clamp(1rem, 2vw, 1.3rem);\n  letter-spacing: .3em;\n}\n\n.section-title {\n  font-size: clamp(1.8rem, 4vw, 3.2rem);\n  line-height: 1.15;\n}\n\n.label {\n  display: inline-block;\n  font-size: 11px;\n  letter-spacing: .25em;\n  text-transform: uppercase;\n  color: var(--accent-text);\n  font-family: var(--font-ui);\n}\n\n.label--dim { color: var(--muted); }\n\n.lede {\n  color: var(--muted);\n  max-width: 62ch;\n}\n\n.center { text-align: center; margin-left: auto; margin-right: auto; }\n\n/* ---------------------------------------------------------------------- */\n/* The Ledger Rule \u2014 signature motif                                        */\n/* ---------------------------------------------------------------------- */\n\n.ledger-rule {\n  position: relative;\n  height: 8px;\n  width: 100%;\n}\n\n.ledger-rule::before {\n  content: \"\";\n  position: absolute;\n  top: 0; left: 0; right: 0;\n  height: 2px;\n  background: var(--accent-text);\n}\n\n.ledger-rule::after {\n  content: \"\";\n  position: absolute;\n  top: 7px; left: 0; right: 0;\n  height: 1px;\n  background: var(--sand-dim);\n}\n\n.ledger-rule--tight { height: 7px; margin-bottom: clamp(36px, 5vw, 56px); }\n\n/* ---------------------------------------------------------------------- */\n/* The Panel \u2014 framed inset motif                                          */\n/* ---------------------------------------------------------------------- */\n\n.panel {\n  border: 1px solid var(--frame-border);\n  padding: 6px;\n}\n\n.panel-inner {\n  border: 1px solid var(--frame-border);\n  padding: clamp(28px, 5vw, 56px);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Buttons                                                                   */\n/* ---------------------------------------------------------------------- */\n\n.btn {\n  display: inline-block;\n  border-radius: 0;\n  padding: 16px 34px;\n  font-size: 12px;\n  font-family: var(--font-ui);\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  text-decoration: none;\n  text-align: center;\n  transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease;\n  white-space: nowrap;\n}\n\n.btn-primary {\n  border: 1px solid var(--sand);\n  color: var(--cream);\n  background: transparent;\n}\n\nhtml:not([data-theme=\"light\"]) .btn-primary:hover,\nhtml:not([data-theme=\"light\"]) .btn-primary:focus-visible {\n  background: var(--sand);\n  color: var(--bg);\n}\n\n[data-theme=\"light\"] .btn-primary { color: var(--wine); border-color: var(--wine); }\n[data-theme=\"light\"] .btn-primary:hover,\n[data-theme=\"light\"] .btn-primary:focus-visible {\n  background: var(--wine);\n  color: var(--cream);\n}\n\n/* Buttons inside the inverted sand/wine band must contrast with THAT band,\n   not the page default \u2014 --on-sand-strong already flips correctly per theme. */\n.band-invert .btn-primary { color: var(--on-sand-strong); border-color: var(--on-sand-strong); }\n.band-invert .btn-primary:hover,\n.band-invert .btn-primary:focus-visible {\n  background: var(--on-sand-strong);\n  color: var(--sand);\n}\n[data-theme=\"light\"] .band-invert .btn-primary:hover,\n[data-theme=\"light\"] .band-invert .btn-primary:focus-visible {\n  color: var(--wine);\n}\n\n.band-invert .section-numeral,\n.band-invert .label { color: var(--on-sand-strong); }\n\n.text-link {\n  color: var(--accent-text);\n  text-decoration: none;\n  font-size: .9rem;\n  letter-spacing: .08em;\n  text-transform: uppercase;\n  font-family: var(--font-ui);\n  border-bottom: 1px solid var(--sand-dim);\n  width: fit-content;\n  padding-bottom: 2px;\n}\n\n.text-link:hover, .text-link:focus-visible { border-color: var(--accent-text); }\n\n/* ---------------------------------------------------------------------- */\n/* Intro assembly animation                                                 */\n/* ---------------------------------------------------------------------- */\n\n.intro-overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 9000;\n  background: var(--bg);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  transition: opacity 500ms ease;\n}\n\n.intro-overlay[data-hidden=\"true\"] {\n  opacity: 0;\n  pointer-events: none;\n}\n\n.intro-mark {\n  width: clamp(72px, 14vw, 140px);\n  color: var(--sand);\n}\n\n.intro-mark .bz-b {\n  opacity: 0;\n  transition: transform 1200ms cubic-bezier(0,.68,.24,1), opacity 1200ms ease;\n}\n\n.intro-mark.bz-run .bz-b { opacity: 1; transform: translate(0, 0); }\n\n.intro-mark .bz-b1 { transform: translate(6%, -6%); }\n.intro-mark .bz-b2 { transform: translate(-6%, -6%); }\n.intro-mark .bz-b3 { transform: translate(6%, 6%); }\n.intro-mark .bz-b4 { transform: translate(-6%, 6%); }\n\n.intro-mark.bz-run .bz-b2 { transition-delay: 35ms; }\n.intro-mark.bz-run .bz-b3 { transition-delay: 65ms; }\n.intro-mark.bz-run .bz-b4 { transition-delay: 100ms; }\n\n/* ---------------------------------------------------------------------- */\n/* Wordmark (per assets/WORDMARK.md)                                        */\n/* ---------------------------------------------------------------------- */\n\n.brand { display: inline-flex; align-items: center; gap: .7em; text-decoration: none; color: inherit; flex-shrink: 0; }\n\n.byzaro-mark { width: auto; height: 32px; flex-shrink: 0; }\n\n.brand-text { display: flex; flex-direction: column; gap: .28em; min-width: 0; }\n\n.brand-word {\n  font-family: var(--font-ui);\n  font-weight: 500;\n  font-size: 16px;\n  line-height: .72;\n  letter-spacing: .445em;\n  text-indent: .445em;\n  margin-right: -.445em;\n  display: flex;\n  align-items: flex-start;\n  white-space: nowrap;\n}\n\n.brand-lam { width: .745em; height: .72em; margin-right: .036em; flex-shrink: 0; }\n\n.brand-sub {\n  font-family: var(--font-ui);\n  font-weight: 300;\n  font-size: 8.5px;\n  line-height: .72;\n  letter-spacing: 1.02em;\n  text-indent: 1.02em;\n  margin-right: -1.02em;\n  white-space: nowrap;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Top navigation                                                           */\n/* ---------------------------------------------------------------------- */\n\n.site-header {\n  position: fixed;\n  top: 0; left: 0; right: 0;\n  z-index: 500;\n  background: var(--header-bg);\n  backdrop-filter: blur(10px);\n  border-bottom: 1px solid var(--sand-faint);\n}\n\n.nav {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 16px;\n  padding-top: 16px;\n  padding-bottom: 16px;\n}\n\n.nav-links {\n  display: flex;\n  align-items: center;\n  gap: clamp(16px, 2.4vw, 30px);\n  font-size: 12px;\n  font-family: var(--font-ui);\n  letter-spacing: .14em;\n  text-transform: uppercase;\n}\n\n.nav-links a:not(.btn) {\n  text-decoration: none;\n  color: var(--muted);\n  padding: 4px 0;\n  border-bottom: 1px solid transparent;\n  transition: color 200ms ease, border-color 200ms ease;\n}\n\n.nav-links a:not(.btn):hover,\n.nav-links a:not(.btn):focus-visible,\n.nav-links a.is-active {\n  color: inherit;\n  border-bottom-color: var(--accent-text);\n}\n\n.nav-cta { padding: 11px 20px; font-size: 11px; }\n\n.lang-switch {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  font-size: 11px;\n  font-family: var(--font-ui);\n  letter-spacing: .12em;\n}\n\n.lang-switch .lang-current { color: var(--accent-text); }\n\n.lang-switch span[aria-disabled=\"true\"] { color: var(--muted); opacity: .62; cursor: default; }\n\n.lang-sep { color: var(--muted); opacity: .5; }\n\n/* ---------------------------------------------------------------------- */\n/* Theme toggle                                                             */\n/* ---------------------------------------------------------------------- */\n\n.theme-toggle {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  background: transparent;\n  border: none;\n  padding: 4px 0;\n  color: var(--accent-text);\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  transition: color 200ms ease;\n}\n\n.theme-toggle-glyph { font-size: 13px; line-height: 1; }\n\n.theme-toggle:hover, .theme-toggle:focus-visible { color: var(--sand); }\n[data-theme=\"light\"] .theme-toggle:hover,\n[data-theme=\"light\"] .theme-toggle:focus-visible { color: var(--wine); opacity: .75; }\n\n.mobile-menu .theme-toggle { margin-top: 4px; font-size: 13px; justify-content: center; }\n\n.nav-toggle {\n  display: none;\n  background: transparent;\n  border: 1px solid var(--sand-faint);\n  width: 42px;\n  height: 42px;\n  align-items: center;\n  justify-content: center;\n  flex-shrink: 0;\n}\n\n.nav-toggle-bars { position: relative; width: 18px; height: 12px; }\n\n.nav-toggle-bars span {\n  position: absolute; left: 0; right: 0; height: 1px;\n  background: currentColor;\n  transition: transform 200ms ease, opacity 200ms ease, top 200ms ease;\n}\n\n.nav-toggle-bars span:nth-child(1) { top: 0; }\n.nav-toggle-bars span:nth-child(2) { top: 5px; }\n.nav-toggle-bars span:nth-child(3) { top: 11px; }\n\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(1) { top: 5px; transform: rotate(45deg); }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(2) { opacity: 0; }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(3) { top: 5px; transform: rotate(-45deg); }\n\n.mobile-menu {\n  position: fixed;\n  inset: 0;\n  z-index: 600;\n  background: var(--bg);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: clamp(18px, 4vh, 32px);\n  transform: translateY(-100%);\n  opacity: 0;\n  transition: transform 320ms ease, opacity 320ms ease;\n  visibility: hidden;\n  overflow-y: auto;\n  padding: 90px 20px 40px;\n}\n\n.mobile-menu.is-open { transform: translateY(0); opacity: 1; visibility: visible; }\n\n.mobile-menu .brand { margin-bottom: clamp(8px, 3vh, 20px); }\n.mobile-menu .byzaro-mark { height: 40px; }\n.mobile-menu .brand-word { font-size: 20px; }\n.mobile-menu .brand-sub { font-size: 10.5px; }\n\n.mobile-menu a:not(.brand) {\n  font-family: var(--font-display);\n  font-size: clamp(1.5rem, 7vw, 2.3rem);\n  text-decoration: none;\n  color: inherit;\n  letter-spacing: .01em;\n}\n\n.mobile-menu a.is-active { color: var(--accent-text); }\n\n.mobile-menu .lang-switch { margin-top: 8px; font-size: 13px; }\n\n.mobile-menu-close {\n  position: absolute;\n  top: 16px;\n  right: clamp(20px, 5vw, 56px);\n  background: transparent;\n  border: 1px solid var(--sand-faint);\n  width: 42px;\n  height: 42px;\n  color: inherit;\n  font-size: 18px;\n  line-height: 1;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Hero                                                                      */\n/* ---------------------------------------------------------------------- */\n\n.hero {\n  position: relative;\n  min-height: 100svh;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  overflow: hidden;\n  padding: 140px 0 0;\n  background-color: var(--bg);\n}\n\n.hero-mark-bg {\n  position: absolute;\n  top: 50%; left: 50%;\n  width: 140vh;\n  max-width: none;\n  height: 140vh;\n  transform: translate(-50%, -50%);\n  pointer-events: none;\n}\n\n.hero-inner {\n  position: relative;\n  z-index: 2;\n  max-width: 900px;\n  margin: 0 auto;\n  padding: 0 clamp(20px, 5vw, 56px) 64px;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: clamp(20px, 3vw, 28px);\n}\n\n.hero-label {\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .25em;\n  text-transform: uppercase;\n  color: var(--accent-text);\n  max-width: 46ch;\n}\n\n.hero-headline {\n  font-size: clamp(2.6rem, 7vw, 6.4rem);\n  line-height: 1.06;\n}\n\n.hero-headline span { display: block; }\n.hero-headline em { font-style: italic; font-weight: 500; }\n\n.hero-support {\n  color: var(--muted);\n  max-width: 56ch;\n  font-size: clamp(.95rem, 1.4vw, 1.1rem);\n}\n\n.hero-actions {\n  margin-top: 8px;\n  display: flex;\n  flex-wrap: wrap;\n  align-items: center;\n  justify-content: center;\n  gap: clamp(18px, 3vw, 30px);\n}\n\n.hero-close-rule { position: relative; z-index: 2; width: 100%; max-width: 640px; margin: 0 auto; }\n\n/* ---------------------------------------------------------------------- */\n/* The Group / Closing \u2014 inverted band (sand in dark, wine in light)        */\n/* ---------------------------------------------------------------------- */\n\n.band-invert {\n  background: var(--sand);\n  color: var(--on-sand-strong);\n}\n\n[data-theme=\"light\"] .band-invert { background: var(--wine); }\n\n.triad {\n  display: flex;\n  flex-direction: column;\n  border-top: 1px solid var(--wine-dim);\n  border-bottom: 1px solid var(--wine-dim);\n}\n\n[data-theme=\"light\"] .triad { border-color: rgba(240,235,225,.35); }\n\n.triad-word {\n  font-family: var(--font-display);\n  text-align: center;\n  padding: clamp(20px, 4vw, 36px) 0;\n  font-size: clamp(1.6rem, 5vw, 3.2rem);\n  border-top: 1px solid var(--wine-dim);\n}\n\n[data-theme=\"light\"] .triad-word { border-color: rgba(240,235,225,.35); }\n\n.triad-word:first-child { border-top: none; }\n\n@media (min-width: 780px) {\n  .triad { flex-direction: row; border-top: none; border-bottom: none; }\n  .triad-word { flex: 1; border-top: none; border-left: 1px solid var(--wine-dim); }\n  [data-theme=\"light\"] .triad-word { border-color: rgba(240,235,225,.35); }\n  .triad-word:first-child { border-left: none; }\n}\n\n.group-copy {\n  margin-top: clamp(40px, 6vw, 64px);\n  text-align: center;\n  display: flex;\n  flex-direction: column;\n  gap: 20px;\n  align-items: center;\n}\n\n.group-copy .lede { font-size: clamp(1rem, 1.6vw, 1.2rem); color: var(--on-sand-strong); }\n.group-copy .audience { color: var(--on-sand-dim); max-width: 52ch; font-size: .95rem; }\n\n/* ---------------------------------------------------------------------- */\n/* The House Ledger \u2014 capability rows (home page)                           */\n/* ---------------------------------------------------------------------- */\n\n.ledger-rows { }\n\n.ledger-row-wrap { border-bottom: 1px solid var(--sand-faint); }\n\n.ledger-row {\n  width: 100%;\n  display: flex;\n  align-items: center;\n  gap: clamp(14px, 3vw, 32px);\n  background: transparent;\n  border: none;\n  text-decoration: none;\n  color: inherit;\n  text-align: left;\n  padding: clamp(20px, 3.4vw, 34px) clamp(8px, 2vw, 20px);\n  transition: background-color 200ms ease;\n}\n\n.ledger-row:hover, .ledger-row:focus-visible { background: var(--bg-2); }\n\n.ledger-num {\n  font-family: var(--font-ui);\n  color: var(--muted);\n  font-size: clamp(.95rem, 1.4vw, 1.15rem);\n  letter-spacing: .1em;\n  width: 2.6em;\n  flex-shrink: 0;\n  transition: color 200ms ease;\n}\n\n.ledger-row:hover .ledger-num, .ledger-row:focus-visible .ledger-num { color: var(--cream); }\n[data-theme=\"light\"] .ledger-row:hover .ledger-num,\n[data-theme=\"light\"] .ledger-row:focus-visible .ledger-num { color: #2B2522; }\n\n.ledger-name {\n  font-family: var(--font-display);\n  font-size: clamp(1.2rem, 2.6vw, 1.9rem);\n  letter-spacing: .01em;\n  flex-shrink: 0;\n}\n\n.ledger-descriptor {\n  margin-left: 16px;\n  color: var(--muted);\n  font-size: .9rem;\n  display: none;\n}\n\n@media (min-width: 720px) { .ledger-descriptor { display: block; } }\n\n.ledger-explore {\n  margin-left: auto;\n  flex-shrink: 0;\n  color: var(--accent-text);\n  font-family: var(--font-ui);\n  font-size: .82rem;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n}\n\n/* ---------------------------------------------------------------------- */\n/* The Roll \u2014 SVG membership plate                                          */\n/* ---------------------------------------------------------------------- */\n\n.roll-wrap alent\" checked>\n                <label for=\"cat-talent\">Talent</label>\n\n                <input type=\"radio\" name=\"category\" id=\"cat-tech\" value=\"Technology / AI\">\n                <label for=\"cat-tech\">Technology / AI</label>\n\n                <input type=\"radio\" name=\"category\" id=\"cat-realestate\" value=\"Real Estate\">\n                <label for=\"cat-realestate\">Real Estate</label>\n\n                <input type=\"radio\" name=\"category\" id=\"cat-capital\" value=\"Capital / Investment Opportunity\">\n                <label for=\"cat-capital\">Capital / Investment Opportunity</label>\n\n                <input type=\"radio\" name=\"category\" id=\"cat-advisory\" value=\"Corporate Advisory\">\n                <label for=\"cat-advisory\">Corporate Advisory</label>\n\n                <input type=\"radio\" name=\"category\" id=\"cat-partnership\" value=\"Strategic Partnership\">\n                <label for=\"cat-partnership\">Strategic Partnership</label>\n\n                <input type=\"radio\" name=\"category\" id=\"cat-special\" value=\"Special Situation\">\n                <label for=\"cat-special\">Special Situation</label>\n\n                <input type=\"radio\" name=\"category\" id=\"cat-other\" value=\"Something Else\">\n                <label for=\"cat-other\">Something Else</label>\n              </div>\n            </fieldset>\n\n            <div class=\"field\">\n              <label for=\"f-name\">Name *</label>\n              <input type=\"text\" id=\"f-name\" name=\"name\" required autocomplete=\"name\">\n            </div>\n\n            <div class=\"field\">\n              <label for=\"f-company\">Company</label>\n              <input type=\"text\" id=\"f-company\" name=\"company\" autocomplete=\"organization\">\n            </div>\n\n            <div class=\"field\">\n              <label for=\"f-country\">Country *</label>\n              <input type=\"text\" id=\"f-country\" name=\"country\" required autocomplete=\"country t.documentElement.removeAttribute('data-theme');\n    }\n    try { localStorage.setItem('bz-theme-05', theme); } catch (e) {}\n    updateThemeToggles();\n  }\n  updateThemeToggles();\n  themeToggles.forEach(function (btn) {\n    btn.addEventListener('click', function () {\n      setTheme(currentTheme() === 'light' ? 'dark' : 'light');\n    });\n  });\n\n  var reveals = document.querySelectorAll('.reveal');\n  if ('IntersectionObserver' in window) {\n    var io = new IntersectionObserver(function (entries) {\n      entries.forEach(function (entry) {\n        if (entry.isIntersecting) {\n          entry.target.classList.add('is-visible');\n          io.unobserve(entry.target);\n        }\n      });\n    }, { threshold: .15 });\n    reveals.forEach(function (el) { io.observe(el); });\n  } else {\n    reveals.forEach(function (el) { el.classList.add('is-visible'); });\n  }\n\n  var form = document.querySelector('.mandate-form');\n  var confirmation = document.querySelector('.mandate-confirmation');\n  if (form) {\n    form.addEventListener('submit', function (e) {\n      e.preventDefault();\n      confirmation.classList.add('is-visible');\n      confirmation.setAttribute('tabindex', '-1');\n      confirmation.focus();\n      form.reset();\n    });\n  }\n})();\n<\/script>\n\n<script>(function(){\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a[href]');\n    if(!a) return;\n    var href = a.getAttribute('href') || '';\n    if(/^(https?:|mailto:|tel:)/i.test(href)) { a.target = '_blank'; return; }\n    var m = href.match(/^(?:\\.\\.\\/)?(?:([0-9]{2}-[a-z]+)\\/)?([a-z]+\\.html)?(#.*)?$/i);\n    if(!m) return;\n    if(href.charAt(0) === '#') return;          /* Anker in der Seite: normal lassen */\n    e.preventDefault();\n    parent.postMessage({bzNav: {concept: m[1] || null, page: m[2] || 'index.html', hash: m[3] || ''}}, '*');\n  }, true);\n  window.addEventListener('message', function(e){\n    if(e.data && e.data.bzHash){ location.hash = e.data.bzHash; }\n  });\n})();<\/script>\n\n</body>\n</html>\n"}, "concepts": [{"num": "01", "dir": "01-obsidian", "name": "OBSIDIAN EMPIRE", "sw": ["#0a0a0b", "#161618", "#f2ede4", "#c19a3f"]}, {"num": "02", "dir": "02-riviera", "name": "RIVIERA", "sw": ["#f6f3ec", "#0e3a5c", "#a8875a", "#10131a"]}, {"num": "03", "dir": "03-platinum", "name": "PLATINUM", "sw": ["#0e1116", "#161b22", "#b9c4d0", "#e9edf2"]}, {"num": "04", "dir": "04-monolith", "name": "MONOLITH", "sw": ["#e8e6e1", "#b4afa6", "#8e8b85", "#17171a"]}, {"num": "05", "dir": "05-bordeaux", "name": "BORDEAUX", "sw": ["#2b1218", "#5c1a28", "#d9cbb4", "#f0ebe1"]}], "pageList": [{"file": "index.html", "label": "Home"}, {"file": "capabilities.html", "label": "Capabilities"}, {"file": "network.html", "label": "Network"}]}</script>
<script>
(function(){
  var D = JSON.parse(document.getElementById('bzdata').textContent);
  var frame = document.getElementById('frame');
  var cur = { dir: D.concepts[0].dir, page: 'index.html' };

  function mkBtn(label, on, swatches){
    var b = document.createElement('button');
    b.type = 'button';
    if (swatches) {
      var t = document.createElement('span'); t.className='nm'; t.textContent = ' ' + label.name;
      var nn = document.createElement('span'); nn.className='no'; nn.textContent = label.num;
      b.appendChild(nn); b.appendChild(t);
    } else { b.textContent = label; }
    if (swatches) {
      var d = document.createElement('span'); d.className = 'dots';
      swatches.forEach(function(c){ var i = document.createElement('i'); i.style.background = c; d.appendChild(i); });
      b.appendChild(d);
    }
    b.addEventListener('click', on);
    return b;
  }

  var cg = document.getElementById('cgrp'), pg = document.getElementById('pgrp');
  D.concepts.forEach(function(c){
    cg.appendChild(mkBtn({num:c.num, name:c.name}, function(){ go(c.dir, cur.page, ''); }, c.sw));
  });
  D.pageList.forEach(function(p){
    pg.appendChild(mkBtn(p.label, function(){ go(cur.dir, p.file, ''); }));
  });

  function paint(){
    [].forEach.call(cg.children, function(b, i){ b.setAttribute('aria-pressed', String(D.concepts[i].dir === cur.dir)); });
    [].forEach.call(pg.children, function(b, i){ b.setAttribute('aria-pressed', String(D.pageList[i].file === cur.page)); });
  }

  function go(dir, page, hash){
    cur.dir = dir || cur.dir;
    cur.page = page || 'index.html';
    var key = cur.dir + '/' + cur.page;
    var html = D.pages[key];
    if (!html) { return; }
    frame.onload = function(){
      frame.onload = null;
      if (hash) { try { frame.contentWindow.postMessage({ bzHash: hash }, '*'); } catch(e){} }
    };
    frame.srcdoc = html;
    paint();
    try { location.hash = cur.dir + '/' + cur.page; } catch(e){}
  }

  window.addEventListener('message', function(e){
    var n = e.data && e.data.bzNav;
    if (!n) return;
    go(n.concept || cur.dir, n.page, n.hash || '');
  });

  var h = (location.hash || '').replace(/^#/, '');
  var m = h.match(/^([0-9]{2}-[a-z]+)\/([a-z]+\.html)$/);
  if (m && D.pages[m[1] + '/' + m[2]]) { go(m[1], m[2], ''); } else { go(cur.dir, 'index.html', ''); }
})();
</script>
