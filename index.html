ebkit-text-size-adjust: 100%; }\n\nhtml, body { max-width: 100%; overflow-x: hidden; }\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font-family: var(--font-ui);\n  font-weight: 400;\n  font-size: 1rem;\n  line-height: 1.7;\n  min-width: 320px;\n}\n\nimg, svg { display: block; max-width: 100%; }\na { color: inherit; }\nbutton { font: inherit; cursor: pointer; }\nul { list-style: none; margin: 0; padding: 0; }\np { margin: 0; }\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  line-height: .94;\n  margin: 0;\n  letter-spacing: -.01em;\n}\n\n.container {\n  max-width: var(--container);\n  margin: 0 auto;\n  padding: 0 clamp(20px, 5vw, 56px);\n}\n\n:focus-visible {\n  outline: 2px solid var(--ink);\n  outline-offset: 3px;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Signature motifs \u2014 board-formed concrete + light shaft + museum labels  */\n/* ---------------------------------------------------------------------- */\n\n.tex-board {\n  background-image: repeating-linear-gradient(\n    to bottom,\n    rgba(var(--ink-rgb), .04) 0,\n    rgba(var(--ink-rgb), .04) 1px,\n    transparent 1px,\n    transparent 48px\n  );\n}\n\n.tex-board.tex-holes {\n  background-image:\n    radial-gradient(circle, rgba(var(--ink-rgb), .08) 2px, transparent 2.5px),\n    repeating-linear-gradient(\n      to bottom,\n      rgba(var(--ink-rgb), .04) 0,\n      rgba(var(--ink-rgb), .04) 1px,\n      transparent 1px,\n      transparent 48px\n    );\n  background-size: 120px 120px, auto;\n}\n\n.tex-shaft { position: relative; }\n\n.tex-shaft::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background: linear-gradient(115deg,\n    rgba(255, 255, 255, 0) 28%,\n    rgba(255, 255, 255, var(--shaft-op)) 54%,\n    rgba(255, 255, 255, 0) 80%);\n  pointer-events: none;\n  z-index: 0;\n}\n\n.tex-shaft > * { position: relative; z-index: 1; }\n\n.ml {\n  display: block;\n  font-family: var(--font-ui);\n  font-weight: 500;\n  font-size: 10.5px;\n  letter-spacing: .2em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.band .ml { color: var(--muted-on-ink); }\n\n.label-row {\n  display: grid;\n  grid-template-columns: 160px 1fr;\n  gap: 16px 40px;\n  align-items: start;\n}\n\n@media (max-width: 820px) {\n  .label-row { grid-template-columns: 1fr; gap: 12px; }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Buttons                                                                  */\n/* ---------------------------------------------------------------------- */\n\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 10px;\n  border: 1px solid var(--ink);\n  background: transparent;\n  color: var(--ink);\n  padding: 15px 28px;\n  font-family: var(--font-ui);\n  font-weight: 500;\n  font-size: 12px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  text-decoration: none;\n  transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease;\n}\n\n.btn:hover, .btn:focus-visible {\n  background: var(--ink);\n  color: var(--bg);\n}\n\n.band .btn { border-color: var(--bg); color: var(--bg); }\n.band .btn:hover, .band .btn:focus-visible { background: var(--bg); color: var(--ink); }\n\n.btn-ghost {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  border: none;\n  background: none;\n  padding: 0;\n  color: var(--ink);\n  font-family: var(--font-ui);\n  font-weight: 500;\n  font-size: 12px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  text-decoration: none;\n  border-bottom: 1px solid var(--concrete);\n  padding-bottom: 2px;\n  transition: border-color 200ms ease, gap 200ms ease;\n}\n\n.btn-ghost:hover, .btn-ghost:focus-visible { border-color: var(--ink); gap: 12px; }\n\n/* ---------------------------------------------------------------------- */\n/* Wordmark \u2014 verbindlicher Baustein, exact markup/CSS per WORDMARK.md     */\n/* ---------------------------------------------------------------------- */\n\n.brand { display: inline-flex; align-items: center; gap: .7em; text-decoration: none; color: inherit; }\n.byzaro-mark { width: auto; height: 32px; flex-shrink: 0; }\n.footer-brand .byzaro-mark { height: 26px; }\n.mobile-menu .byzaro-mark { height: 36px; }\n\n.brand-text { display: flex; flex-direction: column; gap: .28em; min-width: 0; }\n\n.brand-word {\n  font-family: \"Jost\", system-ui, sans-serif;\n  font-weight: 500;\n  font-size: 16px;\n  line-height: .72;\n  letter-spacing: .445em;\n  text-indent: .445em;\n  margin-right: -.445em;\n  display: flex;\n  align-items: flex-start;\n  white-space: nowrap;\n}\n\n.footer-brand .brand-word { font-size: 14px; }\n\n.brand-lam { width: .745em; height: .72em; margin-right: .036em; flex-shrink: 0; }\n\n.brand-sub {\n  font-family: \"Jost\", system-ui, sans-serif;\n  font-weight: 300;\n  font-size: 8.5px;\n  line-height: .72;\n  letter-spacing: 1.02em;\n  text-indent: 1.02em;\n  margin-right: -1.02em;\n  white-space: nowrap;\n}\n\n.footer-brand .brand-sub { font-size: 7.5px; }\n\n/* ---------------------------------------------------------------------- */\n/* Intro assembly animation                                                 */\n/* ---------------------------------------------------------------------- */\n\n.intro-overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 9000;\n  background: var(--bg);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  transition: opacity 500ms ease;\n}\n\n.intro-overlay[data-hidden=\"true\"] { opacity: 0; pointer-events: none; }\n\n.intro-mark { width: clamp(72px, 14vw, 140px); color: var(--ink); }\n\n.intro-mark .bz-b {\n  opacity: 0;\n  transition: transform 1200ms cubic-bezier(0, .68, .24, 1), opacity 1200ms ease;\n}\n\n.intro-mark.bz-run .bz-b { opacity: 1; transform: translate(0, 0); }\n\n.intro-mark .bz-b1 { transform: translate(6%, -6%); }\n.intro-mark .bz-b2 { transform: translate(-6%, -6%); }\n.intro-mark .bz-b3 { transform: translate(6%, 6%); }\n.intro-mark .bz-b4 { transform: translate(-6%, 6%); }\n\n.intro-mark.bz-run .bz-b2 { transition-delay: 35ms; }\n.intro-mark.bz-run .bz-b3 { transition-delay: 65ms; }\n.intro-mark.bz-run .bz-b4 { transition-delay: 100ms; }\n\n/* ---------------------------------------------------------------------- */\n/* Header / navigation                                                      */\n/* ---------------------------------------------------------------------- */\n\n.site-header {\n  position: fixed;\n  top: 0; left: 0; right: 0;\n  z-index: 500;\n  background: rgba(var(--bg-rgb), .88);\n  backdrop-filter: blur(10px);\n  border-bottom: 1px solid rgba(var(--ink-rgb), .1);\n}\n\n.nav {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 16px;\n  padding-top: 18px;\n  padding-bottom: 18px;\n}\n\n.brand { color: var(--ink); flex-shrink: 0; }\n\n.nav-links {\n  display: flex;\n  align-items: center;\n  gap: clamp(16px, 2.2vw, 32px);\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n}\n\n.nav-links a:not(.btn) {\n  text-decoration: none;\n  color: var(--muted);\n  padding: 4px 0;\n  border-bottom: 1px solid transparent;\n  transition: color 200ms ease, border-color 200ms ease;\n}\n\n.nav-links a:not(.btn):hover,\n.nav-links a:not(.btn):focus-visible,\n.nav-links a.is-active {\n  color: var(--ink);\n  border-bottom-color: var(--ink);\n}\n\n.nav-cta { padding: 11px 20px; font-size: 11px; }\n\n.lang-switch {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .12em;\n}\n\n.lang-switch a, .lang-switch .lang-current { color: var(--ink); text-decoration: none; }\n\n.lang-switch span[aria-disabled=\"true\"] { color: var(--muted); }\n\n.lang-sep { color: var(--muted); }\n\n/* ---------------------------------------------------------------------- */\n/* Theme toggle                                                             */\n/* ---------------------------------------------------------------------- */\n\n.theme-toggle {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  background: transparent;\n  border: none;\n  padding: 4px 0;\n  color: var(--ink);\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n}\n\n.theme-toggle-glyph { font-size: 13px; line-height: 1; }\n\n.theme-toggle:hover, .theme-toggle:focus-visible { color: var(--muted); }\n\n.mobile-menu .theme-toggle { margin-top: 12px; font-size: 13px; justify-content: center; color: var(--ink); }\n\n/* ---------------------------------------------------------------------- */\n/* Mobile menu                                                             */\n/* ---------------------------------------------------------------------- */\n\n.nav-toggle {\n  display: none;\n  background: transparent;\n  border: 1px solid var(--concrete);\n  width: 42px;\n  height: 42px;\n  align-items: center;\n  justify-content: center;\n  flex-shrink: 0;\n}\n\n.nav-toggle-bars { position: relative; width: 18px; height: 12px; }\n\n.nav-toggle-bars span {\n  position: absolute;\n  left: 0; right: 0;\n  height: 1px;\n  background: var(--ink);\n  transition: transform 200ms ease, opacity 200ms ease, top 200ms ease;\n}\n\n.nav-toggle-bars span:nth-child(1) { top: 0; }\n.nav-toggle-bars span:nth-child(2) { top: 5px; }\n.nav-toggle-bars span:nth-child(3) { top: 11px; }\n\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(1) { top: 5px; transform: rotate(45deg); }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(2) { opacity: 0; }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(3) { top: 5px; transform: rotate(-45deg); }\n\n.mobile-menu {\n  position: fixed;\n  inset: 0;\n  z-index: 600;\n  background: var(--bg);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: clamp(20px, 5vh, 36px);\n  transform: translateY(-100%);\n  opacity: 0;\n  transition: transform 320ms ease, opacity 320ms ease;\n  visibility: hidden;\n  font-family: var(--font-ui);\n  text-transform: uppercase;\n  letter-spacing: .1em;\n  font-size: 18px;\n}\n\n.mobile-menu.is-open { transform: translateY(0); opacity: 1; visibility: visible; }\n\n.mobile-menu a { text-decoration: none; color: var(--ink); }\n.mobile-menu a.is-active { color: var(--muted); }\n\n.mobile-menu-close {\n  position: absolute;\n  top: 16px;\n  right: clamp(20px, 5vw, 56px);\n  background: transparent;\n  border: 1px solid var(--concrete);\n  width: 42px;\n  height: 42px;\n  color: var(--ink);\n  font-size: 18px;\n  line-height: 1;\n}\n\n@media (max-width: 820px) {\n  .nav-links { display: none; }\n  .nav-toggle { display: flex; }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Hero (index)                                                            */\n/* ---------------------------------------------------------------------- */\n\n.hero {\n  position: relative;\n  min-height: 100svh;\n  display: flex;\n  align-items: center;\n  justify-content: flex-start;\n  overflow: hidden;\n  padding: calc(var(--header-h) + 40px) 0 80px;\n  background-color: var(--bg);\n}\n\n.hero-mark-bg {\n  position: absolute;\n  top: 50%;\n  right: -10vw;\n  width: 130vh;\n  max-width: none;\n  height: 130vh;\n  transform: translateY(-50%);\n  color: var(--ink);\n  opacity: .045;\n  pointer-events: none;\n  z-index: 0;\n}\n\n.hero-mark-bg.hero-mark-bg--2 {\n  opacity: .02;\n  transform: translateY(-50%) translate(6px, 8px);\n}\n\n.hero-inner {\n  position: relative;\n  z-index: 2;\n  max-width: 920px;\n  width: 100%;\n  margin: 0 auto;\n  padding: 0 clamp(20px, 5vw, 56px);\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  gap: clamp(22px, 3vw, 34px);\n}\n\n.hero-label {\n  max-width: 46ch;\n}\n\n.hero-headline {\n  font-family: var(--font-display);\n  font-weight: 700;\n  text-transform: uppercase;\n  font-size: clamp(3rem, 9vw, 8rem);\n  line-height: .94;\n}\n\n.hero-headline span { display: block; }\n\n.hero-support {\n  color: var(--muted);\n  font-size: clamp(1rem, 1.6vw, 1.2rem);\n  max-width: 56ch;\n}\n\n.hero-cta-row { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; }\n\n.scroll-cue {\n  position: absolute;\n  left: clamp(20px, 5vw, 56px);\n  bottom: 28px;\n  width: 1px;\n  height: 46px;\n  background: var(--concrete);\n  z-index: 2;\n}\n\n@media (max-width: 640px) {\n  .scroll-cue { display: none; }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Chapters / generic section rhythm                                       */\n/* ---------------------------------------------------------------------- */\n\n.chapter {\n  position: relative;\n  padding: var(--section-pad) 0;\n  background: var(--bg);\n}\n\n.chapter--alt { background: var(--bg-2); }\n\n.chapter-head {\n  display: flex;\n  align-items: baseline;\n  gap: 18px;\n  margin-bottom: clamp(40px, 6vw, 72px);\n  border-bottom: 1px solid rgba(var(--ink-rgb), .14);\n  padding-bottom: 20px;\n}\n\n.chapter-numeral {\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .16em;\n  color: var(--muted);\n}\n\n.band .chapter-numeral { color: var(--muted-on-ink); }\n\n.chapter-title {\n  font-family: var(--font-display);\n  text-transform: uppercase;\n  font-size: clamp(1.5rem, 3vw, 2.1rem);\n}\n\n.band {\n  background: var(--ink);\n  color: var(--bg);\n}\n\n.band .muted-line { color: var(--muted-on-ink); }\n\n/* ---------------------------------------------------------------------- */\n/* Triad \u2014 ACCESS. EXPERTISE. EXECUTION.                                   */\n/* ---------------------------------------------------------------------- */\n\n.triad {\n  display: flex;\n  flex-direction: column;\n  margin-bottom: clamp(48px, 7vw, 80px);\n}\n\n.triad-word {\n  font-family: var(--font-display);\n  font-weight: 700;\n  text-transform: uppercase;\n  font-size: clamp(2.4rem, 8vw, 6.4rem);\n  line-height: 1.02;\n  padding: clamp(10px, 1.6vw, 18px) 0;\n}\n\n.triad-rule { border: none; border-top: 1px solid rgba(var(--bg-rgb), .22); margin: 0; }\n\n.group-copy { max-width: 780px; display: flex; flex-direction: column; gap: 20px; }\n\n.lede { font-size: clamp(1.05rem, 1.8vw, 1.3rem); }\n\n.audience { color: var(--muted-on-ink); font-size: .95rem; }\n\n/* ---------------------------------------------------------------------- */\n/* Capabilities \u2014 gallery-wall rows (index teaser)                         */\n/* ---------------------------------------------------------------------- */\n\n.cap-rows { border-top: 1px solid rgba(var(--ink-rgb), .14); }\n\n.cap-row {\n  display: grid;\n  grid-template-columns: 160px 1fr;\n  gap: 16px 40px;\n  align-items: center;\n  padding: clamp(22px, 3.4vw, 40px) clamp(12px, 2vw, 24px);\n  border-bottom: 1px solid rgba(var(--ink-rgb), .14);\n  text-decoration: none;\n  color: inherit;\n  transition: background-color 220ms ease;\n}\n\n.cap-row:hover, .cap-row:focus-visible { background: var(--bg-2); }\n\n.cap-row-label { display: flex; align-items: baseline; gap: 12px; }\n\n.cap-row-index { font-family: var(--font-ui); font-size: 12px; letter-spacing: .1em; color: var(--muted); }\n\n.cap-row-cat { font-family: var(--font-ui); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }\n\n.cap-row-main {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 8px 24px;\n}\n\n.cap-row-name {\n  font-family: var(--font-display);\n  font-weight: 700;\n  text-transform: uppercase;\n  font-size: clamp(1.6rem, 3.6vw, 2.8rem);\n  transition: transform 220ms ease;\n}\n\n.cap-row:hover .cap-row-name, .cap-row:focus-visible .cap-row-name { transform: translateX(2px); }\n\n.cap-row-descriptor { color: var(--muted); font-size: .95rem; max-width: 52ch; }\n\n.cap-row-explore {\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  color: var(--ink);\n  border-bottom: 1px solid var(--concrete);\n  padding-bottom: 2px;\n  white-space: nowrap;\n}\n\n@media (max-width: 820px) {\n  .cap-row { grid-template-columns: 1fr; gap: 10px; }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Site plan diagram                                                       */\n/* ---------------------------------------------------------------------- */\n\n.plan-wrap { display: flex; justify-content: center; margin: clamp(24px, 4vw, 48px) 0; }\n\n.plan-svg { width: min(100%, 620px); height: auto; overflow: visible; color: var(--ink); }\n\n.plan-lines line { stroke: var(--concrete); stroke-width: 1; }\n.plan-node { fill: var(--concrete); }\n.plan-center-frame { fill: none; stroke: var(--concrete); stroke-width: 1; }\n.plan-label {\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  fill: var(--ink);\n}\n.plan-label--market { fill: var(--muted); font-size: 10px; }\n.plan-dim line { stroke: var(--concrete); stroke-width: 1; }\n.plan-boundary { fill: none; stroke: var(--concrete); stroke-width: 1; stroke-dasharray: 5 6; }\n.plan-boundary-label {\n  font-family: var(--font-ui);\n  font-size: 10.5px;\n  letter-spacing: .2em;\n  text-transform: uppercase;\n  fill: var(--muted);\n}\n\n.plan-caption {\n  max-width: 640px;\n  margin: 0 auto;\n  text-align: center;\n  color: var(--muted);\n  font-size: clamp(1rem, 1.5vw, 1.15rem);\n}\n\n/* ---------------------------------------------------------------------- */\n/* International reach \u2014 table                                             */\n/* ---------------------------------------------------------------------- */\n\n.reach-table { width: 100%; border-collapse: collapse; margin-bottom: clamp(28px, 4vw, 44px); }\n\n.reach-table tr { border-bottom: 1px solid rgba(var(--ink-rgb), .14); }\n.reach-table tr:first-child { border-top: 1px solid rgba(var(--ink-rgb), .14); }\n\n.reach-table td { padding: clamp(16px, 2.4vw, 26px) clamp(8px, 1.4vw, 16px); }\n\n.reach-name {\n  font-family: var(--font-display);\n  font-weight: 700;\n  text-transform: uppercase;\n  font-size: clamp(1.2rem, 2.6vw, 1.8rem);\n}\n\n.reach-tag {\n  text-align: right;\n  font-family: var(--font-ui);\n  font-size: 10.5px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.reach-foot { display: flex; flex-direction: column; gap: 10px; max-width: 640px; }\n.reach-cities { color: var(--muted); font-size: .95rem; }\n.reach-ambition { font-size: clamp(1.05rem, 1.8vw, 1.25rem); }\n\n/* ---------------------------------------------------------------------- */\n/* Special Situations \u2014 light-shaft section                                */\n/* ---------------------------------------------------------------------- */\n\n.special-headline {\n  font-family: var(--font-display);\n  text-transform: uppercase;\n  font-size: clamp(2rem, 5.4vw, 4rem);\n  max-width: 18ch;\n  margin-bottom: 24px;\n}\n\n.special-body { color: var(--muted); max-width: 60ch; margin-bottom: clamp(32px, 5vw, 56px); font-size: clamp(1rem, 1.6vw, 1.15rem); }\n\n.special-list {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 12px 28px;\n  margin-bottom: clamp(36px, 5vw, 56px);\n  padding-top: 22px;\n  border-top: 1px solid rgba(var(--ink-rgb), .14);\n}\n\n.special-list li {\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Opportunities teaser                                                    */\n/* ---------------------------------------------------------------------- */\n\n.opp-rows { border-top: 1px solid rgba(var(--ink-rgb), .14); margin-bottom: clamp(24px, 3vw, 36px); }\n\n.opp-row {\n  display: flex;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 16px;\n  padding: clamp(18px, 2.6vw, 28px) 0;\n  border-bottom: 1px solid rgba(var(--ink-rgb), .14);\n}\n\n.opp-name {\n  font-family: var(--font-display);\n  font-weight: 700;\n  text-transform: uppercase;\n  font-size: clamp(1.15rem, 2.4vw, 1.6rem);\n}\n\n.opp-tag {\n  font-family: var(--font-ui);\n  font-size: 10.5px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  color: var(--muted);\n  white-space: nowrap;\n}\n\n.opp-note { color: var(--muted); max-width: 60ch; margin-bottom: 28px; }\n.opp-cta-row { display: flex; }\n\n/* ---------------------------------------------------------------------- */\n/* Closing band                                                            */\n/* ---------------------------------------------------------------------- */\n\n.closing { text-align: left; }\n\n.closing .container {\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  gap: clamp(28px, 4vw, 44px);\n}\n\n.closing-headline {\n  font-family: var(--font-display);\n  text-transform: uppercase;\n  font-size: clamp(2.2rem, 7vw, 5.4rem);\n  max-width: 16ch;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Reveal-on-scroll                                                        */\n/* ---------------------------------------------------------------------- */\n\n.reveal {\n  opacity: 0;\n  transform: translateY(22px);\n  transition: opacity 700ms ease, transform 700ms ease;\n}\n\n.reveal.is-visible { opacity: 1; transform: translateY(0); }\n\n@media (prefers-reduced-motion: reduce) {\n  .reveal { opacity: 1; transform: none; transition: none; }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Footer                                                                   */\n/* ---------------------------------------------------------------------- */\n\n.site-footer {\n  background: var(--bg-2);\n  border-top: 1px solid rgba(var(--ink-rgb), .14);\n  padding: clamp(56px, 7vw, 88px) 0 clamp(28px, 4vw, 40px);\n}\n\n.footer-top {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: space-between;\n  gap: 32px;\n  padding-bottom: clamp(32px, 4vw, 48px);\n  border-bottom: 1px solid rgba(var(--ink-rgb), .14);\n}\n\n.footer-brand { display: flex; align-items: center; gap: .7em; color: var(--ink); }\n.footer-brand-text { font-family: var(--font-ui); font-size: 12px; color: var(--muted); line-height: 1.6; }\n.footer-brand-text .g1 { color: var(--ink); font-weight: 500; letter-spacing: .04em; }\n\n.footer-nav {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 14px 28px;\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n}\n\n.footer-nav a { text-decoration: none; color: var(--muted); }\n.footer-nav a:hover, .footer-nav a:focus-visible { color: var(--ink); }\n\n.footer-bottom { padding-top: clamp(24px, 3vw, 32px); display: flex; flex-direction: column; gap: 16px; }\n\n.footer-legal-row {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: space-between;\n  gap: 12px;\n  font-family: var(--font-ui);\n  font-size: 12px;\n  color: var(--muted);\n}\n\n.footer-compliance { color: var(--muted); font-size: 11.5px; max-width: 80ch; line-height: 1.6; }\n\n/* ---------------------------------------------------------------------- */\n/* Sticky sub-nav (capabilities.html)                                       */\n/* ---------------------------------------------------------------------- */\n\n.subnav {\n  position: sticky;\n  top: var(--header-h);\n  z-index: 100;\n  background: rgba(var(--bg-rgb), .94);\n  backdrop-filter: blur(8px);\n  border-bottom: 1px solid rgba(var(--ink-rgb), .14);\n}\n\n.subnav-inner {\n  display: flex;\n  gap: clamp(16px, 3vw, 32px);\n  overflow-x: auto;\n  padding: 14px clamp(20px, 5vw, 56px);\n  scrollbar-width: thin;\n}\n\n.subnav-inner::-webkit-scrollbar { height: 4px; }\n.subnav-inner::-webkit-scrollbar-thumb { background: var(--limestone); }\n\n.subnav a {\n  flex-shrink: 0;\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  text-decoration: none;\n  color: var(--muted);\n  padding-bottom: 4px;\n  border-bottom: 1px solid transparent;\n  white-space: nowrap;\n}\n\n.subnav a:hover, .subnav a:focus-visible, .subnav a.is-active {\n  color: var(--ink);\n  border-bottom-color: var(--ink);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Capabilities page \u2014 gallery bays                                        */\n/* ---------------------------------------------------------------------- */\n\n.page-head { padding: calc(var(--header-h) + 56px) 0 clamp(48px, 7vw, 80px); background: var(--bg); }\n.page-head-eyebrow { margin-bottom: 18px; }\n.page-head-title { font-family: var(--font-display); text-transform: uppercase; font-size: clamp(2.4rem, 7vw, 5rem); margin-bottom: 20px; }\n.page-head-intro { color: var(--muted); max-width: 64ch; font-size: clamp(1rem, 1.6vw, 1.2rem); }\n\n.bay { padding: var(--section-pad) 0; scroll-margin-top: calc(var(--header-h) + 56px); }\n.bay--alt { background: var(--bg-2); }\n.bay--ink { background: var(--ink); color: var(--bg); }\n.bay--ink .division-line,\n.bay--ink .service-list li,\n.bay--ink .relation-line { color: var(--muted-on-ink); }\n.bay--ink .service-list li::before { background: var(--muted-on-ink); }\n\n.division-label { display: flex; flex-direction: column; gap: 6px; }\n.division-index { font-family: var(--font-ui); font-size: 12px; letter-spacing: .1em; color: var(--muted); }\n.bay--ink .division-index { color: var(--muted-on-ink); }\n.division-cat { font-family: var(--font-ui); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }\n.bay--ink .division-cat { color: var(--muted-on-ink); }\n.bay--ink .ml { color: var(--muted-on-ink); }\n\n.division-name {\n  font-family: var(--font-display);\n  font-weight: 700;\n  text-transform: uppercase;\n  font-size: clamp(2.2rem, 6vw, 4.2rem);\n  margin-bottom: 16px;\n}\n\n.division-line { color: var(--muted); font-size: clamp(1.02rem, 1.7vw, 1.25rem); max-width: 56ch; margin-bottom: clamp(32px, 4.5vw, 52px); }\n\n.division-content { display: grid; grid-template-columns: 1fr; gap: clamp(28px, 4vw, 48px); }\n\n@media (min-width: 900px) {\n  .division-content { grid-template-columns: 1.05fr .95fr; align-items: start; }\n}\n\n.service-list { columns: 2; column-gap: 28px; }\n\n@media (max-width: 480px) { .service-list { columns: 1; } }\n\n.service-list li {\n  position: relative;\n  padding-left: 20px;\n  margin-bottom: 12px;\n  break-inside: avoid;\n  font-size: .95rem;\n}\n\n.service-list li::before {\n  content: \"\";\n  position: absolute;\n  left: 0;\n  top: .5em;\n  width: 6px;\n  height: 6px;\n  background: var(--concrete);\n}\n\n.division-aside { display: flex; flex-direction: column; gap: 20px; }\n\n.scenario {\n  border: 1px solid var(--concrete);\n  padding: clamp(18px, 2.4vw, 26px);\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n}\n\n.scenario p { font-style: italic; font-size: .98rem; }\n.bay--ink .scenario { border-color: var(--muted-on-ink); }\n\n.relation { display: flex; flex-direction: column; gap: 8px; }\n.relation-line { color: var(--muted); font-size: .92rem; }\n\n.division-compliance {\n  margin-top: 4px;\n  font-size: 11.5px;\n  color: var(--muted-on-ink);\n  max-width: 60ch;\n  line-height: 1.6;\n}\n\n.bay:not(.bay--ink) .division-compliance { color: var(--muted); }\n\n/* ---------------------------------------------------------------------- */\n/* Network page \u2014 mandate table + category cells + form                   */\n/* ---------------------------------------------------------------------- */\n\n.mandate-table { width: 100%; border-collapse: collapse; margin: clamp(24px, 4vw, 40px) 0; }\n\n.mandate-table tr { border-bottom: 1px solid rgba(var(--ink-rgb), .14); }\n.mandate-table tr:first-child { border-top: 1px solid rgba(var(--ink-rgb), .14); }\n\n.mandate-table td { padding: clamp(14px, 2vw, 20px) clamp(8px, 1.4vw, 16px); vertical-align: top; }\n\n.mandate-step-num {\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .1em;\n  color: var(--muted);\n  width: 64px;\n  white-space: nowrap;\n}\n\n.mandate-step-text { font-size: .98rem; }\n\n.mandate {\n  max-width: 820px;\n  margin: 0 auto;\n}\n\n.mandate-headline {\n  text-align: center;\n  font-family: var(--font-display);\n  text-transform: uppercase;\n  font-size: clamp(2rem, 5.5vw, 4rem);\n  margin-bottom: clamp(20px, 3vw, 30px);\n}\n\n.mandate-intro { text-align: center; color: var(--muted); max-width: 60ch; margin: 0 auto clamp(36px, 5vw, 56px); }\n\n.band .mandate-intro { color: var(--muted-on-ink); }\n\n.cat-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));\n  gap: 10px;\n  margin-bottom: clamp(36px, 5vw, 56px);\n}\n\n.cat-input {\n  position: absolute;\n  opacity: 0;\n  width: 1px;\n  height: 1px;\n}\n\n.cat-cell {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  padding: 18px 14px;\n  min-height: 64px;\n  border: 1px solid var(--concrete);\n  background: var(--bg-2);\n  font-family: var(--font-ui);\n  font-size: .84rem;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: var(--ink);\n  transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease;\n}\n\n.cat-input:checked + .cat-cell { background: var(--ink); color: var(--bg); border-color: var(--ink); }\n.cat-input:focus-visible + .cat-cell { outline: 2px solid var(--ink); outline-offset: 2px; }\n\n.mandate-form { display: grid; grid-template-columns: 1fr; gap: 22px; }\n\n@media (min-width: 680px) {\n  .mandate-form { grid-template-columns: 1fr 1fr; }\n  .field--full { grid-column: 1 / -1; }\n}\n\n.field { display: flex; flex-direction: column; gap: 8px; }\n\n.field > label {\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.band .field > label { color: var(--muted-on-ink); }\n\n.field input, .field select, .field textarea {\n  background: var(--bg-2);\n  border: 1px solid var(--concrete);\n  color: var(--ink);\n  padding: 13px 14px;\n  font-family: var(--font-ui);\n  font-size: .95rem;\n  border-radius: 0;\n}\n\n.field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible {\n  outline: none;\n  border-color: var(--ink);\n}\n\n.field textarea { resize: vertical; min-height: 120px; }\n\n.mandate-submit-row { margin-top: 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }\n\n.mandate-confidential { font-size: .85rem; color: var(--muted); max-width: 60ch; }\n\n.band .mandate-confidential { color: var(--muted-on-ink); }\n\n.mandate-confirmation {\n  display: none;\n  border: 1px solid var(--ink);\n  padding: 16px 20px;\n  color: var(--ink);\n  font-size: .92rem;\n}\n\n.band .mandate-confirmation { border-color: var(--bg); color: var(--bg); }\n\n.mandate-confirmation.is-visible { display: block; }\n\n/* ---------------------------------------------------------------------- */\n/* Utility text helpers                                                    */\n/* ---------------------------------------------------------------------- */\n\n.center { text-align: center; }\n.text-muted { color: var(--muted); }\n\n/* ---------------------------------------------------------------------- */\n/* Responsive guardrails                                                   */\n/* ---------------------------------------------------------------------- */\n\n@media (max-width: 640px) {\n  .footer-top { flex-direction: column; align-items: flex-start; }\n  .footer-legal-row { flex-direction: column; align-items: flex-start; }\n}\n\n</style>\n</head>\n<body data-c  aria-label=\"Primary\">\n      <a href=\"index.html\">Home</a>\n      <a href=\"capabilities.html\" class=\"is-active\" aria-current=\"page\">Capabilities</a>\n      <a href=\"network.html\">Network</a>\n      <a class=\"btn btn-primary nav-cta\" href=\"network.html#mandate\">Discuss an Opportunity</a>\n      <div class=\"lang-switch\" aria-label=\"Language\">\n        <span class=\"lang-current\" aria-current=\"true\">EN</span><span class=\"lang-sep\">|</span>\n        <span aria-disabled=\"true\">DE</span><span class=\"lang-sep\">|</span>\n        <span aria-disabled=\"true\">SR</span>\n      </div>\n      <button class=\"theme-toggle\" type=\"button\" aria-pressed=\"false\" aria-label=\"Toggle color scheme\">\n        <span class=\"theme-toggle-glyph\" aria-hidden=\"true\">&#9680;</span>\n        <span class=\"theme-toggle-label\">DARK</span>\n      </button>\n    </nav>\n    <button class=\"nav-toggle\" type=\"button\" aria-label=\"Open menu\" aria-expanded=\"false\" aria-controls=\"mobile-menu\">\n      <span class=\"nav-toggle-bars\"><span></span><span></span><span></span></span>\n    </button>\n  </div>\n</header>\n\n<div class=\"mobile-menu\" id=\"mobile-menu\">\n  <button class=\"mobile-menu-close\" type=\"button\" aria-label=\"Close menu\">&times;</button>\n  <a href=\"index.html\">Home</a>\n  <a href=\"capabilities.html\" class=\"is-active\">Capabilities</a>\n  <a href=\"network.html\">Network</a>\n  <a href=\"network.html#mandate\">Discuss an Opportunity</a>\n  <div class=\"lang-switch\" aria-label=\"Language\">\n    <span class=\"lang-current\" aria-current=\"true\">EN</span><span class=\"lang-sep\">|</span>\n    <span aria-disabled=\"true\">DE</span><span class=\"lang-sep\">|</span>\n    <span aria-disabled=\"true\">SR</span>\n  </div>\n  <button class=\"theme-toggle\" type=\"button\" aria-pressed=\"false\" aria-label=\"Toggle color scheme\">\n    <span class=\"theme-toggle-glyph\" aria-hidden=\"true\">&#9680;</span>\n    <span class=\"theme-toggle-label\">DARK</span>\n  </button>\n</div>\n\n<main>\n\n  <section class=\"page-head tex-board\">\n    <div class=\"container\">\n      <p class=\"ml page-head-eyebrow\">Byzaro Group \u2014 Capabilities</p>\n      <h1 class=\"page-head-title\">Five Capabilities. One Network.</h1>\n      <p class=\"page-head-intro\">One group, five capabilities, one network \u2014 assembled around each mandate. Whatever the opportunity requires, Byzaro assembles the right expertise, people and partners across markets.</p>\n    </div>\n  </section>\n\n  <nav class=\"subnav\" aria-label=\"Divisions\">\n    <div class=\"subnav-inner\">\n      <a href=\"#talent\" data-subnav=\"talent\">01 \u2014 Talent</a>\n      <a href=\"#digital\" data-subnav=\"digital\">02 \u2014 Digital</a>\n      <a href=\"#realestate\" data-subnav=\"realestate\">03 \u2014 Real Estate</a>\n      <a href=\"#capital\" data-subnav=\"capital\">04 \u2014 Capital</a>\n      <a href=\"#advisory\" data-subnav=\"advisory\">05 \u2014 Advisory</a>\n    </div>\n  </nav>\n\n  <section class=\"bay\" id=\"talent\">\n    <div class=\"container\">\n      <div class=\"label-row reveal\">\n        <div class=\"division-label\">\n          <span class=\"division-index\">01</span>\n          <span class=\"division-cat\">Talent &amp; Workforce Solutions</span>\n        </div>\n        <div>\n          <h2 class=\"division-name\">Talent</h2>\n          <p class=\"division-line\">Connecting companies with the people they need \u2014 across borders.</p>\n          <div class=\"division-content\">\n            <ul class=\"service-list\">\n              <li>International Recruitment</li>\n              <li>Executive Search</li>\n              <li>Temporary Staffing</li>\n              <li>Recruitment Outsourcing</li>\n              <li>Agency-to-Agency Recruiting</li>\n              <li>Cross-Border Workforce Projects</li>\n            </ul>\n            <div class=\"division-aside\">\n              <div class=\"scenario\">\n                <span class=\"ml\">Scenario</span>\n                <p>A growing company needs specialized people in a new market \u2014 sourced, vetted and placed across borders.</p>\n              </div>\n              <div class=\"relation\">\n                <span class=\"ml\">Network</span>\n                <p class=\"relation-line\">Talent solutions rarely stand alone \u2014 placements often connect to Advisory structuring or Digital systems as a company scales across borders.</p>\n              </div>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"bay bay--alt\" id=\"digital\">\n    <div class=\"container\">\n      <div class=\"label-row reveal\">\n        <div class=\"division-label\">\n          <span class=\"division-index\">02</span>\n          <span class=\"division-cat\">Technology, AI &amp; Digital Growth</span>\n        </div>\n        <div>\n          <h2 class=\"division-name\">Digital</h2>\n          <p class=\"division-line\">Building the technology and digital systems behind modern businesses.</p>\n          <div class=\"division-content\">\n            <ul class=\"service-list\">\n              <li>Corporate Websites &amp; Applications</li>\n              <li>Custom Software</li>\n              <li>AI Agents &amp; Automation</li>\n              <li>CRM &amp; ERP Systems</li>\n              <li>Digital Strategy</li>\n              <li>Performance Marketing</li>\n            </ul>\n            <div class=\"division-aside\">\n              <div class=\"scenario\">\n                <span class=\"ml\">Scenario</span>\n                <p>An established business needs its digital infrastructure \u2014 software, automation and visibility \u2014 built to an international standard.</p>\n              </div>\n              <div class=\"relation\">\n                <span class=\"ml\">Network</span>\n                <p class=\"relation-line\">Digital capability is built to work alongside the group's other disciplines \u2014 from Advisory structuring to Real Estate premises \u2014 as part of a single mandate.</p>\n              </div>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"bay\" id=\"realestate\">\n    <div class=\"container\">\n      <div class=\"label-row reveal\">\n        <div class=\"division-label\">\n          <span class=\"division-index\">03</span>\n          <span class=\"division-cat\">International Real Estate</span>\n        </div>\n        <div>\n          <h2 class=\"division-name\">Real Estate</h2>\n          <p class=\"division-line\">Connecting property, people and opportunity across markets.</p>\n          <div class=\"division-content\">\n            <ul class=\"service-list\">\n              <li>International Brokerage</li>\n              <li>Buyer &amp; Seller Representation</li>\n              <li>Off-Market Opportunities</li>\n              <li>Investment Properties</li>\n              <li>Property Search &amp; Relocation</li>\n              <li>Real Estate Investment Advisory</li>\n            </ul>\n            <div class=\"division-aside\">\n              <div class=\"scenario\">\n                <span class=\"ml\">Scenario</span>\n                <p>Active across the UAE, Switzerland, Serbia, Montenegro, Croatia, Germany and Italy \u2014 and internationally through trusted partners.</p>\n              </div>\n              <div class=\"relation\">\n                <span class=\"ml\">Network</span>\n                <p class=\"relation-line\">Real estate mandates often connect to Advisory structuring, Capital introductions and Talent placements as part of a single cross-border move.</p>\n              </div>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"bay bay--ink\" id=\"capital\">\n    <div class=\"container\">\n      <div class=\"label-row reveal\">\n        <div class=\"division-label\">\n          <span class=\"division-index\">04</span>\n          <span class=\"division-cat\">Private Markets &amp; Selected Opportunities</span>\n        </div>\n        <div>\n          <h2 class=\"division-name\">Capital</h2>\n          <p class=\"division-line\">Connecting qualified clients with selected private-market opportunities.</p>\n          <div class=\"division-content\">\n            <ul class=\"service-list\">\n              <li>Selected Investment Opportunities</li>\n              <li>Investor Introductions</li>\n              <li>Capital Advisory</li>\n              <li>Project Introductions</li>\n              <li>Strategic Capital Connections</li>\n            </ul>\n            <div class=\"division-aside\">\n              <div class=\"relation\">\n                <span class=\"ml\">Network</span>\n                <p class=\"relation-line\">Capital introductions are coordinated alongside Advisory structuring and Real Estate opportunities, assembled around each mandate.</p>\n              </div>\n              <p class=\"division-compliance\">Selected opportunities may only be available to eligible or qualified investors and are subject to jurisdiction, due diligence and applicable regulation. Byzaro is not a bank, investment fund or regulated financial institution.</p>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"bay bay--alt\" id=\"advisory\">\n    <div class=\"container\">\n      <div class=\"label-row reveal\">\n        <div class=\"division-label\">\n          <span class=\"division-index\">05</span>\n          <span class=\"division-cat\">Corporate &amp; Strategic Advisory</span>\n        </div>\n        <div>\n          <h2 class=\"division-name\">Advisory</h2>\n          <p class=\"division-line\">Structure, expansion and execution across jurisdictions.</p>\n          <div class=\"division-content\">\n            <ul class=\"service-list\">\n              <li>International Company var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (reduce || sessionStorage.getItem('bz04-intro')) {\n      overlay.setAttribute('data-hidden', 'true');\n      overlay.style.display = 'none';\n    } else {\n      var mark = document.getElementById('intro-mark');\n      requestAnimationFrame(function () {\n        requestAnimationFrame(function () {\n          mark.classList.add('bz-run');\n        });\n      });\n      setTimeout(function () {\n        overlay.setAttribute('data-hidden', 'true');\n        sessionStorage.setItem('bz04-intro', '1');\n        setTimeout(function () { overlay.style.display = 'none'; }, 500);\n      }, 1300);\n    }\n  }\n\n  var toggle = document.querySelector('.nav-toggle');\n  var menu = document.querySelector('.mobile-menu');\n  var closeBtn = document.querySelector('.mobile-menu-close');\n  function openMenu() {\n    menu.classList.add('is-open');\n    toggle.setAttribute('aria-expanded', 'true');\n    document.body.style.overflow = 'hidden';\n  }\n  function closeMenu() {\n    menu.classList.remove('is-open');\n    toggle.setAttribute('aria-expanded', 'false');\n    document.body.style.overflow = '';\n  }\n  if (toggle) {\n    toggle.addEventListener('click', function () {\n      var expanded = toggle.getAttribute('aria-expanded') === 'true';\n      if (expanded) { closeMenu(); } else { openMenu(); }\n    });\n  }\n  if (closeBtn) { closeBtn.addEventListener('click', closeMenu); }\n  if (menu) {\n    menu.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', closeMenu); });\n  }\n\n  var themeToggles = document.querySelectorAll('.theme-toggle');\n  var themeLabels = { light: 'DARK', dark: 'LIGHT' };\n  function currentTheme() {\n    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';\n  }\n  function updateThemeToggles() {\n    var theme = currentTheme();\n    themeToggles.forEach(function (btn) {\n      btn.setAttribute('aria-pressed', String(theme === 'dark'));\n      var label = btn.querySelector('.theme-toggle-label');\n      if (label) { label.textContent = themeLabels[theme]; }\n    });\n  }\n  function setTheme(theme) {\n    document.documentElement.classList.add('theme-transition');\n    window.setTimeout(function () {\n      document.documentElement.classList.remove('theme-transition');\n    }, 320);\n    if (theme === 'dark') {\n      document.documentElement.setAttribute('data-theme', 'dark');\n    } else {\n      document.documentElement.removeAttribute('data-theme');\n    }\n    try { localStorage.setItem('bz-theme-04', theme); } catch (e) {}\n    updateThemeToggles();\n  }\n  updateThemeToggles();\n  themeToggles.forEach(function (btn) {\n    btn.addEventListener('click', function () {\n      setTheme(currentTheme() === 'dark' ? 'light' : 'dark');\n    });\n  });\n\n  var subnavLinks = document.querySelectorAll('.subnav a');\n  var bays = document.querySelectorAll('.bay');\n  if ('IntersectionObserver' in window && subnavLinks.length) {\n    var subIo = new IntersectionObserver(function (entries) {\n      entries.forEach(function (entry) {\n        if (entry.isIntersecting) {\n          subnavLinks.forEach(function (a) {\n            a.classList.toggle('is-active', a.getAttribute('data-subnav') === entry.target.id);\n          });\n        }\n      });\n    }, { rootMargin: '-40% 0px -50% 0px' });\n    bays.forEach(function (b) { subIo.observe(b); });\n  }\n\n  var reveals = document.querySelectorAll('.reveal');\n  if ('IntersectionObserver' in window) {\n    var io = new IntersectionObserver(function (entries) {\n      entries.forEach(function (entry) {\n        if (entry.isIntersecting) {\n          entry.target.classList.add('is-visible');\n          io.unobserve(entry.target);\n        }\n      });\n    }, { threshold: .15 });\n    reveals.forEach(function (el) { io.observe(el); });\n  } else {\n    reveals.forEach(function (el) { el.classList.add('is-visible'); });\n  }\n})();\n<\/script>\n\n<script>(function(){\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a[href]');\n    if(!a) return;\n    var href = a.getAttribute('href') || '';\n    if(/^(https?:|mailto:|tel:)/i.test(href)) { a.target = '_blank'; return; }\n    var m = href.match(/^(?:\\.\\.\\/)?(?:([0-9]{2}-[a-z]+)\\/)?([a-z]+\\.html)?(#.*)?$/i);\n    if(!m) return;\n    if(href.charAt(0) === '#') return;          /* Anker in der Seite: normal lassen */\n    e.preventDefault();\n    parent.postMessage({bzNav: {concept: m[1] || null, page: m[2] || 'index.html', hash: m[3] || ''}}, '*');\n  }, true);\n  window.addEventListener('message', function(e){\n    if(e.data && e.data.bzHash){ location.hash = e.data.bzHash; }\n  });\n})();<\/script>\n\n</body>\n</html>\n", "04-monolith/network.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<script>(function(){try{if(localStorage.getItem('bz-theme-04')==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();<\/script>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>BYZARO GROUP \u2014 The Network</title>\n<meta name=\"description\" content=\"One international network across Serbia, Switzerland, the UAE, Montenegro, Croatia, Germany and Italy \u2014 assembled around each mandate.\">\n<meta name=\"robots\" content=\"noindex\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&amp;family=Jost:wght@300;400;500&amp;display=swap\" rel=\"stylesheet\">\n<style>\n/* ==========================================================================\n   BYZARO GROUP \u2014 Concept 04: MONOLITH\n   Shared stylesheet for index.html, capabilities.html, network.html\n   Pure material, zero color. Board-formed concrete, daylight, museum labels.\n   ========================================================================== */\n\n:root {\n  /* Light theme (default \u2014 no data-theme attribute required) */\n  --bg: #E8E6E1;\n  --bg-2: #DEDBD4;\n  --concrete: #8E8B85;\n  --limestone: #B4AFA6;\n  --ink: #17171A;\n  --muted: #57565A;\n  --muted-on-ink: #B9B7B2;\n\n  --bg-rgb: 232, 230, 225;\n  --ink-rgb: 23, 23, 26;\n  --shaft-op: .06;\n\n  --font-display: \"Archivo\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-ui: \"Jost\", system-ui, sans-serif;\n\n  --container: 1320px;\n  --section-pad: clamp(88px, 11vh, 160px);\n  --header-h: 76px;\n}\n\n[data-theme=\"dark\"] {\n  --bg: #1A1A1C;\n  --bg-2: #232326;\n  --concrete: #7A7873;\n  --limestone: #3A3A3D;\n  --ink: #E8E6E1;\n  --muted: #A3A29E;\n  --muted-on-ink: #57565A;\n\n  --bg-rgb: 26, 26, 28;\n  --ink-rgb: 232, 230, 225;\n  --shaft-op: .08;\n}\n\n@media (prefers-reduced-motion: no-preference) {\n  html.theme-transition,\n  html.theme-transition *,\n  html.theme-transition *::before,\n  html.theme-transition *::after {\n    transition: background-color 300ms ease, color 300ms ease, border-color 300ms ease, fill 300ms ease, stroke 300ms ease !important;\n  }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Reset                                                                    */\n/* ---------------------------------------------------------------------- */\n\n*, *::before, *::after { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; }\n\nhtml, body { max-width: 100%; overflow-x: hidden; }\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--ink);\n  font-family: var(--font-ui);\n  font-weight: 400;\n  font-size: 1rem;\n  line-height: 1.7;\n  min-width: 320px;\n}\n\nimg, svg { display: block; max-width: 100%; }\na { color: inherit; }\nbutton { font: inherit; cursor: pointer; }\nul { list-style: none; margin: 0; padding: 0; }\np { margin: 0; }\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: 700;\n  line-height: .94;\n  margin: 0;\n  letter-spacing: -.01em;\n}\n\n.container {\n  max-width: var(--container);\n  margin: 0 auto;\n  padding: 0 clamp(20px, 5vw, 56px);\n}\n\n:focus-visible {\n  outline: 2px solid var(--ink);\n  outline-offset: 3px;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Signature motifs \u2014 board-formed concrete + light shaft + museum labels  */\n/* ---------------------------------------------------------------------- */\n\n.tex-board {\n  background-image: repeating-linear-gradient(\n    to bottom,\n    rgba(var(--ink-rgb), .04) 0,\n    rgba(var(--ink-rgb), .04) 1px,\n    transparent 1px,\n    transparent 48px\n  );\n}\n\n.tex-board.tex-holes {\n  background-image:\n    radial-gradient(circle, rgba(var(--ink-rgb), .08) 2px, transparent 2.5px),\n    repeating-linear-gradient(\n      to bottom,\n      rgba(var(--ink-rgb), .04) 0,\n      rgba(var(--ink-rgb), .04) 1px,\n      transparent 1px,\n      transparent 48px\n    );\n  background-size: 120px 120px, auto;\n}\n\n.tex-shaft { position: relative; }\n\n.tex-shaft::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background: linear-gradient(115deg,\n    rgba(255, 255, 255, 0) 28%,\n    rgba(255, 255, 255, var(--shaft-op)) 54%,\n    rgba(255, 255, 255, 0) 80%);\n  pointer-events: none;\n  z-index: 0;\n}\n\n.tex-shaft > * { position: relative; z-index: 1; }\n\n.ml {\n  display: block;\n  font-family: var(--font-ui);\n  font-weight: 500;\n  font-size: 10.5px;\n  letter-spacing: .2em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.band .ml { color: var(--muted-on-ink); }\n\n.label-row {\n  display: grid;\n  grid-template-columns: 160px 1fr;\n  gap: 16px 40px;\n  align-items: start;\n}\n\n@media (max-width: 820px) {\n  .label-row { grid-template-columns: 1fr; gap: 12px; }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Buttons                                                                  */\n/* ---------------------------------------------------------------------- */\n\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 10px;\n  border: 1px solid var(--ink);\n  background: transparent;\n  color: var(--ink);\n  padding: 15px 28px;\n  font-family: var(--font-ui);\n  font-weight: 500;\n  font-size: 12px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  text-decoration: none;\n  transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease;\n}\n\n.btn:hover, .btn:focus-visible {\n  background: var(--ink);\n  color: var(--bg);\n}\n\n.band .btn { border-color: var(--bg); color: var(--bg); }\n.band .btn:hover, .band .btn:focus-visible { background: var(--bg); color: var(--ink); }\n\n.btn-ghost {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  border: none;\n  background: none;\n  padding: 0;\n  color: var(--ink);\n  font-family: var(--font-ui);\n  font-weight: 500;\n  font-size: 12px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  text-decoration: none;\n  border-bottom: 1px solid var(--concrete);\n  padding-bottom: 2px;\n  transition: border-color 200ms ease, gap 200ms ease;\n}\n\n.btn-ghost:hover, .btn-ghost:focus-visible { border-color: var(--ink); gap: 12px; }\n\n/* ---------------------------------------------------------------------- */\n/* Wordmark \u2014 verbindlicher Baustein, exact markup/CSS per WORDMARK.md     */\n/* ---------------------------------------------------------------------- */\n\n.brand { display: inline-flex; align-items: center; gap: .7em; text-decoration: none; color: inherit; }\n.byzaro-mark { width: auto; height: 32px; flex-shrink: 0; }\n.footer-brand .byzaro-mark { height: 26px; }\n.mobile-menu .byzaro-mark { height: 36px; }\n\n.brand-text { display: flex; flex-direction: column; gap: .28em; min-width: 0; }\n\n.brand-word {\n  font-family: \"Jost\", system-ui, sans-serif;\n  font-weight: 500;\n  font-size --------- */\n\n.site-header {\n  position: fixed;\n  top: 0; left: 0; right: 0;\n  z-index: 500;\n  background: rgba(var(--bg-rgb), .88);\n  backdrop-filter: blur(10px);\n  border-bottom: 1px solid rgba(var(--ink-rgb), .1);\n}\n\n.nav {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 16px;\n  padding-top: 18px;\n  padding-bottom: 18px;\n}\n\n.brand { color: var(--ink); flex-shrink: 0; }\n\n.nav-links {\n  display: flex;\n  align-items: center;\n  gap: clamp(16px, 2.2vw, 32px);\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n}\n\n.nav-links a:not(.btn) {\n  text-decoration: none;\n  color: var(--muted);\n  padding: 4px 0;\n  border-bottom: 1px solid transparent;\n  transition: color 200ms ease, border-color 200ms ease;\n}\n\n.nav-links a:not(.btn):hover,\n.nav-links a:not(.btn):focus-visible,\n.nav-links a.is-active {\n  color: var(--ink);\n  border-bottom-color: var(--ink);\n}\n\n.nav-cta { padding: 11px 20px; font-size: 11px; }\n\n.lang-switch {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .12em;\n}\n\n.lang-switch a, .lang-switch .lang-current { color: var(--ink); text-decoration: none; }\n\n.lang-switch span[aria-disabled=\"true\"] { color: var(--muted); }\n\n.lang-sep { color: var(--muted); }\n\n/* ---------------------------------------------------------------------- */\n/* Theme toggle                                                             */\n/* ---------------------------------------------------------------------- */\n\n.theme-toggle {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  background: transparent;\n  border: none;\n  padding: 4px 0;\n  color: var(--ink);\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n}\n\n.theme-toggle-glyph { font-size: 13px; line-height: 1; }\n\n.theme-toggle:hover, .theme-toggle:focus-visible { color: var(--muted); }\n\n.mobile-menu .theme-toggle { margin-top: 12px; font-size: 13px; justify-content: center; color: var(--ink); }\n\n/* ---------------------------------------------------------------------- */\n/* Mobile menu                                                             */\n/* ---------------------------------------------------------------------- */\n\n.nav-toggle {\n  display: none;\n  background: transparent;\n  border: 1px solid var(--concrete);\n  width: 42px;\n  height: 42px;\n  align-items: center;\n  justify-content: center;\n  flex-shrink: 0;\n}\n\n.nav-toggle-bars { position: relative; width: 18px; height: 12px; }\n\n.nav-toggle-bars span {\n  position: absolute;\n  left: 0; right: 0;\n  height: 1px;\n  background: var(--ink);\n  transition: transform 200ms ease, opacity 200ms ease, top 200ms ease;\n}\n\n.nav-toggle-bars span:nth-child(1) { top: 0; }\n.nav-toggle-bars span:nth-child(2) { top: 5px; }\n.nav-toggle-bars span:nth-child(3) { top: 11px; }\n\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(1) { top: 5px; transform: rotate(45deg); }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(2) { opacity: 0; }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(3) { top: 5px; transform: rotate(-45deg); }\n\n.mobile-menu {\n  position: fixed;\n  inset: 0;\n  z-index: 600;\n  background: var(--bg);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: clamp(20px, 5vh, 36px);\n  transform: translateY(-100%);\n  opacity: 0;\n  transition: transform 320ms ease, opacity 320ms ease;\n  visibility: hidden;\n  font-family: var(--font-ui);\n  text-transform: uppercase;\n  letter-spacing: .1em;\n  font-size: 18px;\n}\n\n.mobile-menu.is-open { transform: translateY(0); opacity: 1; visibility: visible; }\n\n.mobile-menu a { text-decoration: none; color: var(--ink); }\n.mobile-menu a.is-active { color: var(--muted); }\n\n.mobil 12px; color: var(--muted); line-height: 1.6; }\n.footer-brand-text .g1 { color: var(--ink); font-weight: 500; letter-spacing: .04em; }\n\n.footer-nav {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 14px 28px;\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n}\n\n.footer-nav a { text-decoration: none; color: var(--muted); }\n.footer-nav a:hover, .footer-nav a:focus-visible { color: var(--ink); }\n\n.footer-bottom { padding-top: clamp(24px, 3vw, 32px); display: flex; flex-direction: column; gap: 16px; }\n\n.footer-legal-row {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: space-between;\n  gap: 12px;\n  font-family: var(--font-ui);\n  font-size: 12px;\n  color: var(--muted);\n}\n\n.footer-compliance { color: var(--muted); font-size: 11.5px; max-width: 80ch; line-height: 1.6; }\n\n/* ---------------------------------------------------------------------- */\n/* Sticky sub-nav (capabilities.html)                                       */\n/* ---------------------------------------------------------------------- */\n\n.subnav {\n  position: sticky;\n  top: var(--header-h);\n  z-index: 100;\n  background: rgba(var(--bg-rgb), .94);\n  backdrop-filter: blur(8px);\n  border-bottom: 1px solid rgba(var(--ink-rgb), .14);\n}\n\n.subnav-inner {\n  display: flex;\n  gap: clamp(16px, 3vw, 32px);\n  overflow-x: auto;\n  padding: 14px clamp(20px, 5vw, 56px);\n  scrollbar-width: thin;\n}\n\n.subnav-inner::-webkit-scrollbar { height: 4px; }\n.subnav-inner::-webkit-scrollbar-thumb { background: var(--limestone); }\n\n.subnav a {\n  flex-shrink: 0;\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  text-decoration: none;\n  color: var(--muted);\n  padding-bottom: 4px;\n  border-bottom: 1px solid transparent;\n  white-space: nowrap;\n}\n\n.subnav a:hover, .subnav a:focus-visible, .subnav a.is-active {\n  color: var(--ink);\n  border-bottom-color: var(--ink);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Capabilities page \u2014 gallery bays                                        */\n/* ---------------------------------------------------------------------- */\n\n.page-head { padding: calc(var(--header-h) + 56px) 0 clamp(48px, 7vw, 80px); background: var(--bg); }\n.page-head-eyebrow { margin-bottom: 18px; }\n.page-head-title { font-family: var(--font-display); text-transform: uppercase; font-size: clamp(2.4rem, 7vw, 5rem); margin-bottom: 20px; }\n.page-head-intro { color: var(--muted); max-width: 64ch; font-size: clamp(1rem, 1.6vw, 1.2rem); }\n\n.bay { padding: var(--section-pad) 0; scroll-margin-top: calc(var(--header-h) + 56px); }\n.bay--alt { background: var(--bg-2); }\n.bay--ink { background: var(--ink); color: var(--bg); }\n.bay--ink .division-line,\n.bay--ink .service-list li,\n.bay--ink .relation-line { color: var(--muted-on-ink); }\n.bay--ink .service-list li::before { background: var(--muted-on-ink); }\n\n.division-label { display: flex; flex-direction: column; gap: 6px; }\n.division-index { font-family: var(--font-ui); font-size: 12px; letter-spacing: .1em; color: var(--muted); }\n.bay--ink .division-index { color: var(--muted-on-ink); }\n.division-cat { font-family: var(--font-ui); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }\n.bay--ink .division-cat { color: var(--muted-on-ink); }\n.bay--ink .ml { color: var(--muted-on-ink); }\n\n.division-name {\n  font-family: var(--font-display);\n  font-weight: 700;\n  text-transform: uppercase;\n  font-size: clamp(2.2rem, 6vw, 4.2rem);\n  margin-bottom: 16px;\n}\n\n.division-line { color: var(--muted); font-size: clamp(1.02rem, 1.7vw, 1.25rem); max-width: 56ch; margin-bottom: clamp(32px, 4.5vw, 52px); }\n\n.division-content { display: grid; grid-template-columns: 1fr; gap: clamp(28px, 4vw, 48px); }\n\n@media (min-width: 900px) {\n  .division-content { grid-template-columns: 1.05fr .95fr; align-items: start; }\n}\n\n.service-list { columns: 2; column-gap: 28px; }\n\n@media (max-width: 480px) { .service-list { columns: 1; } }\n\n.service-list li {\n  position: relative;\n  padding-left: 20px;\n  margin-bottom: 12px;\n  break-inside: avoid;\n  font-size: .95rem;\n}\n\n.service-list li::before {\n  content: \"\";\n  position: absolute;\n  left: 0;\n  top: .5em;\n  width: 6px;\n  height: 6px;\n  background: var(--concrete);\n}\n\n.division-aside { display: flex; flex-direction: column; gap: 20px; }\n\n.scenario {\n  border: 1px solid var(--concrete);\n  padding: clamp(18px, 2.4vw, 26px);\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n}\n\n.scenario p { font-style: italic; font-size: .98rem; }\n.bay--ink .scenario { border-color: var(--muted-on-ink); }\n\n.relation { display: flex; flex-direction: column; gap: 8px; }\n.relation-line { color: var(--muted); font-size: .92rem; }\n\n.division-compliance {\n  margin-top: 4px;\n  font-size: 11.5px;\n  color: var(--muted-on-ink);\n  max-width: 60ch;\n  line-height: 1.6;\n}\n\n.bay:not(.bay--ink) .division-compliance { color: var(--muted); }\n\n/* ---------------------------------------------------------------------- */\n/* Network page \u2014 mandate table + category cells + form                   */\n/* ---------------------------------------------------------------------- */\n\n.mandate-table { width: 100%; border-collapse: collapse; margin: clamp(24px, 4vw, 40px) 0; }\n\n.mandate-table tr { border-bottom: 1px solid rgba(var(--ink-rgb), .14); }\n.mandate-table tr:first-child { border-top: 1px solid rgba(var(--ink-rgb), .14); }\n\n.mandate-table td { padding: clamp(14px, 2vw, 20px) clamp(8px, 1.4vw, 16px); vertical-align: top; }\n\n.mandate-step-num {\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .1em;\n  color: var(--muted);\n  width: 64px;\n  white-space: nowrap;\n}\n\n.mandate-step-text { font-size: .98rem; }\n\n.mandate {\n  max-width: 820px;\n  margin: 0 auto;\n}\n\n.mandate-headline {\n  text-align: center;\n  font-family: var(--font-display);\n  text-transform: uppercase;\n  font-size: clamp(2rem, 5.5vw, 4rem);\n  margin-bottom: clamp(20px, 3vw, 30px);\n}\n\n.mandate-intro { text-align: center; color: var(--muted); max-width: 60ch; margin: 0 auto clamp(36px, 5vw, 56px); }\n\n.band .mandate-intro { color: var(--muted-on-ink); }\n\n.cat-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));\n  gap: 10px;\n  margin-bottom: clamp(36px, 5vw, 56px);\n}\n\n.cat-input {\n  position: absolute;\n  opacity: 0;\n  width: 1px;\n  height: 1px;\n}\n\n.cat-cell {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  padding: 18px 14px;\n  min-height: 64px;\n  border: 1px solid var(--concrete);\n  background: var(--bg-2);\n  font-family: var(--font-ui);\n  font-size: .84rem;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: var(--ink);\n  transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease;\n}\n\n.cat-input:checked + .cat-cell { background: var(--ink); color: var(--bg); border-color: var(--ink); }\n.cat-input:focus-visible + .cat-cell { outline: 2px solid var(--ink); outline-offset: 2px; }\n\n.mandate-form { display: grid; grid-template-columns: 1fr; gap: 22px; }\n\n@media (min-width: 680px) {\n  .mandate-form { grid-template-columns: 1fr 1fr; }\n  .field--full { grid-column: 1 / -1; }\n}\n\n.field { display: flex; flex-direction: column; gap: 8px; }\n\n.field > label {\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n.band .field > label { color: var(--muted-on-ink); }\n\n.field input, .field select, .field textarea {\n  background: var(--bg-2);\n  border: 1px solid var(--concrete);\n  color: var(--ink);\n  padding: 13px 14px;\n  font-family: var(--font-ui);\n  font-size: .95rem;\n  border-radius: 0;\n}\n\n.field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible {\n  outline: none;\n  border-color: var(--ink);\n}\n\n.field textarea { resize: vertical; min-height: 120px; }\n\n.mandate-submit-row { margin-top: 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }\n\n.mandate-confidential { font-size: .85rem; color: var(--muted); max-width: 60ch; }\n\n.band .mandate-confidential { color: var(--muted-on-ink); }\n\n.mandate-confirmation {\n  display: none;\n  border: 1px solid var(--ink);\n  padding: 16px 20px;\n  color: var(--ink);\n  font-size: .92rem;\n}\n\n.band .mandate-confirmation { border-color: var(--bg); color: var(--bg); }\n\n.mandate-confirmation.is-visible { display: block; }\n\n/* ---------------------------------------------------------------------- */\n/* Utility text helpers                                                    */\n/* ---------------------------------------------------------------------- */\n\n.center { text-align: center; }\n.text-muted { color: var(--muted); }\n\n/* ---------------------------------------------------------------------- */\n/* Responsive guardrails                                                   */\n/* ---------------------------------------------------------------------- */\n\n@media (max-width: 640px) {\n  .footer-top { flex-direction: column; align-items: flex-start; }\n  .footer-legal-row { flex-direction: column; align-items: flex-start; }\n}\n\n</style>\n</head>\n<body data-concept=\"04\">\n\n<div class=\"intro-overlay\" id=\"intro-overlay\">\n  <svg class=\"intro-mark\" id=\"intro-mark\" viewBox=\"0 0 367 390\" fill=\"currentColor\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Byzaro Group\">\n    <defs><path id=\"bzb-intro-n\" fill-rule=\"evenodd\" d=\"M0,0 H164 V56 C161,68 145,70 145,90 C145,110 161,112 164,124 V181 H0 Z M33,32 H131 V54 A20,20 0 0 1 111,74 H76 V107 H110 A21,21 0 0 1 131,128 V149 H33 Z\"/></defs>\n    <g class=\"bz-b bz-b1\"><use href=\"#bzb-intro-n\" t hapter-head reveal\">\n        <span class=\"chapter-numeral\">I</span>\n        <h2 class=\"chapter-title\">The Plan</h2>\n      </div>\n\n      <div class=\"plan-wrap reveal\">\n        <svg class=\"plan-svg\" viewBox=\"-60 -60 720 720\" role=\"img\" aria-label=\"Diagram showing the Byzaro mark at the centre, connected to the five capabilities on the primary axes and the seven network markets on the outer ring, bounded by a dashed outer ring of trusted partners\">\n          <circle class=\"plan-boundary\" cx=\"300\" cy=\"300\" r=\"270\"></circle>\n          <text class=\"plan-boundary-label\" x=\"300\" y=\"18\" text-anchor=\"middle\">Trusted Partners</text>\n\n          <g class=\"plan-lines\">\n            <line x1=\"300\" y1=\"300\" x2=\"300\" y2=\"170\"></line>\n            <line x1=\"300\" y1=\"300\" x2=\"423.6\" y2=\"259.8\"></line>\n            <line x1=\"300\" y1=\"300\" x2=\"376.4\" y2=\"405.2\"></line>\n            <line x1=\"300\" y1=\"300\" x2=\"223.6\" y2=\"405.2\"></line>\n            <line x1=\"300\" y1=\"300\" x2=\"176.4\" y2=\"259.8\"></line>\n            <line x1=\"300\" y1=\"300\" x2=\"395.5\" y2=\"101.8\"></line>\n            <line x1=\"300\" y1=\"300\" x2=\"514.5\" y2=\"251\"></line>\n            <line x1=\"300\" y1=\"300\" x2=\"472\" y2=\"437.2\"></line>\n            <line x1=\"300\" y1=\"300\" x2=\"300\" y2=\"520\"></line>\n            <line x1=\"300\" y1=\"300\" x2=\"128\" y2=\"437.2\"></line>\n            <line x1=\"300\" y1=\"300\" x2=\"85.5\" y2=\"251\"></line>\n            <line x1=\"300\" y1=\"300\" x2=\"204.5\" y2=\"101.8\"></line>\n          </g>\n\n          <g class=\"plan-dim\">\n            <line x1=\"423.6\" y1=\"259.8\" x2=\"514.5\" y2=\"251\"></line>\n            <line x1=\"418.6\" y1=\"255.4\" x2=\"428.6\" y2=\"264.2\"></line>\n            <line x1=\"509.5\" y1=\"246.6\" x2=\"519.5\" y2=\"255.4\"></line>\n\n            <line x1=\"223.6\" y1=\"405.2\" x2=\"128\" y2=\"437.2\"></line>\n            <line x1=\"219\" y1=\"400.6\" x2=\"228.2\" y2=\"409.8\"></line>\n            <line x1=\"123.4\" y1=\"432.6\" x2=\"132.6\" y2=\"441.8\"></line>\n          </g>\n\n          <rect class=\"plan-center-frame\" x=\"260\" y=\"260\" width=\"80\" height=\"80\"></rect>\n          <svg x=\"277\" y=\"277\" width=\"46\" height=\"46\" viewBox=\"0 0 367 390\" fill=\"currentColor\">\n            <defs><path id=\"bzb-plan-n\" fill-rule=\"evenodd\" d=\"M0,0 H164 V56 C161,68 145,70 145,90 C145,110 161,112 164,124 V181 H0 Z M33,32 H131 V54 A20,20 0 0 1 111,74 H76 V107 H110 A21,21 0 0 1 131,128 V149 H33 Z\"/></defs>\n            <use href=\"#bzb-plan-n\" transform=\"translate(203,0)\"></use>\n            <use href=\"#bzb-plan-n\" transform=\"translate(164,0) scale(-1,1)\"></use>\n            <use href=\"#bzb-plan-n\" transform=\"translate(203,209)\"></use>\n            <use href=\"#bzb-plan-n\" transform=\"translate(164,209) scale(-1,1)\"></use>\n          </svg>\n\n          <g class=\"plan-nodes\">\n            <rect class=\"plan-node\" x=\"297\" y=\"167\" width=\"6\" height=\"6\"></rect>\n            <rect class=\"plan-node\" x=\"420.6\" y=\"256.8\" width=\"6\" height=\"6\"></rect>\n            <rect class=\"plan-node\" x=\"373.4\" y=\"402.2\" width=\"6\" height=\"6\"></rect>\n            <rect class=\"plan-node\" x=\"220.6\" y=\"402.2\" width=\"6\" height=\"6\"></rect>\n            <rect class=\"plan-node\" x=\"173.4\" y=\"256.8\" width=\"6\" height=\"6\"></rect>\n            <rect class=\"plan-node\" x=\"392.5\" y=\"98.8\" width=\"6\" height=\"6\"></rect>\n            <rect class=\"plan-node\" x=\"511.5\" y=\"248\" width=\"6\" height=\"6\"></rect>\n            <rect class=\"plan-node\" x=\"469\" y=\"434.2\" width=\"6\" height=\"6\"></rect>\n            <rect class=\"plan-node\" x=\"297\" y=\"517\" width=\"6\" height=\"6\"></rect>\n            <rect class=\"plan-node\" x=\"125\" y=\"434.2\" width=\"6\" height=\"6\"></rect>\n            <rect class=\"plan-node\" x=\"82.5\" y=\"248\" width=\"6\" height=\"6\"></rect>\n            <rect class=\"plan-node\" x=\"201.5\" y=\"98.8\" width=\"6\" height=\"6\"></rect>\n          </g>\n\n          <text class=\"plan-label\" x=\"300\" y=\"156\" text-anchor=\"middle\">Talent</text>\n          <text class=\"plan-label\" x=\"435\" y=\"256\" text-anchor=\"start\">Digital</text>\n          <text class=\"plan-label\" x=\"388\" y=\"420\" text-anchor=\"start\">Real Estate</text>\n          <text class=\"plan-label\" x=\"212\" y=\"420\" text-anchor=\"end\">Advisory</text>\n          <text class=\"plan-label\" x=\"164\" y=\"256\" text-anchor=\"end\">Capital</text>\n\n          <text class=\"plan-label plan-label--market\" x=\"405\" y=\"96\" text-anchor=\"start\">Serbia</text>\n          <text class=\"plan-label plan-label--market\" x=\"524\" y=\"255\" text-anchor=\"start\">Switzerland</text>\n          <text class=\"plan-label plan-label--market\" x=\"482\" y=\"441\" text-anchor=\"start\">UAE</text>\n          <text class=\"plan-label plan-label--market\" x=\"300\" y=\"540\" text-anchor=\"middle\">Montenegro</text>\n          <text class=\"plan-label plan-label--market\" x=\"118\" y=\"441\" text-anchor=\"end\">Croatia</text>\n          <text class=\"plan-label plan-label--market\" x=\"75.5\" y=\"255\" text-anchor=\"end\">Germany</text>\n          <text class=\"plan-label plan-label--market\" x=\"194.5\" y=\"96\" text-anchor=\"end\">Italy</text>\n        </svg>\n      </div>\n\n      <p class=\"plan-caption reveal\">A mandate rarely fits one discipline. Market entry may require structure, people, property, technology and capital at once. Byzaro assembles the right combination \u2014 specialized internal teams, trusted international partners, coordination and execution \u2014 behind a single point of access.</p>\n    </div>\n  </section>\n\n  <section class=\"chapter chapter--alt\" id=\"mandate-flow\">\n    <div class=\"container\">\n      <div class=\"chapter-head reveal\">\n        <span class=\"chapter-numeral\">II</span>\n        <h2 class=\"chapter-title\">How a Mandate Runs</h2>\n      </div>\n      <p class=\"ml reveal\" style=\"margin-bottom:18px;\">Worked example \u2014 Swiss entrepreneur, expansion to the UAE</p>\n      <table class=\"mandate-table reveal\">\n        <tbody>\n          <tr><td class=\"mandate-step-num\">01</td><td class=\"mandate-step-text\">Strategy \u2014 market entry approach defined together with the group.</td></tr>\n          <tr><td class=\"mandate-step-num\">02</td><td class=\"mandate-step-text\">Company Establishment \u2014 structuring and registration coordinated in the UAE.</td></tr>\n          <tr><td class=\"mandate-step-num\">03</td><td class=\"mandate-step-text\">Legal &amp; Tax Coordination \u2014 with qualified local partners.</td></tr>\n          <tr><td class=\"mandate-step-num\">04</td><td class=\"mandate-step-text\">Premises \u2014 identifying and securing the right business premises.</td></tr>\n          <tr><td class=\"mandate-step-num\">05</td><td class=\"mandate-step-text\">Recruitment \u2014 sourcing the people needed to operate locally.</td></tr>\n          <tr><td class=\"mandate-step-num\">06</td><td class=\"mandate-step-text\">Software \u2014 technology and systems built for the new market.</td></tr>\n          <tr><td class=\"mandate-step-num\">07</td><td class=\"mandate-step-text\">Market Presence \u2014 established and operating across the network.</td></tr>\n        </tbody>\n      </table>\n    </div>\n  </section>\n\n  <section class=\"chapter band\" id=\"mandate\">\n    <div class=\"container\">\n      <div class=\"chapter-head reveal\">\n        <span class=\"chapter-numeral\">III</span>\n        <h2 class=\"chapter-title\">Discuss an Opportunity</h2>\n      </div>\n\n      <div class=\"mandate reveal\">\n        <h3 class=\"mandate-headline\">WHAT ARE YOU TRYING TO ACHIEVE?</h3>\n        <p class=\"mandate-intro\">Every conversation is treated as confidential.</p>\n\n        <form class=\"mandate-form\" novalidate>\n\n          <fieldset class=\"field field--full\" style=\"border:none; padding:0; margin:0;\">\n            <legend class=\"ml\" style=\"display:block; margin-bottom:14px;\">Category</legend>\n            <div class=\"cat-grid\" role=\"radiogroup\" aria-label=\"Category\">\n              <input type=\"radio\" class=\"cat-input\" name=\"category\" id=\"cat-talent\" value=\"Talent\" checked>\n              <label class=\"cat-cell\" for=\"cat-talent\">Talent</label>\n\n              <input type=\"radio\" class=\"cat-input\" name=\"category\" id=\"cat-tech\" value=\"Technology / AI\">\n              <label class=\"cat-cell\" for=\"cat-tech\">Technology / AI</label>\n\n              <input type=\"radio\" class=\"cat-input\" name=\"category\" id=\"cat-realestate\" value=\"Real Estate\">\n              <label class=\"cat-cell\" for=\"cat-realestate\">Real Estate</label>\n\n              <input type=\"radio\" class=\"cat-input\" name=\"category\" id=\"cat-capital\" value=\"Capital / Investment Opportunity\">\n              <label class=\"cat-cell\" for=\"cat-capital\">Capital / Investment Opportunity</label>\n\n              <input type=\"radio\" class=\"cat-input\" name=\"category\" id=\"cat-advisory\" value=\"Corporate Advisory\">\n              <label class=\"cat-cell\" for=\"cat-advisory\">Corporate Advisory</label>\n\n              <input type=\"radio\" class=\"cat-input\" name=\"category\" id=\"cat-partnership\" value=\"Strategic Partnership\">\n              <label class=\"cat-cell\" for=\"cat-partnership\">Strategic Partnership</label>\n\n              <input type=\"radio\" class=\"cat-input\" name=\"category\" id=\"cat-special\" value=\"Special Situation\">\n              <label class=\"cat-cell\" for=\"cat-special\">Special Situation</label>\n\n              <input type=\"radio\" class=\"cat-input\" name=\"category\" id=\"cat-other\" value=\"Something Else\">\n              <label class=\"cat-cell\" for=\"cat-other\">Something Else</label>\n            </div>\n          </fieldset>\n\n
