e, color 300ms ease, border-color 300ms ease, fill 300ms ease, stroke 300ms ease !important;\n  }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Reset                                                                    */\n/* ---------------------------------------------------------------------- */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  background: var(--obsidian);\n  color: var(--ivory);\n  font-family: var(--font-body);\n  font-weight: 400;\n  font-size: 1rem;\n  line-height: 1.7;\n  overflow-x: hidden;\n  min-width: 320px;\n}\n\nhtml, body { max-width: 100%; overflow-x: hidden; }\n\nimg, svg { display: block; max-width: 100%; }\n\na { color: inherit; }\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: 400;\n  text-transform: uppercase;\n  letter-spacing: .08em;\n  margin: 0;\n}\n\np { margin: 0; }\n\nul { list-style: none; margin: 0; padding: 0; }\n\nbutton { font-family: inherit; cursor: pointer; }\n\n/* ---------------------------------------------------------------------- */\n/* Focus visibility                                                         */\n/* ---------------------------------------------------------------------- */\n\na:focus-visible,\nbutton:focus-visible,\ninput:focus-visible,\nselect:focus-visible,\ntextarea:focus-visible,\n[tabindex]:focus-visible {\n  outline: 2px solid var(--gold);\n  outline-offset: 3px;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Layout helpers                                                           */\n/* ---------------------------------------------------------------------- */\n\n.container {\n  width: 100%;\n  max-width: var(--container);\n  margin: 0 auto;\n  padding-left: clamp(20px, 5vw, 56px);\n  padding-right: clamp(20px, 5vw, 56px);\n}\n\n.chapter {\n  position: relative;\n  padding: var(--section-pad) 0;\n}\n\n.chapter--dark { background: var(--charcoal); }\n\n.chapter-bg-vignette {\n  position: absolute;\n  inset: 0;\n  pointer-events: none;\n  background: radial-gradient(ellipse at 50% 0%, var(--vignette), transparent 60%);\n}\n\n.grain {\n  position: absolute;\n  inset: 0;\n  pointer-events: none;\n  background-image: var(--grain);\n  opacity: .025;\n  mix-blend-mode: overlay;\n}\n\n.chapter-head {\n  display: flex;\n  align-items: baseline;\n  justify-content: center;\n  gap: clamp(12px, 3vw, 28px);\n  margin-bottom: clamp(40px, 6vw, 72px);\n  text-align: center;\n}\n\n.chapter-numeral {\n  font-family: var(--font-ui);\n  color: var(--gold-text);\n  font-size: clamp(1rem, 2vw, 1.3rem);\n  letter-spacing: .3em;\n}\n\n.chapter-title {\n  font-size: clamp(1.8rem, 4vw, 3.4rem);\n  line-height: 1.15;\n}\n\n.hairline {\n  border: none;\n  border-top: 1px solid var(--gold-soft);\n  width: 100%;\n  margin: 0;\n}\n\n.hairline--faint {\n  border-top-color: var(--ivory-faint);\n}\n\n.label {\n  display: inline-block;\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .25em;\n  text-transform: uppercase;\n  color: var(--gold-text);\n}\n\n.label--dim {\n  color: var(--ivory-dim);\n}\n\n.lede {\n  color: var(--ivory-dim);\n  max-width: 62ch;\n}\n\n.center { text-align: center; margin-left: auto; margin-right: auto; }\n\n/* ---------------------------------------------------------------------- */\n/* Buttons                                                                   */\n/* ---------------------------------------------------------------------- */\n\n.btn {\n  display: inline-block;\n  border-radius: 0;\n  padding: 16px 34px;\n  font-family: var(--font-ui);\n  font-size: 13px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  text-decoration: none;\n  text-align: center;\n  transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease;\n  white-space: nowrap;\n}\n\n.btn-primary {\n  border: 1px solid var(--gold);\n  color: var(--ivory);\n  background: transparent;\n}\n\n.btn-primary:hover,\n.btn-primary:focus-visible {\n  background: var(--gold);\n  color: var(--obsidian);\n}\n\n.btn-secondary {\n  border: 1px solid var(--ivory-dim);\n  color: var(--ivory);\n  background: transparent;\n}\n\n.btn-secondary:hover,\n.btn-secondary:focus-visible {\n  border-color: var(--ivory);\n  background: var(--ivory-faint);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Intro assembly animation                                                 */\n/* ---------------------------------------------------------------------- */\n\n.intro-overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 9000;\n  background: var(--obsidian);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  transition: opacity 500ms ease;\n}\n\n.intro-overlay[data-hidden=\"true\"] {\n  opacity: 0;\n  pointer-events: none;\n}\n\n.intro-mark {\n  width: clamp(72px, 14vw, 140px);\n  color: var(--ivory);\n}\n\n.intro-mark .bz-b {\n  opacity: 0;\n  transition: transform 1200ms cubic-bezier(0,.68,.24,1), opacity 1200ms ease;\n}\n\n.intro-mark.bz-run .bz-b { opacity: 1; transform: translate(0, 0); }\n\n.intro-mark .bz-b1 { transform: translate(6%, -6%); }\n.intro-mark .bz-b2 { transform: translate(-6%, -6%); }\n.intro-mark .bz-b3 { transform: translate(6%, 6%); }\n.intro-mark .bz-b4 { transform: translate(-6%, 6%); }\n\n.intro-mark.bz-run .bz-b2 { transition-delay: 35ms; }\n.intro-mark.bz-run .bz-b3 { transition-delay: 65ms; }\n.intro-mark.bz-run .bz-b4 { transition-delay: 100ms; }\n\n/* ---------------------------------------------------------------------- */\n/* Top navigation                                                           */\n/* ---------------------------------------------------------------------- */\n\n.site-header {\n  position: fixed;\n  top: 0;\n  left: 0;\n  right: 0;\n  z-index: 500;\n  background: var(--header-bg);\n  backdrop-filter: blur(10px);\n  border-bottom: 1px solid v n  color: var(--ivory-dim);\n  opacity: .5;\n  cursor: default;\n}\n\n.lang-sep {\n  color: var(--ivory-dim);\n  opacity: .4;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Theme toggle                                                             */\n/* ---------------------------------------------------------------------- */\n\n.theme-toggle {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  background: transparent;\n  border: none;\n  padding: 4px 0;\n  color: var(--gold-text);\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  transition: color 200ms ease;\n}\n\n.theme-toggle-glyph {\n  font-size: 13px;\n  line-height: 1;\n}\n\n.theme-toggle:hover,\n.theme-toggle:focus-visible {\n  color: var(--ivory);\n}\n\n.mobile-menu .theme-toggle {\n  margin-top: 12px;\n  font-size: 13px;\n  justify-content: center;\n}\n\n.nav-toggle {\n  display: none;\n  background: transparent;\n  border: 1px solid var(--ivory-faint);\n  width: 42px;\n  height: 42px;\n  align-items: center;\n  justify-content: center;\n  flex-shrink: 0;\n}\n\n.nav-toggle-bars {\n  position: relative;\n  width: 18px;\n  height: 12px;\n}\n\n.nav-toggle-bars span {\n  position: absolute;\n  left: 0;\n  right: 0;\n  height: 1px;\n  background: var(--ivory);\n  transition: transform 200ms ease, opacity 200ms ease, top 200ms ease;\n}\n\n.nav-toggle-bars span:nth-child(1) { top: 0; }\n.nav-toggle-bars span:nth-child(2) { top: 5px; }\n.nav-toggle-bars span:nth-child(3) { top: 11px; }\n\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(1) {\n  top: 5px; transform: rotate(45deg);\n}\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(2) {\n  opacity: 0;\n}\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(3) {\n  top: 5px; transform: rotate(-45deg);\n}\n\n.mobile-menu {\n  position: fixed;\n  inset: 0;\n  z-index: 600;\n  background: var(--obsidian);\n  d gory-grid label {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  padding: 18px 14px;\n  border: 1px solid var(--charcoal-2);\n  background: var(--charcoal);\n  font-family: var(--font-ui);\n  font-size: .84rem;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: var(--ivory-dim);\n  transition: border-color 200ms ease, color 200ms ease;\n  min-height: 64px;\n}\n\n.category-grid input[type=\"radio\"]:checked + label {\n  border-color: var(--gold);\n  color: var(--ivory);\n}\n\n.category-grid input[type=\"radio\"]:focus-visible + label {\n  outline: 2px solid var(--gold);\n  outline-offset: 2px;\n}\n\n.mandate-form {\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: 22px;\n}\n\n@media (min-width: 680px) {\n  .mandate-form { grid-template-columns: 1fr 1fr; }\n  .field--full { grid-column: 1 / -1; }\n}\n\n.field {\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.field label {\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  color: var(--ivory-dim);\n}\n\n.field input,\n.field select,\n.field textarea {\n  background: var(--input-bg);\n  border: 1px solid var(--input-border);\n  color: var(--ivory);\n  padding: 13px 14px;\n  font-family: var(--font-ui);\n  font-size: .95rem;\n  border-radius: 0;\n}\n\n.field input:focus-visible,\n.field select:focus-visible,\n.field textarea:focus-visible {\n  outline: none;\n  border-color: var(--gold);\n}\n\n.field textarea { resize: vertical; min-height: 120px; }\n\n.mandate-submit-row {\n  margin-top: 8px;\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  gap: 18px;\n}\n\n.mandate-confidential {\n  font-size: .82rem;\n  color: var(--ivory-dim);\n  max-width: 60ch;\n}\n\n.mandate-confirmation {\n  display: none;\n  border: 1px solid var(--gold-soft);\n  padding: 16px 20px;\n  color: var(--ivory);\n  font-size: .92rem;\n}\n\n.mandate-confirmation.is-visible { display: block; }\n\n/* ---------------------------------------------------------------------- */\n/* Reduced motion                                                           */\n/* ---------------------------------------------------------------------- */\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: .001ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: .001ms !important;\n    scroll-behavior: auto !important;\n  }\n  .reveal { opacity: 1; transform: none; }\n  .scroll-cue::after { animation: none; }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Responsive: nav collapse                                                 */\n/* ---------------------------------------------------------------------- */\n\n@media (max-width: 820px) {\n  .nav-links { display: none; }\n  .nav-toggle { display: flex; }\n}\n\n@media (min-width: 821px) {\n  .mobile-menu, .mobile-menu-close { display: none; }\n}\n\n</style>\n</head>\n<body data-concept=\"01\">\n\n<div class=\"intro-overlay\" id=\"intro-overlay\">\n  <svg class=\"intro-mark\" id=\"intro-mark\" viewBox=\"0 0 367 390\" fill=\"currentColor\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Byzaro Group\">\n    <defs><path id=\"bzb-intro\" fill-rule=\"evenodd\" d=\"M0,0 H164 V56 C161,68 145,70 145,90 C145,110 161,112 164,124 V181 H0 Z M33,32 H131 V54 A20,20 0 0 1 111,74 H76 V107 H110 A21,21 0 0 1 131,128 V149 H33 Z\"/></defs>\n    <g class=\"bz-b bz-b1\"><use href=\"#bzb-intro\" transform=\"translate(203,0)\"/></g>\n    <g class=\"bz-b bz-b2\"><use href=\"#bzb-intro\" transform=\"translate(164,0) scale(-1,1)\"/></g>\n    <g class=\"bz-b bz-b3\"><use href=\"#bzb-intro\" transform=\"translate(203,209)\"/></g>\n    <g class=\"bz-b bz-b4\"><use href=\"#bzb-intro\" transform=\"translate(164,209) scale(-1,1)\"/></g>\n  </svg>\n</div>\n\n<header class=\"site-header\">\n  <div class=\"container nav\">\n PPORTUNITY GROUP</p>\n      <h1 class=\"hero-headline\"><span>COMPLEX PROBLEMS.</span><span>ONE NETWORK.</span></h1>\n      <p class=\"hero-support\">International expertise, relationships and execution across business, talent, technology, real estate and private markets.</p>\n      <a class=\"btn btn-primary hero-cta\" href=\"network.html#mandate\">Discuss an Opportunity</a>\n    </div>\n    <span class=\"hero-frame\" aria-hidden=\"true\"></span>\n    <span class=\"scroll-cue\" aria-hidden=\"true\"></span>\n  </section>\n\n  <section class=\"chapter\" id=\"group\">\n    <div class=\"chapter-bg-vignette\" aria-hidden=\"true\"></div>\n    <div class=\"container\">\n      <div class=\"chapter-head reveal\">\n        <span class=\"chapter-numeral\">I</span>\n        <h2 class=\"chapter-title\">The Group</h2>\n      </div>\n      <div class=\"triad reveal\">\n        <div class=\"triad-word\">Access.</div>\n        <div class=\"triad-word\">Expertise.</div>\n        <div class=\"triad-word\">Execution.</div>\n      </div>\n      <div class=\"group-copy reveal\">\n        <p class=\"lede\">Byzaro is an international business network bringing together specialized teams and trusted partners across markets and disciplines. One group, five capabilities, one network \u2014 assembled around each mandate.</p>\n        <p class=\"audience\">Built for businesses, entrepreneurs, investors and private clients with ambitions beyond borders.</p>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"chapter chapter--dark\" id=\"capabilities\">\n    <div class=\"grain\" aria-hidden=\"true\"></div>\n    <div class=\"container\">\n      <div class=\"chapter-head reveal\">\n        <span class=\"chapter-numeral\">II</span>\n        <h2 class=\"chapter-title\">Capabilities</h2>\n      </div>\n\n      <div class=\"cap-rows reveal\">\n\n        <div class=\"cap-row\" data-open=\"false\">\n          <h3>\n            <button class=\"cap-row-trigger\" aria-expanded=\"false\" aria-controls=\"cap-panel-01\" id=\"cap-trigger-01\">\n              <span class=\"cap-num\">01</span>\n              <span class=\"cap-name\">Talent</span>\n              <span class=\"cap-descriptor\">Connecting companies with the people they need \u2014 across borders.</span>\n              <span class=\"cap-chevron\" aria-hidden=\"true\"></span>\n            </button>\n          </h3>\n          <div class=\"cap-panel\" id=\"cap-panel-01\" role=\"region\" aria-labelledby=\"cap-trigger-01\">\n            <div class=\"cap-panel-inner\">\n              <div class=\"cap-panel-content\">\n                <p class=\"cap-line\">Talent &amp; Workforce Solutions \u2014 connecting companies with the people they need, across borders.</p>\n                <ul class=\"cap-services\">\n                  <li>International Recruitment</li>\n                  <li>Executive Search</li>\n                  <li>Temporary Staffing</li>\n                  <li>Recruitment Outsourcing</li>\n                  <li>Cross-Border Workforce Projects</li>\n                </ul>\n                <a class=\"cap-link\" href=\"capabilities.html#talent\">Explore capabilities \u2192</a>\n              </div>\n            </div>\n          </div>\n        </div>\n\n        <div class=\"cap-row\" data-open=\"false\">\n          <h3>\n            <button class=\"cap-row-trigger\" aria-expanded=\"false\" aria-controls=\"cap-panel-02\" id=\"cap-trigger-02\">\n              <span class=\"cap-num\">02</span>\n              <span class=\"cap-name\">Digital</span>\n              <span class=\"cap-descriptor\">Building the technology and digital systems behind modern businesses.</span>\n              <span class=\"cap-chevron\" aria-hidden=\"true\"></span>\n            </button>\n          </h3>\n          <div class=\"cap-panel\" id=\"cap-panel-02\" role=\"region\" aria-labelledby=\"cap-trigger-02\">\n            <div class=\"cap-panel-inner\">\n              <div class=\"cap-panel-content\">\n                <p class=\"cap-line\">Technology, AI &amp; Digital Growth \u2014 building the technology and digital systems behind modern businesses.</p>\n                <ul class=\"cap-services\">\n                  <li>Corporate Websites &amp; Applications</li>\n                  <li>Custom Software</li>\n                  <li>AI Agents &amp; Automation</li>\n                  <li>CRM &amp; ERP Systems</li>\n                  <li>Digital Strategy</li>\n                </ul>\n                <a class=\"cap-link\" href=\"capabilities.html#digital\">Explore capabilities \u2192</a>\n              </div>\n            </div>\n          </div>\n        </div>\n\n        <div class=\"cap-row\" data-open=\"false\">\n          <h3>\n            <button class=\"cap-row-trigger\" aria-expanded=\"false\" aria-controls=\"cap-panel-03\" id=\"cap-trigger-03\">\n              <span class=\"cap-num\">03</span>\n              <span class=\"cap-name\">Real Estate</span>\n              <span class=\"cap-descriptor\">Connecting property, people and opportunity across markets.</span>\n              <span class=\"cap-chevron\" aria-hidden=\"true\"></span>\n            </button>\n          </h3>\n          <div class=\"cap-panel\" id=\"cap-panel-03\" role=\"region\" aria-labelledby=\"cap-trigger-03\">\n            <div class=\"cap-panel-inner\">\n              <div class=\"cap-panel-content\">\n                <p class=\"cap-line\">International Real Estate \u2014 connecting property, people and opportunity across markets.</p>\n                <ul class=\"cap-services\">\n                  <li>International Brokerage</li>\n                  <li>Buyer &amp; Seller Representation</li>\n                  <li>Off-Market Opportunities</li>\n                  <li>Investment Properties</li>\n                  <li>Property Search &amp; Relocation</li>\n                </ul>\n                <a class=\"cap-link\" href=\"capabilities.html#realestate\">Explore capabilities \u2192</a>\n              </div>\n            </div>\n          </div>\n        </div>\n\n        <div class=\"cap-row\" data-open=\"false\">\n          <h3>\n            <button class=\"cap-row-trigger\" aria-expanded=\"false\" aria-controls=\"cap-panel-04\" id=\"cap-trigger-04\">\n              <span class=\"cap-num\">04</span>\n              <span class=\"cap-name\">Capital</span>\n              <span class=\"cap-descriptor\">Connecting qualified clients with selected private-market opportunities.</span>\n              <span class=\"cap-chevron\" aria-hidden=\"true\"></span>\n            </button>\n          </h3>\n          <div class=\"cap-panel\" id=\"cap-panel-04\" role=\"region\" aria-labelledby=\"cap-trigger-04\">\n            <div class=\"cap-panel-inner\">\n              <div class=\"cap-panel-content\">\n                <p class=\"cap-line\">Private Markets &amp; Selected Opportunities \u2014 connecting qualified clients with selected private-market opportunities.</p>\n                <ul class=\"cap-services\">\n                  <li>Selected Investment Opportunities</li>\n                  <li>Investor Introductions</li>\n                  <li>Capital Advisory</li>\n                  <li>Project Introductions</li>\n                  <li>Strategic Capital Connections</li>\n                </ul>\n                <a class=\"cap-link\" href=\"capabilities.html#capital\">Explore capabilities \u2192</a>\n              </div>\n            </div>\n          </div>\n        </div>\n\n        <div class=\"cap-row\" data-open=\"false\">\n          <h3>\n            <button class=\"cap-row-trigger\" aria-expanded=\"false\" aria-controls=\"cap-panel-05\" id=\"cap-trigger-05\">\n              <span class=\"cap-num\">05</span>\n              <span class=\"cap-name\">Advisory</span>\n              <span class=\"cap-descriptor\">Structure, expansion and execution across jurisdictions.</span>\n              <span class=\"cap-chevron\" aria-hidden=\"true\"></span>\n            </button>\n          </h3>\n          <div class=\"cap-panel\" id=\"cap-panel-05\" role=\"region\" aria-labelledby=\"cap-trigger-05\">\n            <div class=\"cap-panel-inner\">\n              <div class=\"cap-panel-content\">\n                <p class=\"cap-line\">Corporate &amp; Strategic Advisory \u2014 structure, expansion and execution across jurisdictions.</p>\n                <ul class=\"cap-services\">\n                  <li>International Company Formation</li>\n                  <li>Market Entry &amp; Expansion</li>\n                  <li>Corporate &amp; Holding Structures</li>\n                  <li>M&amp;A Coordination</li>\n                  <li>Business Succession</li>\n                </ul>\n                <a class=\"cap-link\" href=\"capabilities.html#advisory\">Explore capabilities \u2192</a>\n              </div>\n            </div>\n          </div>\n        </div>\n\n      </div>\n    </div>\n  </section>\n\n  <section class=\"chapter\" id=\"network\">\n    <div class=\"chapter-bg-vignette\" aria-hidden=\"true\"></div>\n    <div class=\"container\">\n      <div class=\"chapter-head reveal\">\n        <span class=\"chapter-numeral\">III</span>\n        <h2 class=\"chapter-title\">One Network</h2>\n      </div>\n      <p class=\"network-statement reveal\">Whatever the opportunity requires, we assemble the right expertise, people and partners across markets.</p>\n      <div class=\"network-diagram-wrap reveal\">\n        <svg class=\"radial-diagram\" viewBox=\"0 0 400 400\" role=\"img\" aria-label=\"Diagram showing a central network node connected to Strategy, Technology, Capital, Property, People and Structure\">\n          <g class=\"rd-lines\">\n            <line x1=\"200\" y1=\"200\" x2=\"200\" y2=\"62\"></line>\n            <line x1=\"200\" y1=\"200\" x2=\"319\" y2=\"131\"></line>\n            <line x1=\"200\" y1=\"200\" x2=\"319\" y2=\"269\"></line>\n            <line x1=\"200\" y1=\"200\" x2=\"200\" y2=\"338\"></line>\n            <line x1=\"200\" y1=\"200\" x2=\"81\" y2=\"269\"></line>\n            <line x1=\"200\" y1=\"200\" x2=\"81\" y2=\"131\"></line>\n          </g>\n          <g class=\"rd-points\">\n            <circle class=\"rd-point\" cx=\"200\" cy=\"62\" r=\"3\"></circle>\n            <circle class=\"rd-point\" cx=\"319\" cy=\"131\" r=\"3\"></circle>\n            <circle class=\"rd-point\" cx=\"319\" cy=\"269\" r=\"3\"></circle>\n            <circle class=\"rd-point\" cx=\"200\" cy=\"338\" r=\"3\"></circle>\n            <circle class=\"rd-point\" cx=\"81\" cy=\"269\" r=\"3\"></circle>\n            <circle class=\"rd-point\" cx=\"81\" cy=\"131\" r=\"3\"></circle>\n          </g>\n          <circle class=\"rd-center\" cx=\"200\" cy=\"200\" r=\"24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\"></circle>\n          <svg class=\"rd-center\" x=\"182\" y=\"182\" width=\"36\" height=\"36\" viewBox=\"0 0 367 390\" fill=\"currentColor\">\n            <defs><path id=\"bzb-net\" fill-rule=\"evenodd\" d=\"M0,0 H164 V56 C161,68 145,70 145,90 C145,110 161,112 164,124 V181 H0 Z M33,32 H131 V54 A20,20 0 0 1 111,74 H76 V107 H110 A21,21 0 0 1 131,128 V149 H33 Z\"/></defs>\n            <g class=\"bz-b bz-b1\"><use href=\"#bzb-net\" transform=\"translate(203,0)\"/></g>\n            <g class=\"bz-b bz-b2\"><use href=\"#bzb-net\" transform=\"translate(164,0) scale(-1,1)\"/></g>\n            <g class=\"bz-b bz-b3\"><use href=\"#bzb-net\" transform=\"translate(203,209)\"/></g>\n            <g class=\"bz-b bz-b4\"><use href=\"#bzb-net\" transform=\"translate(164,209) scale(-1,1)\"/></g>\n          </svg>\n          <text class=\"rd-label\" x=\"200\" y=\"46\" text-anchor=\"middle\">Strategy</text>\n          <text class=\"rd-label\" x=\"330\" y=\"124\" text-anchor=\"start\">Technology</text>\n          <text class=\"rd-label\" x=\"330\" y=\"280\" text-anchor=\"start\">Capital</text>\n          <text class=\"rd-label\" x=\"200\" y=\"358\" text-anchor=\"middle\">Property</text>\n          <text class=\"rd-label\" x=\"70\" y=\"280\" text-anchor=\"end\">People</text>\n          <text class=\"rd-label\" x=\"70\" y=\"124\" text-anchor=\"end\">Structure</text>\n        </svg>\n      </div>\n      <p class=\"lede center reveal\" style=\"margin-top:32px;\">A mandate rarely fits one discipline. Market entry may require structure, people, property, technology and capital at once. Byzaro assembles the right combination \u2014 specialized internal teams, trusted international partners, coordination and execution \u2014 behind a single point of access.</p>\n    </div>\n  </section>\n\n  <section class=\"chapter chapter--dark\" id=\"reach\">\n    <div class=\"grain\" aria-hidden=\"true\"></div>\n    <div class=\"container\">\n      <div class=\"chapter-head reveal\">\n        <span class=\"chapter-numeral\">IV</span>\n        <h2 class=\"chapter-title\">International Reach</h2>\n      </div>\n      <p class=\"label center reveal\" style=\"display:block; margin-bottom:24px;\">Current network reach</p>\n      <ul class=\"reach-list reveal\">\n        <li>Serbia</li>\n        <li>Switzerland</li>\n        <li>United Arab Emirates</li>\n        <li>Montenegro</li>\n        <li>Croatia</li>\n        <li>Germany</li>\n        <li>Italy</li>\n      </ul>\n      <p class=\"reach-ambition center reveal\">An expanding international network of specialists, operators and trusted partners.</p>\n    </div>\n  </section>\n\n  <section class=\"chapter\" id=\"special-situations\">\n    <div class=\"chapter-bg-vignette\" aria-hidden=\"true\"></div>\n    <div class=\"container\">\n      <div class=\"chapter-head reveal\">\n        <span class=\"chapter-numeral\">V</span>\n        <h2 class=\"chapter-title\">Special Situations</h2>\n      </div>\n      <h3 class=\"special-headline center reveal\">SOME OPPORTUNITIES DON'T FIT INTO CONVENTIONAL CATEGORIES.</h3>\n      <p class=\"special-body center reveal\">For mandates that cross capabilities \u2014 or fall outside them entirely \u2014 Byzaro works as one coordinated group.</p>\n      <ul cl .querySelector('.mobile-menu');\n  var closeBtn = document.querySelector('.mobile-menu-close');\n  function openMenu() {\n    menu.classList.add('is-open');\n    toggle.setAttribute('aria-expanded', 'true');\n    document.body.style.overflow = 'hidden';\n  }\n  function closeMenu() {\n    menu.classList.remove('is-open');\n    toggle.setAttribute('aria-expanded', 'false');\n    document.body.style.overflow = '';\n  }\n  if (toggle) {\n    toggle.addEventListener('click', function () {\n      var expanded = toggle.getAttribute('aria-expanded') === 'true';\n      if (expanded) { closeMenu(); } else { openMenu(); }\n    });\n  }\n  if (closeBtn) { closeBtn.addEventListener('click', closeMenu); }\n  if (menu) {\n    menu.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', closeMenu); });\n  }\n\n  var themeToggles = document.querySelectorAll('.theme-toggle');\n  var themeLabels = { light: 'DARK', dark: 'LIGHT' };\n  function currentTheme() {\n    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';\n  }\n  function updateThemeToggles() {\n    var theme = currentTheme();\n    themeToggles.forEach(function (btn) {\n      btn.setAttribute('aria-pressed', String(theme === 'dark'));\n      var label = btn.querySelector('.theme-toggle-label');\n      if (label) { label.textContent = themeLabels[theme]; }\n    });\n  }\n  function setTheme(theme) {\n    document.documentElement.classList.add('theme-transition');\n    window.setTimeout(function () {\n      document.documentElement.classList.remove('theme-transition');\n    }, 320);\n    if (theme === 'light') {\n      document.documentElement.setAttribute('data-theme', 'light');\n    } else {\n      document.documentElement.removeAttribute('data-theme');\n    }\n    try { localStorage.setItem('bz-theme-01', theme); } catch (e) {}\n    updateThemeToggles();\n  }\n  updateThemeToggles();\n  themeToggles.forEach(function (btn) {\n    btn.addEventListener('click', function () {\n      setTheme(currentTheme() === 'light' ? 'dark' : 'light');\n    });\n  });\n\n  var rows = document.querySelectorAll('.cap-row');\n  rows.forEach(function (row) {\n    var trigger = row.querySelector('.cap-row-trigger');\n    trigger.addEventListener('click', function () {\n      var expanded = trigger.getAttribute('aria-expanded') === 'true';\n      trigger.setAttribute('aria-expanded', String(!expanded));\n      row.setAttribute('data-open', String(!expanded));\n    });\n  });\n\n  var reveals = document.querySelectorAll('.reveal');\n  if ('IntersectionObserver' in window) {\n    var io = new IntersectionObserver(function (entries) {\n      entries.forEach(function (entry) {\n        if (entry.isIntersecting) {\n          entry.target.classList.add('is-visible');\n          io.unobserve(entry.target);\n        }\n      });\n    }, { threshold: .15 });\n    reveals.forEach(function (el) { io.observe(el); });\n  } else {\n    reveals.forEach(function (el) { el.classList.add('is-visible'); });\n  }\n})();\n<\/script>\n\n<script>(function(){\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a[href]');\n    if(!a) return;\n    var href = a.getAttribute('href') || '';\n    if(/^(https?:|mailto:|tel:)/i.test(href)) { a.target = '_blank'; return; }\n    var m = href.match(/^(?:\\.\\.\\/)?(?:([0-9]{2}-[a-z]+)\\/)?([a-z]+\\.html)?(#.*)?$/i);\n    if(!m) return;\n    if(href.charAt(0) === '#') return;          /* Anker in der Seite: normal lassen */\n    e.preventDefault();\n    parent.postMessage({bzNav: {concept: m[1] || null, page: m[2] || 'index.html', hash: m[3] || ''}}, '*');\n  }, true);\n  window.addEventListener('message', function(e){\n    if(e.data && e.data.bzHash){ location.hash = e.data.bzHash; }\n  });\n})();<\/script>\n\n</body>\n</html>\n", "01-obsidian/capabilities.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<script>(function(){try{if(localStorage.getItem('bz-theme-01')==='light'){document.documentElement.setAttribute('data-theme','light');}}catch(e){}})();<\/script>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>BYZARO GROUP \u2014 Capabilities</title>\n<meta name=\"description\" content=\"Five specialized divisions \u2014 Talent, Digital, Real Estate, Capital and Advisory \u2014 assembled around each mandate.\">\n<meta name=\"robots\" content=\"noindex\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Instrument+Sans:wght@400;500;600&amp;family=Jost:wght@300;400;500&amp;display=swap\" rel=\"stylesheet\">\n<style>\n/* ==========================================================================\n   BYZARO GROUP \u2014 Concept 01: OBSIDIAN EMPIRE\n   Shared stylesheet for index.html, capabilities.html, network.html\n   ========================================================================== */\n\n:root {\n  --obsidian: #0A0A0B;\n  --charcoal: #141416;\n  --charcoal-2: #1C1C1F;\n  --ivory: #F2EDE4;\n  --ivory-dim: rgba(242, 237, 228, .55);\n  --ivory-faint: rgba(242, 237, 228, .12);\n  --gold: #C19A3F;\n  --gold-soft: rgba(193, 154, 63, .35);\n  --gold-faint: rgba(193, 154, 63, .12);\n  /* --gold-text: the accent for SMALL text (labels, links, numerals under\n     24px, tags, active nav states) \u2014 needs \u22654.5:1 on its backdrop. --gold\n     itself stays for hairlines, borders, SVG strokes and large (\u226524px) type. */\n  --gold-text: var(--gold);\n\n  /* additional tokens for values that were previously hardcoded literals */\n  --header-bg: rgba(10, 10, 11, .82);\n  --subnav-bg: rgba(10, 10, 11, .92);\n  --frame-border: rgba(242, 237, 228, .14);\n  --input-bg: var(--charcoal-2);\n  --input-border: rgba(242, 237, 228, .16);\n  --vignette: rgba(193, 154, 63, .05);\n\n  --font-display: \"Marcellus\", \"Times New Roman\", serif;\n  --font-body: \"Instrument Sans\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-ui: \"Jost\", system-ui, sans-serif;\n\n  --container: 1320px;\n  --section-pad: clamp(96px, 12vh, 180px);\n\n  --grain: url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>\");\n}\n\n/* ---------------------------------------------------------------------- */\n/* Light theme \u2014 \"Ivory Empire\" (opt-in via [data-theme=\"light\"] on <html>) */\n/* Default (no attribute, or data-theme=\"dark\") stays the Obsidian design. */\n/* ---------------------------------------------------------------------- */\n\n[data-theme=\"light\"] {\n  --obsidian: #F2EDE4;\n  --charcoal: #E9E2D4;\n  --charcoal-2: rgba(18, 18, 20, .14);\n  --ivory: #121214;\n  --ivory-dim: #55534E;\n  --ivory-faint: rgba(18, 18, 20, .08);\n  --gold-soft: rgba(150, 115, 40, .45);\n  --gold-faint: rgba(150, 115, 40, .12);\n  /* darkened gold for small text \u2014 measured \u22654.5:1 on both #F2EDE4 and #E9E2D4 */\n  --gold-text: #7A5D18;\n\n  --header-bg: rgba(242, 237, 228, .82);\n  --subnav-bg: rgba(242, 237, 228, .92);\n  --frame-border: rgba(18, 18, 20, .14);\n  --input-bg: #EAE4D6;\n  --input-border: rgba(18, 18, 20, .14);\n  --vignette: rgba(193, 154, 63, .05);\n}\n\n[data-theme=\"light\"] .hero-mark-bg {\n  opacity: .028;\n}\n\n@media (prefers-reduced-motion: no-preference) {\n  html.theme-transition,\n  html.theme-transition *,\n  html.theme-transition *::before,\n  html.theme-transition *::after {\n    transition: background-color 300ms ease, color 300ms ease, border-color 300ms ease, fill 300ms ease, stroke 300ms ease !important;\n  }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Reset                                                                    */\n/* ---------------------------------------------------------------------- */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  background: var(--obsidian);\n  color: var(--ivory);\n  font-family: var(--font-body);\n  font-weight: 400;\n  font-size: 1rem;\n  line-height: 1.7;\n  overflow-x: hidden;\n  min-width: 320px;\n}\n\nhtml, body { max-width: 100%; overflow-x: hidden; }\n\nimg, svg { display: block; max-width: 100%; }\n\na { color: inherit; }\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: 400;\n  text-transform: uppercase;\n  letter-spacing: .08em;\n  margin: 0;\n}\n\np { margin: 0; }\n\nul { list-style: none; margin: 0; padding: 0; }\n\nbutton { font-family: inherit; cursor: pointer; }\n\n/* ---------------------------------------------------------------------- */\n/* Focus visibility                                                         */\n/* ---------------------------------------------------------------------- */\n\na:focus-visible,\nbutton:focus-visible,\ninput:focus-visible,\nselect:focus-visible,\ntextarea:focus-visible,\n[tabindex]:focus-visible {\n  outline: 2px solid var(--gold);\n  outline-offset: 3px;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Layout helpers                                                           */\n/* ---------------------------------------------------------------------- */\n\n.container {\n  width: 100%;\n  max-width: var(--container);\n  margin: 0 auto;\n  padding-left: clamp(20px, 5vw, 56px);\n  padding-right: clamp(20px, 5vw, 56px);\n}\n\n.chapter {\n  position: relative;\n  padding: var(--section-pad) 0;\n}\n\n.chapter--dark { background: var(--charcoal); }\n\n.chapter-bg-vignette {\n  position: absolute;\n  inset: 0;\n  pointer-events: none;\n  background: radial-gradient(ellipse at 50% 0%, var(--vignette), transparent 60%);\n}\n\n.grain {\n  position: absolute;\n  inset: 0;\n  pointer-events: none;\n  background-image: var(--grain);\n  opacity: .025;\n  mix-blend-mode: overlay;\n}\n\n.chapter-head {\n  display: flex;\n  align-items: baseline;\n  justify-content: center;\n  gap: clamp(12px, 3vw, 28px);\n  margin-bottom: clamp(40px, 6vw, 72px);\n  text-align: center;\n}\n\n.chapter-numeral {\n  font-family: var(--font-ui);\n  color: var(--gold-text);\n  font-size: clamp(1rem, 2vw, 1.3rem);\n  letter-spacing: .3em;\n}\n\n.chapter-title {\n  font-size: clamp(1.8rem, 4vw, 3.4rem);\n  line-height: 1.15;\n}\n\n.hairline {\n  border: none;\n  border-top: 1px solid var(--gold-soft);\n  width: 100%;\n  margin: 0;\n}\n\n.hairline--faint {\n  border-top-color: var(--ivory-faint);\n}\n\n.label {\n  display: inline-block;\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .25em;\n  text-transform: uppercase;\n  color: var(--gold-text);\n}\n\n.label--dim {\n  color: var(--ivory-dim);\n}\n\n.lede {\n  color: var(--ivory-dim);\n  max-width: 62ch;\n}\n\n.center { text-align: center; margin-left: auto; margin-right: auto; }\n\n/* ---------------------------------------------------------------------- */\n/* Buttons                                                                   */\n/* ---------------------------------------------------------------------- */\n\n.btn {\n  display: inline-block;\n  border-radius: 0;\n  padding: 16px 34px;\n  font-family: var(--font-ui);\n  font-size: 13px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  text-decoration: none;\n  text-align: center;\n  transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease;\n  white-space: nowrap;\n}\n\n.btn-primary {\n  border: 1px solid var(--gold);\n  color: var(--ivory);\n  background: transparent;\n}\n\n.btn-primary:hover,\n.btn-primary:focus-visible {\n  background: var(--gold);\n  color: var(--obsidian);\n}\n\n.btn-secondary {\n  border: 1px solid var(--ivory-dim);\n  color: var(--ivory);\n  background: transpar roke: currentColor; }\n.radial-diagram .rd-point { fill: var(--gold); }\n.radial-diagram .rd-label {\n  font-family: var(--font-ui);\n  font-size: 8.5px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  fill: var(--ivory-dim);\n}\n\n.network-statement {\n  max-width: 60ch;\n  margin: 0 auto;\n  text-align: center;\n  font-size: clamp(1.1rem, 2vw, 1.5rem);\n  font-family: var(--font-display);\n  letter-spacing: .02em;\n  line-height: 1.4;\n}\n\n/* ---------------------------------------------------------------------- */\n/* International reach                                                      */\n/* ---------------------------------------------------------------------- */\n\n.reach-list {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 10px 18px;\n  font-family: var(--font-ui);\n  font-size: clamp(.85rem, 1.6vw, 1.05rem);\n  letter-spacing: .12em;\n  text-transform: uppercase;\n}\n\n.reach-list li { display: flex; align-items: center; gap: 18px; }\n.reach-list li::after { content: \"\u00b7\"; color: var(--gold); }\n.reach-list li:last-child::after { content: \"\"; }\n\n.reach-ambition {\n  margin-top: 24px;\n  color: var(--ivory-dim);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Special situations                                                       */\n/* ---------------------------------------------------------------------- */\n\n.special-headline {\n  font-size: clamp(1.8rem, 4.2vw, 3rem);\n  max-width: 18ch;\n  line-height: 1.2;\n}\n\n.special-body {\n  color: var(--ivory-dim);\n  max-width: 56ch;\n  margin-top: 20px;\n}\n\n.special-list {\n  margin-top: clamp(40px, 6vw, 64px);\n  display: grid;\n  grid-template-columns: 1fr;\n  border-top: 1px solid var(--charcoal-2);\n}\n\n@media (min-width: 700px) {\n  .special-list { grid-template-columns: 1fr 1fr; }\n}\n\n.special-list li {\n  padding: 20px clamp(4px, 2vw, 16px);\n  border-bottom: 1px solid var(--charcoal-2);\n  font-family: va  color: var(--gold-text); }\n\n.footer-bottom {\n  border-top: 1px solid var(--charcoal-2);\n  padding-top: clamp(24px, 4vw, 36px);\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n\n.footer-legal-row {\n  display: flex;\n  flex-wrap: wrap;\n  gap: 16px;\n  justify-content: space-between;\n  align-items: center;\n  font-family: var(--font-ui);\n  font-size: 12px;\n  color: var(--ivory-dim);\n}\n\n.footer-compliance {\n  font-family: var(--font-ui);\n  font-size: 11.5px;\n  color: var(--ivory-dim);\n  max-width: 90ch;\n  line-height: 1.6;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Reveal on scroll                                                         */\n/* ---------------------------------------------------------------------- */\n\n.reveal {\n  opacity: 0;\n  transform: translateY(24px);\n  transition: opacity 700ms ease, transform 700ms ease;\n}\n\n.reveal.is-visible {\n  opacity: 1;\n  transform: translateY(0);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Sticky sub-nav (capabilities.html)                                       */\n/* ---------------------------------------------------------------------- */\n\n.subnav {\n  position: sticky;\n  top: 66px;\n  z-index: 100;\n  background: var(--subnav-bg);\n  backdrop-filter: blur(8px);\n  border-bottom: 1px solid var(--charcoal-2);\n}\n\n.subnav-inner {\n  display: flex;\n  gap: clamp(16px, 3vw, 36px);\n  overflow-x: auto;\n  padding: 14px clamp(20px, 5vw, 56px);\n  scrollbar-width: thin;\n}\n\n.subnav-inner::-webkit-scrollbar { height: 4px; }\n.subnav-inner::-webkit-scrollbar-thumb { background: var(--charcoal-2); }\n\n.subnav a {\n  flex-shrink: 0;\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  text-decoration: none;\n  color: var(--ivory-dim);\n  padding-bottom: 4px;\n  border-bottom: 1px solid transparent;\n  white-space: nowrap;\n}\n\n.subnav a:hover, .subnav a:focus-visible, .subnav a.is-active {\n  color: var(--gold-text);\n  border-bottom-color: var(--gold);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Division chapters (capabilities.html)                                    */\n/* ---------------------------------------------------------------------- */\n\n.division {\n  scroll-margin-top: 130px;\n}\n\n.division-head {\n  text-align: center;\n  max-width: 720px;\n  margin: 0 auto clamp(40px, 6vw, 72px);\n}\n\n.division-eyebrow {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  gap: 16px;\n  margin-bottom: 20px;\n}\n\n.division-name {\n  font-size: clamp(2.2rem, 6vw, 4.2rem);\n  line-height: 1.05;\n}\n\n.division-line {\n  margin-top: 18px;\n  color: var(--ivory-dim);\n  font-size: clamp(1rem, 1.6vw, 1.2rem);\n}\n\n.division-body {\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: clamp(32px, 5vw, 64px);\n  max-width: 1100px;\n  margin: 0 auto;\n}\n\n@media (min-width: 860px) {\n  .division-body { grid-template-columns: 1.1fr .9fr; align-items: start; }\n}\n\n.service-list {\n  display: grid;\n  grid-template-columns: 1fr;\n  border-top: 1px solid var(--charcoal-2);\n}\n\n@media (min-width: 560px) {\n  .service-list { grid-template-columns: 1fr 1fr; }\n}\n\n.service-list li {\n  padding: 16px 12px;\n  border-bottom: 1px solid var(--charcoal-2);\n  font-size: .96rem;\n}\n\n@media (min-width: 560px) {\n  .service-list li:nth-child(odd) { border-right: 1px solid var(--charcoal-2); padding-left: 0; }\n}\n\n.division-aside {\n  border-left: 1px solid var(--gold-soft);\n  padding: 4px 0 4px 22px;\n  display: flex;\n  flex-direction: column;\n  gap: 18px;\n}\n\n.division-aside .use-case {\n  font-style: italic;\n  color: var(--ivory-dim);\n  font-size: 1rem;\n  line-height: 1.6;\n}\n\n.division-aside .relation-line {\n  font-size: .88rem;\n  color: var(--ivory-dim);\n}\n\n.division-compliance {\n  margin-top: 28px;\n  padding-top: 18px;\n  border-top: 1px solid var(--charcoal-2);\n  font-size: .82rem;\n  color: var(--ivory-dim);\n  line-height: 1.6;\n}\n\n.division-sep {\n  margin: clamp(64px, 8vw, 120px) 0;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Network page \u2014 meridian diagram                                          */\n/* ---------------------------------------------------------------------- */\n\n.meridian-wrap {\n  margin-top: clamp(48px, 7vw, 88px);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 28px;\n}\n\n.meridian-diagram {\n  width: min(100%, 760px);\n  height: auto;\n}\n\n.meridian-diagram .md-arc { fill: none; stroke: var(--gold-soft); stroke-width: 1; }\n.meridian-diagram .md-line { stroke: var(--gold-soft); stroke-width: 1; transition: stroke 200ms ease, stroke-width 200ms ease; }\n.meridian-diagram .md-center { color: var(--ivory); }\n.meridian-diagram .md-node circle { fill: var(--obsidian); stroke: var(--gold); stroke-width: 1.4; }\n.meridian-diagram .md-label {\n  font-family: var(--font-ui);\n  font-size: 9.5px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  fill: var(--ivory-dim);\n  transition: fill 200ms ease;\n}\n\n@media (hover: hover) {\n  .meridian-diagram .md-node:hover .md-line,\n  .meridian-diagram .md-node:focus-visible .md-line {\n    stroke: var(--gold);\n    stroke-width: 1.6;\n  }\n  .meridian-diagram .md-node:hover .md-label,\n  .meridian-diagram .md-node:focus-visible .md-label {\n    fill: var(--gold-text);\n  }\n}\n\n.meridian-cities {\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  color: var(--ivory-dim);\n}\n\n.meridian-list-fallback {\n  display: none;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 8px 16px;\n  font-family: var(--font-ui);\n  font-size: .9rem;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  color: var(--ivory-dim);\n}\n\n@media (max-width: 640px) {\n  .meridian-diagram { display: none; }\n  .meridian-list-fallback { display: flex; }\n}\n\n.meridian-list-fallback li::after { content: \"\u00b7\"; margin-left: 16px; color: var(--gold); }\n.meridian-list-fallback li:last-child::after { content: \"\"; }\n\n/* ---------------------------------------------------------------------- */\n/* Opportunities rows (network.html)                                        */\n/* ---------------------------------------------------------------------- */\n\n.opp-rows { border-top: 1px solid var(--charcoal-2); }\n\n.opp-row {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 8px 24px;\n  padding: clamp(20px, 3vw, 30px) 4px;\n  border-bottom: 1px solid var(--charcoal-2);\n}\n\n.opp-name {\n  font-family: var(--font-display);\n  font-size: clamp(1.1rem, 2vw, 1.5rem);\n  letter-spacing: .04em;\n}\n\n.opp-tag {\n  color: var(--gold-text);\n  font-family: var(--font-ui);\n  font-size: .78rem;\n  letter-spacing: .08em;\n  text-transform: uppercase;\n  flex-shrink: 0;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Mandate form                                                             */\n/* ---------------------------------------------------------------------- */\n\n.mandate {\n  max-width: 820px;\n  margin: 0 auto;\n}\n\n.mandate-headline {\n  text-align: center;\n  font-size: clamp(2rem, 5.5vw, 4rem);\n  margin-bottom: clamp(36px, 6vw, 64px);\n}\n\n.category-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));\n  gap: 10px;\n  margin-bottom: clamp(36px, 5vw, 56px);\n}\n\n.category-grid input[type=\"radio\"] {\n  position: absolute;\n  opacity: 0;\n  width: 1px;\n  height: 1px;\n}\n\n.category-grid label {\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  padding: 18px 14px;\n  border: 1px solid var(--charcoal-2);\n  background: var(--charcoal);\n  font-family: var(--font-ui);\n  font-size: .84rem;\n  letter-spacing: .06em;\n  text-transform: uppercase;\n  color: var(--ivory-dim);\n  transition: border-color 200ms ease, color 200ms ease;\n  min-height: 64px;\n}\n\n.category-grid input[type=\"radio\"]:checked + label {\n  border-color: var(--gold);\n  color: var(--ivory);\n}\n\n.category-grid input[type=\"radio\"]:focus-visible + label {\n  outline: 2px solid var(--gold);\n  outline-offset: 2px;\n}\n\n.mandate-form {\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: 22px;\n}\n\n@media (min-width: 680px) {\n  .mandate-form { grid-template-columns: 1fr 1fr; }\n  .field--full { grid-column: 1 / -1; }\n}\n\n.field {\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.field label {\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  color: var(--ivory-dim);\n}\n\n.field input,\n.field select,\n.field textarea {\n  background: var(--input-bg);\n  border: 1px solid var(--input-border);\n  color: var(--ivory);\n  padding: 13px 14px;\n  font-family: var(--font-ui);\n  font-size: .95rem;\n  border-radius: 0;\n}\n\n.field input:focus-visible,\n.field select:focus-visible,\n.field textarea:focus-visible {\n  outline: none;\n  border-color: var(--gold);\n}\n\n.field textarea { resize: vertical; min-height: 120px; }\n\n.mandate-submit-row {\n  margin-top: 8px;\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  gap: 18px;\n}\n\n.mandate-confidential {\n  font-size: .82rem;\n  color: var(--ivory-dim);\n  max-width: 60ch;\n}\n\n.mandate-confirmation {\n  display: none;\n  border: 1px solid var(--gold-soft);\n  padding: 16px 20px;\n  color: var(--ivory);\n  font-size: .92rem;\n}\n\n.mandate-confirmation.is-visible { display: block; }\n\n/* ---------------------------------------------------------------------- */\n/* Reduced motion                                                           */\n/* ---------------------------------------------------------------------- */\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: .001ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: .001ms !important;\n    scroll-behavior: auto !important;\n  }\n  .reveal { opacity: 1; transform: none; }\n  .scroll-cue::after { animation: none; }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Responsive: nav collapse                                                 */\n/* ---------------------------------------------------------------------- */\n\n@media (max-width: 820px) {\n  .nav-links { display: none; }\n  .nav-toggle { display: flex; }\n}\n\n@media (min-width: 821px) {\n  .mobile-menu, .mobile-menu-close { display: none; }\n}\n\n</style>\n</head>\n<body data-concept=\"01\">\n\n<header class=\"site-header\">\n  <div class=\"container nav\">\n    <a class=\"brand\" href=\"index.html\" aria-label=\"Byzaro Group\">\n      <svg class=\"byzaro-mark\" viewBox=\"0 0 367 390\" fill=\"currentColor\" aria-hidden=\"true\">\n        <defs><path id=\"bzb-nav\" fill-rule=\"evenodd\" d=\"M0,0 H164 V56 C161,68 145,70 145,90 C145,110 161,112 164,124 V181 H0 Z M33,32 H131 V54 A20,20 0 0 1 111,74 H76 V107 H110 A21,21 0 0 1 131,128 V149 H33 Z\"/></defs>\n        <use href=\"#bzb-nav\" transform=\"translate(203,0)\"/>\n        <use href=\"#bzb-nav\" transform=\"translate(164,0) scale(-1,1)\"/>\n        <use href=\"#bzb-nav\" transform=\"translate(203,209)\"/>\n        <use href=\"#bzb-nav\" transform=\"translate(164,209) scale(-1,1)\"/>\n      </svg>\n      <span class=\"brand-text\" aria-hidden=\"true\">\n        <span class=\"brand-word\">BYZ<svg class=\"brand-lam\" viewBox=\"0 0 62 72\" fill=\"currentColor\"><path d=\"M31 0 L62 72 H49.5 L31 27 L12.5 72 H0 Z\"/></svg>RO</span>\n        <span class=\"brand-sub\">GROUP</span>\n      </span>\n    </a>\n    <nav class=\"nav-links\" aria-label=\"Primary\">\n      <a href=\"index.html\">Home</a>\n      <a href=\"capabilities.html\" class=\"is-active\" aria-current=\"page\">Capabilities</a>\n      <a href=\"network.html\">Network</a>\n      <a class=\"btn btn-primary nav-cta\" href=\"network.html#mandate\">Discuss an Opportunity</a>\n      <div class=\"lang-switch\" aria-label=\"Language\">\n        <span class=\"lang-current\" aria-current=\"true\">EN</span><span class=\"lang-sep\">|</span>\n        <span aria-disabled=\"true\">DE</span><span class=\"lang-sep\">|</span>\n        <span aria-disabled=\"true\">SR</span>\n      </div>\n      <button class=\"theme-toggle\" type=\"button\" aria-pressed=\"false\" aria-label=\"Toggle color scheme\">\n        <span class=\"theme-toggle-glyph\" aria-hidden=\"true\">&#9680;</span>\n        <span class=\"theme-toggle-label\">LIGHT</span>\n      </button>\n    </nav>\n    <button class=\"nav-toggle\" type=\"button\" aria-label=\"Open menu\" aria-expanded=\"false\" aria-controls=\"mobile-menu\">\n      <span class=\"nav-toggle-bars\"><span></span><span></span><span></span></span>\n    </button>\n  </div>\n</header>\n\n<div class=\"mobile-menu\" id=\"mobile-menu\">\n  <button class=\"mobile-menu-close\" type=\"button\" aria-label=\"Close menu\">&times;</button>\n  <a href=\"index.html\">Home</a>\n  <a href=\"capabilities.html\" class=\"is-active\">Capabilities</a>\n  <a href=\"network.html\">Network</a>\n  <a href=\"network.html#mandate\">Discuss an Opportunity</a>\n  <div class=\"lang-switch\" aria-label=\"Language\">\n    <span class=\"lang-current\" aria-current=\"true\">EN</span><span class=\"lang-sep\">|</span>\n    <span aria-disabled=\"true\">DE</span><span class=\"lang-sep\">|</span>\n    <span aria-disabled=\"true\">SR</span>\n  </div>\n  <button class=\"theme-toggle\" type=\"button\" aria-pressed=\"false\" aria-label=\"Toggle color scheme\">\n    <span class=\"theme-toggle-glyph\" aria-hidden=\"true\">&#9680;</span>\n    <span class=\"theme-toggle-label\">LIGHT</span>\n  </button>\n</div>\n\n<nav class=\"subnav\" aria-label=\"Divisions\">\n  <div class=\"subnav-inner\">\n    <a href=\"#talent\" data-subnav=\"talent\">01 \u2014 Talent</a>\n    <a href=\"#digital\" data-subnav=\"digital\">02 \u2014 Digital</a>\n    <a href=\"#realestate\" data-subnav=\"realestate\">03 \u2014 Real Estate</a>\n    <a href=\"#capital\" data-subnav=\"capital\">04 \u2014 Capital</a>\n    <a href=\"#advisory\" data-subnav=\"advisory\">05 \u2014 Advisory</a>\n  </div>\n</nav>\n\n<main>\n\n  <section class=\"chapter\" style=\"padding-bottom: clamp(56px,7vh,100px);\">\n    <div class=\"container\">\n      <div class=\"chapter-head reveal\" style=\"margin-bottom:0;\">\n        <span class=\"chapter-numeral\">\u2014</span>\n        <h1 class=\"chapter-title\" style=\"font-size:clamp(1.6rem,3.4vw,2.4rem);\">Five Capabilities. One Network.</h1>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"chapter division\" id=\"talent\">\n    <div class=\"chapter-bg-vignette\" aria-hidden=\"true\"></div>\n    <div class=\"container\">\n      <div class=\"division-head reveal\">\n        <div class=\"division-eyebrow\">\n          <span class=\"chapter-numeral\">01</span>\n          <span class=\"label\">I \u2014 Talent &amp; Workforce Solutions</span>\n        </div>\n        <h2 class=\"division-name\">Talent</h2>\n        <p class=\"division-line\">Connecting companies with the people they need \u2014 across borders.</p>\n      </div>\n      <div class=\"division-body reveal\">\n        <ul class=\"service-list\">\n          <li>International Recruitment</li>\n          <li>Executive Search</li>\n          <li>Temporary Staffing</li>\n          <li>Recruitment Outsourcing</li>\n          <li>Agency-to-Agency Recruiting</li>\n          <li>Cross-Border Workforce Projects</li>\n        </ul>\n        <aside class=\"division-aside\">\n          <p class=\"use-case\">\"A growing company needs specialized people in a new market \u2014 sourced, vetted and placed across borders.\"</p>\n          <p class=\"relation-line\">Talent solutions rarely stand alone \u2014 placements often connect to Advisory structuring or Digital systems as a company scales across borders.</p>\n        </aside>\n      </div>\n    </div>\n  </section>\n\n  <hr class=\"hairline hairline--faint division-sep\">\n\n  <section class=\"chapter division\" id=\"digital\">\n    <div class=\"chapter-bg-vignette\" aria-hidden=\"true\"></div>\n    <div class=\"container\">\n      <div class=\"division-head reveal\">\n        <div class=\"division-eyebrow\">\n          <span class=\"chapter-numeral\">02</span>\n          <span class=\"label\">II \u2014 Technology, AI &amp; Digital Growth</span>\n        </div>\n        <h2 class=\"division-name\">Digital</h2>\n        <p class=\"division-line\">Building the technology and digital systems behind modern businesses.</p>\n      </div>\n      <div class=\"division-body reveal\">\n        <ul class=\"service-list\">\n          <li>Corporate Websites &amp; Applications</li>\n          <li>Custom Software</li>\n          <li>AI Agents &amp; Automation</li>\n          <li>CRM &amp; ERP Systems</li>\n          <li>Digital Strategy</li>\n          <li>Performance Marketing</li>\n        </ul>\n        <aside class=\"division-aside\">\n          <p class=\"use-case\">\"An established business needs its digital infrastructure \u2014 software, automation and visibility \u2014 built to an international standard.\"</p>\n          <p class=\"relation-line\">Digital capability is built to work alongside the group's other disciplines \u2014 from Advisory structuring to Real Estate premises \u2014 as part of a single mandate.</p>\n        </aside>\n      </div>\n    </div>\n  </section>\n\n  <hr class=\"hairline hairline--faint division-sep\">\n\n  <section class=\"chapter division\" id=\"realestate\">\n    <div class=\"chapter-bg-vignette\" aria-hidden=\"true\"></div>\n    <div class=\"container\">\n      <div class=\"division-head reveal\">\n        <div class=\"division-eyebrow\">\n          <span class=\"chapter-numeral\">03</span>\n          <span class=\"label\">III \u2014 International Real Estate</span>\n        </div>\n        <h2 class=\"division-name\">Real Estate</h2>\n        <p class=\"division-line\">Connecting property, people and opportunity across markets.</p>\n      </div>\n      <div class=\"division-body reveal\">\n        <ul class=\"service-list\">\n          <li>International Brokerage</li>\n          <li>Buyer &amp; Seller Representation</li>\n          <li>Off-Market Opportunities</li>\n          <li>Investment Properties</li>\n          <li>Property Search &amp; Relocation</li>\n          <li>Real Estate Investment Advisory</li>\n        </ul>\n        <aside class=\"division-aside\">\n          <p class=\"use-case\">Active across the UAE, Switzerland, Serbia, Montenegro, Croatia, Germany and Italy \u2014 and internationally through trusted partners.</p>\n          <p class=\"relation-line\">Real estate mandates often connect to Advisory structuring, Capital introductions and Talent placements as part of a single cross-border move.</p>\n        </aside>\n      </div>\n    </div>\n  </section>\n\n  <hr class=\"hairline hairline--faint division-sep\">\n\n  <section class=\"chapter division\" id=\"capital\">\n    <div class=\"chapter-bg-vignette\" aria-hidden=\"true\"></div>\n    <div class=\"container\">\n      <div class=\"division-head reveal\">\n        <div class=\"division-eyebrow\">\n          <span class=\"chapter-numeral\">04</span>\n          <span class=\"label\">IV \u2014 Private Markets &amp; Selected Opportunities</span>\n        </div>\n        <h2 class=\"division-name\">Capital</h2>\n        <p class=\"division-line\">Connecting qualified clients with selected private-market opportunities.</p>\n      </div>\n      <div class=\"division-body reveal\">\n        <ul class=\"service-list\">\n          <li>Selected Investment Opportunities</li>\n          <li>Investor Introductions</li>\n          <li>Capital Advisory</li>\n          <li>Project Introductions</li>\n          <li>Strategic Capital Connections</li>\n        </ul>\n        <aside class=\"division-aside\">\n          <p class=\"relation-line\">Capital introductions are coordinated alongside Advisory structuring and Real Estate opportunities, assembled around each mandate.</p>\n          <p class=\"division-compliance\">Selected opportunities may only be available to eligible or qualified investors and are subject to jurisdiction, due diligence and applicable regulation. Byzaro is not a bank, investment fund or regulated financial institution.</p>\n        </aside>\n      </div>\n    </div>\n  </section>\n\n  <hr class=\"hairline hairline--faint division-sep\">\n\n  <section class=\"chapter division\" id=\"advisory\">\n    <div class=\"chapter-bg-vignette\" aria-hidden=\"true\"></div>\n    <div class=\"container\">\n      <div class=\"division-head reveal\">\n        <div class=\"division-eyebrow\">\n          <span class=\"chapter-numeral\">05</span>\n          <span class=\"label\">V \u2014 Corporate &amp; Strategic Advisory</span>\n        </div>\n        <h2 class=\"division-name\">Advisory</h2>\n        <p class=\"division-line\">Structure, expansion and execution across jurisdictions.</p>\n      </div>\n      <div class=\"division-body reveal\">\n        <ul class=\"service-list\">\n          <li>International Company Formation</li>\n          <li>Market Entry &amp; Expansion</li>\n          <li>Corporate &amp; Holding Structures</li>\n          <li>M&amp;A Coordination</li>\n          <li>Business Succession</li>\n          <li>Corporate Relocation</li>\n        </ul>\n        <aside class=\"division-aside\">\n          <p class=\"relation-line\">Advisory sits at the center of most cross-border mandates \u2014 coordinating Talent, Digital, Real Estate and Capital as the mandate requires.</p>\n          <p class=\"division-compliance\">International structures developed in coordination with specialized legal, tax and regulatory partners.</p>\n        </aside>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"chapter chapter--dark\" id=\"special-situations-teaser\">\n    <div class=\"grain\" aria-hidden=\"true\"></div>\n    <div class=\"container closing\">\n      <p class=\"label center reveal\" style=\"display:block; margin-bottom:20px;\">Beyond the five capabilities</p>\n      <h2 class=\"closing-headline reveal\" style=\"font-size:clamp(1.8rem,4.4vw,3.2rem); max-width:20ch;\">SOME OPPORTUNITIES DON'T FIT INTO CONVENTIONAL CATEGORIES.</h2>\n      <p class=\"lede center reveal\">For mandates that cross capabilities \u2014 or fall outside them entirely \u2014 Byzaro works as one coordinated group.</p>\n      <a class=\"btn btn-primary reveal\" href=\"network.html#mandate\">Present an Opportunity</a>\n    </div>\n  </section>\n\n</main>\n\n<footer class=\"site-footer\">\n  <div class=\"container\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <a class=\"brand\" href=\"index.html\" aria-label=\"Byzaro Group\">\n          <svg class=\"byzaro-mark\" viewBox=\"0 0 367 390\" fill=\"currentColor\" aria-hidden=\"true\">\n            <defs><path id=\"bzb-foot\" fill-rule=\"evenodd\" d=\"M0,0 H164 V56 C161,68 145,70 145,90 C145,110 161,112 164,124 V181 H0 Z M33,32 H131 V54 A20,20 0 0 1 111,74 H76 V107 H110 A21,21 0 0 1 131,128 V149 H33 Z\"/></defs>\n            <use href=\"#bzb-foot\" transform=\"translate(203,0)\"/>\n            <use href=\"#bzb-foot\" transform=\"translate(164,0) scale(-1,1)\"/>\n            <use href=\"#bzb-foot\" transform=\"translate(203,209)\"/>\n            <use href=\"#bzb-foot\" transform=\"translate(164,209) scale(-1,1)\"/>\n          </svg>\n          <span class=\"brand-text\" aria-hidden=\"true\">\n            <span class=\"brand-word\">BYZ<svg class=\"brand-lam\" viewBox=\"0 0 62 72\" fill=\"currentColor\"><path d=\"M31 0 L62 72 H49.5 L31 27 L12.5 72 H0 Z\"/></svg>RO</span>\n            <span class    menu.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', closeMenu); });\n  }\n\n  var themeToggles = document.querySelectorAll('.theme-toggle');\n  var themeLabels = { light: 'DARK', dark: 'LIGHT' };\n  function currentTheme() {\n    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';\n  }\n  function updateThemeToggles() {\n    var theme = currentTheme();\n    themeToggles.forEach(function (btn) {\n      btn.setAttribute('aria-pressed', String(theme === 'dark'));\n      var label = btn.querySelector('.theme-toggle-label');\n      if (label) { label.textContent = themeLabels[theme]; }\n    });\n  }\n  function setTheme(theme) {\n    document.documentElement.classList.add('theme-transition');\n    window.setTimeout(function () {\n      document.documentElement.classList.remove('theme-transition');\n    }, 320);\n    if (theme === 'light') {\n      document.documentElement.setAttribute('data-theme', 'light');\n    } else {\n      document.documentElement.removeAttribute('data-theme');\n    }\n    try { localStorage.setItem('bz-theme-01', theme); } catch (e) {}\n    updateThemeToggles();\n  }\n  updateThemeToggles();\n  themeToggles.forEach(function (btn) {\n    btn.addEventListener('click', function () {\n      setTheme(currentTheme() === 'light' ? 'dark' : 'light');\n    });\n  });\n\n  var reveals = document.querySelectorAll('.reveal');\n  if ('IntersectionObserver' in window) {\n    var io = new IntersectionObserver(function (entries) {\n      entries.forEach(function (entry) {\n        if (entry.isIntersecting) {\n          entry.target.classList.add('is-visible');\n          io.unobserve(entry.target);\n        }\n      });\n    }, { threshold: .15 });\n    reveals.forEach(function (el) { io.observe(el); });\n  } else {\n    reveals.forEach(function (el) { el.classList.add('is-visible'); });\n  }\n\n  var divisions = document.querySelectorAll('.division');\n  var subnavLinks = document.querySelectorA f=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Instrument+Sans:wght@400;500;600&amp;family=Jost:wght@300;400;500&amp;display=swap\" rel=\"stylesheet\">\n<style>\n/* ==========================================================================\n   BYZARO GROUP \u2014 Concept 01: OBSIDIAN EMPIRE\n   Shared stylesheet for index.html, capabilities.html, network.html\n   ========================================================================== */\n\n:root {\n  --obsidian: #0A0A0B;\n  --charcoal: #141416;\n  --charcoal-2: #1C1C1F;\n  --ivory: #F2EDE4;\n  --ivory-dim: rgba(242, 237, 228, .55);\n  --ivory-faint: rgba(242, 237, 228, .12);\n  --gold: #C19A3F;\n  --gold-soft: rgba(193, 154, 63, .35);\n  --gold-faint: rgba(193, 154, 63, .12);\n  /* --gold-text: the accent for SMALL text (labels, links, numerals under\n     24px, tags, active nav states) \u2014 needs \u22654.5:1 on its backdrop. --gold\n     itself stays for hairlines, borders, SVG strokes and large (\u226524px) type. */\n  --gold-text: var(--gold);\n\n  /* additional tokens for values that were previously hardcoded literals */\n  --header-bg: rgba(10, 10, 11, .82);\n  --subnav-bg: rgba(10, 10, 11, .92);\n  --frame-border: rgba(242, 237, 228, .14);\n  --input-bg: var(--charcoal-2);\n  --input-border: rgba(242, 237, 228, .16);\n  --vignette: rgba(193, 154, 63, .05);\n\n  --font-display: \"Marcellus\", \"Times New Roman\", serif;\n  --font-body: \"Instrument Sans\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-ui: \"Jost\", system-ui, sans-serif;\n\n  --container: 1320px;\n  --section-pad: clamp(96px, 12vh, 180px);\n\n  --grain: url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>\");\n}\n\n/* ---------------------------------------------------------------------- */\n/* Light theme \u2014 \"Ivory Empire\" (opt-in via [data-theme=\"light\"] on <html>) */\n/* Default (no attribute, or data-theme=\"dark\") stays the Obsidian design. */\n/* ---------------------------------------------------------------------- */\n\n[data-theme=\"light\"] {\n  --obsidian: #F2EDE4;\n  --charcoal: #E9E2D4;\n  --charcoal-2: rgba(18, 18, 20, .14);\n  --ivory: #121214;\n  --ivory-dim: #55534E;\n  --ivory-faint: rgba(18, 18, 20, .08);\n  --gold-soft: rgba(150, 115, 40, .45);\n  --gold-faint: rgba(150, 115, 40, .12);\n  /* darkened gold for small text \u2014 measured \u22654.5:1 on both #F2EDE4 and #E9E2D4 */\n  --gold-text: #7A5D18;\n\n  --header-bg: rgba(242, 237, 228, .82);\n  --subnav-bg: rgba(242, 237, 228, .92);\n  --frame-border: rgba(18, 18, 20, .14);\n  --input-bg: #EAE4D6;\n  --input-border: rgba(18, 18, 20, .14);\n  --vignette: rgba(193, 154, 63, .05);\n}\n\n[data-theme=\"light\"] .hero-mark-bg {\n  opacity: .028;\n}\n\n@media (prefers-reduced-motion: no-preference) {\n  html.theme-transition,\n  html.theme-transition *,\n  html.theme-transition *::before,\n  html.theme-transition *::after {\n    transition: background-color 300ms ease, color 300ms ease, border-color 300ms ease, fill 300ms ease, stroke 300ms ease !important;\n  }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Reset                                                                    */\n/* ---------------------------------------------------------------------- */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  background: var(--obsidian);\n  color: var(--ivory);\n  font-family: var(--font-body);\n  font-weight: 400;\n  font-size: 1rem;\n  line-height: 1.7;\n  overflow-x: hidden;\n  min-width: 320px;\n}\n\nhtml, body { max-width: 100%; overflow-x: hidden; }\n late-columns: 1fr;\n  gap: 22px;\n}\n\n@media (min-width: 680px) {\n  .mandate-form { grid-template-columns: 1fr 1fr; }\n  .field--full { grid-column: 1 / -1; }\n}\n\n.field {\n  display: flex;\n  flex-direction: column;\n  gap: 8px;\n}\n\n.field label {\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  color: var(--ivory-dim);\n}\n\n.field input,\n.field select,\n.field textarea {\n  background: var(--input-bg);\n  border: 1px solid var(--input-border);\n  color: var(--ivory);\n  padding: 13px 14px;\n  font-family: var(--font-ui);\n  font-size: .95rem;\n  border-radius: 0;\n}\n\n.field input:focus-visible,\n.field select:focus-visible,\n.field textarea:focus-visible {\n  outline: none;\n  border-color: var(--gold);\n}\n\n.field textarea { resize: vertical; min-height: 120px; }\n\n.mandate-submit-row {\n  margin-top: 8px;\n  display: flex;\n  flex-direction: column;\n  align-items: flex-start;\n  gap: 18px;\n}\n\n.mandate-confidential {\n  font-size: .82rem;\n  color: var(--ivory-dim);\n  max-width: 60ch;\n}\n\n.mandate-confirmation {\n  display: none;\n  border: 1px solid var(--gold-soft);\n  padding: 16px 20px;\n  color: var(--ivory);\n  font-size: .92rem;\n}\n\n.mandate-confirmation.is-visible { display: block; }\n\n/* ---------------------------------------------------------------------- */\n/* Reduced motion                                                           */\n/* ---------------------------------------------------------------------- */\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after {\n    animation-duration: .001ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration: .001ms !important;\n    scroll-behavior: auto !important;\n  }\n  .reveal { opacity: 1; transform: none; }\n  .scroll-cue::after { animation: none; }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Responsive: nav collapse  discipline. Market entry may require structure, people, property, technology and capital at once. Byzaro assembles the right combination \u2014 specialized internal teams, trusted international partners, coordination and execution \u2014 behind a single point of access.</p>\n    </div>\n  </section>\n\n  <section class=\"chapter chapter--dark\" id=\"meridian\">\n    <div class=\"grain\" aria-hidden=\"true\"></div>\n    <div class=\"container\">\n      <div class=\"chapter-head reveal\">\n        <span class=\"chapter-numeral\">II</span>\n        <h2 class=\"chapter-title\">Current Network Reach</h2>\n      </div>\n\n      <div class=\"meridian-wrap reveal\">\n        <svg class=\"meridian-diagram\" viewBox=\"0 0 760 460\" role=\"img\" aria-label=\"Diagram of the Byzaro network across seven markets: Serbia, Switzerland, UAE, Montenegro, Croatia, Germany and Italy\">\n          <g class=\"md-arcs\" aria-hidden=\"true\">\n            <path class=\"md-arc\" d=\"M230,400 A150,150 0 0 0 530,400\"></path>\n            <path class=\"md-arc\" d=\"M150,400 A230,230 0 0 0 610,400\"></path>\n            <path class=\"md-arc\" d=\"M70,400 A310,310 0 0 0 690,400\"></path>\n          </g>\n\n          <g class=\"md-node\" tabindex=\"0\" role=\"img\" aria-label=\"Serbia\">\n            <line class=\"md-line\" x1=\"380\" y1=\"400\" x2=\"150.9\" y2=\"379.9\"></line>\n            <circle cx=\"150.9\" cy=\"379.9\" r=\"4\"></circle>\n            <text class=\"md-label\" x=\"150.9\" y=\"402\" text-anchor=\"middle\">Serbia</text>\n          </g>\n\n          <g class=\"md-node\" tabindex=\"0\" role=\"img\" aria-label=\"Switzerland\">\n            <line class=\"md-line\" x1=\"380\" y1=\"400\" x2=\"254.2\" y2=\"318.3\"></line>\n            <circle cx=\"254.2\" cy=\"318.3\" r=\"4\"></circle>\n            <text class=\"md-label\" x=\"254.2\" y=\"340.3\" text-anchor=\"middle\">Switzerland</text>\n          </g>\n\n          <g class=\"md-node\" tabindex=\"0\" role=\"img\" aria-label=\"United " aria-hidden=\"true\">\n            <defs><path id=\"bzb-net\" fill-rule=\"evenodd\" d=\"M0,0 H164 V56 C161,68 145,70 145,90 C145,110 161,112 164,124 V181 H0 Z M33,32 H131 V54 A20,20 0 0 1 111,74 H76 V107 H110 A21,21 0 0 1 131,128 V149 H33 Z\"/></defs>\n            <g class=\"bz-b bz-b1\"><use href=\"#bzb-net\" transform=\"translate(203,0)\"/></g>\n            <g class=\"bz-b bz-b2\"><use href=\"#bzb-net\" transform=\"translate(164,0) scale(-1,1)\"/></g>\n            <g class=\"bz-b bz-b3\"><use href=\"#bzb-net\" transform=\"translate(203,209)\"/></g>\n            <g class=\"bz-b bz-b4\"><use href=\"#bzb-net\" transform=\"translate(164,209) scale(-1,1)\"/></g>\n          </svg>\n        </svg>\n\n        <ul class=\"meridian-list-fallback\">\n          <li>Serbia</li>\n          <li>Switzerland</li>\n          <li>United Arab Emirates</li>\n          <li>Montenegro</li>\n          <li>Croatia</li>\n          <li>Germany</li>\n          <li>Italy</li>\n        </ul>\n\n        <p class=\"meridian-cities\">Belgrade &middot; Zurich &middot; Dubai</p>\n        <p class=\"lede center\">Connected across markets. Built for international execution.</p>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"chapter\" id=\"opportunities\">\n    <div class=\"chapter-bg-vignette\" aria-hidden=\"true\"></div>\n    <div class=\"container\">\n      <div class=\"chapter-head reveal\">\n        <span class=\"chapter-numeral\">III</span>\n        <h2 class=\"chapter-title\">Opportunities</h2>\n      </div>\n      <p class=\"lede center reveal\" style=\"margin-bottom:clamp(32px,5vw,56px);\">Selected opportunities are shared directly and may require qualification.</p>\n      <div class=\"opp-rows reveal\">\n        <div class=\"opp-row\">\n          <span class=\"opp-name\">Private Markets</span>\n          <span class=\"opp-tag\">By qualification</span>\n        </div>\n        <div class=\"opp-row\">\n          <span class=\"opp-name\">Real Estate</span>\n          <span clas >Capital / Investment Opportunity</label>\n\n              <input type=\"radio\" name=\"category\" id=\"cat-advisory\" value=\"Corporate Advisory\">\n              <label for=\"cat-advisory\">Corporate Advisory</label>\n\n              <input type=\"radio\" name=\"category\" id=\"cat-partnership\" value=\"Strategic Partnership\">\n              <label for=\"cat-partnership\">Strategic Partnership</label>\n\n              <input type=\"radio\" name=\"category\" id=\"cat-special\" value=\"Special Situation\">\n              <label for=\"cat-special\">Special Situation</label>\n\n              <input type=\"radio\" name=\"category\" id=\"cat-other\" value=\"Something Else\">\n              <label for=\"cat-other\">Something Else</label>\n            </div>\n          </fieldset>\n\n          <div class=\"field\">\n            <label for=\"f-name\">Name *</label>\n            <input type=\"text\" id=\"f-name\" name=\"name\" required autocomplete=\"name\">\n          </div>\n\n          <div class=\"field\">\n            <label for=\"f-company\">Company</label>\n            <input type=\"text\" id=\"f-company\" name=\"company\" autocomplete=\"organization\">\n          </div>\n\n          <div class=\"field\">\n            <label for=\"f-country\">Country *</label>\n            <input type=\"text\" id=\"f-country\" name=\"country\" required autocomplete=\"country-name\">\n          </div>\n\n          <div class=\"field\">\n            <label for=\"f-email\">Email *</label>\n            <input type=\"email\" id=\"f-email\" name=\"email\" required autocomplete=\"email\">\n          </div>\n\n          <div class=\"field\">\n            <label for=\"f-phone\">Phone (optional)</label>\n            <input type=\"tel\" id=\"f-phone\" name=\"phone\" autocomplete=\"tel\">\n          </div>\n\n          <div class=\"field\">\n            <label for=\"f-markets\">Markets Involved (optional)</label>\n            <input type=\"text\" id=\"f-markets\" name=\"markets\">\n          </
