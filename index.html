lay: flex;\n  align-items: center;\n  gap: 6px;\n  background: transparent;\n  border: none;\n  padding: 4px 0;\n  color: var(--steel-text);\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  transition: color 200ms ease;\n}\n\n.theme-toggle-glyph { font-size: 13px; line-height: 1; }\n\n.theme-toggle:hover, .theme-toggle:focus-visible { color: var(--text); }\n\n.mobile-menu .theme-toggle { margin-top: 12px; font-size: 13px; justify-content: center; }\n\n.nav-toggle {\n  display: none;\n  background: transparent;\n  border: 1px solid var(--border);\n  width: 42px;\n  height: 42px;\n  align-items: center;\n  justify-content: center;\n  flex-shrink: 0;\n}\n\n.nav-toggle-bars { position: relative; width: 18px; height: 12px; }\n.nav-toggle-bars span {\n  position: absolute; left: 0; right: 0; height: 1px;\n  background: var(--text);\n  transition: transform 200ms ease, opacity 200ms ease, top 200ms ease;\n}\n.nav-toggle-bars span:nth-child(1) { top: 0; }\n.nav-toggle-bars span:nth-child(2) { top: 5px; }\n.nav-toggle-bars span:nth-child(3) { top: 11px; }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(1) { top: 5px; transform: rotate(45deg); }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(2) { opacity: 0; }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(3) { top: 5px; transform: rotate(-45deg); }\n\n.mobile-menu {\n  position: fixed;\n  inset: 0;\n  z-index: 600;\n  background: var(--bg);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: clamp(20px, 5vh, 40px);\n  transform: translateY(-100%);\n  opacity: 0;\n  transition: transform 320ms ease, opacity 320ms ease;\n  visibility: hidden;\n}\n\n.mobile-menu.is-open { transform: translateY(0); opacity: 1; visibility: visible; }\n\n.mobile-menu a {\n  font-family: var(--font-display);\n  font-size: clamp(1.6rem, 8vw, 2.6rem);\n  text-decoration: none;\n  color: var(--text);\n  letter-spacing: .01em;\n}\n\n.mobile-menu a.is-active { color: var(--steel-text); }\n.mobile-menu .lang-switch { margin-top: 12px; font-size: 13px; }\n\n.mobile-menu-close {\n  position: absolute;\n  top: 16px;\n  right: clamp(20px, 5vw, 56px);\n  background: transparent;\n  border: 1px solid var(--border);\n  width: 42px;\n  height: 42px;\n  color: var(--text);\n  font-size: 18px;\n  line-height: 1;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Hero                                                                      */\n/* ---------------------------------------------------------------------- */\n\n.hero {\n  position: relative;\n  min-height: 100svh;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  overflow: hidden;\n  padding: 140px 0 80px;\n}\n\n.hero-guilloche {\n  position: absolute;\n  inset: 0;\n  pointer-events: none;\n  opacity: .035;\n  background-repeat: repeat;\n  background-size: 64px 64px;\n  background-image: url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><g fill='none' stroke='%238C97A5' stroke-width='0.6'><circle cx='0' cy='0' r='34'/><circle cx='64' cy='0' r='34'/><circle cx='0' cy='64' r='34'/><circle cx='64' cy='64' r='34'/><circle cx='32' cy='32' r='34'/></g></svg>\");\n}\n\n.hero-mark-bg {\n  position: absolute;\n  top: 50%;\n  left: 50%;\n  width: 140vh;\n  max-width: none;\n  height: 140vh;\n  transform: translate(-50%, -50%);\n  color: var(--steel);\n  opacity: .045;\n  pointer-events: none;\n}\n\n.hero-frame { position: absolute; inset: 22px; border: 1px solid var(--frame-border); pointer-events: none; z-index: 1; }\n\n@media (max-width: 640px) { .hero-frame { display: none; } }\n\n.hero-index-scale {\n  position: absolute;\n  left: clamp(20px, 4vw, 48px);\n  top: 140px;\n  bottom: 80px;\n  z-index: 1;\n  display: none;\n}\n\n@media (min-width: 1000px) { .hero-index-scale { dis ners across markets and disciplines. One group, five capabilities, one network \u2014 assembled around each mandate.</p>\n        <p class=\"audience\">Built for businesses, entrepreneurs, investors and private clients with ambitions beyond borders.</p>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"chapter\" id=\"capabilities\">\n    <div class=\"container\">\n      <div class=\"chapter-head reveal\">\n        <span class=\"chapter-numeral\">II</span>\n        <h2 class=\"chapter-title\">Five Movements, One Mechanism</h2>\n      </div>\n\n      <div class=\"cap-rows reveal\">\n        <a class=\"cap-row\" href=\"capabilities.html#talent\">\n          <span class=\"jewel\" aria-hidden=\"true\"></span>\n          <span class=\"index-scale\" style=\"width:44px; flex-shrink:0;\" aria-hidden=\"true\"></span>\n          <span class=\"cap-num\">01</span>\n          <span class=\"cap-name\">Talent</span>\n          <span class=\"cap-descriptor\">Connecting companies with the people they need \u2014 across borders.</span>\n          <span class=\"cap-arrow\" aria-hidden=\"true\">Explore \u2192</span>\n        </a>\n        <a class=\"cap-row\" href=\"capabilities.html#digital\">\n          <span class=\"jewel\" aria-hidden=\"true\"></span>\n          <span class=\"index-scale\" style=\"width:44px; flex-shrink:0;\" aria-hidden=\"true\"></span>\n          <span class=\"cap-num\">02</span>\n          <span class=\"cap-name\">Digital</span>\n          <span class=\"cap-descriptor\">Building the technology and digital systems behind modern businesses.</span>\n          <span class=\"cap-arrow\" aria-hidden=\"true\">Explore \u2192</span>\n        </a>\n        <a class=\"cap-row\" href=\"capabilities.html#realestate\">\n          <span class=\"jewel\" aria-hidden=\"true\"></span>\n          <span class=\"index-scale\" style=\"width:44px; flex-shrink:0;\" aria-hidden=\"true\"></span>\n          <span class=\"cap-num\">03</span>\n          <span class=\"cap-name\">Re forEach(function (el) { io.observe(el); });\n  } else {\n    reveals.forEach(function (el) { el.classList.add('is-visible'); });\n  }\n})();\n<\/script>\n\n<script>(function(){\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a[href]');\n    if(!a) return;\n    var href = a.getAttribute('href') || '';\n    if(/^(https?:|mailto:|tel:)/i.test(href)) { a.target = '_blank'; return; }\n    var m = href.match(/^(?:\\.\\.\\/)?(?:([0-9]{2}-[a-z]+)\\/)?([a-z]+\\.html)?(#.*)?$/i);\n    if(!m) return;\n    if(href.charAt(0) === '#') return;          /* Anker in der Seite: normal lassen */\n    e.preventDefault();\n    parent.postMessage({bzNav: {concept: m[1] || null, page: m[2] || 'index.html', hash: m[3] || ''}}, '*');\n  }, true);\n  window.addEventListener('message', function(e){\n    if(e.data && e.data.bzHash){ location.hash = e.data.bzHash; }\n  });\n})();<\/script>\n\n</body>\n</html>\n", "03-platinum/capabilities.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<script>(function(){try{if(localStorage.getItem('bz-theme-03')==='light'){document.documentElement.setAttribute('data-theme','light');}}catch(e){}})();<\/script>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>BYZARO GROUP \u2014 Capabilities</title>\n<meta name=\"description\" content=\"Five specialized divisions \u2014 Talent, Digital, Real Estate, Capital and Advisory \u2014 assembled around each mandate.\">\n<meta name=\"robots\" content=\"noindex\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,600;0,700;1,600;1,700&amp;family=Jost:wght@300;400;500&amp;display=swap\" rel=\"stylesheet\">\n<style>\n/* ==========================================================================\n   BYZARO GROUP \u2014 Concept 03: PLATINUM\n   Swiss precision instrument. Machined steel, guilloch\u00e9, engraved indices.\n   Shared stylesheet for index.html, capabilities.html, network.html\n   ========================================================================== */\n\n:root {\n  --bg: #0E1116;\n  --bg-2: #161B22;\n  --bg-3: #1E242D;\n  --steel: #B9C4D0;\n  --steel-dim: #8C97A5;\n  --text: #E9EDF2;\n  --text-dim: #A3AEBC;\n\n  /* small-text accent \u2014 must be \u22654.5:1 on --bg/--bg-2/--bg-3 */\n  --steel-text: var(--steel);\n  /* rule/hairline colour \u2014 decorative, no contrast requirement */\n  --steel-rule: var(--steel-dim);\n  /* fill colour for filled steel states (button hover, selected chip) \u2014\n     paired with --bg-coloured text on top, needs \u22654.5:1 against --bg */\n  --steel-fill: var(--steel);\n\n  --border: rgba(185, 196, 208, .16);\n  --border-strong: rgba(185, 196, 208, .32);\n  --header-bg: rgba(14, 17, 22, .82);\n  --subnav-bg: rgba(14, 17, 22, .92);\n  --input-bg: var(--bg-2);\n  --input-border: rgba(185, 196, 208, .28);\n  --frame-border: rgba(233, 237, 242, .14);\n\n  --font-display: \"Bodoni Moda\", \"Times New Roman\", serif;\n  --font-ui: \"Jost\", system-ui, sans-serif;\n\n  --container: 1320px;\n  --section-pad: clamp(96px, 12vh, 180px);\n\n  --metal-gradient: linear-gradient(100deg, #8C97A5, #E9EDF2 42%, #7E8A98 58%, #C3CDD9);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Light theme \u2014 cool paper, darker steel for small text                    */\n/* Default (no attribute, or data-theme=\"dark\") stays PLATINUM dark.        */\n/* ---------------------------------------------------------------------- */\n\n[data-theme=\"light\"] {\n  --bg: #F1F4F8;\n  --bg-2: #E4E9F0;\n  --bg-3: #D8DFE8;\n  --steel: #9FACBB;       /* lighter steel kept for rules/lines */\n  --steel-dim: #B7C2CE;\n  --text: #0E1116;\n  --text-dim: #4E5867;\n\n  --steel-text: #5A6675;  /* darkened steel \u2014 measured \u22654.5:1 on bg/bg-2/bg-3 */\n  --steel-rule: #8A97A6;\n  --steel-fill: #5A6675;  /* darkened fill so --bg-coloured text on top stays \u22654.5:1 */\n\n  --border: rgba(14, 17, 22, .14);\n  --border-strong: rgba(14, 17, 22, .24);\n  --header-bg: rgba(241, 244, 248, .82);\n  --subnav-bg: rgba(241, 244, 248, .92);\n  --input-bg: #E9EEF3;\n  --input-border: rgba(14, 17, 22, .2);\n  --frame-border: rgba(14, 17, 22, .12);\n\n  /* Auf hellem Papier muss der Metallverlauf DUNKEL sein \u2014 helles Metall auf\n     hellem Grund war praktisch unlesbar. Dunkler Stahl mit hellerem Streiflicht\n     h\u00e4lt den polierten Charakter und bleibt kr\u00e4ftig. */\n  --metal-gradient: linear-gradient(100deg, #2B3542, #6B7A8C 42%, #1B222C 58%, #4A5766);\n}\n\n[data-theme=\"light\"] .hero-mark-bg { color: var(--text); opacity: .028; }\n\n@media (prefers-reduced-motion: no-preference) {\n  html.theme-transition,\n  html.theme-transition *,\n  html.theme-transition *::before,\n  html.theme-transition *::after {\n    transition: background-color 300ms ease, color 300ms ease, border-color 300ms ease, fill 300ms ease, stroke 300ms ease !important;\n  }\n}\n\n/* ---------------------------------------------------------------------- */\n/* Reset                                                                    */\n/* ---------------------------------------------------------------------- */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--text);\n  font-family: var(--font-ui);\n  font-weight: 400;\n  font-size: 1rem;\n  line-height: 1.7;\n  overflow-x: hidden;\n  min-width: 320px;\n}\n\nhtml, body { max-width: 100%; overflow-x: hidden; }\n\nimg, svg { display: block; max-width: 100%; }\n\na { color: inherit; }\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: 600;\n  letter-spacing: .01em;\n  margin: 0;\n}\n\np { margin: 0; }\n\nul, ol { list-style: none; margin: 0; padding: 0; }\n\nbutton { font-family: inherit; cursor: pointer; }\n\n/* ---------------------------------------------------------------------- */\n/* Focus visibility                                                         */\n/* ---------------------------------------------------------------------- */\n\na:focus-visible,\nbutton:focus-visible,\ninput:focus-visible,\nselect:focus-visible,\ntextarea:focus-visible,\n[tabindex]:focus-visible {\n  outline: 2px solid var(--steel);\n  outline-offset: 3px;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Layout helpers                                                           */\n/* ---------------------------------------------------------------------- */\n\n.container {\n  width: 100%;\n  max-width: var(--container);\n  margin: 0 auto;\n  padding-left: clamp(20px, 5vw, 56px);\n  padding-right: clamp(20px, 5vw, 56px);\n}\n\n.chapter {\n  position: relative;\n  padding: var(--section-pad) 0;\n}\n\n.chapter--panel { background: var(--bg-2); }\n\n.chapter-head {\n  display: flex;\n  align-items: baseline;\n  justify-content: center;\n  gap: clamp(12px, 3vw, 28px);\n  margin-bottom: clamp(40px, 6vw, 72px);\n  text-align: center;\n}\n\n.chapter-numeral {\n  font-family: var(--font-ui);\n  color: var(--steel-text);\n  font-size: clamp(1rem, 2vw, 1.3rem);\n  letter-spacing: .3em;\n}\n\n.chapter-title {\n  font-size: clamp(1.8rem, 4vw, 3.4rem);\n  line-height: 1.15;\n}\n\n.hairline {\n  border: none;\n  border-top: 1px solid var(--steel-rule);\n  opacity: .5;\n  width: 100%;\n  margin: 0;\n}\n\n.label {\n  display: inline-block;\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .25em;\n  text-transform: uppercase;\n  color: var(--steel-text);\n}\n\n.label--dim { color: var(--text-dim); }\n\n.lede {\n  color: var(--text-dim);\n  max-width: 62ch;\n}\n\n.center { text-align: center; margin-left: auto; margin-right: auto; }\n\n/* ---------------------------------------------------------------------- */\n/* Polished metal \u2014 the jewel, used sparingly                               */\n/* ---------------------------------------------------------------------- */\n\n.metal-text {\n  background: var(--metal-gradient);\n  -webkit-background-clip: text;\n  background-clip: text;\n  color: transparent;\n  -webkit-text-fill-color: transparent;\n}\n\n.metal-rule {\n  border: none;\n  height: 2px;\n  width: 100%;\n  background: var(--metal-gradient);\n  margin: 0;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Index scale \u2014 the signature precision-instrument motif                  */\n/* 60 short ticks; every 5th reinforced into a long tick.                  */\n/* ---------------------------------------------------------------------- */\n\n.index-scale {\n  position: relative;\n  width: 100%;\n  height: 18px;\n  pointer-events: none;\n}\n\n.index-scale::before {\n  content: \"\";\n  position: absolute;\n  left: 0; right: 0; top: 50%;\n  height: 7px;\n  transform: translateY(-50%);\n  background-image: repeating-linear-gradient(to right, var(--steel-dim) 0 1px, transparent 1px calc(100% / 60));\n  opacity: .6;\n}\n\n.index-scale::after {\n  content: \"\";\n  position: absolute;\n  left: 0; right: 0; top: 0; bottom: 0;\n  background-image: repeating-linear-gradient(to right, var(--steel) 0 1.4px, transparent 1.4px calc(100% / 12));\n}\n\n.index-scale--v {\n  width: 18px;\n  height: 100%;\n}\n\n.index-scale--v::before {\n  left: 50%; right: auto; top: 0; bottom: 0;\n  width: 7px; height: auto;\n  transform: translateX(-50%);\n  background-image: repeating-linear-gradient(to bottom, var(--steel-dim) 0 1px, transparent 1px calc(100% / 60));\n}\n\n.index-scale--v::after {\n  background-image: repeating-linear-gradient(to bottom, var(--steel) 0 1.4px, transparent 1.4px calc(100% / 12));\n}\n\n/* ---------------------------------------------------------------------- */\n/* Jewel bearings \u2014 tiny precision markers                                  */\n/* ---------------------------------------------------------------------- */\n\n.jewel {\n  display: inline-block;\n  width: 6px;\n  height: 6px;\n  flex-shrink: 0;\n  border-radius: 50%;\n  background: radial-gradient(circle at 35% 30%, var(--text) 0%, var(--steel) 45%, var(--steel-dim) 100%);\n  box-shadow: 0 0 0 1px var(--border);\n}\n\n/* ---------------------------------------------------------------------- */\n/* Buttons                                                                   */\n/* ---------------------------------------------------------------------- */\n\n.btn {\n  display: inline-block;\n  border-radius: 0;\n  padding: 16px 34px;\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  text-decoration: none;\n  text-align: center;\n  transition: background-color 200ms ease, color 200ms ease, border-color 200ms ease;\n  white-space: nowrap;\n}\n\n.btn-primary {\n  border: 1px solid var(--steel);\n  color: var(--text);\n  background: transparent;\n}\n\n.btn-primary:hover,\n.btn-primary:focus-visible {\n  background: var(--steel-fill);\n  border-color: var(--steel-fill);\n  color: var(--bg);\n}\n\n.text-link {\n  color: var(--steel-text);\n  text-decoration: none;\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .1em;\n  text-transform: uppercase;\n  border-bottom: 1px solid var(--steel-rule);\n  padding-bottom: 2px;\n}\n\n.text-link:hover, .text-link:focus-visible { border-color: var(--steel); color: var(--text); }\n\n/* ---------------------------------------------------------------------- */\n/* Intro assembly animation                                                 */\n/* ---------------------------------------------------------------------- */\n\n.intro-overlay {\n  position: fixed;\n  inset: 0;\n  z-index: 9000;\n  background: var(--bg);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  transition: opacity 500ms ease;\n}\n\n.intro-overlay[data-hidden=\"true\"] {\n  opacity: 0;\n  pointer-events: none;\n}\n\n.intro-mark {\n  width: clamp(72px, 14vw, 140px);\n  color: var(--steel);\n}\n\n.intro-mark .bz-b {\n  opacity: 0;\n  transition: transform 1200ms cubic-bezier(0,.68,.24,1), opacity 1200ms ease;\n}\n\n.intro-mark.bz-run .bz-b { opacity: 1; transform: translate(0, 0); }\n\n.intro-mark .bz-b1 { transform: translate(6%, -6%); }\n.intro-mark .bz-b2 { transform: translate(-6%, -6%); }\n.intro-mark .bz-b3 { transform: translate(6%, 6%); }\n.intro-mark .bz-b4 { transform: translate(-6%, 6%); }\n\n.intro-mark.bz-run .bz-b2 { transition-delay: 35ms; }\n.intro-mark.bz-run .bz-b3 { transition-delay: 65ms; }\n.intro-mark.bz-run .bz-b4 { transition-delay: 100ms; }\n\n/* ---------------------------------------------------------------------- */\n/* Top navigation                                                           */\n/* ---------------------------------------------------------------------- */\n\n.site-header {\n  position: fixed;\n  top: 0; left: 0; right: 0;\n  z-index: 500;\n  background: var(--header-bg);\n  backdrop-filter: blur(10px);\n  border-bottom: 1px solid var(--border);\n}\n\n.nav {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 16px;\n  padding-top: 16px;\n  padding-bottom: 16px;\n}\n\n.brand { display: inline-flex; align-items: center; gap: .7em; text-decoration: none; color: var(--text); flex-shrink: 0; }\n.byzaro-mark { width: auto; height: 32px; flex-shrink: 0; }\n.brand-text { display: flex; flex-direction: column; gap: .28em; min-width: 0; }\n\n.brand-word {\n  font-family: var(--font-ui);\n  font-weight: 500;\n  font-size: 16px;\n  line-height: .72;\n  letter-spacing: .445em;\n  text-indent: .445em;\n  margin-right: -.445em;\n  display: flex;\n  align-items: flex-start;\n  white-space: nowrap;\n}\n\n.brand-lam { width: .745em; height: .72em; margin-right: .036em; flex-shrink: 0; }\n\n.brand-sub {\n  font-family: var(--font-ui);\n  font-weight: 300;\n  font-size: 8.5px;\n  line-height: .72;\n  letter-spacing: 1.02em;\n  text-indent: 1.02em;\n  margin-right: -1.02em;\n  white-space: nowrap;\n}\n\n.nav-links {\n  display: flex;\n  align-items: center;\n  gap: clamp(16px, 2.4vw, 34px);\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .14em;\n  text-transform: uppercase;\n}\n\n.nav-links a:not(.btn) {\n  text-decoration: none;\n  color: var(--text-dim);\n  padding: 4px 0;\n  border-bottom: 1px solid transparent;\n  transition: color 200ms ease, border-color 200ms ease;\n}\n\n.nav-links a:not(.btn):hover,\n.nav-links a:not(.btn):focus-visible,\n.nav-links a.is-active {\n  color: var(--text);\n  border-bottom-color: var(--steel);\n}\n\n.nav-cta { padding: 11px 20px; font-size: 11px; }\n\n.lang-switch { display: flex; align-items: center; gap: 6px; font-family: var(--font-ui); font-size: 11px; letter-spacing: .12em; }\n.lang-switch a, .lang-switch .lang-current { color: var(--steel-text); text-decoration: none; }\n.lang-switch span[aria-disabled=\"true\"] { color: var(--text-dim); opacity: .85; cursor: default; }\n.lang-sep { color: var(--text-dim); opacity: .5; }\n\n/* ---------------------------------------------------------------------- */\n/* Theme toggle                                                             */\n/* ---------------------------------------------------------------------- */\n\n.theme-toggle {\n  display: flex;\n  align-items: center;\n  gap: 6px;\n  background: transparent;\n  border: none;\n  padding: 4px 0;\n  color: var(--steel-text);\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .12em;\n  text-transform: uppercase;\n  transition: color 200ms ease;\n}\n\n.theme-toggle-glyph { font-size: 13px; line-height: 1; }\n\n.theme-toggle:hover, .theme-toggle:focus-visible { color: var(--text); }\n\n.mobile-menu .theme-toggle { margin-top: 12px; font-size: 13px; justify-content: center; }\n\n.nav-toggle {\n  display: none;\n  background: transparent;\n  border: 1px solid var(--border);\n  width: 42px;\n  height: 42px;\n  align-items: center;\n  justify-content: center;\n  flex-shrink: 0;\n}\n\n.nav-toggle-bars { position: relative; width: 18px; height: 12px; }\n.nav-toggle-bars span {\n  position: absolute; left: 0; right: 0; height: 1px;\n  background: var(--text);\n  transition: transform 200ms ease, opacity 200ms ease, top 200ms ease;\n}\n.nav-toggle-bars span:nth-child(1) { top: 0; }\n.nav-toggle-bars span:nth-child(2) { top: 5px; }\n.nav-toggle-bars span:nth-child(3) { top: 11px; }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(1) { top: 5px; transform: rotate(45deg); }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(2) { opacity: 0; }\n.nav-toggle[aria-expanded=\"true\"] .nav-toggle-bars span:nth-child(3) { top: 5px; transform: rotate(-45deg); }\n\n.mobile-menu {\n  position: fixed;\n  inset: 0;\n  z-index: 600;\n  background: var(--bg);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: clamp(20px, 5vh, 40px);\n  transform: translateY(-100%);\n  opacity: 0;\n  transition: transform 320ms ease, opacity 320ms ease;\n  visibility: hidden;\n}\n\n.mobile-menu.is-open { transform: translateY(0); opacity: 1; visibility: visible; }\n\n.mobile-menu a {\n  font-family: var(--font-display);\n  font-size: clamp(1.6rem, 8vw, 2.6rem);\n  text-decoration: none;\n  color: var(--text);\n  letter-spacing: .01em;\n}\n\n.mobile-menu a.is-active { color: var(--steel-text); }\n.mobile-menu .lang-switch { margin-top: 12px; font-size: 13px; }\n\n.mobile-menu-close {\n  position: absolute;\n  top: 16px;\n  right: clamp(20px, 5vw, 56px);\n  background: transparent;\n  border: 1px solid var(--border);\n  width: 42px;\n  height: 42px;\n  color: var(--text);\n  font-size: 18px;\n  line-height: 1;\n}\n\n/* ---------------------------------------------------------------------- */\n/* Hero                                                                      */\n/* ---------------------------------------------------------------------- */\n\n.hero {\n  position: relative;\n  min-height: 100svh;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  overflow: hidden;\n  padding: 140px 0 80px;\n}\n\n.hero-guilloche {\n  position: absolute;\n  inset: 0;\n  pointer-events: none;\n  opacity: .035;\n  background-repeat: repeat;\n  background-size: 64px 64px;\n  background-image: url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><g fill='none' stroke='%238C97A5' stroke-width='0.6'><circle cx='0' cy='0' r='34'/><circle cx='64' cy='0' r='34'/><circle cx='0' cy='64' r='34'/><circle cx='64' cy='64' r='34'/><circle cx='32' cy='32' r='34'/></g></svg>\");\n}\n\n.hero-mark-bg {\n  position: absolute;\n  top: 50%;\n  left: 50%;\n  width: 140vh;\n  max-width: none;\n  height: 140vh;\n  transform: translate(-50%, -50%);\n  color: var(--steel);\n  opacity: .045;\n  pointer-events: none;\n}\n\n.hero-frame { position: absolute; inset: 22px; border: 1px solid var(--frame-border); pointer-events: none; z-index: 1; }\n\n@media (max-width: 640px) { .hero-frame { display: none; } }\n\n.hero-index-scale {\n  position: absolute;\n  left: clamp(20px, 4vw, 48px);\n  top: 140px;\n  bottom: 80px;\n  z-index: 1;\n  display: none;\n}\n\n@media (min-width: 1000px) { .hero-index-scale { display: block; } }\n\n.hero .hero-index-scale.index-scale--v { height: auto; }\n\n.hero-inner {\n  position: relative;\n  z-index: 2;\n  max-width: 900px;\n  margin: 0 auto;\n  padding: 0 clamp(20px, 5vw, 56px);\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: clamp(20px, 3vw, 30px);\n}\n\n.hero-label { font-family: var(--font-ui); font-size: 11px; letter-spacing: .25em; text-transform: uppercase; color: var(--steel-text); max-width: 44ch; }\n\n.hero-headline {\n  font-size: clamp(2.6rem, 7vw, 6.4rem);\n  line-height: 1.03;\n  text-transform: uppercase;\n}\n\n.hero-headline span { display: block; }\n\n.hero-support { color: var(--text-dim); max-width: 56ch; font-size: clamp(.95rem, 1.4vw, 1.1rem); }\n\n.hero-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: clamp(16px, 3vw, 28px); margin-top: 8px; }\n\n/* ---------------------------------------------------------------------- */\n/* The Group \u2014 triad                                                        */\n/* ---------------------------------------------------------------------- */\n\n.triad {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n}\n\n.triad-tick { width: 18px; }\n\n.triad-word {\n  text-align: center;\n  padding: clamp(20px, 4vw, 36px) 0;\n  font-size: clamp(1.6rem, 5vw, 3.2rem);\n}\n\n.triad-tick { height: 16px; }\n\n@media (min-width: 780px) {\n  .triad { flex-direction: row; align-items: stretch; }\n  .triad-word { flex: 1; }\n  .triad-tick { width: 16px; height: auto; flex-shrink: 0; }\n}\n\n.group-copy { margin-top: clamp(40px, 6vw, 64px); text-align: center; display: flex; flex-direction: column; gap: 20px; align-items: center; }\n.group-copy .lede { font-size: clamp(1rem, 1.6vw, 1.2rem); color: var(--text); }\n.group-copy .audience { color: var(--text-dim); max-width: 52ch; font-size: .95rem; }\n\n/* ---------------------------------------------------------------------- */\n/* Capabilities rows (home page) \u2014 \"Five Movements, One Mechanism\"          */\n/* ---------------------------------------------------------------------- */\n\n.cap-rows { border-top: 1px solid var(--border); }\n\n.cap-row {\n  display: flex;\n  align-items: center;\n  gap: clamp(14px, 3vw, 28px);\n  text-decoration: none;\n  color: var(--text);\n  padding: clamp(20px, 3.4vw, 34px) clamp(8px, 2vw, 20px);\n  border-bottom: 1px solid var(--border);\n  transition: background-color 200ms ease;\n}\n\n.cap-row:hover, .cap-row:focus-visible { background: var(--bg-2); }\n\n.cap-row ll: var(--text-dim);\n}\n.movement-diagram .mv-label--division { fill: var(--steel-text); font-weight: 500; }\n.movement-diagram .mv-label--ring { fill: var(--steel-text); font-size: 8.5px; letter-spacing: .18em; }\n\n.network-statement {\n  max-width: 60ch;\n  margin: 0 auto;\n  text-align: center;\n  font-size: clamp(1.1rem, 2vw, 1.5rem);\n  font-family: var(--font-display);\n  letter-spacing: .01em;\n  line-height: 1.4;\n}\n\n.movement-list-fallback-wrap { display: none; text-align: center; margin-top: 24px; width: 100%; }\n\n.movement-list-fallback {\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 8px 16px;\n  font-family: var(--font-ui);\n  font-size: .88rem;\n  letter-spacing: .08em;\n  text-transform: uppercase;\n  color: var(--text-dim);\n  margin-top: 10px;\n}\n\n@media (max-width: 640px) {\n  .movement-diagram { display: none; }\n  .movement-list-fallback-wrap { display: block; }\n}\n\n/* ---------------------------------------------------------------------- */\n/* International reach \u2014 precision table                                    */\n/* ---------------------------------------------------------------------- */\n\n.reach-table { border-top: 1px solid var(--border); max-width: 720px; margin: 0 auto; }\n\n.reach-row {\n  display: flex;\n  align-items: center;\n  gap: 16px;\n  padding: clamp(14px, 2.4vw, 20px) 4px;\n  border-bottom: 1px solid var(--border);\n}\n\n.reach-name { font-family: var(--font-display); font-size: clamp(1.05rem, 1.8vw, 1.3rem); }\n\n.reach-tick { flex: 1; height: 14px; }\n\n.reach-label {\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .16em;\n  text-transform: uppercase;\n  color: var(--steel-text);\n  flex-shrink: 0;\n}\n\n.reach-cities {\n  margin-top: clamp(28px, 4vw, 44px);\n  font-family: var(--font-ui);\n  font-size: 12px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  color: var(--text-dim);\n  text-align: center;\n}\n\n.reach-ambition { margin-top: 14px; color: var(--text-dim); text-align: center; }\n\n/* ---------------------------------------------------------------------- */\n/* Special situations                                                       */\n/* ---------------------------------------------------------------------- */\n\n.special-headline {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-weight: 700;\n  font-size: clamp(1.9rem, 4.6vw, 3.4rem);\n  max-width: 20ch;\n  line-height: 1.2;\n}\n\n.special-body { color: var(--text-dim); max-width: 56ch; margin-top: 20px; }\n\n.special-list {\n  margin-top: clamp(40px, 6vw, 64px);\n  display: flex;\n  flex-wrap: wrap;\n  justify-content: center;\n  gap: 4px 0;\n  font-family: var(--font-ui);\n  font-size: clamp(.85rem, 1.6vw, 1rem);\n  letter-spacing: .14em;\n  text-transform: uppercase;\n  color: var(--text);\n}\n\n.special-list li { display: flex; align-items: center; }\n.special-list li .index-scale { width: 30px; margin: 0 14px; }\n.special-list li:last-child .index-scale { display: none; }\n\n.special-cta { margin-top: clamp(40px, 6vw, 64px); text-align: center; }\n\n/* ---------------------------------------------------------------------- */\n/* Opportunities rows                                                       */\n/* ---------------------------------------------------------------------- */\n\n.opp-rows { border-top: 1px solid var(--border); }\n\n.opp-row {\n  display: flex;\n  flex-wrap: wrap;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 8px 24px;\n  padding: clamp(20px, 3vw, 30px) 4px;\n  border-bottom: 1px solid var(--border);\n}\n\n.opp-name { font-family: var(--font-display); font-size: clamp(1.1rem, 2vw, 1.5rem); letter-spacing: .01em; }\n\n.opp-tag {\n  color: var(--text-dim);\n  font-family: var(--font-ui);\n  font-size: .78rem;\n  letter-spacing: .08em;\n  text-transform: uppercase;\n  flex-shrink: 0;\n}\n\n.opp-qualification { margin-top: clamp(24px, 4vw, 36px); color: var(--text-dim); text-align: t-family: var(--font-ui); font-size: 12px; color: var(--text-dim); }\n\n.footer-compliance { font-family: var(--font-ui); font-size: 11.5px; color: var(--text-dim); max-width: 90ch; line-height: 1.6; }\n\n/* ---------------------------------------------------------------------- */\n/* Reveal on scroll                                                         */\n/* ---------------------------------------------------------------------- */\n\n.reveal { opacity: 0; transform: translateY(24px); transition: opacity 700ms ease, transform 700ms ease; }\n.reveal.is-visible { opacity: 1; transform: translateY(0); }\n\n/* ---------------------------------------------------------------------- */\n/* Sticky sub-nav (capabilities.html)                                       */\n/* ---------------------------------------------------------------------- */\n\n.subnav { position: sticky; top: 66px; z-index: 100; background: var(--subnav-bg); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }\n\n.subnav-inner { display: flex; gap: clamp(16px, 3vw, 36px); overflow-x: auto; padding: 14px clamp(20px, 5vw, 56px); scrollbar-width: thin; max-width: 100%; }\n.subnav-inner::-webkit-scrollbar { height: 4px; }\n.subnav-inner::-webkit-scrollbar-thumb { background: var(--border-strong); }\n\n.subnav a {\n  flex-shrink: 0;\n  font-family: var(--font-ui);\n  font-size: 11px;\n  letter-spacing: .18em;\n  text-transform: uppercase;\n  text-decoration: none;\n  color: var(--text-dim);\n  padding-bottom: 4px;\n  border-bottom: 1px solid transparent;\n  white-space: nowrap;\n}\n\n.subnav a:hover, .subnav a:focus-visible, .subnav a.is-active { color: var(--steel-text); border-bottom-color: var(--steel); }\n\n/* ---------------------------------------------------------------------- */\n/* Division chapters (capabilities.html)                                    */\n/* ---------------------------------------------------------------------- */\n\n.division { scroll-margin-top: 130px; }\n\n.division-head { text-align: center; max-width: 720px; margin: 0 auto clamp(40px, 6vw, 72px); }\n\n.division-eyebrow { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 20px; }\n\n.division-name { font-size: clamp(2.2rem, 6vw, 4.2rem); line-height: 1.05; }\n\n.division-line { margin-top: 18px; color: var(--text-dim); font-size: clamp(1rem, 1.6vw, 1.2rem); }\n\n.division-body { display: grid; grid-template-columns: 1fr; gap: clamp(32px, 5vw, 64px); max-width: 1100px; margin: 0 auto; }\n\n@media (min-width: 860px) { .division-body { grid-template-columns: 1.1fr .9fr; align-items: start; } }\n\n.service-list { display: grid; grid-template-columns: 1fr; border-top: 1px solid var(--border); }\n\n@media (min-width: 560px) { .service-list { grid-template-columns: 1fr 1fr; } }\n\n.service-list li {\n  display: flex;\n  align-items: baseline;\n  gap: 10px;\n  padding: 16px 12px;\n  border-bottom: 1px solid var(--border);\n  font-size: .96rem;\n}\n\n.service-list li .jewel { flex-shrink: 0; margin-top: .35em; }\n\n@media (min-width: 560px) { .service-list li:nth-child(odd) { border-right: 1px solid var(--border); padding-left: 0; } }\n\n.division-aside { border-left: 1px solid var(--border-strong); padding: 4px 0 4px 22px; display: flex; flex-direction: column; gap: 18px; }\n\n.use-case-panel { position: relative; padding-top: 22px; }\n.use-case-panel .index-scale { position: absolute; top: 0; left: 0; right: 0; height: 12px; }\n.use-case-panel .use-case { font-style: italic; font-family: var(--font-display); color: var(--text); font-size: 1.05rem; line-height: 1.6; padding-top: 8px; }\n\n.division-aside .relation-line { font-size: .88rem; color: var(--text-dim); }\n\n.division-compliance-panel {\n  margin-top: 28px;\n  background: var(--bg-3);\n  padding: 20px 22px;\n  border: 1px solid var(--border);\n}\n\n.division-compliance {\n  font-size: .82rem;\n  color: var(--text-dim);\n  line-height: 1.6;\n}\n\n.division-sep { margin: 0; }\n\n/* ---------------------------------------------------------------------- */\n/* Network page \u2014 the Movement, mandate flow how-it-works                   */\n/* ---------------------------------------------------------------------- */\n\n.mandate-steps {\n  display: flex;\n  max-width: 780px;\n  margin: clamp(40px, 6vw, 64px) auto 0;\n  gap: clamp(20px, 4vw, 40px);\n}\n\n.mandate-steps-spine { flex-shrink: 0; width: 18px; }\n\n.mandate-steps-list { display: flex; flex-direction: column; gap: clamp(28px, 4vw, 44px); flex: 1; }\n\n.mandate-step { display: flex; align-items: flex-start; gap: 14px; }\n\n.mandate-step .jewel { margin-top: .5em; flex-shrink: 0; }\n\n.mandate-step-num { font-family: var(--font-ui); color: var(--steel-text); font-size: .85rem; letter-spacing: .1em; margin-right: 14px; }\n\n.mandate-step-name { font-family: var(--font-display); font-size: clamp(1.05rem, 1.8vw, 1.3rem); }\n\n.mandate-step-body { color: var(--text-dim); font-size: .92rem; margin-top: 4px; }\n\n.mandate-worked-lede { max-width: 62ch; margin: 0 auto; text-align: center; color: var(--text-dim); }\n\n/* ---------------------------------------------------------------------- */\n/* Mandate form                                                             */\n/* ---------------------------------------------------------------------- */\n\n.mandate { max-width: 820px; margin: 0 auto; }\n\n.mandate-headline { text-align: center; font-size: clamp(2rem, 5.5vw, 4rem); margin-bottom: clamp(20px, 3vw, 28px); }\n\n.mandate-confidential-top { text-align: center; color: var(--text-dim); font-size: .9rem; max-width: 60ch; margin: 0 auto clamp(36px, 5vw, 56px); }\n\n.category-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: clamp(36px, 5vw, 56px); }\n\n.category-grid input[type=\"radio\"] { position: absolute; opacity: 0; width: 1px; height: 1px; }\n\n.category-grid label {\n  display: flex;\n  align-items: center;\n  justify-content: cen n>\n    <span class=\"theme-toggle-label\">LIGHT</span>\n  </button>\n</div>\n\n<nav class=\"subnav\" aria-label=\"Divisions\">\n  <div class=\"subnav-inner\">\n    <a href=\"#talent\" data-subnav=\"talent\">01 \u2014 Talent</a>\n    <a href=\"#digital\" data-subnav=\"digital\">02 \u2014 Digital</a>\n    <a href=\"#realestate\" data-subnav=\"realestate\">03 \u2014 Real Estate</a>\n    <a href=\"#capital\" data-subnav=\"capital\">04 \u2014 Capital</a>\n    <a href=\"#advisory\" data-subnav=\"advisory\">05 \u2014 Advisory</a>\n  </div>\n</nav>\n\n<main>\n\n  <section class=\"chapter\" style=\"padding-top:clamp(150px,18vh,210px); padding-bottom: clamp(56px,7vh,100px);\">\n    <div class=\"container\">\n      <div class=\"chapter-head reveal\" style=\"margin-bottom:20px;\">\n        <span class=\"chapter-numeral\">\u2014</span>\n        <h1 class=\"chapter-title\"><span class=\"metal-text\">Capabilities</span></h1>\n      </div>\n      <p class=\"lede center reveal\">Five specialized divisions, precision-fitted together. Whatever the mandate requires, Byzaro assembles the right combination of expertise, people and partners.</p>\n    </div>\n  </section>\n\n  <section class=\"chapter division\" id=\"talent\">\n    <div class=\"container\">\n      <div class=\"division-head reveal\">\n        <div class=\"division-eyebrow\">\n          <span class=\"jewel\" aria-hidden=\"true\"></span>\n          <span class=\"chapter-numeral\">01</span>\n          <span class=\"label\">Talent &amp; Workforce Solutions</span>\n        </div>\n        <h2 class=\"division-name\">Talent</h2>\n        <p class=\"division-line\">Connecting companies with the people they need \u2014 across borders.</p>\n      </div>\n      <div class=\"division-body reveal\">\n        <ul class=\"service-list\">\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>International Recruitment</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Executive Search</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Temporary Staffing</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Recruitment Outsourcing</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Agency-to-Agency Recruiting</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Cross-Border Workforce Projects</li>\n        </ul>\n        <aside class=\"division-aside\">\n          <div class=\"use-case-panel\">\n            <div class=\"index-scale\" aria-hidden=\"true\"></div>\n            <p class=\"use-case\">\"A growing company needs specialized people in a new market \u2014 sourced, vetted and placed across borders.\"</p>\n          </div>\n          <p class=\"relation-line\">Talent solutions rarely stand alone \u2014 placements often connect to Advisory structuring or Digital systems as a company scales across borders.</p>\n        </aside>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"chapter chapter--panel division\" id=\"digital\">\n    <div class=\"container\">\n      <div class=\"division-head reveal\">\n        <div class=\"division-eyebrow\">\n          <span class=\"jewel\" aria-hidden=\"true\"></span>\n          <span class=\"chapter-numeral\">02</span>\n          <span class=\"label\">Technology, AI &amp; Digital Growth</span>\n        </div>\n        <h2 class=\"division-name\">Digital</h2>\n        <p class=\"division-line\">Building the technology and digital systems behind modern businesses.</p>\n      </div>\n      <div class=\"division-body reveal\">\n        <ul class=\"service-list\">\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Corporate Websites &amp; Applications</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Custom Software</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>AI Agents &amp; Automation</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>CRM &amp; ERP Systems</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Digital Strategy</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Performance Marketing</li>\n        </ul>\n        <aside class=\"division-aside\">\n          <div class=\"use-case-panel\">\n            <div class=\"index-scale\" aria-hidden=\"true\"></div>\n            <p class=\"use-case\">\"An established business needs its digital infrastructure \u2014 software, automation and visibility \u2014 built to an international standard.\"</p>\n          </div>\n          <p class=\"relation-line\">Digital capability is built to work alongside the group's other disciplines \u2014 from Advisory structuring to Real Estate premises \u2014 as part of a single mandate.</p>\n        </aside>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"chapter division\" id=\"realestate\">\n    <div class=\"container\">\n      <div class=\"division-head reveal\">\n        <div class=\"division-eyebrow\">\n          <span class=\"jewel\" aria-hidden=\"true\"></span>\n          <span class=\"chapter-numeral\">03</span>\n          <span class=\"label\">International Real Estate</span>\n        </div>\n        <h2 class=\"division-name\">Real Estate</h2>\n        <p class=\"division-line\">Connecting property, people and opportunity across markets.</p>\n      </div>\n      <div class=\"division-body reveal\">\n        <ul class=\"service-list\">\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>International Brokerage</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Buyer &amp; Seller Representation</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Off-Market Opportunities</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Investment Properties</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Property Search &amp; Relocation</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Real Estate Investment Advisory</li>\n        </ul>\n        <aside class=\"division-aside\">\n          <div class=\"use-case-panel\">\n            <div class=\"index-scale\" aria-hidden=\"true\"></div>\n            <p class=\"use-case\">Active across the UAE, Switzerland, Serbia, Montenegro, Croatia, Germany and Italy \u2014 and internationally through trusted partners.</p>\n          </div>\n          <p class=\"relation-line\">Real estate mandates often connect to Advisory structuring, Capital introductions and Talent placements as part of a single cross-border move.</p>\n        </aside>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"chapter chapter--panel division\" id=\"capital\">\n    <div class=\"container\">\n      <div class=\"division-head reveal\">\n        <div class=\"division-eyebrow\">\n          <span class=\"jewel\" aria-hidden=\"true\"></span>\n          <span class=\"chapter-numeral\">04</span>\n          <span class=\"label\">Private Markets &amp; Selected Opportunities</span>\n        </div>\n        <h2 class=\"division-name\">Capital</h2>\n        <p class=\"division-line\">Connecting qualified clients with selected private-market opportunities.</p>\n      </div>\n      <div class=\"division-body reveal\">\n        <ul class=\"service-list\">\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Selected Investment Opportunities</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Investor Introductions</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Capital Advisory</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Project Introductions</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Strategic Capital Connections</li>\n        </ul>\n        <aside class=\"division-aside\">\n          <p class=\"relation-line\">Capital introductions are coordinated alongside Advisory structuring and Real Estate opportunities, assembled around each mandate.</p>\n          <div class=\"division-compliance-panel\">\n            <p class=\"division-compliance\">Selected opportunities may only be available to eligible or qualified investors and are subject to jurisdiction, due diligence and applicable regulation. Byzaro is not a bank, investment fund or regulated financial institution.</p>\n          </div>\n        </aside>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"chapter division\" id=\"advisory\">\n    <div class=\"container\">\n      <div class=\"division-head reveal\">\n        <div class=\"division-eyebrow\">\n          <span class=\"jewel\" aria-hidden=\"true\"></span>\n          <span class=\"chapter-numeral\">05</span>\n          <span class=\"label\">Corporate &amp; Strategic Advisory</span>\n        </div>\n        <h2 class=\"division-name\">Advisory</h2>\n        <p class=\"division-line\">Structure, expansion and execution across jurisdictions.</p>\n      </div>\n      <div class=\"division-body reveal\">\n        <ul class=\"service-list\">\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>International Company Formation</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Market Entry &amp; Expansion</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Corporate &amp; Holding Structures</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>M&amp;A Coordination</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Business Succession</li>\n          <li><span class=\"jewel\" aria-hidden=\"true\"></span>Corporate Relocation</li>\n        </ul>\n        <aside class=\"division-aside\">\n          <p class=\"relation-line\">Advisory sits at the center of most cross-border mandates \u2014 coordinating Talent, Digital, Real Estate and Capital as the mandate requires.</p>\n          <div class=\"division-compliance-panel\">\n            <p class=\"division-compliance\">International structures developed in coordination with specialized legal, tax and regulatory partners.</p>\n          </div>\n        </aside>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"chapter chapter--panel\" id=\"special-situations-teaser\">\n    <div class=\"container closing\">\n      <p class=\"label center reveal\" style=\"display:block; margin-bottom:20px;\">Beyond the five capabilities</p>\n      <h2 class=\"closing-headline reveal\" style=\"font-size:clamp(1.8rem,4.4vw,3.2rem); max-width:20ch;\">Some opportunities don't fit into conventional categories.</h2>\n      <p class=\"lede center reveal\">For mandates that cross capabilities \u2014 or fall outside them entirely \u2014 Byzaro works as one coordinated group.</p>\n      <a class=\"btn btn-primary reveal\" href=\"network.html#mandate\">Present an Opportunity</a>\n    </div>\n  </section>\n\n</main>\n\n<footer class=\"site-footer\">\n  <div class=\"container\">\n    <div class=\"footer-top\">\n      <div class=\"footer-brand\">\n        <a class=\"brand\" href=\"index.html\" aria-label=\"Byzaro Group\">\n          <svg class=\"byzaro-mark\" viewBox=\"0 0 367 390\" fill=\"currentColor\" aria-hidden=\"true\">\n            <defs><path id=\"bzb-foot\" fill-rule=\"evenodd\" d=\"M0,0 H164 V56 C161,68 145,70 145,90 C145,110 161,112 164,124 V181 H0 Z M33,32 H131 V54 A20,20 0 0 1 111,74 H76 V107 H110 A21,21 0 0 1 131,128 V149 H33 Z\"/></defs>\n            <use href=\"#bzb-foot\" transform=\"translate(203,0)\"/>\n            <use href=\"#bzb-foot\" transform=\"translate(164,0) scale(-1,1)\"/>\n            <use href=\"#bzb-foot\" transform=\"translate(203,209)\"/>\n            <use href=\"#bzb-foot\" transform=\"translate(164,209) scale(-1,1)\"/>\n          </svg>\n          <span class=\"brand-text\" aria-hidden=\"true\">\n            <span class=\"brand-word\">BYZ<svg class=\"brand-lam\" viewBox=\"0 0 62 72\" fill=\"currentColor\"><path d=\"M31 0 L62 72 H49.5 L31 27 L12.5 72 H0 Z\"/></svg>RO</span>\n            <span class=\"brand-sub\">GROUP</span>\n
